адной хотя бы одна строка |\n| Товар — Позиция поставки | 1 : N | Товар встречается во многих поставках |\n| Товар — Остаток, Склад — Остаток | 1 : N | Остаток — пересечение товара и склада |\n| Поставщик — Товар | M : N | Через «Поставку» и «Позицию поставки» |\n| Товар — Склад | M : N | Через «Остаток» |\n\n## Поступление одного товара от нескольких поставщиков\n\nСвязь «поставщик — товар» имеет тип M : N: поставщик поставляет много товаров, товар закупается у многих поставщиков. Она разрешается двумя уровнями: **«Поставка»** (документ — накладная от одного поставщика) и **«Позиция поставки»** (строка накладной с конкретным товаром). Товар связан с разными поставщиками через разные поставки, а в позиции фиксируется **цена закупки** у конкретного поставщика на конкретную дату. Это позволяет сравнивать поставщиков по цене и срокам. Если нужно хранить договорные цены до факта поставки, вводится дополнительная ассоциативная сущность «Прайс поставщика» с ключом (ID_поставщика, ID_товара).\n\n## Хранение одного товара на нескольких складах\n\nСвязь «товар — склад» тоже M : N. Её разрешает ассоциативная сущность **«Остаток»** с составным первичным ключом (ID_склада, ID_товара): для каждой пары хранится одно значение количества и ячейка хранения. Составной ключ гарантирует, что для товара на складе не появится двух противоречащих друг другу остатков. Поставка увеличивает остаток на складе-получателе; для движения между складами модель расширяется сущностью «Перемещение».\n\n**Пример.** Бумага А4 артикул 101 поступила от ООО «Альфа» по 320 руб. за пачку (накладная № 15 на склад «Север») и от ООО «Бета» по 305 руб. (накладная № 22 на склад «Юг»). В «Позиции поставки» две строки с разными ценами, в «Остатке» — две строки: (Север, 101) = 400 пачек и (Юг, 101) = 250 пачек. Запрос по «Остатку» даёт общий запас 650 пачек и его распределение по складам.\n\n**Вывод.** Обе ситуации — товар от многих поставщиков и товар на многих складах — моделируются связями M : N, разрешёнными через ассоциативные сущности: «Поставка» с «Позицией поставки» и «Остаток». Составные ключи этих таблиц обеспечивают уникальность и целостность складского учёта."}, {"d": "udo", "q": 19, "title": "Многомерная модель «звезда» для анализа продаж", "md": "## Идея многомерного анализа\n\nМногомерная (размерная) модель Ральфа Кимбалла представляет данные как **факты** — числовые показатели бизнес-событий — и **измерения** — контекст событий: когда, что, где, кому, через какой канал. Аналитик видит данные как **куб**: на осях измерения, в ячейках меры. Над кубом выполняются операции: срез (slice), выборка подкуба (dice), детализация (drill-down: год → квартал → месяц), свёртка (roll-up), поворот (pivot). Например: «выручка по категориям товаров в Поволжье по месяцам 2026 года» — фиксация региона, разворот по категориям и времени.\n\n## Схема «звезда»\n\nВ центре — таблица фактов, вокруг — денормализованные таблицы измерений, связанные с ней отношением 1 : N. **Зерно** (детальность) факта — одна позиция чека.\n\n![Схема «звезда» для анализа продаж](img/udo19_star.webp){600}\n\nТаблица: Состав таблицы фактов «Факт продаж»\n{w:26,30,44}\n| Элемент | Поля | Пояснение |\n|---|---|---|\n| Внешние ключи измерений | ID_даты, ID_товара, ID_магазина, ID_клиента, ID_канала | Определяют, к какому сочетанию измерений относится факт |\n| Аддитивные меры | Количество, выручка, себестоимость, скидка, валовая прибыль | Суммируются по любым измерениям |\n| Производные показатели (вычисляются в BI) | Средний чек, маржинальность | Не хранятся: средние нельзя суммировать |\n\nТаблица: Таблицы измерений\n{w:22,48,30}\n| Измерение | Атрибуты | Иерархия |\n|---|---|---|\n| Дата | Дата, день недели, месяц, квартал, год, признак праздника | День → месяц → квартал → год |\n| Товар | Артикул, наименование, бренд, подкатегория, категория | Товар → подкатегория → категория |\n| Магазин | Название, формат, город, регион, площадь | Магазин → город → регион |\n| Клиент | Пол, возрастная группа, город, сегмент лояльности | Клиент → сегмент |\n| Канал продаж | Канал (магазин, сайт, маркетплейс), тип оплаты | — |\n\n## Схема «снежинка» и её применение\n\nВ «снежинке» таблицы измерений **нормализованы**: иерархия выносится в отдельные связанные таблицы.\n\n![Фрагмент схемы «снежинка»: нормализованное измерение «Товар»](img/udo19_snowflake.webp){600}\n\nТаблица: «Звезда» и «снежинка»\n{w:24,38,38}\n| Признак | Звезда | Снежинка |\n|---|---|---|\n| Измерения | Денормализованы, одна таблица на измерение | Нормализованы в цепочки таблиц |\n| Число соединений | Минимальное | Больше — запросы сложнее и медленнее |\n| Объём и избыточность | Повторы названий категорий в каждой строке | Меньше избыточности |\n| Сопровождение иерархий | Изменение категории затрагивает много строк | Изменение в одной строке справочника |\n| Удобство для BI | Высокое | Ниже |\n\n«Снежинку» применяют, когда измерения очень велики и имеют глубокие иерархии (каталог из миллионов товаров), когда одна иерархия используется несколькими измерениями (общее измерение «География» для магазинов и клиентов), когда атрибуты верхних уровней часто меняются, а также при жёстких требованиях к экономии места. По умолчанию выбирают «звезду».\n\n**Пример.** Директор спрашивает, почему упала выручка в Поволжье в марте. Аналитик фильтрует «Магазин.Регион = Поволжье», детализирует время до недель и видит провал в одном магазине, затем детализирует по категориям: проблема в «Электронике» — товар не поступал две недели. Запрос использует три соединения таблицы фактов с измерениями.\n\n**Вывод.** Схема «звезда» — таблица фактов с аддитивными мерами и окружающие её измерения с иерархиями — даёт простую и быструю основу многомерного анализа. «Снежинка» нормализует измерения и оправдана при больших и разделяемых иерархиях ценой более сложных запросов."}, {"d": "udo", "q": 20, "title": "Data Warehouse, Data Lake и Data Lakehouse", "md": "## Определения\n\n- **Хранилище данных (Data Warehouse)** — интегрированная, предметно-ориентированная, историческая база очищенных структурированных данных для отчётности; схема задаётся при записи.\n- **Озеро данных (Data Lake)** — хранилище «сырых» данных любых типов в исходном формате на дешёвом объектном хранилище; схема задаётся при чтении.\n- **Озеро-хранилище (Data Lakehouse)** — архитектура, которая добавляет к озеру возможности хранилища: ACID-транзакции, контроль схемы, версии данных, высокопроизводительный SQL. Основу составляют открытые табличные форматы (Delta Lake, Apache Iceberg, Apache Hudi) поверх файлов Parquet. Концепцию описали М. Армбруст и соавторы (Databricks, конференция CIDR, 2021).\n\n![Архитектура Data Lakehouse с медальонными слоями](img/udo20_lakehouse.webp){600}\n\n## Сравнение\n\nТаблица: Сравнение DWH, Data Lake и Lakehouse\n{w:19,27,27,27}\n| Признак | Data Warehouse | Data Lake | Data Lakehouse |\n|---|---|---|---|\n| Типы данных | Структурированные | Любые | Любые |\n| Схема | При записи | При чтении | При записи для очищенных слоёв, при чтении для сырых |\n| Транзакции и надёжность | ACID | Нет: возможны «битые» и несогласованные файлы | ACID за счёт табличного формата |\n| Производительность BI | Высокая | Низкая без доработок | Близка к хранилищу |\n| Машинное обучение | Ограниченно: нужны выгрузки | Хорошо: прямой доступ к сырым данным | Хорошо: те же данные без копирования |\n| Стоимость хранения | Высокая | Низкая | Низкая |\n| Управление данными | Зрелое | Слабое — риск «болота данных» | Единый каталог и права доступа |\n| Копии данных | Отдельная копия для BI | Отдельная копия для ML | Одна копия для BI и ML |\n\n## Выбор для организации со структурированной отчётностью и данными для ML\n\nРекомендуется **Data Lakehouse**:\n\n1) одна платформа и **одна копия данных** вместо связки «озеро + хранилище», где одни и те же данные дублируются и синхронизируются двумя конвейерами;\n2) **отчётность** строится по «золотому» слою с ACID-транзакциями и контролем схемы — цифры воспроизводимы, а «путешествие во времени» позволяет восстановить данные на дату отчёта;\n3) **машинное обучение** использует «бронзовый» и «серебряный» слои с полной историей сырых событий;\n4) **дешёвое хранение** на объектном хранилище и разделение хранения и вычислений;\n5) **единое управление**: каталог, права доступа и происхождение данных для всех слоёв.\n\nУсловия выбора — наличие команды инженеров данных и зрелых процессов Data Governance. Если в организации уже работает надёжное хранилище с регуляторной отчётностью, разумен поэтапный переход: сначала озеро-хранилище для новых данных и ML, затем перенос витрин.\n\n**Пример.** Оператор связи хранит отчётность по выручке и абонентам и одновременно обучает модели оттока на детализации звонков и журналах сети. В архитектуре Lakehouse журналы попадают в «бронзовый» слой, очищенные данные об абонентах — в «серебряный», витрины выручки — в «золотой». Финансовые отчёты строятся SQL-запросами к «золоту», модель оттока обучается на «серебре»; конвейер один, копия данных одна.\n\n**Вывод.** Хранилище обеспечивает надёжную отчётность, озеро — дешёвое хранение сырых данных, Lakehouse объединяет оба качества. Для организации, которой одновременно нужны структурированная отчётность и данные для машинного обучения, Lakehouse — наиболее сбалансированное решение."}, {"d": "udo", "q": 21, "title": "Архитектура приложений, управление портфелем и целевой ландшафт", "md": "## Архитектура приложений и её области\n\n**Архитектура приложений** — домен корпоративной архитектуры (наряду с бизнес-архитектурой, архитектурой данных и технологической архитектурой), который описывает состав прикладных систем организации, их функции, взаимосвязи (интерфейсы, интеграционная шина, API) и соответствие бизнес-процессам. Она включает две основные области.\n\n1) **Разработка прикладных систем** — создание или приобретение приложений: сбор требований, решение «купить или разработать», проектирование, разработка и настройка, тестирование, внедрение, сопровождение. Работа ведётся по методологиям жизненного цикла (каскадная модель, Agile) и стандартам серии ГОСТ 34 (стадии создания автоматизированных систем, техническое задание). Результат — отдельная система, отвечающая требованиям.\n2) **Управление портфелем приложений** (Application Portfolio Management) — управление всей совокупностью приложений как инвестиционным портфелем: инвентаризация (реестр систем с владельцами, функциями, интеграциями, затратами), оценка, решение о судьбе каждого приложения и дорожная карта изменений. Результат — сбалансированный ИТ-ландшафт.\n\n## Зачем оценивать ценность приложений\n\n- ИТ-бюджет ограничен, а значительная его часть уходит на поддержку унаследованных систем — оценка показывает, где деньги не создают ценности;\n- выявляются дублирующие системы (три CRM в разных филиалах) и «сироты» без владельцев;\n- инвестиции направляются в системы, которые поддерживают стратегию;\n- снижаются риски: прекращение поддержки вендором, уязвимости, санкционные ограничения, несоответствие требованиям регуляторов.\n\nПриложения оценивают по двум осям: **ценность для бизнеса** (поддержка ключевых процессов, число пользователей, критичность, вклад в стратегию) и **техническое состояние** (поддержка вендором, архитектура, интеграции, безопасность, стоимость владения — TCO). Результат наносят на матрицу TIME, предложенную Gartner.\n\n![Матрица TIME для управления портфелем приложений](img/udo21_time.webp){560}\n\n## Целевой ландшафт ИТ-приложений\n\n**Целевой ландшафт (TO-BE)** — желаемый через 3–5 лет состав приложений и связей между ними, вытекающий из стратегии. Его сравнивают с текущим ландшафтом (AS-IS); разрыв между ними раскладывается в дорожную карту из переходных состояний. Целевой ландшафт служит «компасом»: каждый новый проект проверяется на соответствие ему, что предотвращает появление разрозненных систем.\n\n## Пример: решение о замене устаревшей системы\n\nТаблица: Оценка самописной CRM дистрибьютора\n{w:30,70}\n| Критерий | Оценка |\n|---|---|\n| Ценность для бизнеса | Высокая: через систему проходят все продажи B2B, 120 пользователей |\n| Техническое состояние | Плохое: разработчик уволился, нет API для интеграции с 1С:ERP, нет мобильного доступа, ежемесячные сбои |\n| Стоимость владения | Около 6 млн руб. в год на поддержку и доработки |\n| Риски | Невозможность выполнить требования 152-ФЗ к журналированию и разграничению доступа |\n| Квадрант TIME | Migrate — мигрировать |\n\nЦелевой ландшафт предусматривает CRM из реестра российского программного обеспечения (постановление Правительства РФ от 16.11.2015 № 1236), интегрированную с ERP через API. Расчёт на пять лет: сохранение старой системы — около 30 млн руб. плюс потери от простоев; замена — внедрение 12 млн руб. и сопровождение 2,5 млн руб. в год, итого около 24,5 млн руб. Портфельный комитет утверждает миграцию за 18 месяцев: данные переносятся поэтапно, старая CRM после перехода выводится из эксплуатации (квадрант Eliminate).\n\n**Вывод.** Архитектура приложений сочетает разработку отдельных систем и управление их портфелем. Оценка ценности и состояния приложений вместе с целевым ландшафтом превращает замену устаревших систем из эмоционального спора в обоснованное инвестиционное решение."}, {"d": "udo", "q": 22, "title": "Облачные модели обслуживания IaaS, PaaS и SaaS", "md": "## Характеристика моделей\n\nМодели определены в документе NIST SP 800-145 (2011):\n\n- **IaaS (Infrastructure as a Service)** — провайдер предоставляет виртуальные серверы, хранилища и сети; организация сама устанавливает ОС, СУБД и приложения (пример — виртуальные машины Yandex Compute Cloud).\n- **PaaS (Platform as a Service)** — провайдер предоставляет готовую платформу: среду выполнения, управляемые СУБД и аналитические движки; организация разрабатывает приложения и работает с данными (пример — управляемые сервисы PostgreSQL, ClickHouse, Greenplum в российских облаках).\n- **SaaS (Software as a Service)** — готовое приложение по подписке; организация лишь настраивает его и использует (пример — BI-сервис Yandex DataLens, облачные CRM).\n\n![Распределение ответственности между организацией и провайдером](img/udo22_cloud.webp){600}\n\nДействует **модель разделённой ответственности**: чем выше уровень сервиса, тем больше берёт на себя провайдер. Но **данные и права доступа всегда остаются ответственностью организации**: провайдер SaaS не отвечает за то, что сотрудник выдал доступ к отчёту постороннему.\n\n## Сравнение моделей\n\nТаблица: Сравнение IaaS, PaaS и SaaS\n{w:22,26,26,26}\n| Критерий | IaaS | PaaS | SaaS |\n|---|---|---|---|\n| Гибкость | Максимальная: любая ОС и любое ПО | Средняя: в рамках возможностей платформы | Минимальная: функции приложения |\n| Скорость внедрения | Дни и недели: нужно установить и настроить ПО | Часы и дни: платформа готова | Минуты и часы: готовое приложение |\n| Контроль над инфраструктурой | Высокий: ОС, сеть, конфигурация | Средний: параметры сервиса | Минимальный |\n| Требуемые компетенции | Администраторы ОС и СУБД, инженеры | Разработчики и инженеры данных | Пользователи и администратор приложения |\n| Модель затрат | Оплата за ресурсы | Оплата за ресурсы и сервис | Подписка за пользователя или объём |\n\n## Выбор для быстрого развёртывания корпоративного хранилища\n\nРекомендуется **PaaS — управляемый сервис аналитической СУБД** (например, ClickHouse или Greenplum в российском облаке), дополненный SaaS-инструментом BI.\n\n1) **Скорость:** кластер хранилища создаётся за минуты через консоль, без закупки оборудования и установки ПО.\n2) **Нет собственного ЦОД и администраторов СУБД:** установку, обновления, резервное копирование, репликацию и мониторинг выполняет провайдер.\n3) **Масштабирование:** узлы и диски добавляются по мере роста данных, оплата — по факту.\n4) **Фокус на ценности:** команда занимается моделью данных, ETL и отчётами, а не инфраструктурой.\n\nIaaS потребовал бы самостоятельно устанавливать и сопровождать СУБД — это медленнее и требует редких специалистов. Чистый SaaS-продукт хранилища даёт меньше контроля над моделью данных и интеграциями. Если в хранилище попадут персональные данные, провайдер выбирается с ЦОД в России и аттестованным сегментом (ч. 5 ст. 18 № 152-ФЗ), а обработка поручается ему договором по ч. 3 ст. 6 № 152-ФЗ.\n\n**Пример.** Сеть из 80 магазинов за две недели развернула управляемый кластер ClickHouse в российском облаке, настроила ночную загрузку из 1С и подключила дашборды DataLens. Капитальные затраты на серверы не понадобились, а при открытии новых магазинов кластер был расширен без остановки.\n\n**Вывод.** IaaS даёт максимум контроля, SaaS — максимум скорости, PaaS — баланс между ними. Для быстрого запуска корпоративного хранилища без собственного ЦОД оптимальна PaaS-модель: инфраструктуру ведёт провайдер, а организация сохраняет контроль над данными и моделью."}, {"d": "udo", "q": 23, "title": "SQL и NoSQL: модель данных, строгость схемы и выбор базы", "md": "## Различие по модели данных и строгости схемы\n\n**Реляционные (SQL) базы** представляют данные в виде таблиц — отношений, связанных первичными и внешними ключами. Схема **строгая**: типы столбцов, обязательность, уникальность и ссылочная целостность объявляются заранее и проверяются самой СУБД при каждой записи (schema-on-write). Изменение структуры требует миграции (ALTER TABLE), зато данные всегда соответствуют описанию, а ACID-транзакции гарантируют целостность.\n\n**Нереляционные (NoSQL) базы** используют иные модели — пары «ключ — значение», документы, семейства колонок, графы. Схема **гибкая или отсутствует**: записи одной коллекции могут иметь разный набор полей, новое поле появляется без миграции. Контроль структуры переносится в приложение (или включается факультативно, например JSON Schema в MongoDB). Плата за гибкость — риск несогласованных данных и, как правило, более слабые гарантии согласованности в распределённом режиме.\n\nТаблица: Модель данных и схема в SQL и NoSQL\n{w:24,38,38}\n| Критерий | SQL | NoSQL |\n|---|---|---|\n| Единица хранения | Строка таблицы | Значение по ключу, документ, строка семейства колонок, узел или ребро графа |\n| Схема | Объявляется заранее, проверяется СУБД | Гибкая, проверяется приложением |\n| Изменение структуры | Миграция схемы | Новые поля добавляются «на лету» |\n| Связи | Внешние ключи и JOIN | Вложенность, денормализация, рёбра графа |\n| Целостность | Ограничения СУБД, ACID | В основном ответственность приложения |\n\n## Четыре типа NoSQL-баз\n\n![Модели данных четырёх типов NoSQL-баз](img/udo04_nosql.webp){620}\n\nТаблица: Типы NoSQL-баз и примеры СУБД\n{w:24,46,30}\n| Тип | Модель данных | Пример СУБД |\n|---|---|---|\n| Ключ — значение | Значение произвольного вида по уникальному ключу | Redis, Tarantool |\n| Документная | Самоописываемые JSON/BSON-документы с вложенными структурами | MongoDB |\n| Колоночная (wide-column) | Строки с переменным набором колонок, сгруппированных в семейства | Apache Cassandra, HBase |\n| Графовая | Узлы и рёбра со свойствами | Neo4j |\n\n## Выбор базы для двух задач\n\n**Анализ связей между пользователями социальной сети → графовая БД (Neo4j).** Связи «дружит», «подписан», «состоит в группе» хранятся как рёбра, и каждый узел напрямую ссылается на соседей. Запросы «друзья друзей», «кратчайшая цепочка знакомств», «сообщества с плотными связями» выполняются обходом графа и встроенными алгоритмами (PageRank, выделение сообществ) на языке Cypher. В реляционной базе такой запрос — каскад самосоединений таблицы связей, время которого резко растёт с каждым уровнем глубины.\n\n**Хранение профилей с быстрым доступом → документная БД (MongoDB).** Профиль — естественный документ: имя, город, интересы, контакты, настройки приватности, вложенные списки. У разных пользователей разный набор полей, и документная модель хранит их без пустых столбцов и миграций. Профиль читается одной операцией по идентификатору за миллисекунды, нагрузка распределяется шардированием по ключу пользователя. Для самых популярных профилей добавляется кэш «ключ — значение» (Redis). Если профиль всегда читается целиком только по ключу, достаточно и хранилища «ключ — значение».\n\n**Пример.** Социальная сеть хранит профили 20 млн пользователей в MongoDB, граф из 1,5 млрд связей — в Neo4j для рекомендаций «возможно, вы знакомы», а платёжные операции — в PostgreSQL, где важны ACID-транзакции.\n\n**Вывод.** SQL-базы отличаются строгой схемой, проверяемой СУБД, NoSQL — гибкой схемой и специализированными моделями данных. Для анализа связей подходит графовая модель, для профилей с быстрым доступом — документная, а надёжные системы сочетают несколько моделей."}, {"d": "udo", "q": 24, "title": "Динамическая и статическая модели проектирования системы", "md": "## Принципиальное различие\n\n**Статическая модель** описывает **структуру** системы — из чего она состоит: классы, их атрибуты и операции, связи между объектами. Она не зависит от времени и отвечает на вопрос «что есть в системе». **Динамическая модель** описывает **поведение** — как система реагирует на события во времени, какие действия выполняет, как взаимодействует с окружением. Она отвечает на вопрос «что и в какой последовательности происходит».\n\nТаблица: Сравнение моделей\n{w:22,39,39}\n| Критерий | Динамическая модель | Статическая модель |\n|---|---|---|\n| Описывает | Поведение, взаимодействия, изменения состояний | Структуру: классы, атрибуты, операции, связи |\n| Время | Учитывается: последовательность событий | Не учитывается: «снимок» системы |\n| Диаграммы UML | Вариантов использования, последовательности, деятельности, состояний | Классов, объектов, компонентов |\n| Основной вопрос | Что система делает для пользователей | Из чего система состоит |\n| Этап | Анализ требований | Проектирование и программирование |\n\n## Динамическая модель: «чёрный ящик» и внешние акторы\n\nНа первом шаге система рассматривается как **«чёрный ящик»**: её внутреннее устройство неизвестно и неважно, описываются только реакции на внешние воздействия. **Акторы** — роли внешних участников, взаимодействующих с системой: люди (покупатель) и другие системы (платёжная система, служба доставки). Каждый **вариант использования** — законченная функция, дающая актору значимый результат.\n\n![Диаграмма вариантов использования интернет-магазина](img/udo24_usecase.webp){600}\n\nОсновной сценарий варианта «Оформить заказ»: 1) покупатель подтверждает корзину; 2) система проверяет наличие и рассчитывает сумму; 3) покупатель вводит адрес; 4) система включает вариант «Оплатить заказ» (отношение «include») и обращается к платёжной системе; 5) после подтверждения передаёт заказ службе доставки и выдаёт номер. Альтернативный сценарий: оплата отклонена — заказ остаётся в статусе «ожидает оплаты». Детальный обмен сообщениями во времени показывает диаграмма последовательности.\n\n## Статическая модель: классы и связи\n\nСтатическая модель «открывает» ящик: определяет классы, их **атрибуты** (данные) и **операции** (поведение), а также связи между объектами.\n\n![Диаграмма классов процесса покупки товара через интернет](img/udo24_class.webp){620}\n\n- **Ассоциация** с кратностями: покупатель оформляет от нуля до многих заказов (1 — 0..∗); позиция ссылается на один товар.\n- **Композиция** (закрашенный ромб): позиции заказа не существуют без заказа и удаляются вместе с ним (1 — 1..∗).\n- **Ассоциации 1 — 0..1**: у заказа может быть одна оплата и одна доставка.\n- **Обобщение** (наследование) при развитии модели: «Оплата картой» и «Оплата через СБП» — подклассы «Оплаты».\n\n**Объект** — экземпляр класса: заказ № 501 от 12.10.2026 — объект класса «Заказ», связанный с объектами «Позиция заказа».\n\n## Связь двух моделей\n\nМодели взаимно дополняют друг друга: шаги сценариев динамической модели становятся **операциями классов** статической («Оплатить заказ» → «Оплата.провести()», «Отследить доставку» → «Доставка.отследить()»), а статическая модель проверяется на достаточность — каждому сценарию должны хватать классов и связей.\n\n**Вывод.** Динамическая модель описывает, что система делает для акторов, рассматривая её как «чёрный ящик»; статическая — из каких классов и связей она построена. Для интернет-магазина первая фиксирует сценарии покупки и оплаты, вторая — структуру «Покупатель — Заказ — Позиция — Товар — Оплата — Доставка»."}, {"d": "udo", "q": 25, "title": "Централизованная и распределённая архитектуры данных, масштабирование", "md": "## Сравнение архитектур\n\nТаблица: Централизованная и распределённая архитектуры данных\n{w:20,40,40}\n| Критерий | Централизованная | Распределённая |\n|---|---|---|\n| Особенности | Единая база на одном узле или кластере в одном ЦОД; все запросы идут в одну точку | Данные разделены (шардирование) и продублированы (репликация) по узлам и площадкам |\n| Преимущества | Простота разработки и администрирования, строгая согласованность и ACID, единая точка контроля безопасности, предсказуемая стоимость на малых объёмах | Горизонтальное масштабирование, отказоустойчивость, географическая близость к пользователям, параллельная обработка |\n| Недостатки | Единая точка отказа, предел мощности одного сервера, задержки для удалённых пользователей | Сложность проектирования и сопровождения, компромиссы теоремы CAP, распределённые транзакции, сетевые задержки между узлами |\n| Примеры | PostgreSQL или MS SQL на одном сервере | Cassandra, Greenplum, PostgreSQL с шардированием (Citus), кластеры ClickHouse |\n\n## Вертикальная и горизонтальная масштабируемость\n\n![Вертикальное и горизонтальное масштабирование](img/udo25_scaling.webp){600}\n\n**Вертикальная масштабируемость (scale up)** — рост производительности за счёт усиления одного сервера: больше ядер, памяти, быстрее диски. Приложение менять не нужно, но есть физический предел, стоимость растёт нелинейно, сервер остаётся единой точкой отказа, а замена оборудования часто требует простоя.\n\n**Горизонтальная масштабируемость (scale out)** — рост за счёт добавления однотипных узлов. Нагрузку распределяет балансировщик, данные делятся на шарды и реплицируются. Предел практически отсутствует, отказ узла не останавливает сервис, а рост оплачивается линейно. Цена — усложнение архитектуры: нужно выбрать ключ шардирования, обеспечить балансировку и согласованность.\n\n## Подход для быстрорастущего сервиса\n\nРекомендуется **горизонтальное масштабирование и распределённая архитектура**, вводимые поэтапно:\n\n1) **Сервисы приложений без состояния** (stateless) за балансировщиком с автомасштабированием в облаке: при пиковой нагрузке добавляются экземпляры.\n2) **Кэш** (Redis) и CDN для статического контента снимают с базы до 80–90 % чтений.\n3) **Реплики для чтения**: основная база принимает запись, реплики обслуживают чтение.\n4) **Шардирование** по идентификатору пользователя, когда объём записи превышает возможности одного сервера.\n5) **Разные хранилища для разных задач**: платежи — в реляционной базе с ACID, лента и события — в распределённой NoSQL-базе, аналитика — в колоночном хранилище; асинхронная обработка через очередь (Kafka).\n\nНа старте разумно вертикальное масштабирование — оно дешевле в разработке. Но архитектура сразу проектируется так, чтобы переход к горизонтальной схеме не требовал переписывать систему.\n\n**Пример.** Онлайн-платформа обучения выросла за год с 50 тыс. до 2 млн пользователей. Сначала сервер PostgreSQL усилили с 16 до 64 ядер, затем вынесли сессии в Redis, добавили три реплики для чтения и разделили данные о прогрессе учащихся на 8 шардов по ID пользователя. В период сессии нагрузка выросла в пять раз, и облачное автомасштабирование добавило серверы приложений без простоя.\n\n**Вывод.** Централизованная архитектура проста и согласованна, но упирается в предел одного сервера; распределённая масштабируется почти без ограничений ценой сложности. Для быстрорастущего сервиса оптимален поэтапный переход к горизонтальному масштабированию: сервисы без состояния, кэш, реплики, затем шардирование."}, {"d": "udo", "q": 26, "title": "Подходы к интеграции данных ETL и ELT", "md": "## Сравнение подходов\n\n**ETL (Extract — Transform — Load)** — данные извлекаются, преобразуются на отдельном сервере или в ETL-инструменте и загружаются в хранилище уже в готовом виде. **ELT (Extract — Load — Transform)** — данные загружаются в целевое хранилище «как есть», а преобразования выполняются внутри него его же вычислительными ресурсами.\n\n![Последовательность этапов ETL и ELT](img/udo26_etl_elt.webp){620}\n\nТаблица: Сравнение ETL и ELT\n{w:24,38,38}\n| Критерий | ETL | ELT |\n|---|---|---|\n| Порядок этапов | Извлечение → преобразование → загрузка | Извлечение → загрузка → преобразование |\n| Место преобразований | Промежуточный ETL-сервер (Informatica, Pentaho, Apache NiFi, Airflow со скриптами) | Целевая СУБД или озеро: SQL, dbt, Spark |\n| Что попадает в хранилище | Только очищенные данные; сырые не сохраняются | Сырые данные плюс преобразованные слои |\n| Скорость загрузки | Ограничена мощностью ETL-сервера | Высокая: загрузка без предварительной обработки |\n| Гибкость | Изменение логики требует повторного извлечения | Логику можно изменить и пересчитать по сохранённым сырым данным |\n| Защита данных | Чувствительные поля можно замаскировать до загрузки | Сырые данные, включая персональные, попадают в хранилище — нужна защита сырого слоя |\n| Применимость | Локальные хранилища, умеренные объёмы, строгие требования к качеству и защите | Облачные хранилища и озёра, большие объёмы, разнородные и полуструктурированные данные |\n\n## Почему ELT распространился с облачными хранилищами и озёрами\n\n1) **Мощные масштабируемые движки.** Колоночные MPP-хранилища (ClickHouse, Greenplum, облачные DWH) преобразуют терабайты данных SQL-запросами быстрее, чем отдельный ETL-сервер, — узкое место исчезло.\n2) **Разделение хранения и вычислений.** Хранить сырые данные дёшево, а вычислительные ресурсы для преобразований оплачиваются только на время работы.\n3) **Эластичность.** Нагрузку на преобразования можно масштабировать по требованию.\n4) **Схема при чтении.** Озёра и современные хранилища принимают JSON и логи без заранее заданной структуры.\n5) **Потребности аналитики и ML.** Специалистам по данным нужны сырые данные, а не только итоговые агрегаты.\n6) **Инструменты.** dbt и подобные средства сделали SQL-преобразования управляемыми: версии в Git, тесты, документация, происхождение данных.\n\n## Выбор для загрузки больших объёмов сырых данных в облако\n\nДля задачи «загрузить большие объёмы сырых данных в облачное хранилище и обрабатывать их потом» обоснован **ELT**:\n\n- загрузка идёт параллельно и с максимальной скоростью — в объектное хранилище или сырой слой облачного DWH без промежуточной обработки;\n- сохраняется полная история: при изменении бизнес-правил витрины пересчитываются без повторного обращения к источникам;\n- преобразования выполняются масштабируемыми ресурсами облака (Spark, SQL, dbt) и оплачиваются по факту;\n- одни и те же сырые данные служат и отчётности, и машинному обучению.\n\nУсловия: доступ к сырому слою ограничивается, а персональные данные маскируются или псевдонимизируются на входе (гибридная схема ETLT — минимальное преобразование до загрузки); нужен каталог данных, чтобы озеро не превратилось в «болото»; расходы на вычисления контролируются.\n\n**Пример.** Маркетплейс ежедневно получает около 2 ТБ событий кликов и поиска. Данные потоком загружаются в объектное хранилище облака в формате Parquet, идентификаторы покупателей заменяются хэшами. Ночью Spark и dbt строят из сырого слоя витрины конверсии и рекомендаций. Когда маркетологи изменили определение «сессии», витрины за два года пересчитали за несколько часов — без повторной выгрузки из источников.\n\n**Вывод.** ETL преобразует данные до загрузки и подходит для умеренных объёмов и строгих требований к защите; ELT загружает сырые данные и преобразует их силами хранилища. С появлением облачных хранилищ и озёр ELT стал основным подходом для больших объёмов, а защиту чувствительных данных обеспечивают минимальные преобразования на входе."}, {"d": "udo", "q": 27, "title": "Аналитическая (OLAP) и транзакционная (OLTP) обработка данных", "md": "## Сравнение OLAP и OLTP\n\n**OLTP (Online Transaction Processing)** — оперативная обработка транзакций: множество коротких операций чтения и записи в учётных системах. **OLAP (Online Analytical Processing)** — оперативная аналитическая обработка больших объёмов исторических данных; термин ввёл Э. Кодд (1993).\n\nТаблица: Сравнение OLTP и OLAP\n{w:22,39,39}\n| Критерий | OLTP | OLAP |\n|---|---|---|\n| Назначение | Выполнение операций: продажа, платёж, запись на приём | Анализ, планирование, поддержка решений |\n| Тип запросов | Короткие: вставка, изменение, чтение одной записи; тысячи транзакций в секунду | Сложные агрегирующие запросы по миллионам строк, преимущественно чтение |\n| Структура данных | Нормализованная модель (3НФ), строковое хранение | Денормализованная многомерная модель («звезда», куб), колоночное хранение |\n| Частота обновления | Непрерывно, в реальном времени | Периодически пакетами: ежечасно, ежедневно |\n| Объём и история | Текущие данные, гигабайты | История за годы, терабайты |\n| Пользователи | Операторы, клиенты, кассиры | Аналитики, руководители |\n| Критерий эффективности | Время транзакции, целостность | Время ответа на аналитический запрос |\n\n## Компоненты OLAP-системы\n\n![Компоненты OLAP-системы](img/udo27_olap.webp){620}\n\n1) **Источники** — OLTP-системы: ERP, CRM, кассы, госинформсистемы.\n2) **Процессы ETL/ELT** — извлечение, очистка и загрузка по расписанию.\n3) **Хранилище и витрины данных** — интегрированная история в многомерной модели.\n4) **OLAP-сервер** — движок, который строит кубы, рассчитывает и хранит агрегаты: MOLAP (многомерное хранение, максимальная скорость), ROLAP (вычисления поверх реляционных таблиц, большие объёмы), HOLAP (агрегаты многомерно, детали реляционно).\n5) **Метаданные** — описание измерений, иерархий, мер, формул и прав доступа.\n6) **Клиентские средства** — BI-платформы, дашборды, сводные таблицы.\n\n## Куб данных, измерения и меры\n\n**Куб** — многомерное представление данных, где каждая ось — **измерение** (время, товар, регион), а каждая ячейка содержит значения **мер** — числовых показателей (выручка, количество, маржа) для данного сочетания элементов измерений. Измерения имеют **иерархии** (день → месяц → квартал → год), что позволяет переходить от итогов к деталям.\n\n![OLAP-куб продаж: измерения, элементы и ячейка с мерой](img/udo27_cube.webp){500}\n\nНад кубом выполняются операции: **срез** (фиксация значения измерения — только I квартал), **детализация** и **свёртка** (переход по иерархии), **поворот** (смена осей отчёта), **выборка подкуба** (несколько регионов и категорий).\n\n## Когда уместна OLAP, а когда — OLTP\n\nТаблица: Примеры задач\n{w:50,50}\n| OLTP | OLAP |\n|---|---|\n| Оформление заказа и списание остатка | Анализ продаж по регионам, категориям и периодам |\n| Проведение платежа | План-факт исполнения бюджета |\n| Запись пациента на приём | Анализ загрузки врачей и сроков ожидания |\n| Регистрация заявления на Госуслугах | Мониторинг сроков оказания услуг по ведомствам |\n\nАналитические запросы нельзя выполнять напрямую на OLTP-базе: тяжёлые агрегаты блокируют таблицы и замедляют работу касс и сайтов. Поэтому контуры разделяют: OLTP фиксирует факты, OLAP анализирует их копию в хранилище.\n\n**Пример.** Торговая сеть: кассовая система (OLTP) ежедневно обрабатывает 2 млн чеков. Ночью чеки загружаются в хранилище, OLAP-куб пересчитывает агрегаты, и утром коммерческий директор за секунды видит падение выручки «Электроники» в Самаре в III квартале и детализирует до конкретного магазина.\n\n**Вывод.** OLTP обеспечивает быстрые и надёжные операции, OLAP — быстрый многомерный анализ накопленной истории. OLAP-система включает источники, ETL, хранилище, OLAP-сервер, метаданные и клиентские средства, а куб с измерениями и мерами даёт аналитику интуитивную модель для срезов и детализации."}, {"d": "udo", "q": 28, "title": "Классы систем хранения данных и ограничения облака при локализации персональных данных", "md": "## Характеристика классов систем хранения\n\n![Централизованная, распределённая и облачная системы хранения](img/udo05_storage.webp){620}\n\nТаблица: Классы систем хранения данных\n{w:16,28,28,28}\n| Класс | Особенности | Преимущества | Недостатки |\n|---|---|---|---|\n| Централизованные | Единая СУБД и СХД в одном ЦОД; управление из одной точки | Простота, строгая согласованность, понятный периметр безопасности, полный контроль над размещением данных | Единая точка отказа, ограниченная масштабируемость, капитальные затраты на ЦОД |\n| Распределённые | Данные разнесены и реплицированы по узлам и площадкам | Отказоустойчивость, горизонтальный рост, близость к филиалам | Сложность, компромиссы согласованности, требования к сети и квалификации |\n| Облачные | Хранение и СУБД как услуга провайдера (IaaS, PaaS, DBaaS) | Эластичность, оплата по факту, быстрый запуск, управляемые сервисы | Зависимость от провайдера, сложнее контролировать размещение и доступ, риск привязки |\n\n## Требования 152-ФЗ и выбор архитектуры\n\n**Локализация.** Ч. 5 ст. 18 № 152-ФЗ (в ред. Федерального закона от 28.02.2025 № 23-ФЗ, с 01.07.2025): при сборе персональных данных граждан РФ их запись, систематизация, накопление, хранение, уточнение и извлечение с использованием баз данных за пределами РФ не допускаются (исключения — п. 2, 3, 4, 8 ч. 1 ст. 6). За нарушение — штраф для юридических лиц от 1 до 6 млн руб. (ч. 8 ст. 13.11 КоАП РФ), повторно — от 6 до 18 млн руб. (ч. 9).\n\n**Рекомендуемая архитектура** — гибридная, полностью в российском контуре:\n\n- первичная база с персональными данными — в собственном ЦОД (частное облако) или в аттестованном сегменте российского облачного провайдера;\n- резервная площадка — также в России, с репликацией для отказоустойчивости;\n- обезличенные и агрегированные данные — в эластичных облачных сервисах аналитики;\n- копии за рубеж — только при обоснованной необходимости и после уведомления Роскомнадзора.\n\n## Ограничения на использование облака\n\n1) **Территория.** ЦОД провайдера, где происходит первичная запись, должен находиться в России; зарубежные облачные платформы для первичной базы исключены.\n2) **Трансграничная передача.** Передача копий за рубеж допускается после уведомления Роскомнадзора (ч. 3 ст. 12 № 152-ФЗ), который вправе запретить или ограничить её (ч. 8, 12 ст. 12).\n3) **Поручение обработки.** Провайдер обрабатывает данные по поручению оператора; договор должен содержать цели, перечень действий, обязанность соблюдать конфиденциальность и требования ст. 19 (ч. 3 ст. 6). Ответственность перед субъектом несёт оператор (ч. 5 ст. 6).\n4) **Уровень защищённости.** Облачный сегмент должен обеспечивать уровень, определённый по постановлению Правительства РФ № 1119, с мерами по приказу ФСТЭК России № 21; для государственных информационных систем — требования приказа ФСТЭК России от 11.04.2025 № 117 и аттестация.\n5) **Средства защиты и шифрование.** Требуются сертифицированные средства защиты информации, а при необходимости криптографической защиты — СКЗИ, сертифицированные ФСБ России.\n6) **Операционные риски.** Зависимость от провайдера, санкционные риски отключения у иностранных сервисов, сложность миграции; нужны план выхода и резервные копии вне провайдера.\n\n**Пример.** Сеть частных клиник обслуживает 300 тыс. пациентов; данные о здоровье относятся к специальной категории, и при угрозах 3-го типа требуется УЗ-2. Медицинские карты хранятся в частном облаке собственного ЦОД в Москве с репликой в резервном ЦОД в Казани. Запись на приём и колл-центр работают в аттестованном сегменте российского облака по договору поручения. Аналитика загрузки врачей ведётся в облачном хранилище на обезличенных данных.\n\n**Вывод.** Каждый класс систем хранения имеет свои преимущества, но для оператора персональных данных граждан РФ решающим становится требование локализации. Облако допустимо только российское, с подтверждённым уровнем защиты и договором поручения, а наиболее устойчивая схема — гибридная архитектура в российском контуре."}, {"d": "udo", "q": 29, "title": "Измеримые характеристики качества данных, метрики и пороговые значения", "md": "## Характеристики качества данных\n\nКачество данных — степень их пригодности для конкретного использования. Измеримые характеристики выделяют DAMA-DMBOK и стандарт ISO/IEC 25012 «Модель качества данных».\n\nТаблица: Характеристики качества, метрики и пороги\n{w:23,25,29,23}\n| Характеристика | Смысл | Метрика | Пример порога |\n|---|---|---|---|\n| Полнота | Заполнены ли обязательные значения | Доля записей с заполненным полем | Телефон клиента: не менее 95 % |\n| Точность (достоверность) | Соответствует ли значение действительности | Доля записей, совпавших с эталоном при выборочной проверке | Адреса доставки: не менее 98 % |\n| Согласованность | Совпадают ли значения в разных системах и полях | Доля совпадающих значений справочника в ERP и CRM | Коды регионов: 100 % |\n| Своевременность (актуальность) | Достаточно ли свежи данные | Доля записей, обновлённых в пределах регламента; задержка загрузки | Продажи за вчера в хранилище к 7:00 в 99 % дней |\n| Валидность | Соответствует ли значение формату и правилам | Доля значений, прошедших проверку формата (ИНН, e-mail, даты) | Не менее 99,5 % |\n| Уникальность | Нет ли дублей | 1 − доля дублирующихся записей | Дубли клиентов: не более 0,5 % |\n| Целостность | Существуют ли связанные записи | Доля строк фактов с действующим ключом справочника | 100 % |\n\n## Как задать метрику и пороговое значение\n\n1) **Определить объект и правило:** таблица, поле и условие «правильного» значения (ИНН из 10 или 12 цифр с верной контрольной суммой).\n2) **Задать формулу:** как правило, доля записей, удовлетворяющих правилу, от общего числа: полнота = (всего − пустые) / всего × 100 %.\n3) **Измерить базовый уровень** по текущим данным.\n4) **Установить пороги исходя из влияния на бизнес:** целевой (зелёный), предупредительный (жёлтый), критический (красный). Например, полнота телефона: зелёный — 95 % и выше, жёлтый — 90–95 %, красный — ниже 90 %: без телефона нельзя подтвердить доставку.\n5) **Назначить владельца, периодичность и действия:** ежедневный расчёт, оповещение стюарда при «жёлтом», остановка загрузки витрины при «красном».\n\n## Несогласованность справочника и искажение отчётности\n\nВ ERP регион клиента хранится кодом по ОКТМО, в CRM — свободным текстом: «Московская обл.», «МО», «Подмосковье». BI-отчёт «Продажи по регионам» объединяет данные по названию, и Московская область распадается на три строки. Ни одна из них не попадает в пятёрку лидеров: регион выглядит седьмым по продажам вместо второго. Руководство сокращает маркетинговый бюджет «отстающего» региона и откладывает открытие нового склада — решение принято на искажённых данных. Аналогично несогласованные справочники товарных категорий приводят к росту строки «Без категории» и ошибочным выводам об ассортименте.\n\n## Меры по обеспечению качества\n\n- **единый эталонный справочник (НСИ, MDM)** с кодами общероссийских классификаторов (ОКТМО, ОКАТО, ГАР ФИАС, ОКВЭД 2, ОКПД 2) и таблицы соответствия кодов систем;\n- **контроль на входе:** выбор из справочника вместо свободного текста, маски, проверки контрольных сумм;\n- **правила качества в ETL** с метриками, порогами и «карантином» для ошибочных записей;\n- **дашборд качества данных** и оповещения владельцам;\n- **роли и регламенты:** владельцы и стюарды справочников, исправление ошибки в источнике;\n- **соглашения о данных** между системами-поставщиками и потребителями (формат, сроки, пороги качества).\n\n**Вывод.** Качество данных измеряется через полноту, точность, согласованность, своевременность, валидность, уникальность и целостность. Каждая характеристика превращается в метрику с формулой, порогами и владельцем, а несогласованные справочники устраняются единой НСИ и контролем на входе — иначе отчётность искажается и решения принимаются неверно."}, {"d": "udo", "q": 30, "title": "Управление мастер-данными (MDM) и «золотая запись» клиента", "md": "## Определение MDM\n\n**Управление мастер-данными (Master Data Management, MDM)** — дисциплина, в которой бизнес и ИТ совместно обеспечивают единообразие, точность, управляемость и согласованность официальных общих мастер-данных организации (определение Gartner). Цель — единая достоверная версия ключевых сущностей, используемая всеми системами. MDM объединяет процессы, роли (владельцы и стюарды) и технологии (MDM-платформы, например отечественная «Юнидата»).\n\n## Мастер-данные, транзакционные данные и метаданные\n\nТаблица: Виды данных\n{w:18,30,30,22}\n| Вид | Суть | Примеры | Изменчивость |\n|---|---|---|---|\n| Мастер-данные | Ключевые бизнес-сущности, на которые ссылаются операции; используются многими системами | Клиенты, контрагенты, товары, поставщики, сотрудники, магазины и склады | Меняются редко |\n| Транзакционные данные | Записи о событиях и операциях; всегда ссылаются на мастер-данные | Заказы, платежи, отгрузки, приёмы пациентов | Постоянно растут |\n| Метаданные | Данные о данных: структура, смысл, происхождение | Описание полей, бизнес-глоссарий, схема таблиц, lineage | Меняются при изменении систем |\n| Справочные данные (НСИ) | Классификаторы, задающие допустимые значения | Валюты (ОКВ), страны (ОКСМ), единицы измерения (ОКЕИ) | Меняются редко, часто внешние |\n\nПример: заказ № 501 — транзакционные данные; покупатель Иванов и смартфон артикул 1017, на которые ссылается заказ, — мастер-данные; описание поля «ID_покупателя» в каталоге — метаданные.\n\n## Проблема формирования «золотой записи»\n\nКлиент Иванов представлен в трёх системах: CRM, интернет-магазине и биллинге. Записи различаются написанием (кириллица и латиница, полное и сокращённое ФИО), форматами телефонов и адресов, полнотой (в одной есть дата рождения, в другой — e-mail) и актуальностью. Возникают две опасности:\n\n- **ложное несовпадение** — один человек считается тремя клиентами: тройные рассылки, неверная оценка ценности клиента;\n- **ложное совпадение** — два однофамильца сливаются в одну запись: ошибки в обслуживании и неправомерное раскрытие персональных данных.\n\n## Подход к решению\n\n![Формирование «золотой записи» клиента](img/udo30_mdm.webp){620}\n\n1) **Стандартизация:** разбор ФИО на части, приведение телефонов к единому формату, адресов — к ГАР ФИАС, транслитерация.\n2) **Сопоставление (matching):** детерминированное — по надёжным идентификаторам (ИНН, СНИЛС, телефон вместе с датой рождения); вероятностное — нечёткое сравнение ФИО и адреса (расстояние Левенштейна, мера Джаро — Винклера). Пороги: сходство не ниже 0,95 — автоматическое слияние, 0,80–0,95 — передача стюарду данных, ниже 0,80 — разные клиенты.\n3) **Слияние по правилам выживания (survivorship):** для каждого атрибута задаётся источник-приоритет (паспортные данные — из биллинга, e-mail — из интернет-магазина), берётся самое свежее, подтверждённое или наиболее полное значение.\n4) **Перекрёстные ссылки:** золотая запись получает ID_MDM и хранит связи с ключами источников; ведётся история, ошибочное слияние можно отменить.\n5) **Публикация:** эталон возвращается в системы-источники или предоставляется по API (в зависимости от стиля MDM — реестрового, консолидирующего, сосуществования или централизованного).\n6) **Стюардинг и метрики:** стюард разбирает спорные пары; контролируются доля дублей и число ручных решений.\n\n**Пример.** Записи «Иванов Иван Петрович, +7 916 123-45-67» (CRM), «Ivanov Ivan, 8 (916) 123-45-67» (интернет-магазин) и «Иванов И. П., 12.03.1990, Ленина д. 5, кв. 12» (биллинг) совпали по нормализованному телефону и сходству ФИО 0,97. Золотая запись взяла полное ФИО из CRM, дату рождения и адрес с квартирой из биллинга, e-mail — из интернет-магазина. Клиент получил ID_MDM 100245, а дубли в рассылках исчезли.\n\n**Вывод.** MDM обеспечивает единую версию ключевых сущностей, на которые ссылаются все операции. «Золотая запись» формируется последовательностью «стандартизация — сопоставление — слияние по правилам выживания — публикация» при участии стюардов, а контроль ложных совпадений защищает и качество данных, и права субъектов персональных данных."}];
const TICKETS = [
  { n:1, ebod:11, avd:21, udo:2 }, { n:2, ebod:15, avd:5, udo:17 }, { n:3, ebod:13, avd:14, udo:28 },
  { n:4, ebod:25, avd:12, udo:24 }, { n:5, ebod:19, avd:27, udo:11 }, { n:6, ebod:4, avd:16, udo:10 }
];

<script>
(() => {
const DISC = {
  ebod: { s: 'ЭБОД', n: 'Этичное и безопасное обращение с данными' },
  avd:  { s: 'АВД',  n: 'Анализ и визуализация данных' },
  udo:  { s: 'УДО',  n: 'Управление данными организации' }
};
const DKEYS = ['ebod', 'avd', 'udo'];
const LV = { 1: 'Базовый', 2: 'Средний', 3: 'Сложный' };
const FMT = { s: 'Один ответ', m: 'Несколько ответов', tf: 'Верно / неверно', mt: 'Соответствие', or: 'Порядок', in: 'Ввод ответа', op: 'Устный ответ' };
const FKEYS = ['s', 'm', 'tf', 'mt', 'or', 'in', 'op'];
const cardOf = (d, q) => CARDS.find(c => c.d === d && c.q === q);
CARDS.forEach(c => BANK.push({ id: c.d + '-' + c.q + '-op', d: c.d, q: c.q, l: 3, t: 'op', x: c.title }));

/* ---------- хранилище (только этот браузер) ---------- */
const store = {
  get(k, def){ try { const v = localStorage.getItem('m11:' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v){ try { localStorage.setItem('m11:' + k, JSON.stringify(v)); } catch (e) {} }
};
/* ---------- участники: прогресс по имени ---------- */
let profiles = store.get('profiles', {});      // key -> {name, stats, updated}
let curKey = store.get('current', null);
if (curKey && !profiles[curKey]) curKey = null;
let stats = curKey ? profiles[curKey].stats : {};   // id -> {n, ok, last}
const legacy = store.get('stats', null);       // прогресс из первой версии — достаётся первому участнику
let cloud = null;                              // {db, writable}
let cloudList = {};                            // key -> профиль из общего хранилища
const keyOf = name => 'u-' + encodeURIComponent(name.trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ')).replace(/[!'()*]/g, '_').replace(/%/g, '~');
const cleanName = n => n.trim().replace(/\s+/g, ' ').slice(0, 30);
function summary(st){
  let n = 0, sum = 0; const per = {};
  Object.keys(st || {}).forEach(id => { const r = st[id]; n += 1; sum += r.last; const k = id.split('-').slice(0, 2).join('-'); (per[k] = per[k] || [0, 0])[0] += 1; per[k][1] += r.last; });
  const mastered = Object.values(per).filter(([c, v]) => v / c >= .8 && c >= 2).length;
  return { n, acc: n ? sum / n : 0, mastered };
}
function mergeStats(a, b){
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach(id => { if (!out[id] || b[id].n > out[id].n) out[id] = b[id]; });
  return out;
}
function saveLocal(){ store.set('profiles', profiles); store.set('current', curKey); }
let pushT = null, pushing = false, pushAgain = false;
function schedulePush(){ if (!cloud || !cloud.writable || !curKey) return; clearTimeout(pushT); pushT = setTimeout(pushCloud, 1500); }
async function pushCloud(){
  if (!cloud || !cloud.writable || !curKey) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true;
  const pr = profiles[curKey], sm = summary(pr.stats);
  try {
    await cloud.db.collection('profiles').doc(curKey).set({ name: pr.name, stats: pr.stats, updated: pr.updated, answered: sm.n, acc: sm.acc, mastered: sm.mastered });
    cloudList[curKey] = { name: pr.name, stats: pr.stats, updated: pr.updated };
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) { cloud.writable = false; paintWho(); }
  }
  pushing = false;
  if (pushAgain){ pushAgain = false; schedulePush(); }
}
function saveProfile(){
  if (!curKey) return;
  profiles[curKey].stats = stats; profiles[curKey].updated = Date.now();
  saveLocal(); schedulePush();
}
function login(name, extraStats){
  name = cleanName(name); if (!name) return false;
  const k = keyOf(name);
  const local = profiles[k], remote = cloudList[k];
  let st = mergeStats(local ? local.stats : {}, remote ? remote.stats : {});
  if (extraStats) st = mergeStats(st, extraStats);
  if (!local && !remote && legacy && !Object.keys(profiles).length){ st = mergeStats(st, legacy); try { localStorage.removeItem('m11:stats'); } catch (e) {} }
  profiles[k] = { name: (local && local.name) || (remote && remote.name) || name, stats: st, updated: Date.now() };
  curKey = k; stats = st; saveProfile(); paintWho();
  return true;
}
function paintWho(){
  const pr = curKey && profiles[curKey];
  $('#who-av').textContent = pr ? pr.name.slice(0, 1).toUpperCase() : '?';
  $('#who-nm').textContent = pr ? pr.name : 'Войти';
  $('#who-btn').title = pr ? 'Сменить участника · ' + (cloud && cloud.writable ? 'прогресс в облаке' : 'прогресс на этом устройстве') : 'Войти';
}
async function initCloud(){

}

function exportCode(){
  const pr = profiles[curKey]; const idx = {}; BANK.forEach((it, i) => { idx[it.id] = i; });
  const rows = Object.keys(pr.stats).filter(id => id in idx).map(id => { const r = pr.stats[id]; return [idx[id], r.n, Math.round(r.ok * 2), Math.round(r.last * 2)].map(x => x.toString(36)).join('.'); });
  const json = JSON.stringify({ v: 1, name: pr.name, s: rows.join(',') });
  return 'M11-' + btoa(unescape(encodeURIComponent(json)));
}
function importCode(code){
  const raw = code.trim().replace(/^M11-/, '').replace(/\s+/g, '');
  const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
  if (!obj || obj.v !== 1 || !obj.name) throw new Error('bad');
  const st = {};
  (obj.s ? obj.s.split(',') : []).forEach(row => { const [i, n, ok, last] = row.split('.').map(x => parseInt(x, 36)); const it = BANK[i]; if (it) st[it.id] = { n, ok: ok / 2, last: last / 2 }; });

}

let QZ = null;
function prepare(it){

  if (it.t === 'm') p.opts = shuffle(it.o.map(t => ({ t: t.replace(/^\+/, ''), ok: t.startsWith('+') })));
  if (it.t === 'tf') p.opts = [{ t: 'Верно', ok: !!it.a }, { t: 'Неверно', ok: !it.a }];
  if (it.t === 'mt'){ p.left = shuffle(it.p.map(x => x[0])); p.right = shuffle([...new Set(it.p.map(x => x[1]))]); p.sel = {}; }
  if (it.t === 'or'){ let o; do { o = shuffle(it.s); } while (it.s.length > 1 && o.every((v, i) => v === it.s[i])); p.cur = o; }
  p.picked = new Set(); p.done = false;
  return p;
}
function startQuiz(items, opts){

function grade(p){
  const it = p.it;
  if (it.t === 's' || it.t === 'tf'){ const k = [...p.picked][0]; return k !== undefined && p.opts[k].ok ? 1 : 0; }
  if (it.t === 'm'){
    const good = p.opts.map((o, k) => o.ok === p.picked.has(k)).filter(Boolean).length;
    return good === p.opts.length ? 1 : Math.max(0, (good - (p.opts.length - good)) / p.opts.length);
  }
  if (it.t === 'mt'){ const right = it.p.filter(([l, r]) => p.sel[p.left.indexOf(l)] === r).length; return right / it.p.length; }
  if (it.t === 'or'){ const right = p.cur.filter((v, i) => v === it.s[i]).length; return right === it.s.length ? 1 : right / it.s.length * 0.5; }
  if (it.t === 'in'){ const v = norm(p.text || ''); return v && it.a.some(a => norm(a) === v) ? 1 : 0; }
  return 0;
}
function check(p){
  if (p.done) return;
  const it = p.it;
  if ((it.t === 's' || it.t === 'tf' || it.t === 'm') && !p.picked.size){ hint('Выберите вариант ответа.'); return; }
  if (it.t === 'mt' && it.p.some((x, k) => !p.sel[k])){ hint('Заполните все пары.'); return; }
  if (it.t === 'in' && !norm(p.text || '')){ hint('Введите ответ.'); return; }
  p.score = grade(p); p.done = true; record(it.id, p.score);
  if (QZ.instant){ renderQ(); } else next();
}

function finishQuiz(){
  const done = QZ.items.filter(p => p.score !== undefined);
  const total = done.reduce((a, p) => a + p.score, 0);
  const rate = done.length ? total / done.length : 0;
  const by = DKEYS.map(d => { const a = done.filter(p => p.it.d === d); return [d, a.length, a.reduce((s, p) => s + p.score, 0)]; }).filter(x => x[1]);
  const wrong = done.filter(p => p.score < 1);
  const back = QZ.back;
  V().innerHTML = `
  <div class="stack">
    <span class="eyebrow">${esc(QZ.title)} · итог</span>
    <div class="panel row" style="justify-content:space-between;gap:20px">
      <div class="stack" style="gap:6px"><span class="big mono">${pct(rate)}%</span>
        <span class="note">${plural(done.length, 'задание', 'задания', 'заданий')}, верно ${String(Math.round(total * 10) / 10).replace('.', ',')} баллов</span></div>
      <div class="bars" style="flex:1;min-width:220px">${by.map(([d, n, s]) => `<div class="bar"><span>${DISC[d].s}</span><span class="tr"><i style="width:${pct(s / n)}%;background:var(--${d})"></i></span><span class="v">${pct(s / n)}%</span></div>`).join('')}</div>
    </div>
    <div class="row">
      ${wrong.length ? `<button class="btn primary" id="b-redo">Повторить ошибки · <span class="mono">${wrong.length}</span></button>` : ''}
      <button class="btn" id="b-new">Новый тест</button>
    </div>
    <h2>${wrong.length ? 'Ошибки и неточности' : 'Ошибок нет'}</h2>
    <div class="mist">${wrong.map(p => `<div class="it"><div class="row">${dtag(p.it.d)}<span class="tag">Вопрос ${p.it.q}</span><span class="tag">${FMT[p.it.t]}</span></div>
      <div>${esc(p.it.x)}</div><div class="a">${esc(answerText(p.it))}</div>${p.it.x2 ? `<p class="note">${esc(p.it.x2)}</p>` : ''}${fullHtml(p.it.d, p.it.q, false)}</div>`).join('') || '<p class="empty">Все задания решены верно.</p>'}</div>
  </div>`;
  if (wrong.length) $('#b-redo').addEventListener('click', () => startQuiz(shuffle(wrong.map(p => p.it)), { title: 'Повтор ошибок', instant: true, back }));
  $('#b-new').addEventListener('click', () => go(back));
  QZ = null; window.scrollTo(0, 0);
}
function answerText(it){
  if (it.t === 's') return 'Ответ: ' + it.o[0];
  if (it.t === 'm') return 'Верные: ' + it.o.filter(o => o.startsWith('+')).map(o => o.slice(1)).join('; ');
  if (it.t === 'tf') return 'Ответ: ' + (it.a ? 'верно' : 'неверно') + '. ' + (it.e || '');
  if (it.t === 'mt') return it.p.map(x => x[0] + ' → ' + x[1]).join('; ');
  if (it.t === 'or') return it.s.join(' → ');
  if (it.t === 'in') return 'Ответ: ' + it.a[0];
  if (it.t === 'op') return 'Повторить карточку вопроса ' + it.q;
  return '';
}

/* ---------- развёрнутый ответ ---------- */
function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function mdHtml(md){
  const L = md.split('\n'); const out = []; let i = 0;
  const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  while (i < L.length){
    let l = L[i];
    if (!l.trim()){ i++; continue; }
    if (l.startsWith('## ')){ out.push('<h3>' + inl(l.slice(3)) + '</h3>'); i++; continue; }
    const im = l.match(/^!\[([^\]]*)\]\(([^)]+)\)(?:\{(\d+)\})?/);
    if (im){ out.push(`<figure><div class="pic"><img src="${esc(im[2])}" alt="${esc(im[1])}" loading="lazy" style="width:${im[3] ? Math.round(im[3] * 1.15) + 'px' : '100%'};max-width:100%"></div><figcaption>${inl(im[1])}</figcaption></figure>`); i++; continue; }
    if (l.startsWith('Таблица:') || l.trim().startsWith('|')){
      let cap = ''; if (l.startsWith('Таблица:')){ cap = l.slice(8).trim(); i++; }
      if (L[i] && /^\{w:/.test(L[i])) i++;
      const rows = []; while (i < L.length && L[i].trim().startsWith('|')){ rows.push(L[i]); i++; }
      const body = rows.filter(r => !/^\|\s*:?-{2,}/.test(r.trim()));
      if (body.length){
        const [h, ...rest] = body;
        out.push((cap ? `<div class="cap">${inl(cap)}</div>` : '') + `<div class="tw"><table><thead><tr>${cells(h).map(c => '<th>' + inl(c) + '</th>').join('')}</tr></thead><tbody>${rest.map(r => '<tr>' + cells(r).map(c => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('')}</tbody></table></div>`);
      } else if (cap) out.push(`<p>${inl(cap)}</p>`);
      continue;
    }
    if (/^- /.test(l)){ const it = []; while (i < L.length && /^- /.test(L[i])){ it.push(L[i].slice(2)); i++; } out.push('<ul>' + it.map(x => '<li>' + inl(x) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\) /.test(l)){ const it = []; while (i < L.length && /^\d+\) /.test(L[i])){ it.push(L[i].replace(/^\d+\) /, '')); i++; } out.push('<ol>' + it.map(x => '<li>' + inl(x) + '</li>').join('') + '</ol>'); continue; }
    const para = []; while (i < L.length && L[i].trim() && !/^(## |- |\d+\) |!\[|Таблица:|\|)/.test(L[i])){ para.push(L[i]); i++; }
    if (para.length) out.push('<p>' + inl(para.join(' ')) + '</p>'); else { out.push('<p>' + inl(l) + '</p>'); i++; }
  }
  return out.join('');
}
const answerOf = (d, q) => ANSWERS.find(a => a.d === d && a.q === q);
function fullHtml(d, q, open){
  const a = answerOf(d, q); if (!a) return '';
  return `<details class="full" data-d="${d}" data-q="${q}" ${open ? 'open' : ''}><summary><span>Развёрнутый ответ на билет <span class="sub">· ${DISC[d].s} ${q}. ${esc(a.title)}</span></span></summary><div class="ans">${open ? mdHtml(a.md) : ''}</div></details>`;
}
document.addEventListener('toggle', e => {
  const dt = e.target; if (!dt.matches || !dt.matches('details.full') || !dt.open) return;
  const box = dt.querySelector('.ans'); if (!box.innerHTML) box.innerHTML = mdHtml(answerOf(dt.dataset.d, Number(dt.dataset.q)).md);
}, true);
function explainHtml(it){
  const t = it.x2 || it.e; if (!t) return '';
  return `<div class="explain"><span class="lbl">Пояснение</span><p>${esc(t)}</p></div>`;
}

function cardHtml(c){
  if (!c) return '';
  const rows = [['План', c.plan], ['Якоря', c.anch], ['Пример', c.ex], ['Вывод', c.concl], ['Нарисовать', c.draw]].filter(r => r[1]);
  return `<div class="card panel"><dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>`;
}
function openCard(d, q){
  const c = cardOf(d, q), dr = $('#drawer');
  dr.innerHTML = `<div class="drawer" id="dr"><div class="in" role="dialog" aria-modal="true" aria-label="Карточка вопроса">
    <div class="row" style="justify-content:space-between">${dtag(d)}<button class="btn small" id="dr-x">Закрыть <span class="kbd">Esc</span></button></div>
    <h2>${q}. ${esc(c.title)}</h2>${cardHtml(c)}${fullHtml(d, q, false)}</div></div>`;
  dr.hidden = false;
  $('#dr-x').focus();
  const close = () => { dr.hidden = true; dr.innerHTML = ''; };
  $('#dr-x').addEventListener('click', close);
  $('#dr').addEventListener('click', e => { if (e.target.id === 'dr') close(); });
}

    $('#b-tq').addEventListener('click', () => {

function keepTimer(draw){ const keep = timer; if (keep){ clearInterval(keep.h); } draw(); if (keep){ timer = keep; tick(); if (keep.run) timer.h = setInterval(tick, 1000); } }
function fmtT(s){ const m = Math.floor(Math.abs(s) / 60), r = Math.abs(s) % 60; return (s < 0 ? '−' : '') + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0'); }
function tick(){
  if (!timer) return;
  const left = timer.run ? Math.round(timer.left - (Date.now() - timer.t0) / 1000) : timer.left;
  const el = $('#tm'); if (el){ el.textContent = fmtT(left); el.style.color = left <= 0 ? 'var(--bad)' : left <= 300 ? 'var(--warn)' : ''; }
  const b = $('#b-tm'); if (b) b.textContent = timer.run ? 'Пауза' : (timer.left < 1800 ? 'Продолжить' : 'Старт');
}
function bindTimer(){
  if (!timer) timer = { left: 1800, run: false, t0: 0, h: null };
  tick();
  $('#b-tm').addEventListener('click', () => {
    if (timer.run){ timer.left = Math.round(timer.left - (Date.now() - timer.t0) / 1000); timer.run = false; clearInterval(timer.h); }
    else { timer.t0 = Date.now(); timer.run = true; timer.h = setInterval(tick, 1000); }
    tick();
  });
  $('#b-tr').addEventListener('click', () => { clearInterval(timer.h); timer = { left: 1800, run: false, t0: 0, h: null }; tick(); });
}

      <div class="row"><button class="btn ghost small" id="b-del">Удалить «${esc(me.name)}» с этого устройства</button><span id="del-msg"></span></div>
    </section>` : `<section class="panel stack" style="gap:10px"><h2>Есть код переноса?</h2>
      <textarea class="code" id="imp" placeholder="M11-…"></textarea>
      <div class="row"><button class="btn small" id="b-imp">Загрузить прогресс</button><span class="note" id="imp-msg"></span></div></section>`}
  </div>`;
  const done = () => { const to = afterLogin && afterLogin !== 'who' ? afterLogin : 'test'; afterLogin = 'test'; go(to); };
  $('#login').addEventListener('submit', e => { e.preventDefault(); const v = $('#nm').value; if (!cleanName(v)){ $('#nm-msg').textContent = 'Введите имя.'; return; } login(v); done(); });
  V().querySelectorAll('.person').forEach(b => b.addEventListener('click', () => { login(b.dataset.name); done(); }));
  $('#b-imp').addEventListener('click', () => {
    try { const r = importCode($('#imp').value); login(r.name, r.stats); $('#imp-msg').textContent = 'Прогресс «' + r.name + '» загружен.'; setTimeout(viewWho, 900); }
    catch (e) { $('#imp-msg').textContent = 'Код не распознан. Скопируйте его целиком, начиная с M11-.'; }
  });
  if (me){
    $('#b-exp').addEventListener('click', () => {
      const code = exportCode(), ta = $('#exp'); ta.value = code; ta.hidden = false;
      const ok = () => { $('#exp-msg').textContent = 'Код скопирован.'; };
      const fail = () => { ta.focus(); ta.select(); $('#exp-msg').textContent = 'Выделите код и скопируйте вручную.'; };
      try { navigator.clipboard.writeText(code).then(ok, fail); } catch (e) { fail(); }
    });
    $('#b-del').addEventListener('click', () => {
      $('#del-msg').innerHTML = '<span class="row"><span class="note">Удалить прогресс с этого устройства?</span><button class="btn small" id="del-y">Удалить</button><button class="btn ghost small" id="del-n">Отмена</button></span>';
      $('#del-n').addEventListener('click', () => { $('#del-msg').innerHTML = ''; });
      $('#del-y').addEventListener('click', () => { delete profiles[curKey]; curKey = null; stats = {}; saveLocal(); paintWho(); viewWho(); });
    });
  }
  if (!me) $('#nm').focus();
}

/* ---------- клавиатура ---------- */
document.addEventListener('keydown', e => {
  if (!$('#drawer').hidden){ if (e.key === 'Escape'){ $('#dr-x').click(); } return; }
  if (e.key === 'Enter'){
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' && !(e.ctrlKey || e.metaKey)) return;
    const inQ = e.target.closest && e.target.closest('#qbody');
    if ((tag === 'button' || tag === 'select') && !inQ) return;
    const b = $('#b-check') || $('#b-next') || $('#b-reveal') || $('#b-start');
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
    return;
  }
  if (QZ && /^[1-9]$/.test(e.key) && !/input|textarea|select/i.test(e.target.tagName)){
    const o = document.querySelector(`#qbody .opt[data-k="${Number(e.key) - 1}"]`); if (o && !o.disabled) o.click();
  }
});

const start = (location.hash || '').slice(1);
paintWho();
go(VIEWS[start] ? start : 'test');
initCloud();
})();
</script>
