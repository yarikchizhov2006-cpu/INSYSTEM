собенности человека, на основании которых можно установить его личность, **и которые используются оператором для установления личности субъекта** (ч. 1 ст. 11 № 152-ФЗ). Решающее условие отнесения — цель использования: фотография в личном деле работника не является биометрией, а та же фотография, используемая системой распознавания лиц на проходной, — биометрия.\n\n**Причина усиленного режима.** Биометрию нельзя «сменить», как пароль: компрометация шаблона лица или голоса необратима. Кроме того, биометрия позволяет идентифицировать человека дистанционно и без его участия, что создаёт риск тотального наблюдения.\n\n**Единая биометрическая система (ЕБС).** Федеральный закон от 29.12.2022 № 572-ФЗ установил порядок идентификации и аутентификации с использованием биометрии: сбор и хранение биометрических образцов для таких целей сосредоточены в государственной ЕБС, банки и иные организации используют её векторы, а не собственные базы. Закон гарантирует добровольность: отказ гражданина от сдачи биометрии не может быть основанием для отказа в обслуживании.\n\n## Оператор персональных данных и оператор ИС\n\n**Оператор ПДн** — государственный орган, муниципальный орган, юридическое или физическое лицо, самостоятельно или совместно с другими лицами организующие и (или) осуществляющие обработку ПДн, а также определяющие цели обработки, состав ПДн и действия с ними (п. 2 ст. 3 № 152-ФЗ). **Оператор информационной системы** (п. 12 ст. 2 № 149-ФЗ) лишь эксплуатирует систему. Ключевое различие — **кто определяет цели и состав обработки**: им является оператор ПДн, а техническая эксплуатация может быть поручена другому лицу (обработка по поручению, ч. 3 ст. 6 № 152-ФЗ).\n\n## Пример: анкета гражданина\n\nАнкета на получение региональной субсидии на газификацию дома:\n\n- ФИО, дата рождения, адрес, телефон, СНИЛС, паспортные данные, сведения о доходах семьи — **общие ПДн** (основание — исполнение полномочий, п. 4 ч. 1 ст. 6);\n- сведения об инвалидности члена семьи для приоритетной очереди — **специальная категория** (состояние здоровья, ст. 10);\n- графа «национальность» — специальная категория, которая для цели субсидии не нужна: её запрос нарушает ч. 5 ст. 5 и ст. 10 и должен быть исключён из формы;\n- фотография заявителя для пропуска в здание — общие ПДн; та же фотография для прохода через турникет с распознаванием лица — **биометрические** ПДн (ст. 11);\n- согласие на публикацию ФИО в списке получателей на сайте района — согласие на **распространение** (ст. 10.1).\n\n**Вывод.** Персональные данные — любая информация о прямо или косвенно определённом или определяемом физическом лице (п. 1 ст. 3 № 152-ФЗ); удаление фамилии не устраняет косвенную определяемость. Категории — общие, специальные (ст. 10), биометрические (ст. 11), разрешённые для распространения (ст. 10.1) и обезличенные (ст. 13.1) — имеют разные условия обработки. Биометрией сведения становятся только при использовании для установления личности; их сбор сосредоточен в ЕБС по № 572-ФЗ."}, {"d": "ebod", "q": 10, "title": "Принципы обработки персональных данных", "md": "## Шесть принципов в семи частях статьи 5\n\nСт. 5 Федерального закона № 152-ФЗ закрепляет принципы обработки ПДн.\n\nТаблица: Принципы обработки персональных данных\n{w:12,36,52}\n| Часть ст. 5 | Принцип | Содержание |\n|---|---|---|\n| ч. 1 | Законность и справедливость | Обработка осуществляется на законной и справедливой основе |\n| ч. 2 | Ограничение целью | Обработка ограничивается достижением конкретных, заранее определённых и законных целей; не допускается обработка, несовместимая с целями сбора |\n| ч. 3 | Недопустимость объединения несовместимых баз | Не допускается объединение баз данных с ПДн, обработка которых ведётся в несовместимых между собой целях |\n| ч. 4, ч. 5 | Минимизация (соответствие целям) | Обработке подлежат только ПДн, отвечающие целям; содержание и объём соответствуют заявленным целям, избыточность не допускается |\n| ч. 6 | Точность | Обеспечиваются точность, достаточность, а при необходимости актуальность ПДн по отношению к целям; оператор принимает меры по удалению или уточнению неполных и неточных данных |\n| ч. 7 | Ограничение срока хранения | Хранение в форме, позволяющей определить субъекта, не дольше, чем требуют цели; по достижении целей ПДн уничтожаются либо обезличиваются |\n\nТаким образом, шесть принципов — законность и справедливость, ограничение целью, недопустимость объединения несовместимых баз, минимизация, точность и ограничение хранения — изложены в семи частях статьи.\n\n## Одновременное применение принципов\n\nПринципы действуют **одновременно и кумулятивно**: операция правомерна, только если соответствует каждому из них. Наличие правового основания по ст. 6 отвечает лишь на вопрос «можно ли обрабатывать вообще», но не исключает нарушения принципов. Орган власти, обрабатывающий данные во исполнение полномочий (п. 4 ч. 1 ст. 6), всё равно нарушит закон, если запросит избыточные сведения, использует их для несовместимой цели или будет хранить бессрочно. Основание — необходимое, но не достаточное условие.\n\n## Двухшаговая проверка операции\n\n**Шаг 1. Законная цель.** Сформулировать конкретную цель («назначение ежемесячной выплаты по ст. … регионального закона»), найти норму, наделяющую орган полномочием, и правовое основание обработки. Цель «на всякий случай» или «для аналитики в будущем» не является конкретной. Если цель новая — проверить её совместимость с целью сбора.\n\n**Шаг 2. Состав данных.** Для каждого реквизита ответить: нужен ли он именно для этой цели; достаточно ли менее точного значения (год рождения вместо даты, район вместо адреса); как обеспечивается точность и актуальность; когда данные будут уничтожены или обезличены. Всё, что не проходит проверку, исключается из формы, выгрузки или системы.\n\n## Примеры нарушения каждого принципа в органе власти\n\n- **законность и справедливость (ч. 1):** администрация публикует на сайте список граждан, имеющих задолженность по найму муниципального жилья, «для воспитательного эффекта» — без правового основания и в ущерб правам граждан;\n- **ограничение целью (ч. 2):** контакты родителей, собранные школой для экстренной связи, используются для рассылки агитационных материалов;\n- **недопустимость объединения баз (ч. 3):** реестр получателей социальной помощи соединяют с базой пропусков в спортивные учреждения, чтобы выявлять «нецелевое» использование средств;\n- **минимизация (ч. 4, 5):** для записи на приём к главе района требуют копию паспорта и сведения о месте работы;\n- **точность (ч. 6):** в реестре льготников годами не обновляется статус умерших получателей, и выплаты продолжают начисляться;\n- **ограничение хранения (ч. 7):** анкеты кандидатов конкурса на замещение должности хранятся годами после его завершения при отсутствии согласия на включение в кадровый резерв.\n\n## Пример проверки операции\n\nКомитет по культуре муниципального района хочет выгрузить из реестра участников мероприятий ФИО, дату рождения, адрес и телефон для анализа «охвата населения культурными услугами». Шаг 1: цель законна (полномочия в сфере культуры), но для неё не нужны сведения о конкретных людях. Шаг 2: достаточно возрастной группы и поселения — эти поля агрегируются, ФИО и телефон исключаются, выгрузка обезличивается. Операция приведена в соответствие с ч. 2, 5 и 7 ст. 5, а риск утечки снижен до нуля.\n\n**Вывод.** Ст. 5 № 152-ФЗ в семи частях устанавливает шесть принципов: законность и справедливость, ограничение целью, недопустимость объединения несовместимых баз, минимизацию, точность и ограничение хранения. Они применяются одновременно, и наличие основания по ст. 6 не исключает их нарушения. Любая операция проверяется в два шага: сначала законная цель, затем необходимый состав данных."}, {"d": "ebod", "q": 11, "title": "Правовые основания обработки персональных данных и согласие субъекта", "md": "## Двенадцать оснований части 1 статьи 6\n\nОбработка ПДн допускается только при наличии хотя бы одного основания ч. 1 ст. 6 Федерального закона № 152-ФЗ. Действуют двенадцать пунктов, которые удобно сгруппировать.\n\nТаблица: Правовые основания обработки ПДн (ч. 1 ст. 6 № 152-ФЗ)\n{w:26,74}\n| Группа | Пункты ч. 1 ст. 6 |\n|---|---|\n| 1. Воля субъекта | п. 1 — согласие субъекта |\n| 2. Публично-правовые основания | п. 2 — достижение целей международного договора или закона, осуществление возложенных на оператора функций, полномочий и обязанностей; п. 3 — правосудие; п. 3.1 — исполнение судебного акта, акта другого органа или должностного лица; п. 4 — исполнение полномочий государственных органов, органов местного самоуправления, внебюджетных фондов и участие в предоставлении государственных и муниципальных услуг, включая регистрацию на ЕПГУ |\n| 3. Частноправовые и жизненные интересы | п. 5 — исполнение договора, стороной, выгодоприобретателем или поручителем по которому является субъект; п. 6 — защита жизни, здоровья или иных жизненно важных интересов субъекта, если получить согласие невозможно; п. 7 — осуществление прав и законных интересов оператора или третьих лиц, общественно значимые цели, если не нарушаются права субъекта |\n| 4. Специальные режимы | п. 8 — профессиональная деятельность журналиста, СМИ, научная, литературная, творческая деятельность; п. 9 — статистические и иные исследовательские цели при условии обезличивания; п. 9.1 — обработка ПДн, полученных в результате обезличивания, в целях повышения эффективности государственного управления (с 01.09.2025); п. 11 — обработка ПДн, подлежащих опубликованию или обязательному раскрытию в соответствии с федеральным законом |\n\n**Пункт 10** (обработка общедоступных ПДн, «сделанных общедоступными субъектом») **утратил силу с 01.03.2021** (Федеральный закон от 30.12.2020 № 519-ФЗ). Поэтому **общедоступность сведений сама по себе не является основанием обработки**: то, что данные гражданина видны в социальной сети или на сайте, не даёт права их собирать и использовать. Распространение ПДн теперь возможно только при отдельном согласии на распространение (ст. 10.1) или ином основании.\n\n## Базовое основание для органа власти\n\nДля государственного органа базовое основание — **исполнение полномочий** (п. 4, а также п. 2 ч. 1 ст. 6): орган обрабатывает данные потому, что закон обязывает его назначать выплаты, вести реестры, рассматривать обращения. Согласие гражданина в этих случаях не требуется.\n\nСбор согласия «на всякий случай» вреден:\n\n- **вводит гражданина в заблуждение:** создаёт видимость добровольности там, где обработка обязательна по закону; согласие, без которого не оказывают услугу, не является свободным;\n- **создаёт правовую неопределённость:** при отзыве согласия неясно, должен ли орган прекратить обработку, — хотя основание по закону сохраняется;\n- **порождает лишние риски и документы:** неверно оформленное согласие само становится нарушением;\n- **маскирует отсутствие настоящего основания:** если полномочия на обработку нет, согласие его не заменит.\n\n## Требования к согласию\n\n- согласие даётся **свободно, своей волей и в своём интересе**; оно должно быть **конкретным, предметным, информированным, сознательным и однозначным** (ч. 1 ст. 9);\n- форма — любая, позволяющая подтвердить факт получения, если иное не установлено законом (ч. 1 ст. 9);\n- **с 01.09.2025** согласие оформляется **отдельно от иных информации и документов**, которые субъект подтверждает или подписывает (ч. 1 ст. 9 в ред. Федерального закона от 24.06.2025 № 156-ФЗ). Согласие, «встроенное» в договор, заявление или пользовательское соглашение после этой даты, не считается полученным; ранее оформленные согласия сохраняют силу;\n- согласие может быть **отозвано** (ч. 2 ст. 9); обязанность доказать его получение лежит на операторе (ч. 3 ст. 9);\n- **письменная форма** требуется в случаях, установленных законом (специальные категории — ст. 10, биометрия — ст. 11, решения на основе исключительно автоматизированной обработки — ст. 16). Электронный документ с электронной подписью приравнивается к письменному согласию.\n\n**Девять обязательных сведений письменного согласия** (ч. 4 ст. 9): 1) ФИО, адрес субъекта, номер основного документа, удостоверяющего личность, дата выдачи и выдавший орган; 2) те же сведения о представителе и реквизиты доверенности (при наличии); 3) наименование или ФИО и адрес оператора; 4) цель обработки; 5) перечень ПДн; 6) наименование или ФИО и адрес лица, обрабатывающего ПДн по поручению оператора (если есть); 7) перечень действий и общее описание способов обработки; 8) срок действия согласия и способ его отзыва; 9) подпись субъекта.\n\n## Согласие на распространение и обезличенные данные\n\n**Согласие на распространение** (ст. 10.1) оформляется **отдельно** от иных согласий, может быть предоставлено через информационную систему Роскомнадзора; субъект вправе установить запреты и условия обработки неограниченным кругом лиц. Молчание или бездействие не является согласием на распространение. По требованию субъекта оператор прекращает распространение в течение трёх рабочих дней.\n\n**Обезличенные ПДн** (ст. 13.1, Федеральный закон от 08.08.2024 № 233-ФЗ, с 01.09.2025): обработка допускается в целях повышения эффективности государственного управления (п. 9.1 ч. 1 ст. 6). По требованию уполномоченного органа (Минцифры России) операторы обезличивают ПДн по требованиям и методам, утверждаемым Роскомнадзором, исключают сведения ограниченного доступа и передают данные для формирования составов данных в государственной информационной системе — так, чтобы по составу данных нельзя было определить конкретного субъекта.\n\n## Алгоритм выбора основания\n\n1) Сформулировать конкретную цель обработки.\n2) Проверить, есть ли закон или полномочие, требующее обработки (п. 2–4) — для органа власти это первый и обычно достаточный шаг.\n3) Если нет — проверить договор (п. 5), жизненно важные интересы (п. 6), законный интерес (п. 7), специальные режимы (п. 8–11).\n4) Только если ни одно основание не подходит, — получить согласие (п. 1), оформив его отдельным документом.\n5) Для специальных и биометрических данных дополнительно проверить условия ст. 10 и 11; для публикации — ст. 10.1.\n6) Зафиксировать основание в политике обработки и уведомлении Роскомнадзора.\n\n## Пример\n\nМногофункциональный центр при приёме заявления о регистрации по месту жительства просил граждан подписать «согласие на обработку персональных данных», включённое в бланк заявления. Обработка ведётся во исполнение полномочий по предоставлению государственной услуги (п. 4 ч. 1 ст. 6), поэтому согласие не нужно; кроме того, после 01.09.2025 согласие, включённое в бланк, не соответствует ч. 1 ст. 9. Правильное решение — исключить «согласие» из бланка и разместить информационное уведомление о целях и основаниях обработки, а согласие получать отдельно только там, где оно действительно требуется: например, для рассылки опросов о качестве обслуживания.\n\n**Вывод.** Обработка допускается по одному из двенадцати оснований ч. 1 ст. 6 № 152-ФЗ; п. 10 утратил силу, поэтому общедоступность данных основанием не является. Для органа власти базовое основание — исполнение полномочий, а согласие «на всякий случай» вредно. Если согласие нужно, оно должно отвечать ч. 1 и 4 ст. 9 и с 01.09.2025 оформляться отдельным документом (№ 156-ФЗ); для распространения — отдельное согласие по ст. 10.1."}, {"d": "ebod", "q": 12, "title": "Права субъекта персональных данных и обязанности государственного органа-оператора", "md": "## Шесть прав субъекта\n\nТаблица: Права субъекта персональных данных\n{w:30,20,50}\n| Право | Норма № 152-ФЗ | Содержание |\n|---|---|---|\n| Право на доступ к своим данным | ст. 14 | Получить подтверждение факта обработки, сведения об операторе, целях, правовых основаниях, составе данных, источнике, сроках, порядке реализации прав (ч. 7 ст. 14) |\n| Право на уточнение | ст. 14 | Требовать уточнения неполных, неточных или устаревших данных |\n| Право на блокирование и уничтожение | ст. 14 | Требовать блокирования или уничтожения данных, полученных незаконно или не нужных для заявленной цели |\n| Право отозвать согласие | ч. 2 ст. 9 | Прекратить обработку, основанную на согласии |\n| Право на обжалование | ст. 17 | Обжаловать действия или бездействие оператора в Роскомнадзор или в суд |\n| Право на возмещение вреда | ст. 17, 24 | Требовать возмещения убытков и компенсации морального вреда |\n\nДополнительно ст. 16 запрещает принимать юридически значимые решения на основании исключительно автоматизированной обработки без письменного согласия субъекта или прямого указания закона и даёт право заявить возражение против такого решения. Право на доступ может быть ограничено федеральным законом, например в целях обороны, безопасности, оперативно-розыскной деятельности (ч. 8 ст. 14).\n\n## Корреспондирующие обязанности и сроки\n\nТаблица: Сроки исполнения обязанностей оператора\n{w:40,30,30}\n| Ситуация | Обязанность | Срок |\n|---|---|---|\n| Запрос субъекта о его данных (ч. 1 ст. 20) | Предоставить сведения или мотивированный отказ | 10 рабочих дней, продление не более чем на 5 рабочих дней с уведомлением |\n| Выявлены неполные, неточные, неактуальные данные (ч. 3 ст. 20, ч. 2 ст. 21) | Уточнить данные, снять блокирование, уведомить субъекта | 7 рабочих дней |\n| Выявлена неправомерная обработка (ч. 3 ст. 21) | Прекратить обработку; если обеспечить правомерность невозможно — уничтожить | 3 рабочих дня; уничтожение — 10 рабочих дней |\n| Достижение цели обработки (ч. 4 ст. 21) | Прекратить обработку и уничтожить данные | 30 дней |\n| Отзыв согласия (ч. 5 ст. 21) | Прекратить обработку и уничтожить данные, если нет иного основания | 30 дней |\n| Требование о прекращении обработки (ч. 5.1 ст. 21) | Прекратить обработку | 10 рабочих дней (+5) |\n| Невозможность уничтожения в срок (ч. 6 ст. 21) | Заблокировать и уничтожить | Не более 6 месяцев |\n| Запрос Роскомнадзора (ч. 4 ст. 20) | Представить информацию | 10 рабочих дней (+5) |\n\n## Обязанности оператора при сборе персональных данных\n\n1) **Определить цель и основание** до начала сбора и разъяснить субъекту юридические последствия отказа, если предоставление данных обязательно по закону (ч. 2 ст. 18).\n2) **Издать и опубликовать политику обработки ПДн** и обеспечить неограниченный доступ к ней — на официальном сайте и в местах приёма граждан (п. 2 ч. 1, ч. 2 ст. 18.1).\n3) **Назначить ответственного за организацию обработки ПДн** (п. 1 ч. 1 ст. 18.1, ст. 22.1): он осуществляет внутренний контроль, доводит требования до работников, организует приём обращений субъектов.\n4) **Соблюдать запрет зарубежных баз данных:** при сборе данных граждан России запись, систематизация, накопление, хранение, уточнение и извлечение с использованием баз данных за пределами РФ не допускаются, кроме случаев п. 2, 3, 4, 8 ч. 1 ст. 6 (ч. 5 ст. 18 в ред. Федерального закона от 28.02.2025 № 23-ФЗ, с 01.07.2025). Ранее норма лишь обязывала обеспечить запись и хранение в России; теперь это прямой запрет.\n5) **Принять правовые, организационные и технические меры защиты** (ст. 18.1, 19).\n6) **Ознакомить работников** с требованиями законодательства и локальными актами и организовать обучение (п. 6 ч. 1 ст. 18.1).\n\nЕсли данные получены не от субъекта, оператор до начала обработки сообщает ему о себе, целях, правовом основании, источнике и правах (ч. 3 ст. 18), за исключениями ч. 4 ст. 18.\n\n## Как орган обеспечивает права на доступ и уточнение\n\n1) **Приём запроса.** Запрос должен содержать реквизиты документа, удостоверяющего личность, сведения, подтверждающие участие субъекта в отношениях с оператором, и подпись (ч. 3 ст. 14); принимается лично, почтой, электронно с ЭП.\n2) **Регистрация и проверка личности** — чтобы не раскрыть данные постороннему.\n3) **Подготовка ответа по существу** — все сведения ч. 7 ст. 14, а не формальная отписка; доступ к данным предоставляется безвозмездно (ч. 3 ст. 20).\n4) **Соблюдение срока** — 10 рабочих дней, при продлении — мотивированное уведомление.\n5) **Уточнение.** При представлении сведений о неточности данные блокируются на период проверки (ч. 1 ст. 21), уточняются в течение 7 рабочих дней, субъект и третьи лица, которым данные передавались, уведомляются (ч. 2 ст. 21).\n\n## Пример\n\nГражданин направил в департамент социальной защиты запрос: какие сведения о нём хранятся и кому передавались. Ответственный за организацию обработки зарегистрировал запрос и проверил подпись; через 8 рабочих дней гражданин получил перечень данных, цели и основания обработки, сведения о передаче в Социальный фонд через СМЭВ и сроки хранения. Обнаружив неверный адрес, гражданин представил выписку о регистрации; запись заблокировали, исправили в течение 5 рабочих дней и уведомили фонд, которому адрес передавался.\n\n**Вывод.** Субъект имеет шесть основных прав — на доступ, уточнение, блокирование и уничтожение, отзыв согласия, обжалование и возмещение вреда (ст. 9, 14–17 № 152-ФЗ). Каждому соответствует обязанность органа с жёстким сроком: 10 рабочих дней на ответ, 7 — на уточнение, 3 — на прекращение неправомерной обработки, 30 дней — на уничтожение. При сборе данных орган определяет цель и основание, публикует политику, назначает ответственного, соблюдает запрет зарубежных баз (№ 23-ФЗ), принимает меры защиты и обучает работников."}, {"d": "ebod", "q": 13, "title": "Требования к защите персональных данных", "md": "## Порядок определения требований\n\nОператор обязан принимать правовые, организационные и технические меры защиты ПДн (ч. 1 ст. 19 Федерального закона № 152-ФЗ). Состав мер определяется не усмотрением оператора, а формальной процедурой.\n\n1) **Определить категорию ПДн** в информационной системе: специальные, биометрические, общедоступные или иные.\n2) **Установить тип актуальных угроз:** 1-й тип — угрозы, связанные с недокументированными (недекларированными) возможностями системного ПО; 2-й тип — прикладного ПО; 3-й тип — угрозы, не связанные с такими возможностями. Тип определяется по модели угроз с учётом оценки возможного вреда.\n3) **Учесть число субъектов:** более или менее 100 000 и являются ли они работниками оператора.\n4) **Установить уровень защищённости** от УЗ-4 (минимальный) до УЗ-1 (максимальный) по постановлению Правительства РФ от 01.11.2012 № 1119 (п. 9–12). Например, УЗ-1 — угрозы 1-го типа для специальных, биометрических или иных данных либо угрозы 2-го типа для специальных данных более 100 000 лиц, не являющихся работниками; УЗ-4 — угрозы 3-го типа для общедоступных данных либо для иных данных работников или менее 100 000 лиц.\n5) **Применить требования по уровню** (п. 13–16 постановления № 1119): для УЗ-4 — режим помещений, сохранность носителей, перечень допущенных лиц, средства защиты, прошедшие оценку соответствия; для УЗ-3 — дополнительно ответственный за безопасность ПДн в системе; для УЗ-2 — доступ к электронному журналу сообщений только лицам, которым он необходим по службе; для УЗ-1 — автоматическая регистрация изменений полномочий и структурное подразделение, ответственное за безопасность ПДн.\n\nУровень защищённости определяется актом оператора; его произвольное занижение является нарушением.\n\n## Меры по приказу ФСТЭК России № 21 и криптография\n\nПриказ ФСТЭК России от 18.02.2013 № 21 устанавливает состав организационных и технических мер по группам: идентификация и аутентификация (ИАФ), управление доступом (УПД), ограничение программной среды (ОПС), защита машинных носителей (ЗНИ), регистрация событий безопасности (РСБ), антивирусная защита (АВЗ), обнаружение вторжений (СОВ), контроль (анализ) защищённости (АНЗ), обеспечение целостности (ОЦЛ) и доступности (ОДТ), защита среды виртуализации (ЗСВ), технических средств (ЗТС), информационной системы, её средств и каналов связи (ЗИС), выявление инцидентов и реагирование (ИНЦ), управление конфигурацией (УКФ). Для каждого уровня определён базовый набор мер, который адаптируется и дополняется по модели угроз.\n\n**Требования приказа ФСБ России от 10.07.2014 № 378** применяются, если для нейтрализации актуальных угроз используются средства криптографической защиты информации (СКЗИ): например, при передаче ПДн по каналам за пределами контролируемой зоны. Приказ определяет класс СКЗИ (от КС1 до КА) в зависимости от уровня защищённости и типа угроз, а также организационные меры по работе с СКЗИ.\n\n## Обработка без средств автоматизации\n\nПостановление Правительства РФ от 15.09.2008 № 687 устанавливает особенности:\n\n- ПДн обособляются от иной информации — на отдельных материальных носителях, в специальных разделах или полях форм;\n- для разных целей обработки используются разные носители, обеспечивается их раздельное хранение;\n- типовые формы документов содержат сведения о цели обработки, операторе, источнике, сроках, перечне действий;\n- лица, осуществляющие обработку, информируются о её факте и особенностях;\n- определяются места хранения носителей и перечень лиц с доступом;\n- уничтожение или обезличивание части данных выполняется способом, исключающим их дальнейшую обработку, с сохранением возможности обработки иных данных на носителе.\n\n## Три линейки требований: не путать\n\nТаблица: Разграничение уровней, классов и категорий\n{w:28,22,24,26}\n| Шкала | Значения | Кто устанавливает | Основание |\n|---|---|---|---|\n| Уровень защищённости ПДн | УЗ-4 … УЗ-1 | Оператор ПДн | Постановление № 1119 |\n| Класс защищённости ГИС | К3, К2, К1 | Оператор (обладатель информации) | Приказ ФСТЭК России от 11.04.2025 № 117 (с 01.03.2026) |\n| Категория значимости объекта КИИ | 3-я, 2-я, 1-я | Комиссия субъекта КИИ по категорированию | Постановление Правительства РФ от 08.02.2018 № 127 |\n\nЕсли к системе применимы несколько шкал (государственная ИС, обрабатывающая ПДн и являющаяся объектом КИИ), меры принимаются по наивысшему требованию. Категория значимости КИИ определяется по пяти критериям — социальная, политическая, экономическая, экологическая значимость и значимость для обороны и правопорядка; при соответствии первой категории хотя бы по одному критерию присваивается первая.\n\n## Организационные меры на уровне подразделения и ответственность руководителя\n\n- утверждённый **перечень обрабатываемых ПДн** по каждой цели;\n- **приказ о допуске** с объёмом доступа для каждой должности;\n- определённые **места хранения** и режим доступа в помещения;\n- **инструкции работникам** о порядке обработки, передачи, копирования и уничтожения, ознакомление под подпись;\n- **журнал учёта машинных носителей**;\n- **внутренний контроль** соответствия обработки требованиям закона и локальных актов.\n\nУказ Президента РФ от 01.05.2022 № 250 возлагает на руководителей федеральных органов исполнительной власти, высших исполнительных органов субъектов РФ и ряда организаций персональную ответственность за обеспечение информационной безопасности, обязывает назначить заместителя руководителя, отвечающего за ИБ, и создать структурное подразделение по защите информации; с 01.01.2025 запрещено использовать средства защиты информации из недружественных государств.\n\n## Пример\n\nРегиональный реестр получателей мер социальной поддержки: 180 000 граждан (не работники), сведения о доходах и об инвалидности, актуальны угрозы 3-го типа. Специальные данные более 100 000 лиц при угрозах 3-го типа — **УЗ-2**. Система одновременно является ГИС, поэтому класс защищённости устанавливается по приказу № 117, и выбирается наиболее строгий набор мер. Каналы связи с районными управлениями защищаются СКЗИ, класс которых выбирается по приказу ФСБ № 378. На уровне районного управления утверждаются перечень лиц с доступом, журнал носителей и инструкция о запрете выгрузки реестра на личные устройства.\n\n**Вывод.** Требования к защите ПДн определяются формальной процедурой: категория данных, тип угроз и число субъектов задают уровень защищённости (постановление № 1119), а он — нормативный перечень мер (приказ ФСТЭК № 21); при использовании шифрования добавляются требования приказа ФСБ № 378. Обработка без автоматизации подчиняется постановлению № 687. Уровень защищённости ПДн, класс ГИС (приказ № 117) и категория объекта КИИ (постановление № 127) — разные шкалы, и при совпадении применяется наивысшая."}, {"d": "ebod", "q": 14, "title": "Трансграничная передача персональных данных и уведомления Роскомнадзора", "md": "## Понятие и уведомительный порядок\n\n**Трансграничная передача ПДн** — передача персональных данных на территорию иностранного государства органу власти иностранного государства, иностранному физическому лицу или иностранному юридическому лицу (п. 11 ст. 3 Федерального закона № 152-ФЗ).\n\nС 01.03.2023 действует **уведомительный порядок** (ст. 12 в ред. Федерального закона от 14.07.2022 № 266-ФЗ): до начала передачи оператор уведомляет Роскомнадзор, причём **отдельно** от уведомления об обработке ПДн.\n\n**Содержание уведомления** (ч. 4 ст. 12): сведения об операторе и дата уведомления об обработке; ФИО и контакты ответственного; правовое основание и цель передачи и дальнейшей обработки; категории и перечень передаваемых данных; категории субъектов; перечень иностранных государств; дата оценки соблюдения получателями конфиденциальности и безопасности ПДн.\n\n**Сведения, которые оператор получает от иностранного получателя до уведомления** (ч. 5 ст. 12): о принимаемых получателем мерах защиты ПДн и условиях прекращения обработки; информацию о правовом регулировании ПДн в иностранном государстве (если государство не включено в перечень обеспечивающих адекватную защиту); сведения о самом получателе.\n\n## Государства из перечня и вне перечня\n\nПеречень иностранных государств, обеспечивающих адекватную защиту прав субъектов, утверждает Роскомнадзор. **Критерий включения** после Федерального закона от 26.07.2026 № 265-ФЗ — соответствие правового регулирования и применяемых мер положениям Конвенции Совета Европы о защите физических лиц при автоматизированной обработке ПДн (ч. 2 ст. 12). Формальное участие государства в Конвенции перестало быть самостоятельным основанием: важно, как защита реально обеспечивается.\n\n- **В государства из перечня** передача возможна сразу после направления уведомления.\n- **В государства вне перечня** — только по истечении срока рассмотрения уведомления (10 рабочих дней), если Роскомнадзор не принял решения о запрете или ограничении (ч. 10, 11 ст. 12).\n\n**Запрет или ограничение передачи** устанавливает Роскомнадзор по собственной инициативе или по представлению уполномоченных федеральных органов (ч. 8, 12 ст. 12) — в целях защиты основ конституционного строя, нравственности, здоровья, прав и законных интересов граждан, обеспечения обороны и безопасности государства, защиты экономических и финансовых интересов Российской Федерации.\n\n## Соотношение с запретом зарубежных баз данных\n\nТрансграничная передача и локализация — разные требования. Ч. 5 ст. 18 (в ред. Федерального закона от 28.02.2025 № 23-ФЗ, с 01.07.2025) запрещает при **сборе** данных граждан России их запись, систематизацию, накопление, хранение, уточнение и извлечение с использованием баз данных за пределами РФ. Значит, первичная база должна находиться в России; последующая передача копии данных за рубеж возможна только через уведомительный порядок ст. 12. Сбор данных россиян сразу в зарубежный облачный сервис нарушает ч. 5 ст. 18 независимо от уведомления.\n\n## Уведомление об обработке персональных данных\n\n- **Обязанность:** до начала обработки оператор направляет в Роскомнадзор уведомление о намерении осуществлять обработку (ч. 1 ст. 22).\n- **Содержание** (ч. 3 ст. 22): наименование и адрес оператора; цель обработки (с категориями данных и субъектов, правовым основанием, перечнем действий по каждой цели); описание мер защиты по ст. 18.1 и 19, включая сведения о шифровальных средствах; ответственный за организацию обработки и его контакты; дата начала и срок или условие прекращения обработки; наличие трансграничной передачи; место нахождения базы данных; сведения о лицах, имеющих доступ к данным в государственных и муниципальных информационных системах; сведения об обеспечении безопасности.\n- **Обработка без уведомления** (ч. 2 ст. 22) после 01.09.2022 допускается лишь в трёх случаях: данные в ГИС, созданных для защиты безопасности государства и общественного порядка; обработка исключительно без средств автоматизации; обработка по законодательству о транспортной безопасности. Прежние исключения (например, данные работников) отменены.\n- **Сроки:** об изменении сведений — не позднее 15-го числа месяца, следующего за месяцем изменений; о прекращении обработки — в течение 10 рабочих дней (ч. 7 ст. 22).\n- **Реестр операторов** ведёт Роскомнадзор; сведения вносятся в течение 30 дней и общедоступны, кроме сведений о средствах обеспечения безопасности (ч. 4 ст. 22).\n\n## Уведомление об инциденте: правило 24/72\n\nПри выявлении неправомерной или случайной передачи (предоставления, распространения, доступа) ПДн, повлёкшей нарушение прав субъектов, оператор уведомляет Роскомнадзор (ч. 3.1 ст. 21):\n\n- **в течение 24 часов** — о самом инциденте, предполагаемых причинах, предполагаемом вреде, принятых мерах и контактном лице;\n- **в течение 72 часов** — о результатах внутреннего расследования и лицах, виновных в инциденте (при наличии).\n\nСроки исчисляются с момента выявления инцидента. Параллельно оператор обязан взаимодействовать с **ГосСОПКА**, в том числе информировать её о компьютерных инцидентах, повлёкших неправомерную передачу ПДн (ч. 12 ст. 19; порядок — приказ ФСБ России от 13.02.2023 № 77). Уведомление Роскомнадзора защищает права субъектов, информирование НКЦКИ — служит реагированию на компьютерные атаки; это самостоятельные обязанности, одна не заменяет другую.\n\n## Пример\n\nОбластной центр организации отдыха детей планирует использовать зарубежный сервис онлайн-опросов, сохраняющий анкеты на серверах в другой стране. Такой сбор нарушил бы ч. 5 ст. 18: анкеты сразу записываются в зарубежную базу. Правильная схема — российский сервис для сбора; если затем данные о группе детей нужно передать принимающей стороне за рубежом (детский лагерь в другом государстве), центр получает от неё сведения о мерах защиты, направляет в Роскомнадзор уведомление о трансграничной передаче и, если государство не входит в перечень, ждёт 10 рабочих дней. Сведения о передаче отражаются и в уведомлении об обработке ПДн.\n\n**Вывод.** Трансграничная передача (п. 11 ст. 3 № 152-ФЗ) с 2023 года ведётся в уведомительном порядке ст. 12; для государств вне перечня действует ожидание 10 рабочих дней, а критерий «адекватности» с 2026 года — фактическое соответствие Конвенции 108 (№ 265-ФЗ). Передача не отменяет запрета зарубежных баз при сборе (ч. 5 ст. 18). Роскомнадзор уведомляется об обработке (ст. 22), об изменениях и прекращении, а об инцидентах — по правилу 24/72 (ч. 3.1 ст. 21) параллельно с информированием ГосСОПКА."}, {"d": "ebod", "q": 15, "title": "Ответственность за нарушения и действия при утечке персональных данных", "md": "## Четыре вида ответственности\n\nЛица, виновные в нарушении требований № 152-ФЗ, несут предусмотренную законодательством ответственность (ч. 1 ст. 24 Федерального закона № 152-ФЗ).\n\n- **Дисциплинарная.** Замечание, выговор, предупреждение о неполном должностном соответствии, увольнение (ст. 57 Федерального закона от 27.07.2004 № 79-ФЗ). Разглашение охраняемой законом тайны и служебной информации, ставших известными в связи с исполнением обязанностей, — основание для расторжения контракта по инициативе представителя нанимателя (подп. «в» п. 3 ч. 1 ст. 37 № 79-ФЗ). Обязанность не разглашать сведения закрепляется в должностном регламенте и обязательстве о неразглашении.\n- **Гражданско-правовая.** Моральный вред, причинённый субъекту нарушением его прав, подлежит возмещению независимо от возмещения имущественного вреда и понесённых убытков (ч. 2 ст. 24 № 152-ФЗ; ст. 151, 1069 ГК РФ). При крупных утечках иски могут носить массовый характер.\n- **Административная.** Ст. 13.11 КоАП РФ (в ред. Федерального закона от 30.11.2024 № 420-ФЗ, с 30.05.2025): обработка без основания или согласия, неопубликование политики, неисполнение запросов субъекта, неуведомление Роскомнадзора о намерении обрабатывать ПДн (ч. 10), неуведомление об инциденте (ч. 11: для должностных лиц — 400–800 тыс. руб., для организаций — 1–3 млн руб.), утечка в зависимости от числа субъектов (ч. 12–14: для организаций — от 3 до 15 млн руб.), утечка специальных категорий (ч. 16) и биометрии (ч. 17), повторная утечка (ч. 15, 18). Применяется также ст. 13.14 КоАП (разглашение информации ограниченного доступа лицом, получившим к ней доступ в связи с исполнением служебных обязанностей).\n- **Уголовная.** Ст. 137 УК РФ (нарушение неприкосновенности частной жизни), ст. 272 (неправомерный доступ к компьютерной информации) и **ст. 272.1** (незаконный оборот ПДн).\n\n## Оборотные штрафы и ответственность в государственном органе\n\n**Оборотные штрафы** — от 1 до 3 % совокупной выручки нарушителя за предыдущий год, но не менее 20 млн руб. (повторная утечка, ч. 15 ст. 13.11) или 25 млн руб. (повторная утечка специальных и биометрических данных, ч. 18) и не более 500 млн руб. Они применяются к **юридическим лицам и индивидуальным предпринимателям — коммерческим операторам**. Государственный орган оборотным штрафом не наказывается: в органе власти административную ответственность несут **должностные лица** (примечания к ст. 13.11 КоАП РФ) — для них при повторной утечке штраф достигает 800 тыс. – 1,2 млн руб. (ч. 15), а при повторной утечке специальных или биометрических данных — 1,5–2 млн руб. (ч. 18). Утверждение, что оборотный штраф налагается на государственный орган, — грубая ошибка.\n\n## Статья 272.1 УК РФ\n\nВведена Федеральным законом от 30.11.2024 № 421-ФЗ, **действует с 11.12.2024**. Состав — незаконные использование и (или) передача (распространение, предоставление, доступ), сбор и (или) хранение компьютерной информации, содержащей ПДн, полученной путём неправомерного доступа, иного вмешательства или иным незаконным путём (ч. 1: до 4 лет лишения свободы). Квалифицирующие признаки: специальные категории и биометрия, данные несовершеннолетних (ч. 2); корыстная заинтересованность, причинение крупного ущерба, группа лиц, использование служебного положения (ч. 3); трансграничная передача (ч. 4: до 8 лет); тяжкие последствия или организованная группа (ч. 5: до 10 лет); создание и обеспечение работы ресурса для незаконного оборота ПДн (ч. 6). **Ограничение сферы действия** (примечание): статья не применяется к хранению ПДн физическими лицами исключительно для личных и семейных нужд. Практическое следствие: скачать «слитую» базу или воспользоваться сервисом «пробива» — уже оконченный состав.\n\n## Алгоритм действий при утечке: семь шагов\n\n1) **Зафиксировать** время и обстоятельства обнаружения документально — от этого момента исчисляются сроки.\n2) **Локализовать** инцидент: изолировать систему или носитель, прекратить дальнейшую утечку, сохранить журналы и следы.\n3) **Уведомить Роскомнадзор в течение 24 часов** о факте инцидента, предполагаемых причинах, вреде, принятых мерах и контактном лице (ч. 3.1 ст. 21 № 152-ФЗ).\n4) **Проинформировать НКЦКИ** (ГосСОПКА) при наличии признаков компьютерного инцидента (ч. 12 ст. 19 № 152-ФЗ; приказ ФСБ России № 77).\n5) **Провести внутреннее расследование:** комиссия устанавливает причины, объём затронутых данных, круг виновных лиц.\n6) **Направить в Роскомнадзор в течение 72 часов** сведения о результатах расследования и виновных лицах.\n7) **Устранить причины** и предотвратить повторение: изменить меры защиты, провести обучение, при необходимости уведомить субъектов о рисках (например, о возможных мошеннических звонках).\n\n**Типичные ошибки реагирования:** ждать полной картины и пропустить 24 часа (уведомление о факте направляется даже при неполной информации); удалять журналы и следы, «наводя порядок» до проверки; выключать компьютер вместо отключения от сети (теряется содержимое памяти); скрывать «незначительную» утечку — неуведомление само по себе образует состав (ч. 11 ст. 13.11 КоАП); считать уведомление Роскомнадзора заменой информирования НКЦКИ.\n\n## Структура ущерба от утечки для органа власти\n\n- **ущерб гражданам:** мошенничество с использованием утёкших сведений, шантаж, дискредитация; для органа — иски о компенсации морального вреда;\n- **правовые последствия:** административная ответственность должностных лиц, уголовные дела, дисциплинарные взыскания, проверки;\n- **финансовые затраты:** расследование, восстановление систем, усиление защиты, судебные расходы;\n- **репутационный ущерб:** снижение доверия к органу и к цифровым государственным услугам;\n- **операционный ущерб:** простой систем и отвлечение персонала;\n- **ущерб интересам государства:** использование сведений о служащих и объектах для целевых атак и социальной инженерии.\n\n## Пример\n\nСпециалист управления ЖКХ района отправил таблицу получателей компенсации за коммунальные услуги (3 200 граждан: ФИО, адреса, суммы, льготные категории) на внешний адрес вместо адреса подрядчика. Получатель сообщил об ошибке через 5 часов. Ответственный зафиксировал время, добился удаления письма получателем с письменным подтверждением, в тот же день направил уведомление в Роскомнадзор, затем провёл расследование и через двое суток направил его результаты. Причина — автодополнение адреса и отправка файла без шифрования; введены проверка адресата для внешних писем и архивы с паролем. Ответственность наступает для должностных лиц: дисциплинарная для специалиста и административная по ст. 13.11 КоАП РФ; оборотный штраф к управлению не применяется.\n\n**Вывод.** За нарушения в области ПДн наступает дисциплинарная (№ 79-ФЗ), гражданско-правовая (ст. 24 № 152-ФЗ, ГК РФ), административная (ст. 13.11 КоАП РФ в ред. № 420-ФЗ) и уголовная ответственность (ст. 272.1 УК РФ с 11.12.2024). Оборотные штрафы грозят коммерческим операторам, а в государственном органе отвечают должностные лица. При утечке орган действует по алгоритму из семи шагов с соблюдением правила 24/72 и информированием НКЦКИ, не скрывая инцидент и сохраняя доказательства."}, {"d": "ebod", "q": 16, "title": "Открытые данные: понятие, принципы и правовые основы", "md": "## Легальное определение и признаки\n\n**Открытые данные** (информация в форме открытых данных) — общедоступная информация, размещаемая её обладателями в сети «Интернет» в формате, допускающем автоматизированную обработку без предварительных изменений человеком в целях повторного её использования (ч. 4 ст. 7 Федерального закона № 149-ФЗ).\n\nТри признака открытых данных:\n\n1) **общедоступность** — сведения не относятся к информации ограниченного доступа;\n2) **машиночитаемость** — форматы CSV, XML, JSON, позволяющие программе обработать данные без участия человека;\n3) **назначение для повторного использования** — любое лицо вправе использовать данные для собственных сервисов, исследований, публикаций.\n\n**Скан документа открытыми данными не является.** Отсканированный отчёт в PDF или изображение таблицы человек прочитает, но программа обработать не сможет без ручного распознавания — нарушен признак машиночитаемости. Публикация такой «таблицы-картинки» не выполняет обязанность размещения в форме открытых данных.\n\n## Шесть принципов и модель «пяти звёзд»\n\n- **полнота** — публикуется весь массив сведений, а не удобные ведомству фрагменты;\n- **первичность** — данные в исходном виде из первоисточника, без промежуточных обобщений;\n- **актуальность** — обновление в разумный срок, указание даты актуальности и регламента;\n- **машиночитаемость** — открытые форматы, пригодные для автоматической обработки;\n- **отсутствие дискриминации** — доступ для любого лица без регистрации, обоснования цели и договора;\n- **свобода использования** — открытая лицензия: разрешены копирование, переработка, коммерческое применение.\n\nПринципы международные (Хартия открытых данных; модель Т. Бернерса-Ли), в российском праве нормативно закреплено прежде всего требование машиночитаемости. **Модель «пяти звёзд»** описывает зрелость публикации: ★ — документ в любом формате под открытой лицензией (например, PDF); ★★ — структурированные данные (таблица XLS); ★★★ — открытый непроприетарный формат (CSV); ★★★★ — использование идентификаторов (URI) для обозначения объектов; ★★★★★ — связанные данные со ссылками на другие наборы.\n\n## Правовая основа открытости органов власти\n\n- **Конституция РФ:** органы власти обязаны обеспечить каждому возможность ознакомления с документами и материалами, непосредственно затрагивающими его права и свободы, если иное не предусмотрено законом (ч. 2 ст. 24).\n- **Федеральный закон № 149-ФЗ:** понятие общедоступной информации и формы открытых данных (ст. 7); перечень сведений, доступ к которым не может быть ограничен (ч. 4 ст. 8).\n- **Федеральный закон от 09.02.2009 № 8-ФЗ** «Об обеспечении доступа к информации о деятельности государственных органов и органов местного самоуправления» (с изменениями, внесёнными Федеральным законом от 31.07.2025 № 325-ФЗ и действующими с 01.03.2026): перечень сведений, размещаемых в сети «Интернет» (ст. 13), порядок предоставления информации по запросу (ст. 18–20).\n- **Постановление Правительства РФ от 10.07.2013 № 583** — перечень общедоступной информации о деятельности федеральных органов, размещаемой в форме открытых данных, правила отнесения информации к таковой и периодичность обновления; методические рекомендации по публикации открытых данных.\n\nОткрытость — обязанность органа власти, установленная законом, а не проявление доброй воли.\n\n## Обязательное размещение, открытые данные и ответ на запрос\n\nТаблица: Режимы раскрытия информации органом власти\n{w:22,30,24,24}\n| Режим | Что раскрывается | Форма | Основание |\n|---|---|---|---|\n| Обязательное размещение | Сведения о деятельности органа: структура, акты, планы, отчёты, бюджет | Страницы официального сайта | Ст. 13 № 8-ФЗ |\n| Открытые данные | Наборы данных для повторного использования | CSV, XML, JSON с паспортом | Ч. 4 ст. 7 № 149-ФЗ; постановление № 583 |\n| Ответ на запрос | Информация по конкретному обращению | Письменный или электронный ответ | Ст. 18–20 № 8-ФЗ |\n\nВыполнение одной обязанности не заменяет другую: размещение отчёта в PDF на сайте не освобождает от публикации соответствующего набора в машиночитаемом виде.\n\n## Условия правомерности и прекращение размещения\n\nРазмещение открытых данных должно соответствовать законодательству о государственной тайне и о персональных данных:\n\n- если размещение может привести к распространению сведений, составляющих государственную тайну, оно **прекращается по требованию органа**, наделённого полномочиями по распоряжению такими сведениями (ч. 5 ст. 7 № 149-ФЗ);\n- если размещение может повлечь нарушение прав обладателей информации ограниченного доступа или прав субъектов ПДн, оно **прекращается по решению суда**; при нарушении требований Федерального закона № 152-ФЗ — **приостанавливается или прекращается по требованию Роскомнадзора** (ч. 6 ст. 7 № 149-ФЗ).\n\n## Открытые данные, общедоступная информация и персональные данные\n\n- **общедоступная информация** — широкое понятие (любые сведения без ограничения доступа); открытые данные — её часть, размещённая в машиночитаемом виде для повторного использования;\n- **персональные данные** открытыми данными по общему правилу не являются: их распространение допускается только при наличии основания — обязательного раскрытия по закону (п. 11 ч. 1 ст. 6 № 152-ФЗ) или согласия на распространение (ст. 10.1). Персональные данные в наборах удаляются или агрегируются до обезличенного уровня.\n\n**Примеры наборов**, публикуемых органами власти: расписания и маршруты общественного транспорта, реестры организаций и лицензий, сведения о бюджетных расходах и закупках, показатели качества атмосферного воздуха, перечни образовательных и медицинских организаций, результаты контрольных мероприятий.\n\n## Пример\n\nДепартамент охраны окружающей среды области выкладывал ежемесячный доклад о качестве воздуха в PDF-скане. По жалобе разработчиков экологического приложения департамент перешёл на публикацию набора «Концентрации загрязняющих веществ по постам наблюдения» в CSV с паспортом (поля, единицы, методика измерений, периодичность — ежедневно), обновляемого автоматически из системы мониторинга. Сведения об окружающей среде не могут быть ограничены в доступе (ч. 4 ст. 8 № 149-ФЗ), персональных данных в наборе нет, — публикация правомерна и выполняет требование машиночитаемости ч. 4 ст. 7.\n\n**Вывод.** Открытые данные — общедоступная информация в машиночитаемом формате для повторного использования (ч. 4 ст. 7 № 149-ФЗ); их принципы — полнота, первичность, актуальность, машиночитаемость, недискриминационность и свобода использования, а зрелость оценивается по модели «пяти звёзд». Правовую основу образуют ч. 2 ст. 24 Конституции, № 149-ФЗ, № 8-ФЗ и постановление № 583. Размещение правомерно, только если не раскрывает гостайну и персональные данные, иначе оно прекращается по ч. 5, 6 ст. 7."}, {"d": "ebod", "q": 17, "title": "Жизненный цикл открытых данных и порталы открытых данных", "md": "## Восемь этапов жизненного цикла\n\n1) **Инвентаризация** — составление перечня информационных ресурсов органа: какие данные есть, где хранятся, кто владелец.\n2) **Приоритизация** — выбор наборов для публикации по общественному запросу, пользе и обязательности (перечни постановления № 583).\n3) **Подготовка** — очистка, приведение к машиночитаемому формату, удаление прямых идентификаторов, обезличивание и агрегирование.\n4) **Экспертиза** — проверка рисков раскрытия персональных данных и служебной информации, в том числе связывания с уже опубликованными наборами.\n5) **Паспортизация** — оформление метаданных набора.\n6) **Публикация** — размещение на портале и предоставление программного интерфейса доступа (API).\n7) **Актуализация** — обновление по заявленному регламенту.\n8) **Обратная связь** — приём сообщений об ошибках и запросов пользователей, которые возвращают цикл к приоритизации и подготовке.\n\n**Почему основной контроль сосредоточен до публикации.** Ошибка публикации необратима: скачанный третьими лицами набор невозможно отозвать, его копии расходятся по сервисам и архивам. Поэтому экспертиза рисков проводится на этапах подготовки и экспертизы, а не после инцидента; после публикации остаются лишь меры по ограничению ущерба (снятие набора по ч. 6 ст. 7 № 149-ФЗ).\n\n## Паспорт набора данных\n\nБез полного паспорта набор бесполезен: пользователь не понимает, что означают поля и можно ли доверять данным. Состав паспорта:\n\n- наименование и описание — что содержит набор и для каких задач пригоден;\n- владелец данных — орган и подразделение, отвечающие за достоверность;\n- структура набора — перечень полей, их типы и значение;\n- периодичность обновления и дата последнего обновления;\n- территория и период охвата;\n- формат файла, интерфейс доступа, условия использования (лицензия);\n- источник и методика — как собраны данные, какие объекты не вошли;\n- контакт обратной связи и срок ответа.\n\n**Обязательный минимум** по методическим рекомендациям по публикации открытых данных: идентификатор и наименование набора, его описание, владелец и ответственное лицо с контактами, ссылка на набор, формат, описание структуры, дата первой публикации, дата последнего изменения и дата актуальности.\n\n## Инфраструктура публикации\n\n- **Федеральный портал открытых данных data.gov.ru** — единая точка публикации наборов федеральных органов; после модернизации перезапущен 15 июля 2025 года, часть наборов по-прежнему доступна на сайтах ведомств.\n- **Региональные порталы** — например, портал открытых данных Москвы data.mos.ru и аналогичные ресурсы субъектов: транспорт, здравоохранение, образование, городская среда, экология.\n- **Система официальной статистики** — Единая межведомственная информационно-статистическая система (fedstat.ru): официальные показатели с методиками и динамическими рядами.\n- **Ведомственные реестры и сервисы** — ЕГРЮЛ и сервис «Прозрачный бизнес» ФНС России, единая информационная система в сфере закупок, картотека арбитражных дел, банк данных исполнительных производств ФССП России.\n\n**Типовой функционал портала:** каталог наборов с поиском и рубрикацией, паспорта, выгрузка файлов, программный интерфейс (API), рейтинги активности ведомств, форма обратной связи.\n\n## Роль обратной связи\n\nВнешние пользователи находят ошибки и пробелы, которых ведомство не замечало: неверные координаты, устаревшие записи, несогласованные коды. Обратная связь — механизм повышения качества данных и одновременно индикатор спроса: подтверждённый интерес обосновывает публикацию новых наборов и учащение обновлений. Обращение о публикации конкретного набора не обязывает орган его опубликовать, но учитывается при приоритизации.\n\n## Типичные ошибки публикации\n\n- отсканированный отчёт в PDF вместо машиночитаемого набора;\n- набор без паспорта: поля названы служебными сокращениями, дата актуальности не указана;\n- набор опубликован один раз и не обновляется, оставаясь в каталоге как действующий — правильно соблюдать регламент или перевести набор в архивный статус с указанием периода;\n- в набор попали прямые или косвенные идентификаторы граждан;\n- несоответствие структуры заявленной в паспорте, изменение формата без версии.\n\n## Пример\n\nКомитет по транспорту городского округа публикует набор «Остановочные пункты и расписания». Инвентаризация выявила данные в системе навигации автобусов; приоритизация обоснована запросами разработчиков навигаторов; подготовка — выгрузка в формате GTFS и CSV, удаление идентификаторов водителей; экспертиза подтвердила отсутствие ПДн и служебных сведений; паспорт описывает поля и ежедневное обновление; набор размещён на региональном портале с API. Через месяц пользователи сообщили о 12 остановках с перепутанными координатами; ошибки исправлены, а спрос на данные в реальном времени обосновал публикацию нового набора о движении транспорта.\n\n**Вывод.** Жизненный цикл открытых данных включает восемь этапов — инвентаризацию, приоритизацию, подготовку, экспертизу, паспортизацию, публикацию, актуализацию и обратную связь, причём контроль сосредоточен до публикации, поскольку её ошибки необратимы. Паспорт набора делает данные понятными и проверяемыми. Инфраструктура публикации включает федеральный и региональные порталы, ЕМИСС и ведомственные реестры (ст. 13 № 8-ФЗ, ст. 7 № 149-ФЗ, постановление № 583)."}, {"d": "ebod", "q": 18, "title": "Открытые данные во взаимодействии государства, бизнеса и граждан", "md": "## Эффекты открытости\n\nТаблица: Эффекты открытых данных для участников\n{w:22,78}\n| Участник | Эффект |\n|---|---|\n| Государство | Прозрачность и подотчётность: публикация сведений о расходах, закупках и результатах работы снижает пространство для злоупотреблений и повышает доверие |\n| Общество | Гражданский контроль: некоммерческие организации и активисты сопоставляют планы и фактическое исполнение, выявляют расхождения |\n| СМИ | Журналистика данных: расследования на основе анализа закупок, бюджетов, экологических показателей |\n| Бизнес | Сервисы для граждан: навигация и транспортные приложения, поиск недвижимости, проверка контрагентов строятся на государственных данных |\n| Наука | Исследования городской среды, миграции, здравоохранения на основе открытой статистики |\n| Сам орган власти | Обратная связь и качество: внешние пользователи находят ошибки; открытость дисциплинирует внутренний учёт и снижает нагрузку на справочные каналы |\n\nОткрытые данные — одновременно инструмент подотчётности и «сырьё» для сервисов, которые государство само создавать не обязано.\n\n## От публикации к общественному эффекту\n\n1) **Публикация набора** — машиночитаемые данные с паспортом.\n2) **Освоение данных сообществом** — разработчики, исследователи и журналисты изучают структуру, задают вопросы.\n3) **Создание продукта** — приложение, исследование, публикация, аналитический сервис.\n4) **Общественный эффект** — граждане получают удобный сервис, общество — сведения о работе органа, ведомство — снижение нагрузки.\n5) **Обратная связь о качестве** — пользователи выявляют ошибки, данные улучшаются.\n6) **Расширение публикации** — подтверждённый спрос обосновывает новые наборы и учащение обновлений.\n\n**Ценность создаётся использованием, а не публикацией.** Набор без потребителей остаётся издержкой: его нужно готовить, проверять и обновлять, а пользы нет. Поэтому орган должен не только выкладывать данные, но и выстраивать диалог с пользователями: изучать спрос, отвечать на вопросы, поддерживать стабильность формата и API.\n\n## Решение о публикации: польза и риск\n\nРешение принимается по двум осям одновременно — общественная польза и риск раскрытия защищаемых сведений.\n\nТаблица: Матрица решения о публикации\n{w:24,38,38}\n| Риск раскрытия | Высокая общественная польза | Низкая общественная польза |\n|---|---|---|\n| Низкий | Публиковать в первую очередь: расписания транспорта, реестры организаций, бюджетные расходы, экология, результаты проверок | Публиковать по возможности: справочные сведения, архивные материалы |\n| Высокий | Публиковать после обработки: агрегирование, огрубление геоданных и времени, удаление идентификаторов, экспертиза реидентификации | Не публиковать: пользы нет, а риск раскрытия ПДн и служебной информации есть |\n\nОграничения публикации установлены ч. 5, 6 ст. 7 Федерального закона № 149-ФЗ и Федеральным законом № 152-ФЗ, а обязанность обеспечивать доступ к информации о деятельности органов — Федеральным законом № 8-ФЗ.\n\n## Пример общественно полезного сервиса\n\nОбщественный проект «Карта ДТП» использует данные Госавтоинспекции о дорожно-транспортных происшествиях: координаты, время, вид ДТП, число пострадавших. Сервис показывает очаги аварийности на карте города, жители и активисты обращаются в администрацию с обоснованными предложениями — установить светофор, пешеходное ограждение, изменить организацию движения, — а органы власти получают внешнюю аналитику без затрат. Другие примеры — сервисы проверки контрагентов на основе данных ФНС России и мониторинг государственных закупок на основе ЕИС.\n\n**Собственный пример.** Администрация муниципального района публикует набор «Обращения граждан по вопросам благоустройства» без персональных данных: тема, адрес на уровне улицы, дата, статус и срок исполнения. Местные журналисты выявляют улицы, где обращения закрываются формально и повторяются, а администрация получает аргумент для включения этих улиц в программу благоустройства. Риск низкий (персональные данные удалены, адреса огрублены до улицы), польза — гражданский контроль качества работы с обращениями.\n\n**Вывод.** Открытые данные меняют взаимодействие сторон: государство становится подотчётнее, общество и СМИ получают инструмент контроля, бизнес и наука — сырьё для сервисов и исследований, а сам орган — бесплатную проверку качества своих данных. Цепочка «публикация — освоение — продукт — эффект — обратная связь — расширение» показывает, что ценность создаётся использованием. Решение о публикации принимается по двум осям: польза и риск (№ 8-ФЗ, ст. 7 № 149-ФЗ, № 152-ФЗ)."}, {"d": "ebod", "q": 19, "title": "Риски публикации открытых данных, мозаичный эффект и этика", "md": "## Риски публикации\n\n- **раскрытие персональных данных** — прямые идентификаторы в наборе или косвенная определяемость граждан;\n- **раскрытие служебной информации** ограниченного распространения и сведений ограниченного доступа;\n- **реидентификация** — восстановление личности в «обезличенном» наборе сопоставлением с другими источниками;\n- **угроза безопасности объектов** — раскрытие расположения, режима работы и уязвимостей критически важных объектов.\n\n## Мозаичный эффект и эмерджентность\n\n**Мозаичный эффект** — ситуация, когда отдельные фрагменты информации, каждый из которых общедоступен и сам по себе безобиден, при сопоставлении дают охраняемый результат: сведения ограниченного доступа или идентификацию конкретного лица. Пример: обезличенный демографический набор (пол, год рождения, почтовый индекс) + обезличенные маршруты поездок со временем и координатами + публичный профиль в социальной сети с местом работы и фотографиями = конкретный человек, его адрес и распорядок дня.\n\nМеханизм объясняется **эмерджентностью** — возникновением у системы свойств, которых нет у её элементов: портрет нельзя увидеть ни в одном отдельном кружке или треугольнике, он появляется только при соединении элементов. Эмерджентные свойства нельзя проконтролировать, предсказать и ими нельзя управлять на уровне отдельного элемента.\n\n**Почему риск нельзя оценить по одному набору.** Ведомство оценивает свой набор изолированно, а исследователь или злоумышленник сопоставляет его с десятками других наборов, сведениями социальных сетей и базами утечек. Публикующее ведомство в принципе не видит всех наборов, с которыми его данные будут соединены. Обезличивание — не бинарное свойство, а степень: при достаточном числе сопоставляемых наборов обезличенность разрушается.\n\n## Результаты исследований реидентификации\n\n- **87 %** населения США уникально определяются комбинацией почтового индекса, полной даты рождения и пола (Л. Свини, 1997); по «обезличенной» базе страховых записей была установлена медицинская карта губернатора штата Массачусетс;\n- **4 точки «место и время»** достаточно для уникальной идентификации 95 % людей в обезличенных данных сотовой связи 1,5 млн абонентов (И. де Монжуа и др., Scientific Reports, 2013);\n- **4 банковские транзакции** уникально идентифицируют 90 % из 1,1 млн человек (де Монжуа и др., Science, 2015);\n- **15 демографических атрибутов** позволяют корректно реидентифицировать 99,98 % жителей США в любом обезличенном наборе (Роше, Хендрикс, де Монжуа, Nature Communications, 2019);\n- **тепловая карта пробежек** фитнес-сервиса (2018) — агрегированные обезличенные данные раскрыли расположение и планировку военных объектов.\n\n## Восемь мер управления риском публикации\n\n1) **Удалить прямые идентификаторы:** ФИО, паспортные данные, СНИЛС, телефоны, адреса, государственные регистрационные знаки.\n2) **Оценить квазиидентификаторы:** дата рождения, точный адрес, редкая профессия, точное время и координаты — по отдельности не имя, вместе идентификатор.\n3) **Огрубить точность:** год вместо даты, район вместо адреса, интервал вместо точного времени, округление координат.\n4) **Агрегировать малые группы:** если в ячейке менее пяти записей, человек вычисляется — категории объединяются.\n5) **Проверить связывание** с уже опубликованными наборами своего и смежных ведомств.\n6) **Провести экспертизу до публикации** с участием ответственного за обработку ПДн и подразделения по защите информации.\n7) **Установить регламент отзыва** — порядок и сроки снятия набора при выявлении нарушения (ч. 6 ст. 7 № 149-ФЗ).\n8) **Документировать решение** — какие риски оценивались и почему публикация признана допустимой.\n\n## Этическая рамка и правовые границы OSINT\n\n**Этическая рамка:** открытость и приватность не противоположны — задача органа власти раскрыть максимум сведений о собственной деятельности и минимум о конкретных людях. Методы разведки по открытым источникам (OSINT) изучаются не для сбора сведений о людях, а чтобы понимать, что уже собрано о служащих и органе, и сокращать этот объём.\n\n**Правовые границы:**\n\n- допустима работа с общедоступной информацией без обхода технических ограничений и без доступа к чужим учётным записям (ст. 7 № 149-ФЗ);\n- подбор паролей и обход авторизации, повлёкшие копирование или модификацию информации, — неправомерный доступ (ст. 272 УК РФ);\n- незаконное собирание сведений о частной жизни, составляющих личную или семейную тайну, — преступление уже на стадии сбора, без распространения (ст. 137 УК РФ); частная жизнь охраняется и гражданским правом (ст. 152.2 ГК РФ);\n- обращение к сервисам «пробива» и хранение «слитых» баз — незаконный оборот ПДн (ст. 272.1 УК РФ);\n- публичность сведений в социальной сети не даёт права их собирать: п. 10 ч. 1 ст. 6 № 152-ФЗ упразднён, распространение требует согласия по ст. 10.1;\n- оперативно-розыскные мероприятия вправе проводить только уполномоченные органы (ст. 13 Федерального закона от 12.08.1995 № 144-ФЗ).\n\n## Пример\n\nУправление образования планирует опубликовать набор «Результаты муниципальных олимпиад» с полями «школа, класс, год рождения, балл, наличие ОВЗ». ФИО удалены, но в малокомплектной сельской школе в 9-м классе один участник: сочетание школы, класса и года рождения однозначно указывает на ребёнка, а признак ОВЗ раскрывает сведения о здоровье (специальная категория, ст. 10 № 152-ФЗ). Решение по мерам: исключить признак ОВЗ, заменить школу на муниципальный район, объединить классы в параллели, агрегировать ячейки менее пяти участников, проверить связывание с публикациями школьных сайтов о победителях. После экспертизы публикуется только распределение баллов по районам и параллелям.\n\n**Вывод.** Риски публикации — раскрытие ПДн и служебной информации, реидентификация и угрозы объектам. Их главный механизм — мозаичный эффект, эмерджентный по природе, поэтому риск нельзя оценить по одному набору; исследования показывают, что для реидентификации достаточно нескольких точек данных. Риск снижается восемью мерами, принимаемыми до публикации (ч. 5, 6 ст. 7 № 149-ФЗ; ст. 3, 13.1 № 152-ФЗ). OSINT допустим только в отношении общедоступных сведений и в границах ст. 137, 272, 272.1 УК РФ и ст. 13 № 144-ФЗ."}, {"d": "ebod", "q": 20, "title": "Информационная безопасность и триада «конфиденциальность — целостность — доступность»", "md": "## Понятие информационной безопасности данных\n\n**Безопасность информации (данных)** — состояние защищённости информации (данных), при котором обеспечены её (их) конфиденциальность, доступность и целостность (ГОСТ Р 50922-2006 «Защита информации. Основные термины и определения», п. 2.4.5). ГОСТ Р 53114-2008 раскрывает понятие применительно к организации: обеспечение информационной безопасности организации — деятельность, направленная на устранение (нейтрализацию, парирование) внутренних и внешних угроз информационной безопасности организации или на минимизацию ущерба от возможной реализации таких угроз.\n\nДля государственного служащего информационная безопасность данных — не только техническая задача ИТ-службы, но и личная обязанность: соблюдать режим обращения со сведениями, правила доступа и сообщать об инцидентах. Три свойства образуют полный набор требований: нарушение любого из них является инцидентом информационной безопасности.\n\n## Содержание триады\n\n- **Конфиденциальность** — доступ к информации имеют только те, кто вправе. Нарушается утечкой, несанкционированным доступом, перехватом трафика, разглашением.\n- **Целостность** — информация изменяется только уполномоченными лицами и установленным способом; сохраняются её полнота и неизменность. Нарушается модификацией, подделкой записи, ошибочным вводом, отказом от авторства.\n- **Доступность** — уполномоченные лица беспрепятственно получают информацию и услуги в нужный момент. Нарушается DDoS-атакой, программой-вымогателем, отказом оборудования.\n\nТаблица: Примеры нарушения свойств в государственном органе\n{w:20,26,30,24}\n| Свойство | Типовое нарушение | Пример в органе власти | Последствия |\n|---|---|---|---|\n| Конфиденциальность | Утечка, разглашение | Копирование базы получателей пособий на личный носитель | Мошеннические звонки, шантаж |\n| Целостность | Модификация, подделка | Изменение записи о размере назначенной выплаты в реестре | Неправомерный отказ или выплата, финансовые потери |\n| Доступность | DDoS, шифровальщик | Недоступность портала услуг в последний день подачи заявлений | Пропуск срока, утрата права |\n| Аутентичность | Подмена отправителя | Рассылка фиктивных счетов с официальной почты учреждения | Ущерб контрагентам, подрыв доверия |\n\n## Техническое и правовое значения конфиденциальности\n\n**Техническая трактовка** — состояние информации, при котором доступ к ней имеют только управомоченные субъекты; описывает свойство системы и обеспечивается средствами разграничения доступа и шифрования.\n\n**Правовая трактовка** — обязательное для выполнения лицом, получившим доступ к определённой информации, требование не передавать такую информацию третьим лицам без согласия её обладателя (п. 7 ст. 2 № 149-ФЗ; так же — в приложении А ГОСТ Р 50922-2006). Это обязанность человека, за нарушение которой наступает юридическая ответственность. Служащий, имеющий законный доступ к реестру, технически не нарушает «конфиденциальность системы», но, пересказав сведения знакомому, нарушает правовую обязанность конфиденциальности.\n\n## Дополнительные свойства\n\n- **аутентичность** — подлинность источника и содержания: сведения исходят от того, кто указан отправителем;\n- **неотказуемость** — невозможность отказаться от совершённого действия (подписания, отправки); обеспечивается электронной подписью;\n- **подотчётность** — возможность однозначно установить, кто и когда выполнил действие; обеспечивается регистрацией событий и персонализированными учётными записями.\n\n## Цепочка реализации угрозы\n\n**Источник угрозы** (инсайдер, преступная группа, спецслужба, техногенный или природный фактор) → **угроза** (совокупность условий и факторов, создающих опасность нарушения безопасности информации) → **уязвимость** (свойство системы, обусловливающее возможность реализации угрозы: непоставленное обновление, слабый пароль, необученный работник) → **вектор атаки** (фишинговое письмо, эксплуатация уязвимости внешнего сервиса, вынос носителя) → **атака** (реализация угрозы) → **последствия** (утечка, нарушение работы, ущерб гражданам и государству, ответственность).\n\nРиск = вероятность (угроза × уязвимость) × ущерб. **Меры защиты направлены на уязвимости**, потому что угрозы существуют объективно и организация не может их устранить, а управлять она может только собственными уязвимостями, снижая вероятность реализации угрозы и тяжесть ущерба.\n\n## Пример\n\nВ управлении записи актов гражданского состояния специалист на время отпуска коллеги пользуется его учётной записью в ГИС, чтобы не оформлять доступ. Нарушается подотчётность (невозможно установить, кто вносил изменения), возникает уязвимость для целостности (ошибочные или умышленные изменения записей не будут привязаны к виновному) и конфиденциальности (специалист получает доступ сверх своих полномочий). Мера — не усиление «защиты от хакеров», а устранение уязвимости: персональные учётные записи, временное делегирование прав через администратора, контроль журналов.\n\n**Вывод.** Безопасность информации — состояние защищённости, при котором обеспечены её конфиденциальность, целостность и доступность (п. 2.4.5 ГОСТ Р 50922-2006); нарушение любого свойства — инцидент. Конфиденциальность имеет техническое значение (свойство системы) и правовое (обязанность лица по п. 7 ст. 2 № 149-ФЗ). Триаду дополняют аутентичность, неотказуемость и подотчётность, а меры защиты направляются на уязвимости — единственное звено цепочки угрозы, которым управляет организация."}, {"d": "ebod", "q": 21, "title": "Угрозы, уязвимости и атаки; несанкционированный доступ и воздействие", "md": "## Определения и взаимосвязь\n\n- **Угроза безопасности информации** — совокупность условий и факторов, создающих потенциальную или реально существующую опасность нарушения безопасности информации (ГОСТ Р 50922-2006).\n- **Уязвимость (информационной системы)** — свойство информационной системы, обусловливающее возможность реализации угроз безопасности обрабатываемой в ней информации (ГОСТ Р 50922-2006).\n- **Атака** — реализация угрозы: конкретные действия нарушителя, направленные на нарушение конфиденциальности, целостности или доступности (в терминах ГОСТ Р ИСО/МЭК 27000 — попытка уничтожения, раскрытия, изменения, блокирования, кражи, несанкционированного доступа к активу или его несанкционированного использования).\n\n**Взаимосвязь:** угроза существует объективно; она становится реальной, когда у системы есть уязвимость; атака — это использование уязвимости источником угрозы через выбранный вектор (фишинговое письмо, эксплуатация уязвимости сервиса, вынос носителя). Нет уязвимости — угроза не реализуется; поэтому защита направлена на уязвимости.\n\n## Несанкционированный доступ и несанкционированное воздействие\n\n**Несанкционированный доступ (НСД)** — доступ к информации или к ресурсам автоматизированной информационной системы, осуществляемый с нарушением установленных прав и (или) правил доступа (ГОСТ Р 53114-2008, п. 3.3.6).\n\n**Несанкционированное воздействие на информацию** — воздействие на защищаемую информацию с нарушением установленных прав и (или) правил на изменение информации (ГОСТ Р 50922-2006, п. 2.6.6); защита от него направлена на предотвращение разрушения, уничтожения, искажения, блокирования информации и сбоев носителей (п. 2.3.3).\n\nТаблица: Разграничение НСД и несанкционированного воздействия\n{w:24,38,38}\n| Признак | Несанкционированный доступ | Несанкционированное воздействие |\n|---|---|---|\n| Существо действия | Нарушение правил доступа; действие пассивное — чтение, просмотр, копирование | Нарушение правил изменения; действие активное — модификация, уничтожение, блокирование, подделка |\n| Нарушаемое свойство | Конфиденциальность | Целостность и доступность |\n| Пример | Сотрудник из любопытства копирует из ГИС сведения о знакомом | Изменение записи в реестре, удаление журналов, шифрование данных |\n| Уголовно-правовая квалификация | Ст. 272 УК РФ — если доступ к охраняемой законом информации повлёк её уничтожение, блокирование, модификацию либо копирование; ст. 272.1 — если это ПДн | Ст. 272 (неправомерный доступ с модификацией), ст. 273 (вредоносные программы), ст. 274 (нарушение правил эксплуатации), ст. 274.1 (воздействие на КИИ) |\n\n## Классификация угроз\n\n- **по природе источника:** антропогенные (действия людей), техногенные (отказы оборудования, сбои ПО, перебои электропитания), стихийные (пожар, затопление);\n- **по расположению источника:** внешние (злоумышленники вне организации), внутренние (работники, подрядчики, стажёры), комбинированные (внешний атакующий через скомпрометированную учётную запись сотрудника);\n- **по наличию умысла:** преднамеренные (хищение, саботаж, продажа доступа) и непреднамеренные (ошибка ввода, утеря носителя, отправка не тому адресату);\n- **по нарушаемому свойству:** угрозы конфиденциальности (утечка, перехват, разглашение), целостности (модификация, подделка), доступности (блокирование, уничтожение, отказ в обслуживании).\n\nРоссийская специфика: 95,6 % утечек по вине работников в России — умышленные, против 47,3 % в мире (экспертно-аналитический центр InfoWatch, 9 месяцев 2025 года).\n\n## Каналы утечки информации\n\n1) **человеческий фактор** — разглашение в разговоре, публикация в социальных сетях, вынос документов, передача сведений за вознаграждение;\n2) **технические каналы** — перехват трафика, побочные электромагнитные излучения и наводки, подключение к линиям связи, аппаратные закладки;\n3) **визуальный канал** — считывание с экрана и распечаток, съёмка экрана телефоном, обзор рабочего места посетителями;\n4) **съёмные носители** — копирование на личные накопители, утеря носителей, неправильное уничтожение дисков;\n5) **программные каналы** — вредоносное ПО, похитители учётных данных, несанкционированные средства удалённого доступа, облачные хранилища и мессенджеры.\n\n**Официальный каталог угроз** — банк данных угроз безопасности информации ФСТЭК России (bdu.fstec.ru): свыше 220 угроз и более 90 тысяч уязвимостей; используется при разработке моделей угроз по Методике оценки угроз безопасности информации ФСТЭК России (2021).\n\n## Пример уязвимости и её использования\n\nМуниципальный портал записи в детские сады открывает заявление по адресу вида «…/application?id=10452». Сервер не проверяет, принадлежит ли заявление авторизованному пользователю (уязвимость «небезопасная прямая ссылка на объект»). Родитель, изменив номер в адресной строке, видит чужие заявления: ФИО детей, адреса, сведения о льготах. Это НСД к персональным данным; массовое копирование чужих заявлений квалифицируется по ст. 272 и 272.1 УК РФ, а для оператора — инцидент с обязанностью уведомить Роскомнадзор по правилу 24/72. Мера защиты — проверка прав доступа на сервере к каждому объекту, анализ защищённости портала перед вводом в эксплуатацию.\n\n**Вывод.** Угроза — условия опасности, уязвимость — свойство системы, позволяющее её реализовать, атака — реализация угрозы. НСД нарушает правила доступа (пассивное чтение, конфиденциальность, ст. 272 УК РФ), несанкционированное воздействие — правила изменения (активные действия, целостность и доступность, ст. 272–274.1). Угрозы классифицируются по природе и расположению источника, умыслу и нарушаемому свойству; каналы утечки — человеческий, технический, визуальный, носители и программные; официальный каталог — БДУ ФСТЭК России."}, {"d": "ebod", "q": 22, "title": "Классификация и маркировка сведений; личная ответственность служащего", "md": "## Четыре уровня режима обращения со сведениями\n\nТаблица: Иерархия режимов обращения со сведениями в органе власти\n{w:26,38,36}\n| Уровень | Правовая основа | Особенности режима |\n|---|---|---|\n| Государственная тайна | Закон РФ от 21.07.1993 № 5485-1 | Грифы «особой важности», «совершенно секретно», «секретно»; допуск по особой процедуре; режимные помещения; уголовная ответственность за разглашение (ст. 283 УК РФ) |\n| Служебная информация ограниченного распространения | Постановление Правительства РФ от 03.11.1994 № 1233 | Пометка «Для служебного пользования»; учёт, ограниченный круг лиц |\n| Конфиденциальная информация | Указ Президента РФ от 06.03.1997 № 188; отраслевые законы (№ 152-ФЗ, № 98-ФЗ и др.) | Семь групп Перечня: ПДн, тайна следствия, служебная, профессиональная, коммерческая тайна, сведения об изобретении, сведения о личных делах осуждённых |\n| Общедоступная информация и открытые данные | Ст. 7 № 149-ФЗ | Свободный доступ; контроль качества и правомерности публикации |\n\nКлассификация переводит абстрактное требование «защищать информацию» в конкретные правила обращения с каждым документом.\n\n## Пометка «ДСП» и гриф секретности\n\n- **Природа:** гриф секретности — реквизит, указывающий степень секретности сведений гостайны; пометка «Для служебного пользования» — **не гриф**, а отметка о служебной информации ограниченного распространения. Режим государственной тайны на ДСП не распространяется.\n- **Кто присваивает:** должностные лица, уполномоченные руководителем органа; они несут персональную ответственность за обоснованность отнесения сведений к ДСП. Не могут быть отнесены к ДСП, в частности, акты, устанавливающие правовой статус органов и права граждан, сведения о чрезвычайных ситуациях, о состоянии экологии, об исполнении бюджета.\n- **Где проставляется:** пометка «Для служебного пользования» и номер экземпляра — в правом верхнем углу первой страницы документа, на обложке и титульном листе издания, а также на первой странице сопроводительного письма к таким документам (раздел II Положения, утв. постановлением № 1233). Приём, учёт и регистрация документов ДСП ведутся подразделениями, которым поручен учёт несекретных документов (п. 2.1).\n- **Ответственность:** за разглашение служебной информации ограниченного распространения и нарушение порядка обращения с документами служащий может быть привлечён к дисциплинарной или иной предусмотренной законодательством ответственности (п. 1.8 Положения) — но не по статьям о государственной тайне.\n\n## Шесть методов защиты информации\n\n1) **препятствие** — физическое преграждение пути к информации: контролируемая зона, режим помещений, хранилища;\n2) **управление доступом** — идентификация, аутентификация, проверка полномочий, регистрация, реагирование;\n3) **маскировка** — криптографическое закрытие сведений при хранении и передаче;\n4) **регламентация** — условия обработки, хранения и передачи, сводящие возможности НСД к минимуму;\n5) **принуждение** — соблюдение правил под угрозой дисциплинарной, материальной, административной или уголовной ответственности;\n6) **побуждение** — соблюдение порядка за счёт моральных и этических норм.\n\n**Роль метода побуждения:** это и есть этичное обращение с данными. Морал
