очные СУБД сканируют лишь нужные столбцы. Пользователь получает уже агрегированный результат — несколько строк вместо миллионов.\n\nТаблица: Сравнение SQL и Excel по ключевым критериям\n{w:24,38,38}\n| Критерий | Excel | SQL (реляционная СУБД) |\n|---|---|---|\n| Целостность | Не контролируется | PK, FK, ограничения, транзакции |\n| Типизация | Тип у каждой ячейки отдельно | Строгий тип столбца |\n| Автоматизация | Ручные операции, макросы | Повторяемые скрипты, расписание, версии |\n| Память и объём | Вся книга в ОЗУ ПК, ~1 млн строк на лист | Обработка на сервере, миллиарды строк |\n| Совместная работа | Конфликты копий файла | Одновременный доступ с разграничением прав |\n\n## Пример\n\nРасчёт суммы социальных выплат по районам из таблицы фактов на 3 млн строк выполняется одним запросом:\n\nSELECT r.name, SUM(p.amount) FROM payments p JOIN regions r ON p.region_id = r.id WHERE p.pay_date BETWEEN '2026-01-01' AND '2026-06-30' GROUP BY r.name;\n\nЗапрос подтягивает название района из справочника (JOIN), фильтрует период (WHERE) и агрегирует (GROUP BY). В Excel ту же операцию пришлось бы делать на нескольких файлах, каждый из которых не помещается на один лист.\n\n**Вывод.** Excel удобен для небольших расчётов и оформления, но при больших массивах SQL выигрывает по четырём критериям: обеспечивает целостность через ключи и ограничения, строгую типизацию, воспроизводимую автоматизацию и обработку на сервере без перегрузки памяти пользователя. Рациональная схема — подготовка и агрегация данных в SQL, презентация результатов в BI-системе или Excel."}, {"d": "avd", "q": 7, "title": "F-паттерн и Z-паттерн сканирования экрана и размещение KPI", "md": "## Паттерны внимания\n\nРасположение элементов дашборда опирается на данные исследований движения глаз (eye-tracking). Пользователь не читает экран целиком, а сканирует его по устойчивым траекториям. Наиболее известное исследование провела Nielsen Norman Group (Я. Нильсен, 2006): при чтении текстовых страниц взгляд образует фигуру, похожую на букву F.\n\n**F-паттерн** применяется для текстовых отчётов, реестров и таблиц. Взгляд проходит по верхней горизонтали, затем по второй горизонтали чуть ниже и далее вертикально вниз по левому краю. Вывод для дизайна: ключевые идентификаторы — название района, ФИО ответственного, статус задачи — размещаются в крайнем левом столбце, а самое важное — в первых строках и первых словах заголовков.\n\n**Z-паттерн** применяется для обзорных дашбордов (Executive Dashboards) с карточками и индикаторами. Взгляд идёт из левого верхнего угла в правый верхний, затем по диагонали в левый нижний и завершает движение в правом нижнем углу. Вывод: левый верхний угол — точка входа внимания, туда ставится главный KPI; правый нижний угол — точка завершения, где уместен итог или призыв к действию.\n\n![Траектории F- и Z-паттернов и зоны размещения элементов дашборда](img/avd07_patterns.webp){560}\n\n## Правило 30 секунд\n\nЭффективный дашборд позволяет руководителю считать статус системы и обнаружить «красную зону» в течение первых 30 секунд осмотра. Руководитель не изучает интерфейс: если главное не видно сразу, решение принимается без учёта данных или откладывается. Правило 30 секунд задаёт критерий качества — проверку «первым взглядом»: покажите дашборд коллеге на полминуты и спросите, какая ситуация и где проблема.\n\n## Куда помещать KPI и почему\n\nКлючевые показатели размещаются в **левом верхнем углу** — в точке входа обоих паттернов. Причины:\n\n- это первая фиксация взгляда, она гарантированно происходит в первые секунды и укладывается в правило 30 секунд;\n- верхняя полоса просматривается и в F-, и в Z-паттерне, поэтому карточки KPI выстраиваются по верхнему ряду слева направо по убыванию важности;\n- нижние и правые зоны просматриваются позже и бегло — туда выносятся детали.\n\nОтсюда информационная иерархия дашборда:\n\n- верхний уровень — агрегированные KPI в виде крупных карточек с цветовой индикацией (сумма, процент выполнения плана);\n- средний уровень — тренды и сравнения (динамика за период, «план — факт» по ведомствам);\n- нижний уровень — детализация: таблицы с возможностью «провала» в данные (drill-down).\n\nЦвет несёт смысл (красный — риск, зелёный — норма), а отклонения выделяются: дашборд должен отвечать на вопрос «Где горит?».\n\n**Пример.** Дашборд губернатора по национальному проекту: в левом верхнем углу — карточка «Достижение целевого показателя 87 % (план 95 %)» красного цвета, справа от неё — исполнение бюджета и число объектов с отставанием; в центре — линейный график динамики по месяцам; внизу — таблица муниципалитетов, отсортированная по отставанию, где в левом столбце указано название муниципалитета. За 30 секунд руководитель видит, что цель под угрозой и какие муниципалитеты отстают.\n\n**Вывод.** F- и Z-паттерны описывают естественные траектории взгляда, поэтому расположение элементов дашборда должно совпадать с ними. Главный KPI ставится в левый верхний угол — в точку входа внимания, детализация — ниже и правее. Это обеспечивает выполнение правила 30 секунд и ускоряет принятие решения."}, {"d": "avd", "q": 8, "title": "Столбчатая и круговая диаграммы с точки зрения психологии восприятия", "md": "## Назначение диаграмм\n\n**Столбчатая диаграмма (Bar Chart)** предназначена для сравнения категорий и значений: значение кодируется длиной столбца от общей нулевой линии. **Круговая диаграмма (Pie Chart)** показывает структуру целого — доли частей, сумма которых 100 %: значение кодируется углом сектора и его площадью.\n\n## Почему длина воспринимается точнее угла и площади\n\nПсихология восприятия ранжирует способы кодирования данных по точности. Классическое исследование У. Кливленда и Р. Макгилла (1984) показало, что человек точнее всего сравнивает положение на общей шкале и длину; угол и площадь оцениваются заметно хуже, объём и насыщенность цвета — хуже всего. Отсюда принцип курса «Длина > Площадь»: столбчатые диаграммы эффективнее круговых для точного сравнения.\n\nТаблица: Восприятие столбчатой и круговой диаграмм\n{w:28,36,36}\n| Признак | Столбчатая диаграмма | Круговая диаграмма |\n|---|---|---|\n| Кодирование значения | Длина и положение на общей шкале | Угол и площадь сектора |\n| Точность сравнения | Высокая, видна разница в 2–3 % | Низкая: секторы 23 % и 27 % выглядят одинаково |\n| Число категорий | Десятки (при горизонтальной ориентации) | Не более 5–6, иначе «веер» |\n| Отрицательные значения и сумма ≠ 100 % | Допускаются | Невозможны по смыслу |\n| Сравнение нескольких периодов | Легко: группированные столбцы | Плохо: глаз переходит между разными кругами |\n| Лучшее применение | Ранжирование, «план — факт», сравнение районов | Одна доминирующая доля целого |\n\nДополнительные факторы: подписи на круговой диаграмме читаются хуже, а легенда заставляет взгляд «прыгать» между цветом и текстом; 3D-эффект искажает пропорции — ближние секторы кажутся больше.\n\n## Пример ошибочного выбора в управленческой задаче\n\nЗадача: решить, в какие районы перераспределить бригады ЖКХ, по доле жалоб на отопление. Аналитик строит круговую диаграмму из 12 районов с долями от 6 до 11 %. Секторы почти одинаковы, цвета повторяются, и руководитель делает вывод, что «жалобы распределены равномерно» — перераспределение не нужно. На отсортированной горизонтальной столбчатой диаграмме сразу видно, что три района дают почти вдвое больше жалоб, чем три последних. Неверный тип диаграммы скрыл различие и привёл к ошибочному решению.\n\nДругой распространённый случай — круговая диаграмма «Исполнение бюджета по программам», где сумма долей не равна 100 % (у каждой программы свой план). Такая диаграмма вводит в заблуждение по самой своей форме: правильный выбор — столбчатая диаграмма «план — факт».\n\n## Когда круговая диаграмма допустима\n\nЕсли нужно показать одну доминирующую долю целого и категорий две-три: например, «82 % заявлений подано через Госуслуги, 18 % — в МФЦ». Здесь нужна не точность сравнения, а впечатление о структуре. Альтернатива — кольцевая диаграмма с числом в центре или 100-процентный столбец.\n\n**Вывод.** Столбчатая диаграмма использует самые точные для глаза каналы — длину и положение, поэтому подходит для сравнения и ранжирования. Круговая опирается на угол и площадь, которые воспринимаются неточно, и пригодна только для простой структуры целого. Выбор типа диаграммы — управленческое, а не оформительское решение: неверная форма может скрыть различия и исказить вывод."}, {"d": "avd", "q": 9, "title": "Визуальный шум в дашбордах", "md": "## Понятие визуального шума\n\nВизуальный шум — элементы оформления дашборда, которые не несут информации о данных, но требуют внимания пользователя: избыточные сетки, тени, градиенты, 3D-эффекты, декоративные иконки, лишние цвета и подписи. Эдвард Тафти назвал такие элементы «chartjunk» («графический мусор») и предложил принцип максимизации доли «чернил данных» (data-ink ratio): каждое пятно краски на графике должно отображать данные. В курсе эта группа ошибок вынесена в стоп-лист: 3D-эффекты, избыточность (chartjunk), манипуляция осями и случайный цвет.\n\nК визуальному шуму относятся и показатели, не связанные с целью дашборда: если элемент не укладывается в логику диаграммы влияния и не связан с целевым показателем, он является информационным шумом и удаляется из интерфейса принятия решений.\n\n## Почему шум снижает скорость и качество решений\n\n1) **Когнитивная нагрузка.** Рабочая память человека ограничена; ресурс внимания, потраченный на расшифровку оформления, отнимается у анализа содержания. Руководитель не успевает считать статус за 30 секунд.\n2) **Маскировка сигнала.** Зрение быстро, ещё до осознанного внимания, выделяет отличающиеся по цвету, размеру и форме объекты (преаттентивная обработка). Когда цветным и ярким сделано всё, действительно важное отклонение — «красная зона» — перестаёт выделяться.\n3) **Искажение восприятия.** 3D-перспектива, тени и обрезанные оси меняют видимые пропорции: руководитель неверно оценивает величину проблемы.\n4) **Снижение доверия.** Перегруженный дашборд выглядит как «витрина», а не инструмент, и пользователь возвращается к таблицам Excel и устным докладам.\n\n## Три примера визуального шума\n\n- **3D-круговая диаграмма с тенями и градиентом.** Ближние секторы кажутся крупнее дальних; при доле 18 % у ближнего сектора и 22 % у дальнего руководитель видит обратное соотношение.\n- **Избыточная сетка, рамки и фоновые изображения.** Плотная сетка на линейном графике динамики обращений сливается с линией тренда; герб региона на фоне снижает контраст подписей.\n- **Случайный цвет без семантики.** Каждый район окрашен в свой цвет «для красоты», в том числе красный и зелёный. Пользователь ищет в цвете смысл (проблема — норма), которого нет, и делает ложный вывод.\n\nСюда же относятся обрезанная ось Y (небольшой рост выглядит катастрофой), десятки мелких графиков на одном экране вместо принципа «один экран — одна задача» и заголовки-констатации «График 1» вместо заголовков-выводов.\n\n## Как устранить шум\n\n- удалить всё, что можно удалить без потери смысла: 3D, тени, фоны, лишние линии сетки и рамки;\n- использовать цвет только семантически: серый — фон и норма, акцентный цвет — отклонение;\n- соблюдать единообразие: одинаковые показатели называются и окрашиваются одинаково на всех графиках;\n- начинать ось столбчатых диаграмм с нуля;\n- писать заголовки-выводы: «Жалобы на протечки кровли выросли на 45 %» вместо «Динамика обращений».\n\n**Вывод.** Визуальный шум — оформление без информации. Он перегружает внимание, маскирует отклонения и искажает пропорции, поэтому замедляет принятие решения и снижает его качество. Хороший дашборд строится по принципу минимализма: каждый элемент либо отвечает на управленческий вопрос, либо удаляется."}, {"d": "avd", "q": 10, "title": "Четыре критерия определения границ системы", "md": "## Зачем определять границы системы\n\nСистемный анализ социально-экономических процессов начинается с разграничения трёх элементов: **субъекта управления** — органа власти, принимающего решения (например, министерства ЖКХ региона); **объекта управления** — управляемого процесса или подсистемы (износ сетей и качество теплоснабжения); **внешней среды** — факторов, которые влияют на объект, но находятся вне прямого контроля субъекта (климат, макроэкономика, демография, федеральное законодательство).\n\nНеверно очерченные границы порождают две системные ошибки: включение лишних факторов (модель становится невычислимой) или игнорирование критически важных ограничений среды. Граница отвечает на вопрос: что контролируется напрямую, на что можно повлиять косвенно и что принимается как внешнее условие.\n\n## Четыре критерия\n\nТаблица: Критерии определения границ системы\n{w:20,40,40}\n| Критерий | Внутри системы | Вне системы |\n|---|---|---|\n| Юридический | Сфера прямых полномочий и НПА ведомства | Смежная юрисдикция других органов и уровней власти |\n| Ресурсный | Бюджет, штат, имущество ведомства | Частные инвестиции, ресурсы других ведомств |\n| Информационный | Ведомственная отчётность и собственные ГИС | Статистика Росстата, данные других ведомств |\n| Управляемости | Контур прямого контроля и контур влияния | Контур наблюдения (внешняя среда) |\n\n1) **Юридический критерий.** Внутрь системы включаются процессы, регулируемые нормативными правовыми актами и полномочиями ведомства. Например, региональная жилищная инспекция проверяет управляющие компании, но тарифы на электроэнергию устанавливаются вне её компетенции.\n2) **Ресурсный критерий.** Граница проходит по ресурсам, которыми ведомство распоряжается: бюджет программы, штатная численность, техника. Частные инвестиции и средства федерального бюджета, которыми ведомство не управляет, относятся к среде.\n3) **Информационный критерий.** Внутри — данные, которые ведомство собирает и за качество которых отвечает (ведомственная отчётность, собственные ГИС); вне — сведения, получаемые от других (статистика Росстата, данные других ведомств). Этот критерий определяет и архитектуру будущей аналитической системы: свои источники и внешние наборы, получаемые по межведомственным запросам.\n4) **Критерий управляемости.** Все факторы распределяются по трём контурам: **прямой контроль** (решения — «рычаги» чиновника: финансирование, штат, тарифы, графики проверок); **влияние** (промежуточные переменные, которые меняются опосредованно через рычаги: частота аварий, число жалоб); **наблюдение** (экзогенные факторы, которые нужно мониторить и закладывать в модель как ограничения: инфляция, численность населения, погода).\n\n## Проблема размытых границ\n\nПопытка решить проблему силами одного подразделения без учёта внешних связей ведёт к системным сбоям. Пример из курса: до 60 % факторов здоровья лежат во внешней по отношению к системе здравоохранения среде — экология, питание, доходы, физическая активность. Модель «здоровье населения», ограниченная поликлиниками, объяснит лишь часть результата. Решение — проектное управление, которое расширяет границы системы под межведомственную цель.\n\n**Пример.** Задача — снизить число жалоб на теплоснабжение. Юридически в системе — полномочия министерства ЖКХ и ГЖИ; по ресурсам — региональная программа капремонта и штат инспекторов; информационно — реестр аварий и обращения на портале; по управляемости рычаги — тарифы на капремонт и плановые проверки, влияние — частота аварий, наблюдение — погодные условия и износ сетей. Такая разметка сразу показывает, какие данные собирать и на что руководитель реально может воздействовать.\n\n**Вывод.** Границы системы определяются по четырём критериям: юридическому, ресурсному, информационному и управляемости. Вместе они разделяют факторы на рычаги, промежуточные переменные и внешнюю среду. Корректные границы — условие построения диаграммы влияния и аналитической модели, пригодной для принятия решений."}, {"d": "avd", "q": 11, "title": "Положительная и отрицательная обратная связь в социально-экономических системах", "md": "## Понятие обратной связи\n\nОбратная связь — замкнутая цепочка причинно-следственных зависимостей, при которой изменение выхода системы возвращается на её вход и влияет на дальнейшее поведение. Контуры обратной связи — одно из свойств сверхсложных систем, наряду с нелинейностью, эмерджентностью и инерционностью. В системной динамике (Дж. Форрестер, П. Сенге) контуры обозначаются буквами R (reinforcing — усиливающий) и B (balancing — балансирующий).\n\n## Различие положительной и отрицательной обратной связи\n\n**Положительная (усиливающая, R-петля)** обратная связь усиливает исходное отклонение: изменение вызывает цепочку реакций, которые увеличивают это изменение. Возникает эффект «снежного кома» — экспоненциальный рост или обвал. Пример курса: инвестиции → развитие инфраструктуры → снижение издержек бизнеса → рост инвестиционной привлекательности → новые инвестиции.\n\n**Отрицательная (стабилизирующая, B-петля)** обратная связь гасит отклонение и возвращает систему к равновесию. На этом принципе строится большинство регуляторных механизмов ГМУ. Пример курса: рост тарифов ЖКХ → рост жалоб граждан → проверки жилищной инспекции → корректировка тарифов и стабилизация.\n\nТаблица: Сравнение типов обратной связи\n{w:24,38,38}\n| Признак | Положительная (R) | Отрицательная (B) |\n|---|---|---|\n| Действие на отклонение | Усиливает | Гасит |\n| Динамика | Рост или обвал по экспоненте | Колебания вокруг равновесия, стабилизация |\n| Роль в управлении | Механизм развития и «точки роста» | Механизм регулирования и контроля |\n| Риск | Неуправляемый разгон, кризис | Застой, сопротивление изменениям |\n\n## Знак связи не равен её оценке\n\nТермины «положительная» и «отрицательная» описывают направление действия контура, а не его полезность. Поэтому возможны все четыре сочетания.\n\n**Положительная связь с отрицательным влиянием** — «порочный круг»:\n\n- набег вкладчиков на банк: слухи → изъятие вкладов → проблемы с ликвидностью → новые слухи и изъятия;\n- депопуляция малого города: отток молодёжи → закрытие школ и поликлиник → снижение качества жизни → новый отток;\n- инфляционная спираль: рост цен → индексация зарплат → рост издержек → новый рост цен;\n- потеря доверия к власти: невыполненные обещания → снижение участия граждан → решения без обратной связи от граждан → новые ошибки.\n\n**Отрицательная связь с положительным влиянием** — нормальная работа регуляторов:\n\n- денежно-кредитная политика: рост инфляции → повышение ключевой ставки Банком России → снижение кредитования и спроса → замедление инфляции;\n- автоматические стабилизаторы бюджета: в кризис падают налоги и растут пособия по безработице, что поддерживает спрос.\n\n**Отрицательная связь с отрицательным влиянием** — сопротивление нужным переменам (policy resistance): система «гасит» реформу. Например, сдерживание тарифов стабилизирует платежи граждан, но ведёт к недоинвестированию и росту износа сетей. С запаздыванием отрицательная связь вызывает перерегулирование и колебания: поздняя реакция на дефицит кадров приводит к избыточному набору, затем к сокращению.\n\n**Положительная связь с положительным влиянием** — «добродетельный круг»: рост числа цифровых услуг → рост числа пользователей Госуслуг → снижение стоимости обслуживания → средства на новые услуги.\n\n## Значение для аналитики и управления\n\n- обратные связи нужно выявлять при построении диаграммы влияния: замкнутые цепочки объясняют, почему разовое воздействие даёт неожиданный долгосрочный эффект;\n- для R-петель важны ранние сигналы: на дашборде нужен мониторинг скорости изменения, а не только уровня показателя;\n- для B-петель важно учитывать временные лаги, иначе управляющее воздействие запаздывает и раскачивает систему;\n- управленческая задача — запускать полезные R-петли (инвестиционный климат) и встраивать B-петли там, где нужен контроль (обратная связь от граждан через жалобы).\n\n**Вывод.** Положительная обратная связь усиливает отклонение, отрицательная — стабилизирует систему. Знак связи характеризует механизм, а не результат: положительная связь может разрушать систему, а отрицательная — тормозить развитие. Аналитик ГМУ должен выявлять контуры обратной связи, чтобы предвидеть отложенные и непропорциональные последствия решений."}, {"d": "avd", "q": 12, "title": "Диаграммы влияния и их роль в подготовке технического задания для BI-систем", "md": "## Понятие и назначение\n\nДиаграмма влияния (Influence Diagram) — направленный граф без циклов, который визуализирует логику принятия решения: управляемые параметры, неопределённости и целевой результат. Метод предложили Р. Говард и Дж. Матесон (1981) в теории принятия решений; в курсе он используется как строгий графический язык описания структуры аналитической модели.\n\nДиаграмма влияния применяется для того, чтобы:\n\n- **структурировать неопределённость:** выявить скрытые взаимосвязи между показателями и отделить управляемое от неуправляемого;\n- **выровнять понимание:** превратить словесное описание проблемы в логическую схему, понятную и руководителю, и аналитику;\n- **проводить стресс-тестирование решений:** проигрывать сценарии «что будет, если...»;\n- **защитить от хаотичного построения графиков «ради графиков»:** на дашборд попадает только то, что связано с целевым результатом.\n\n## Место диаграммы в моделировании\n\nДиаграмма влияния — третий из пяти этапов аналитического моделирования: словесное описание → структурирование (выход, входы, факторы среды) → визуализация взаимосвязей (диаграмма влияния) → математическая формализация (формулы, DAX, SQL) → программная реализация в BI-системе. Модели бывают детерминированными (каждому набору входов соответствует строго определённый результат) и вероятностными, где результат — распределение вероятностей.\n\n![Диаграмма влияния для задачи «Жалобы населения в сфере ЖКХ»](img/avd12_infl.webp){600}\n\n## Как диаграмма помогает подготовить ТЗ для BI-системы\n\nДиаграмма влияния — прямой «чертёж» будущего дашборда. Каждый элемент диаграммы переходит в конкретное требование технического задания.\n\nТаблица: Переход от диаграммы влияния к требованиям ТЗ\n{w:30,35,35}\n| Элемент диаграммы | Элемент BI-системы | Требование в ТЗ |\n|---|---|---|\n| Решение (прямоугольник) | Фильтр, срез (slicer), параметр сценария | Перечень управляемых параметров и диапазоны сценариев |\n| Переменная (овал) | График динамики, структуры, карта | Источник данных, периодичность обновления, справочники |\n| Результат (ромб) | Крупная карточка KPI в левом верхнем углу | Формула целевого показателя, план и пороги цвета |\n| Стрелка влияния | SQL-запрос, мера DAX, расчёт в Python | Алгоритм расчёта, связи таблиц в модели данных |\n| Узлы-решения и факторы | Таблицы параметров (справочники) | Структура таблиц измерений |\n| Узлы-результаты | Витрины данных (Data Marts) | Состав витрины и уровень агрегации |\n\nКроме того, диаграмма позволяет:\n\n- составить **реестр источников**: для каждого узла указывается ГИС, реестр или статистика, откуда берутся данные; узлы без источника показывают пробелы, которые нужно закрыть до разработки;\n- определить **гранулярность и периодичность** данных: если влияние проявляется с лагом в квартал, ежедневное обновление избыточно;\n- согласовать с заказчиком **критерии приёмки**: дашборд считается готовым, когда все узлы диаграммы отражены и связаны;\n- отсечь **информационный шум**: показатель, не связанный с целевым ромбом, в ТЗ не включается.\n\nФакторы, которые невозможно описать строгой формулой («уровень доверия к мэру»), заменяются прокси-показателями или экспертными оценками с весами — это тоже фиксируется в ТЗ.\n\n**Пример.** Для задачи снижения социальной напряжённости в ЖКХ решения «тарифы на капремонт» и «плановые проверки ГЖИ» становятся фильтрами-параметрами; погодные условия, износ сетей и квалификация сотрудников управляющих компаний — графиками; частота аварий и жалобы на портале — промежуточными показателями; лояльность населения — главным KPI. В ТЗ сразу видно, что нужны данные реестра аварий, портала обращений, ГЖИ и метеоданные.\n\n**Вывод.** Диаграмма влияния переводит управленческую проблему на язык структуры модели. Для BI-проекта она служит основой технического задания: определяет фильтры, графики, KPI, расчётные формулы, источники данных и границы дашборда, снижая риск создать красивую, но бесполезную визуализацию."}, {"d": "avd", "q": 13, "title": "Типы узлов диаграмм влияния", "md": "## Общая характеристика\n\nДиаграмма влияния — направленный ациклический граф: узлы обозначают переменные модели решения, стрелки — влияния между ними. Стандарт графических обозначений использует форму узла, чтобы показать, кто управляет переменной: субъект управления, внешняя среда или расчёт.\n\n## Типы узлов\n\nТаблица: Типы узлов диаграммы влияния\n{w:22,18,30,30}\n| Тип узла | Форма | Назначение | Примеры в ГМУ |\n|---|---|---|---|\n| Решение (Decision Node) | Прямоугольник | Параметр, полностью контролируемый субъектом управления, — «рычаг» | Объём субсидий, лимит штатной численности, график проверок |\n| Переменная, неопределённость (Uncertainty / Chance Node) | Овал (эллипс) | Случайная величина внешней среды (экзогенный фактор) или промежуточный расчётный показатель | Уровень инфляции, численность заявителей, частота аварий |\n| Результат, ценность (Value / Objective Node) | Ромб или восьмиугольник | Главный целевой критерий эффективности — выход системы | Уровень бедности, удовлетворённость граждан |\n| Влияние (Arc) | Направленная стрелка | Причинно-следственная, функциональная или временная связь | Бюджет поддержки → число получателей услуги |\n\n**Узел-решение.** Отражает то, что руководитель выбирает сам. На диаграмме таких узлов немного: если их много, вероятно, смешаны рычаги и последствия. В BI-системе решения становятся фильтрами, срезами или параметрами сценария «что если».\n\n**Узел-переменная.** Охватывает две группы: экзогенные факторы (внешняя среда, контур наблюдения) и эндогенные промежуточные показатели (контур влияния), которые меняются через решения. В классической нотации теории решений выделяют также детерминированный узел — двойной овал — для величины, однозначно вычисляемой по формуле из родительских узлов (например, «общий фонд выплат = пособие × число получателей»). В BI-системе переменные становятся графиками динамики, структуры или картами.\n\n**Узел-результат.** Целевая функция модели; на диаграмме он один или их очень мало. Все пути на диаграмме должны вести к нему. В BI-системе он превращается в крупную карточку KPI в левом верхнем углу дашборда — в фокусе Z-паттерна.\n\n**Стрелка влияния.** Запись A → B означает, что изменение в узле A вызывает изменение состояния узла B. В теории решений различают стрелки, входящие в узел-решение (информационные: что известно на момент выбора), и стрелки в переменные и результат (условные, функциональные). Граф не должен содержать циклов; динамические обратные связи разворачиваются во времени.\n\n![Диаграмма влияния «Оценка эффективности социальной поддержки населения» с типами узлов](img/avd13_infl.webp){600}\n\n## Правила построения\n\n- начинать с узла-результата и двигаться «назад» к причинам;\n- проверять каждый узел вопросом «кто им управляет?»: субъект — прямоугольник, среда или расчёт — овал;\n- каждая стрелка должна иметь объяснение и в перспективе формулу;\n- удалять узлы, не связанные с результатом, — это информационный шум.\n\n**Пример.** В модели оценки социальной поддержки решения — объём финансирования льгот и качество информирования; внешний фактор — демографическая ситуация; случайные переменные — численность льготников и уровень инфляции; расчётные переменные — доля охвата нуждающихся и реальный доход льготников; результат — уровень бедности.\n\n**Вывод.** Диаграмма влияния использует три типа узлов и направленные стрелки: прямоугольник — решение, овал — неопределённость или промежуточная переменная, ромб (восьмиугольник) — целевой результат. Форма узла сразу показывает, чем управляет орган власти, а что лишь наблюдает, и задаёт будущую структуру дашборда."}, {"d": "avd", "q": 14, "title": "Элементы OLAP-куба и основные группы измерений", "md": "## Понятие OLAP-куба\n\nOLAP (On-Line Analytical Processing) — технология оперативной аналитической обработки многомерных данных для поддержки решений (термин введён Э. Коддом в 1993 году). Центральная абстракция OLAP — куб: многомерное пространство, по осям которого откладываются измерения, а в ячейках находятся значения показателей. Слово «куб» условно: измерений может быть больше трёх (гиперкуб).\n\n## Элементы OLAP-куба\n\n- **Факты (Facts)** — численные показатели эффективности, подлежащие математической агрегации: объём субсидий, количество жалоб, сумма инвестиций. В технической терминологии агрегируемые величины в кубе называют мерами (measures).\n- **Измерения (Dimensions)** — контекст анализа, справочники, по которым группируются факты: время, география, отрасль, ведомство.\n- **Элементы (члены) измерения (Members)** — конкретные значения измерения: «2026 год», «Кировский район», «ЖКХ».\n- **Иерархии и уровни** — упорядоченная структура детализации измерения: год → квартал → месяц → день; регион → муниципальный район → поселение. Иерархии делают возможными свёртку и детализацию.\n- **Ячейка (Cell)** — пересечение элементов всех измерений, содержащее значение факта.\n- **Агрегаты** — предварительно рассчитанные итоги по уровням иерархий, обеспечивающие быстрый ответ.\n\n![Схема OLAP-куба: измерения, элементы и ячейка с фактом](img/avd14_cube.webp){520}\n\nПример ячейки из курса: на пересечении осей «Время = I квартал 2026», «География = Кировский район», «Отрасль = ЖКХ» находится факт «выделено 15 млн руб.».\n\n## Основные группы измерений\n\nИзмерения отвечают на базовые вопросы анализа — «когда, где, что, кто». В курсе они представлены как четыре «луча» схемы «звезда» вокруг таблицы фактов: **люди, места, вещи, время**.\n\nТаблица: Основные группы измерений OLAP-куба\n{w:22,28,50}\n| Группа | Вопрос | Примеры в ГМУ |\n|---|---|---|\n| Время | Когда? | Год, квартал, месяц, день; бюджетный год, отчётный период |\n| География (места) | Где? | Регион, муниципальный район, поселение, адрес объекта (ОКТМО, ФИАС) |\n| Объекты и отрасли (вещи) | Что? | Отрасль (ЖКХ, социальная защита, образование), вид услуги, тип объекта, статья КБК |\n| Субъекты (люди и организации) | Кто? | Ведомство, учреждение, категория льготника, возрастная группа, ответственный исполнитель |\n\nИзмерение времени присутствует практически в любом кубе: без него невозможен анализ динамики и сравнение с прошлым периодом.\n\n## Связь куба с реляционной моделью\n\nВ реляционных BI-системах куб реализуется схемой «звезда»: таблица фактов содержит меры и внешние ключи, таблицы измерений — справочники с атрибутами и иерархиями. Связь «один ко многим» идёт от измерения к фактам, фильтрация — однонаправленная, от справочника к фактам.\n\n**Вывод.** OLAP-куб состоит из фактов (мер), измерений с элементами и иерархиями и ячеек на их пересечении. Основные группы измерений — время, география, объекты (отрасли) и субъекты (ведомства, категории граждан). Такая структура позволяет руководителю анализировать показатель в любом разрезе без программиста."}, {"d": "avd", "q": 15, "title": "Операции над OLAP-кубом: срез, вращение, консолидация, детализация", "md": "## Назначение операций\n\nОперации над кубом изменяют ракурс и уровень детализации анализа без написания запросов: пользователь BI-системы выбирает значения фильтров, меняет оси таблицы и «проваливается» в детали. Каждая операция соответствует типичному вопросу руководителя.\n\n## Срез (Slice)\n\nСрез — фиксация значения одного или нескольких измерений для получения подмножества данных меньшей размерности. Пример: зафиксировать измерение «Отрасль = ЖКХ» и получить двумерную таблицу «Время × Район» только по расходам на ЖКХ. Срез по нескольким значениям нескольких измерений называют также кубиком (Dice): например, ЖКХ и образование в трёх районах за 2025–2026 годы. В интерфейсе BI-системы срез реализуется селектором или фильтром дашборда.\n\n## Вращение (Pivot, Rotation)\n\nВращение — изменение ориентации осей куба для нового ракурса анализа: строки меняются со столбцами, одно измерение заменяется другим на оси. Данные не меняются, меняется их представление. Пример: таблица «районы в строках, годы в столбцах» показывает динамику каждого района; после поворота «годы в строках, районы в столбцах» удобнее сравнивать районы внутри одного года. Аналог — перенос полей между областями «Строки» и «Столбцы» в сводной таблице Excel.\n\n## Консолидация (Roll-up)\n\nКонсолидация (свёртка) — переход от детальных данных к более крупным агрегатам по иерархии измерения или за счёт исключения измерения. Пример: переход по шкале времени от дней к месяцам и годам, по географии — от поселений к муниципальным районам и региону. Руководителю субъекта нужен не реестр выплат по дням, а итог по районам за квартал.\n\n## Детализация (Drill-down)\n\nДетализация — обратная операция: переход от агрегированных показателей к более детальным уровням и далее к первичным транзакциям. Пример: «провал» от годового бюджета ведомства к кварталам, месяцам и конкретным платёжным поручениям. Детализация до исходных записей называется Drill-through. Детализация — главный инструмент поиска причин: увидев аномальный рост расходов в ноябре, аналитик спускается до района, учреждения и конкретного контракта.\n\nТаблица: Операции над OLAP-кубом\n{w:20,40,40}\n| Операция | Что происходит | Вопрос руководителя |\n|---|---|---|\n| Срез (Slice, Dice) | Фиксация значений измерений | «Что происходит только в ЖКХ?» |\n| Вращение (Pivot) | Смена осей представления | «Как сравнить районы между собой в 2026 году?» |\n| Консолидация (Roll-up) | Переход к агрегатам по иерархии | «Каков итог по региону за год?» |\n| Детализация (Drill-down) | Переход к деталям и транзакциям | «Из-за какого учреждения вырос расход?» |\n\n## Сценарий анализа\n\n1) Консолидация: министр видит рост расходов на социальную поддержку по региону за 2026 год на 12 %.\n2) Срез: фиксируется категория «Ветераны» — рост сосредоточен в этой категории.\n3) Вращение: районы выводятся в строки, кварталы — в столбцы; выделяется Заволжский район в III квартале.\n4) Детализация: переход к выплатам района по месяцам и к отдельным получателям выявляет дублирующиеся записи после сбоя выгрузки.\n\nОперации применяются последовательно и образуют цикл «от общего к частному и обратно». Чтобы они работали быстро, в кубе заранее рассчитываются агрегаты по уровням иерархий, а измерения описываются через справочники с иерархиями.\n\n**Вывод.** Срез ограничивает куб по значениям измерений, вращение меняет ракурс, консолидация обобщает данные по иерархии, детализация раскрывает их до первичных записей. Вместе эти операции позволяют руководителю без программиста пройти путь от общего показателя к причине отклонения."}, {"d": "avd", "q": 16, "title": "Вычисляемый столбец и мера в DAX", "md": "## Язык DAX\n\nDAX (Data Analysis Expressions) — декларативный функциональный язык формул Microsoft для реляционных моделей данных в Power BI, Excel Power Pivot и Analysis Services. В отличие от Excel, который работает со статическими ячейками (=A1+B1), DAX оперирует целыми столбцами и таблицами и пересчитывает результат в зависимости от действий пользователя на дашборде. Данные модели хранятся в колоночном движке VertiPaq со сжатием, что позволяет обрабатывать миллионы строк за миллисекунды.\n\nВ DAX есть два способа добавить вычисление: вычисляемый столбец и мера. Внешне формулы похожи, но различаются моментом вычисления, контекстом и использованием ресурсов.\n\n## Ключевое отличие: время вычисления и память\n\n**Вычисляемый столбец (Calculated Column)** — статичное построчное вычисление, которое выполняется при загрузке или обновлении данных. Результат для каждой строки физически сохраняется в модели, занимает оперативную память и увеличивает размер файла (.pbix). Вычисление идёт в контексте строки: формула «видит» только текущую строку таблицы. После обновления значения не меняются при работе с отчётом и не реагируют на срезы.\n\n**Мера (Measure)** — динамическое вычисление, выполняемое «на лету» в момент запроса, когда пользователь открывает визуализацию или меняет фильтр. Результат не хранится в модели: мера не занимает память под данные и нагружает только процессор в момент запроса. Мера вычисляется в контексте фильтра — с учётом всех срезов, строк и столбцов визуализации — и поэтому реагирует на любые фильтры.\n\nТаблица: Вычисляемый столбец и мера в DAX\n{w:26,37,37}\n| Признак | Вычисляемый столбец | Мера |\n|---|---|---|\n| Когда вычисляется | При загрузке и обновлении данных | В момент запроса, при каждом взаимодействии |\n| Хранение | Физически в модели, для каждой строки | Не хранится, хранится только формула |\n| Память и размер файла | Занимает ОЗУ, увеличивает .pbix | Не увеличивает модель, нагружает CPU |\n| Контекст | Контекст строки | Контекст фильтра |\n| Реакция на срезы | Нет, значения статичны | Да, пересчитывается динамически |\n| Где используется | В срезах, фильтрах, осях, строках, связях | В области значений визуализаций, карточках KPI |\n\n## Контексты вычислений\n\n**Контекст строки** существует по умолчанию в вычисляемых столбцах и в итерирующих функциях (SUMX, AVERAGEX). Программа обрабатывает одну запись за раз и не умеет сама переходить по связям от справочника к фактам; данные контекст строки не фильтрует.\n\n**Контекст фильтра** — сумма всех ограничений, наложенных на модель: срезы, строки и столбцы визуализации, внутренние фильтры функций. Мера сначала отбирает строки по контексту фильтра, затем вычисляет результат над оставшимся подмножеством. Изменить контекст фильтра может функция CALCULATE.\n\n## Когда выбирать вычисляемый столбец, а когда меру\n\n**Вычисляемый столбец** предпочтителен, когда нужен **атрибут для фильтрации, группировки или связи** — значение, которое характеризует отдельную строку и не зависит от выбора пользователя:\n\n- возрастная группа получателя («до 18», «18–35», «старше 65»);\n- категория или статус выполнения заявки («в срок», «просрочена»);\n- ключ для связи таблиц, составленный из нескольких полей.\n\nТакой атрибут можно вынести в срез или на ось графика — мера для этого непригодна.\n\n**Мера** предпочтительна для **агрегируемых показателей KPI**, которые должны пересчитываться при фильтрации:\n\n- Total_Budget = SUM('Social_Payments'[Сумма]) — сумма выплат;\n- Median_Budget = MEDIAN('Social_Payments'[Сумма]) — медиана, устойчивая к выбросам;\n- Execution_Rate = DIVIDE([Total_Budget], SUM('Plan'[Budget_Limit]), 0) — безопасный процент исполнения плана;\n- Budget_Last_Year = CALCULATE([Total_Budget], SAMEPERIODLASTYEAR('Calendar'[Date])) — сравнение с прошлым годом.\n\nТипичная ошибка — рассчитывать долю или процент выполнения плана вычисляемым столбцом. Процент, посчитанный для каждой строки, при суммировании по району даёт бессмыслицу (сумма процентов), а мера корректно делит сумму на сумму в любом разрезе. Другая ошибка — создавать десятки вычисляемых столбцов на таблице фактов с миллионами строк: модель разрастается и медленно обновляется.\n\n**Пример.** В модели социальных выплат региона столбец «Возрастная группа» создан вычисляемым столбцом в справочнике получателей — он используется как срез. Показатели «Сумма выплат», «Медианная выплата» и «% исполнения плана» реализованы мерами: при выборе района или года карточки KPI мгновенно пересчитываются, а одна и та же мера работает на уровне региона, района и поселения без изменения кода.\n\n**Вывод.** Вычисляемый столбец вычисляется один раз при загрузке, хранится в памяти и работает в контексте строки — это инструмент создания атрибутов для фильтрации и группировки. Мера вычисляется в момент запроса, не занимает память и учитывает контекст фильтра — это инструмент расчёта KPI. Правило выбора: «если значение нужно положить в срез — столбец, если его нужно посчитать по срезу — мера»."}, {"d": "avd", "q": 17, "title": "Концепция Self-Service BI в государственном и муниципальном управлении", "md": "## Понятие Self-Service BI\n\nSelf-Service BI (аналитика самообслуживания) — концепция, при которой конечные пользователи — управленцы, профильные специалисты ведомств — самостоятельно подключают данные, строят интерактивные дашборды и анализируют показатели без написания кода и без постоянного участия ИТ-подразделения.\n\nКонцепция возникла как ответ на ограничения корпоративного (Enterprise) BI, в котором отчёты готовит ИТ-отдел по запросу департаментов. Недостатки такой модели: высокие временные задержки (очередь на разработку отчётов), низкая гибкость, высокая стоимость владения и зависимость управленцев от программистов.\n\n## Почему концепция актуальна для ГМУ\n\n- **оперативность решений:** в кризисных ситуациях (паводок, эпидемия, аварии в ЖКХ) нужен ответ за часы, а не за недели ожидания отчёта;\n- **прозрачность данных для руководства:** руководитель видит первичные показатели, а не только согласованные справки;\n- **снижение нагрузки на ИТ-департаменты региона:** ИТ-служба занимается инфраструктурой и качеством данных, а не версткой отчётов;\n- **развитие компетенций:** реализуется принцип Data-Driven Management и повышение грамотности в работе с данными (Data Literacy) государственных служащих — одна из задач национальной цели «цифровая трансформация государственного управления»;\n- **импортонезависимость и доступность:** отечественные платформы — Yandex DataLens (облачная, с бесплатным тарифом и размещением данных в России), Visiology, FineBI — позволяют внедрять самообслуживание без зарубежных решений с ограниченной доступностью (Power BI, Tableau, Qlik);\n- **межведомственное взаимодействие:** веб-дашборды легко открыть коллегам из других ведомств и муниципалитетов.\n\n## Организационные риски\n\n- **«зоопарк» отчётов и разные версии правды:** каждый отдел строит свои расчёты одного показателя; на совещании звучат несовпадающие цифры;\n- **недостаточная грамотность в работе с данными:** пользователь может неверно соединить таблицы, сложить проценты, использовать среднее при выбросах и сделать ошибочный вывод;\n- **размывание ответственности:** неясно, кто отвечает за корректность показателя на дашборде — автор, владелец данных или ИТ-служба;\n- **сопротивление изменениям:** служащие продолжают готовить справки в Excel, а внедрённая платформа простаивает;\n- **«теневая» аналитика:** расчёты уходят в личные файлы и неконтролируемые облачные сервисы.\n\n## Технические риски\n\n- **безопасность и персональные данные:** при самостоятельном подключении источников возрастает риск открыть широкий доступ к ПДн и служебной информации, нарушить требования Федерального закона № 152-ФЗ и выгрузить данные на зарубежные сервисы;\n- **качество данных:** пользователи подключаются к «сырым» выгрузкам вместо выверенных витрин;\n- **нагрузка на источники:** тяжёлые запросы напрямую к транзакционным ГИС замедляют их работу;\n- **масштабирование и производительность:** неоптимальные датасеты и сотни чартов перегружают платформу;\n- **зависимость от облачного поставщика:** условия тарифов, доступность сервиса, размещение данных.\n\n## Как снижать риски\n\n- руководство данными (Data Governance): назначение владельцев и распорядителей данных, единый каталог показателей с методиками расчёта;\n- **сертифицированные датасеты и витрины**, подготовленные ИТ-службой: пользователи строят визуализации поверх проверенных данных, а не подключают источники самостоятельно;\n- ролевая модель доступа, обезличивание данных в аналитическом контуре, аудит действий;\n- обучение служащих и внутренние стандарты оформления дашбордов;\n- гибридная модель: ИТ отвечает за данные, бизнес — за анализ.\n\n**Вывод.** Self-Service BI переносит построение отчётов от ИТ-службы к самим управленцам, что ускоряет решения и повышает прозрачность. Для органов власти концепция особенно актуальна, но без руководства данными она порождает разные версии правды и риски утечек. Поэтому самообслуживание вводится поверх выверенных витрин, с чёткими ролями, правами доступа и обучением."}, {"d": "avd", "q": 18, "title": "Четыре сущности архитектуры Yandex DataLens", "md": "## Общая характеристика DataLens\n\nYandex DataLens — облачный инструмент визуализации и анализа данных класса Self-Service BI. Он работает непосредственно с источниками данных без промежуточных серверов на стороне пользователя. Для государственного сектора важны: размещение серверов и данных на территории России (соответствие требованиям Федерального закона № 152-ФЗ о локализации), бесплатный базовый тариф, быстрое развёртывание веб-интерфейсов и встроенная геоаналитика. С 2023 года исходный код DataLens открыт, что позволяет разворачивать платформу в собственной инфраструктуре.\n\n## Четыре сущности и их назначение\n\nЛюбой проект в DataLens строится по сквозной цепочке: **Подключение → Датасет → Чарт → Дашборд**.\n\n1) **Подключение (Connection)** — набор технических параметров доступа к источнику данных: тип источника (PostgreSQL, ClickHouse, MySQL, файлы CSV и Excel, Google Таблицы, API, Яндекс Метрика), адрес сервера, порт, база, учётные данные, режим кеширования. Подключение отвечает на вопрос «откуда берём данные» и позволяет централизованно управлять доступом: пароль к базе хранит подключение, а не каждый пользователь.\n2) **Датасет (Dataset)** — логическое описание структуры данных. Здесь выбираются таблицы, настраиваются связи между ними (JOIN), определяются типы полей (строка, число, дата, геоточка), создаются вычисляемые поля и формулы, задаются агрегации по умолчанию. Датасет — семантический слой: он переводит технические таблицы на язык бизнеса («Сумма выплат», «Район») и обеспечивает единую логику расчёта для всех визуализаций.\n3) **Чарт (Chart)** — отдельный элемент визуализации, построенный на основе датасета: линейный график, столбчатая диаграмма, таблица, сводная таблица, индикатор, карта. Чарт создаётся в визуальном конструкторе (Wizard), в QL-чарте на SQL или в редакторе на JavaScript.\n4) **Дашборд (Dashboard)** — финальный интерактивный интерфейс для руководства: объединяет чарты, селекторы (фильтры) и текстовые блоки, поддерживает вкладки и мобильную вёрстку, открывается по ссылке.\n\n![Сквозная цепочка сущностей Yandex DataLens](img/avd18_datalens.webp){600}\n\n## Логическая последовательность\n\nПоследовательность обусловлена зависимостями: без подключения нельзя описать датасет, без датасета — построить чарт, без чартов — собрать дашборд. Изменение на нижнем уровне автоматически распространяется наверх: если в датасете исправлена формула показателя, все чарты и дашборды, использующие его, обновятся. Поэтому качество аналитики закладывается на уровнях подключения и датасета, а дашборд — только «витрина» результата.\n\nПомимо четырёх основных сущностей, объекты объединяются в **воркбуки** (контейнеры для подключений, датасетов, чартов и дашбордов одного проекта) и **коллекции**; есть также отчёты для экспорта в PDF.\n\n## Пример\n\nПроект «Мониторинг обращений граждан в сфере ЖКХ»: подключение — к базе PostgreSQL портала обращений; датасет — таблица обращений, связанная со справочником районов по коду ОКТМО, вычисляемые поля «Срок рассмотрения» и «Просрочено», геоточка из широты и долготы адреса; чарты — карточка KPI «Доля просроченных обращений», линейный график динамики, тепловая карта адресов, таблица управляющих компаний; дашборд — объединяет чарты с селекторами «Район» и «Период» для заместителя главы администрации.\n\n**Вывод.** Архитектура DataLens состоит из четырёх последовательных сущностей: подключение (доступ к источнику), датасет (структура и логика данных), чарт (визуализация) и дашборд (интерфейс для руководителя). Строгая последовательность обеспечивает единую логику расчётов и позволяет быстро создавать веб-аналитику для органов власти."}, {"d": "avd", "q": 19, "title": "Виды геовизуализации в аналитике", "md": "## Значение геоаналитики для ГМУ\n\nУправленческие решения в государственном секторе практически всегда привязаны к территории: муниципальный район, избирательный округ, адрес конкретного инцидента. Геоаналитика позволяет оценивать плотность и доступность социальной инфраструктуры, выявлять очаги социальной напряжённости и аварийности, проводить пространственный аудит расходования бюджетных средств.\n\nОснова геовизуализации — координаты в международной системе WGS 84: широта (от 0° до ±90°) и долгота (от 0° до ±180°). В DataLens используются два типа геополей: **геоточка** — объект с парой координат, задаётся функцией GEOPOINT([Широта], [Долгота]); **геополигон** — многоугольник, описывающий границы территории (района, области).\n\n## Виды геовизуализации\n\nТаблица: Виды геовизуализации и задачи их применения\n{w:22,40,38}\n| Вид | Принцип | Пример задачи в ГМУ |\n|---|---|---|\n| Точечная карта (Point Map) | Каждый объект или инцидент — маркер; размер и цвет зависят от показателя | Адреса школ, очаги ДТП, объекты нацпроекта с размером по объёму инвестиций |\n| Тепловая карта (Heatmap) | Цвет показывает плотность точек: чем ближе точки, тем «горячее» область | Зоны концентрации жалоб на отопление и протечки кровли |\n| Фоновая картограмма (Choropleth Map) | Административные единицы окрашены по значению относительного показателя | Сравнение районов по среднему баллу ЕГЭ, уровню безработицы |\n| Картодиаграмма (Proportional Symbol Map) | Значок или диаграмма в центре территории, размер пропорционален абсолютному значению | Объём субсидий по муниципалитетам, структура расходов района |\n| Карта потоков (Flow Map) | Линии между точками, толщина — интенсивность потока | Маятниковая миграция, пассажиропотоки, межмуниципальный обмен пациентами |\n| Изолинии и зоны доступности (Isochrones) | Линии равных значений или равного времени в пути | Зоны 15-минутной доступности поликлиник, шумовые зоны |\n\n**Точечная карта** показывает точное расположение объектов: подходит для мониторинга точечной застройки, адресов учреждений, мест происшествий. При тысячах точек становится нечитаемой — тогда используют кластеризацию или тепловую карту.\n\n**Тепловая карта** выявляет «горячие точки» без привязки к административным границам. Пример: карта жалоб на теплоснабжение показывает, что проблема сосредоточена в квартале со старыми сетями, а не во всём районе.\n\n**Фоновая картограмма** сравнивает территории по относительному показателю. Важное правило: окрашивать нужно по относительным величинам (на 1000 жителей, процент), а не по абсолютным — иначе крупные районы всегда будут «самыми проблемными» просто из-за численности населения. Ещё одна ловушка — большие по площади, но малонаселённые территории визуально доминируют.\n\n**Картодиаграмма** показывает абсолютные значения и структуру; часто сочетается с картограммой (цвет — относительный показатель, размер знака — абсолютный).\n\n**Карты потоков и изолиний** применяются в транспортном планировании и оценке доступности услуг.\n\nВ Yandex DataLens по умолчанию доступны точечная карта, тепловая карта, фоновая картограмма по полигонам и линии (маршруты).\n\n## Требования к данным\n\n- корректная геопривязка: координаты в WGS 84 или нормализованные адреса (ФИАС/ГАР) с геокодированием;\n- контроль ошибок ввода: перепутанные широта и долгота отправляют точки «в Гвинейский залив» (координаты 0;0) — это признак ошибки, а не реальный объект;\n- единые справочники территорий (ОКТМО) для связи показателей с полигонами.\n\n**Вывод.** Основные виды геовизуализации — точечная карта (где расположены объекты), тепловая карта (где концентрация), фоновая картограмма (как различаются территории), а также картодиаграммы, карты потоков и изолиний. Выбор вида определяется управленческим вопросом: найти конкретный объект, выявить очаг или сравнить территории."}, {"d": "avd", "q": 20, "title": "Выбросы (аномалии) в данных и устойчивость медианы", "md": "## Понятие выброса\n\nВыброс (аномалия, outlier) — наблюдение, которое существенно отклоняется от общей закономерности или распределения остальных данных. Аномальные данные не всегда ошибочны: прежде чем исключать их, нужно разобраться, что они собой представляют и почему появились.\n\nПричины аномалий в ГИС:\n\n- **технический фактор:** сбои при автоматической выгрузке, некорректная конвертация форматов, дублирование пакетов при межведомственном обмене;\n- **человеческий фактор:** опечатки при ручном вводе — лишние нули в суммах выплат или контрактов, перепутанные поля («ИНН» и «Объём финансирования»);\n- **умышленное искажение:** «сглаживание» отчётности на местах;\n- **реальные редкие события:** авария, стихийное бедствие, крупный разовый контракт, мошенническая схема.\n\n## Почему аномалии мешают анализу\n\n- **искажают описательные статистики:** сильно смещают среднее арифметическое, завышают дисперсию и среднеквадратическое отклонение;\n- **искажают модели:** регрессия и прогноз «тянутся» к экстремальным точкам; коэффициенты корреляции становятся ложными;\n- **ломают визуализацию:** одна гигантская величина сжимает шкалу графика, и различия между нормальными значениями становятся невидимыми;\n- **ведут к ошибочным решениям:** завышенный средний бюджет ремонта или средний срок рассмотрения обращения приводит к неверному распределению ресурсов;\n- в ручном режиме их трудно найти: на массивах более 10⁴ строк аналитик «замыливает глаз», поэтому нужны алгоритмические методы.\n\n## Почему среднее смещается, а медиана устойчива\n\nСреднее арифметическое x̄ = (x₁ + x₂ + … + xₙ) / n использует **величину каждого** наблюдения. Одно экстремальное значение входит в сумму целиком, и его отклонение делится лишь на n. Поэтому одна ошибка «лишние три нуля» может увеличить среднее в разы. В робастной статистике говорят, что у среднего нулевая **точка излома** (breakdown point): достаточно одного сколь угодно большого значения, чтобы сдвинуть среднее сколь угодно далеко.\n\nМедиана Me — значение, которое делит упорядоченный ряд пополам. Она зависит **только от порядка** наблюдений, а не от их величины: если максимальное значение увеличить в тысячу раз, оно останется последним в ряду, и центральный элемент не изменится. Точка излома медианы — 50 %: чтобы произвольно сдвинуть её, нужно исказить половину данных. Мода (наиболее частое значение) также устойчива к единичным выбросам.\n\n**Пример.** Сроки рассмотрения девяти обращений (дней): 5, 6, 6, 7, 7, 8, 8, 9, 10. Среднее — 7,3 дня, медиана — 7 дней. Оператор ошибочно ввёл вместо 10 значение 1000. Среднее выросло до 117,3 дня, медиана осталась 7 дней. Если руководитель сравнивает районы по среднему, район с одной опечаткой получит ложный статус «провального».\n\n## Выводы для аналитика\n\n- для показателей с асимметричным распределением (доходы, бюджеты, сроки, суммы контрактов) в KPI используется медиана — в курсе это показано как борьба с «ловушкой среднего»: Median_Budget = MEDIAN('Social_Payments'[Сумма]);\n- расхождение среднего и медианы — сигнал наличия выбросов или сильной асимметрии;\n- аномалии выявляются формально (правило трёх сигм, метод межквартильного размаха) и затем анализируются содержательно: ошибка исправляется по первоисточнику, реальное событие изучается отдельно.\n\n**Вывод.** Выброс — наблюдение, существенно отклоняющееся от закономерности данных; он может быть ошибкой или реальным редким событием. Среднее арифметическое чувствительно к выбросам, поскольку учитывает величину каждого значения, а медиана зависит только от порядка и поэтому робастна. Для управленческих показателей с выбросами и асимметрией медиана даёт более достоверную картину «типичного» случая."}, {"d": "avd", "q": 21, "title": "Метод межквартильного размаха (IQR) для обнаружения аномалий", "md": "## Квартили и межквартильный размах\n\nМетод межквартильного размаха (Interquartile Range, IQR) — непараметрический метод выявления выбросов, предложенный Дж. Тьюки (1977) и лежащий в основе диаграммы «ящик с усами» (boxplot). Он опирается на квартили — значения, делящие упорядоченный ряд на четыре равные части:\n\n- **Q₁** (25-й процентиль) — граница, ниже которой лежит четверть данных;\n- **Q₂** (50-й процентиль) — медиана;\n- **Q₃** (75-й процентиль) — граница, выше которой лежит четверть данных.\n\nМежквартильный размах IQR = Q₃ − Q₁ — ширина интервала, в котором находятся центральные 50 % наблюдений.\n\n## Алгоритм метода\n\n1) Упорядочить значения по возрастанию.\n2) Рассчитать Q₁ и Q₃ (в Excel — функции КВАРТИЛЬ.ВКЛ, в DAX — PERCENTILE.INC, в SQL — PERCENTILE_CONT).\n3) Найти IQR = Q₃ − Q₁.\n4) Вычислить границы нормы: нижняя Lower_Bound = Q₁ − 1,5 × IQR; верхняя Upper_Bound = Q₃ + 1,5 × IQR.\n5) Признать аномалией любое значение xᵢ вне интервала [Lower_Bound; Upper_Bound]. Значения за пределами Q₁ − 3 × IQR и Q₃ + 3 × IQR Тьюки называл экстремальными выбросами.\n\nНа диаграмме boxplot «ящик» охватывает интервал от Q₁ до Q₃, линия внутри — медиана, «усы» доходят до крайних значений в пределах границ, а выбросы изображаются отдельными точками.\n\n## Почему IQR устойчивее правила трёх сигм\n\nПравило трёх сигм признаёт выбросом значение, для которого |xᵢ − μ| > 3σ. Оно опирается на среднее и стандартное отклонение — статистики, которые **сами искажаются выбросами**. Возникает эффект маскировки: крупный выброс увеличивает σ, расширяет «нормальный» интервал и прячет сам себя и соседние аномалии. Кроме того, правило корректно только для нормального (гауссовского) распределения, где в интервал μ ± 3σ попадает 99,73 % значений.\n\nМетод IQR опирается на квартили, которые зависят от порядка данных, а не от величины крайних значений. Экстремальное значение остаётся «где-то за Q₃» и не сдвигает границы: чтобы исказить квартиль, нужно испортить четверть выборки (точка излома 25 %). Метод не требует нормальности распределения, поэтому идеален для бюджетов, сроков исполнения заявок, сумм социальных выплат — показателей с асимметричным распределением.\n\n## Пример применения\n\nСроки исполнения 11 заявок в управляющей компании (дней): 3, 4, 4, 5, 5, 6, 6, 7, 8, 9, 45.\n\nТаблица: Сравнение правила трёх сигм и метода IQR на примере\n{w:34,33,33}\n| Показатель | Правило 3σ | Метод IQR |\n|---|---|---|\n| Центр | Среднее x̄ = 9,27 | Медиана Me = 6 |\n| Разброс | σ = 11,98 (выборочное) | Q₁ = 4,5; Q₃ = 7,5; IQR = 3 |\n| Граница нормы сверху | 9,27 + 3 × 11,98 = 45,2 | 7,5 + 1,5 × 3 = 12 |\n| Значение 45 дней | Не выброс (45 < 45,2) | Выброс (45 > 12) |\n\nОдна заявка, исполнявшаяся 45 дней, раздула стандартное отклонение до 12 дней, и правило трёх сигм её «не заметило». Метод IQR уверенно отнёс её к аномалиям. Дальнейший анализ показывает: заявка ждала поставки материалов, то есть это реальное событие, требующее управленческой реакции, а не ошибка ввода.\n\n## Ограничения метода\n\n- при очень длинном «хвосте» (доходы, суммы контрактов) метод относит к выбросам много реальных значений; помогает логарифмирование данных перед расчётом;\n- на малых выборках (менее 10–20 наблюдений) квартили неустойчивы;\n- метод одномерный: не видит аномальных сочетаний признаков и не учитывает тренд и сезонность временного ряда — их сначала нужно удалить.\n\n**Вывод.** Метод IQR задаёт границы нормы Q₁ − 1,5 × IQR и Q₃ + 1,5 × IQR и признаёт аномалией всё, что за ними. Он робастен, потому что квартили не зависят от величины экстремальных значений, и не требует нормального распределения. Поэтому для управленческих данных с асимметрией и единичными грубыми ошибками метод IQR надёжнее правила трёх сигм."}, {"d": "avd", "q": 22, "title": "Методы нейтрализации аномалий и границы допустимой замены", "md": "## Принцип: сначала диагностика, потом обработка\n\nАномальные данные не всегда ошибочны. Прежде чем обрабатывать выброс, аналитик устанавливает его природу: техническая ошибка (сбой выгрузки, дубль пакета), человеческая ошибка (лишний ноль, перепутанные поля), умышленное искажение или реальное редкое событие (авария, крупный разовый контракт, мошенничество). От диагноза зависит выбор метода.\n\n## Основные методы нейтрализации\n\n1) **Исправление по первоисточнику.** Если ошибка установлена (оператор ввёл 1 500 000 вместо 15 000), правильное значение берётся из первичного документа или исходной системы. Это лучший вариант — данные становятся верными.\n2) **Удаление.** Аномальная запись исключается, если таких записей немного и их исключение не нарушает общую картину (технические дубли, тестовые записи, координаты 0;0).\n3) **Аппроксимация (замена расчётным значением).** Во временном ряду аномалия заменяется средним или медианой соседних значений, интерполяцией или значением по модели (например, регрессионной). Если временного окружения нет — наиболее вероятным значением (медианой группы).\n4) **Винзоризация (ограничение).** Значения за границами нормы приравниваются к границам (например, к Q₃ + 1,5 × IQR или 99-му процентилю): выброс остаётся в данных, но перестаёт доминировать.\n5) **Преобразование шкалы.** Логарифмирование сжимает длинный «хвост» распределения.\n6) **Робастные статистики вместо обработки.** Данные не меняются, но в KPI используются медиана и квантили вместо среднего — так влияние выбросов нейтрализуется без вмешательства в записи.\n7) **Маркировка и отдельный анализ.** Аномалия помечается флагом и анализируется отдельно как самостоятельный управленческий сигнал.\n\n## Когда замена расчётным значением оправдана\n\n- выброс — **доказанная техническая ошибка**, а истинное значение нельзя восстановить, но можно надёжно оценить (сбой датчика расхода воды на одни сутки — интерполяция по соседним дням);\n- задача — **оценить типичную закономерность**, а не конкретный случай: прогноз нагрузки на МФЦ, сезонность обращений;\n- замен **немного**, и они не меняют вывод; аналитик проверяет это, сравнивая результаты с заменой и без неё;\n- замена **документирована**: что заменено, почему, каким методом; исходные значения сохранены, и замену можно отменить.\n\n## Когда замена превращается в фальсификацию\n\n- аномалия — **реальное событие**: резкий рост смертности, вспышка заболеваемости, авария на сетях, крупный контракт. Заменить его «средним» — значит скрыть проблему, ради которой анализ и проводится;\n- замена делается, чтобы **достичь целевого значения KPI** или «сгладить» отчётность перед проверкой: это прямое искажение государственной отчётности;\n- заменяется **значимая доля** данных, и вывод определяется не наблюдениями, а методом замены;\n- замена **не документирована** и необратима: пользователь отчёта не знает, что видит расчётные, а не фактические данные;\n- аномалия — **признак мошенничества** (дублирующиеся заявления на выплаты, завышенные цены контрактов). Её «нейтрализация» уничтожает доказательство и мешает контролю.\n\n## Пример\n\nВ реестре социальных выплат района обнаружены две аномалии. Первая — выплата 1 250 000 руб. при типичной сумме 12 500 руб.: сверка с платёжным поручением показала лишние два нуля при вводе, значение исправлено по первоисточнику. Вторая — рост числа получателей пособия в одном поселении в три раза за месяц. Заменять его средним недопустимо: проверка выявила повторную подачу заявлений одними и теми же лицами, и аномалия стала основанием для контрольных мероприятий.\n\n**Вывод.** Нейтрализация аномалий включает исправление по первоисточнику, удаление, аппроксимацию, винзоризацию, преобразование, робастные статистики и маркировку. Замена расчётным значением оправдана только для доказанных технических ошибок, при её незначительной доле и полной документированности. Замена реальных событий, особенно ради «красивых» показателей, превращает аналитику в фальсификацию."}, {"d": "avd", "q": 23, "title": "Три типичных «греха» данных в отчётах с точки зрения Tidy Data", "md": "## Почему «грехи» возникают\n\nОтчёты органов власти исторически готовятся для чтения человеком и печати: с объединёнными шапками, цветовыми пометками и промежуточными итогами. Такая «презентационная» вёрстка удобна глазу, но нарушает правила Tidy Data (одна переменная — столбец, одно наблюдение — строка, одно значение — ячейка). При автоматизации отчётности, когда таблицы загружаются в хранилище или BI-систему, эти нарушения становятся источником ошибок.\n\n## «Грех» 1. Объединённые ячейки и многоуровневые шапки\n\nПример: в отчёте муниципалитета ячейка «Кировский район» объединена на пять строк, а шапка состоит из двух уровней («2026 год» → «I кв.», «II кв.»).\n\nПоследствия при автоматизации:\n\n- машина считывает значение только из первой ячейки объединения, остальные строки получают пустое значение района — при группировке они попадают в «пустой» район или теряются;\n- двухуровневая шапка не превращается в имена столбцов: загрузчик создаёт столбцы «Unnamed_1», «Unnamed_2»;\n- любое изменение вёрстки ломает настроенный ETL-процесс, и его приходится переписывать вручную.\n\n## «Грех» 2. Несколько значений или переменных в одной ячейке и смысл через цвет\n\nПример: в ячейке «Ответственные» записано «Иванов / Петров», в ячейке «Адрес» — город, улица и номер дома вместе; должники выделены красной заливкой без отдельного столбца «Статус».\n\nПоследствия:\n\n- невозможно отфильтровать и посчитать нагрузку по каждому исполнителю — значение надо разбирать по разделителям, которые разные люди ставят по-разному;\n- нельзя связать таблицу со справочником адресов (ФИАС) и построить карту;\n- цвет заливки не загружается в базу данных: при автоматизации информация о должниках просто исчезает. Смысл должен быть вынесен в отдельный текстовый столбец.\n\n## «Грех» 3. Внутренние итоги и «широкий» формат\n\nПример: после каждого района вставлена строка «Итого по району», в конце — «Всего по региону»; годы или месяцы вынесены в отдельные столбцы.\n\nПоследствия:\n\n- при автоматическом суммировании итоговые строки складываются вместе с детальными — показатель завышается в два-три раза (задвоение сумм);\n- строки «Итого» не являются наблюдениями и ломают расчёт средних и медиан;\n- в «широкой» таблице каждый новый период требует нового столбца: формулы, сводные таблицы и связи в BI-модели нужно переделывать каждый месяц; одна переменная («Месяц») размазана по столбцам, что нарушает правило «одна переменная — один столбец».\n\nТаблица: «Грехи» данных и способы их исправления\n{w:30,35,35}\n| «Грех» | Нарушенное правило Tidy Data | Исправление |\n|---|---|---|\n| Объединённые ячейки, многоуровневые шапки | Одно наблюдение — одна строка; одна переменная — один столбец | Заполнить значения в каждой строке, шапку свести к одному уровню |\n| Несколько значений в ячейке, смысл через цвет | Одно значение — одна ячейка | Разделить на атомарные столбцы, цвет заменить столбцом «Статус» |\n| Внутренние итоги, «широкий» формат | Одно наблюдение — одна строка; одна переменная — один столбец | Удалить итоги (их считает BI-система), перевести таблицу в «длинный» формат |\n\n## Общие последствия для автоматизации отчётности\n\n- ошибки становятся **незаметными**: таблица загружается, но цифры неверны, а пользователь дашборда не видит причину;\n- растут **трудозатраты** на ручную подготовку — именно поэтому подготовка данных занимает до 80 % времени проекта;\n- теряется **воспроизводимость**: каждый файл требует индивидуальной обработки;\n- **межведомственный обмен** затрудняется: машиночитаемость нарушена, данные нельзя опубликовать как открытые.\n\n**Вывод.** Три типичных «греха» — объединённые ячейки с многоуровневыми шапками, несколько значений в ячейке со смыслом через цвет и внутренние итоги в «широком» формате — делают отчёт удобным для печати, но непригодным для автоматизации. Они ведут к потере данных, задвоению сумм и постоянной ручной доработке. Решение — разделять «данные» и «презентацию»: хранить и передавать таблицы в формате Tidy Data, а оформление и итоги строить в BI-системе."}, {"d": "avd", "q": 24, "title": "«Колодцы данных» (Data Silos) и пути их преодоления", "md": "## Понятие Data Silos\n\nData Silos («колодцы», «болота» данных) — ситуация, когда данные разных подразделений или ведомств изолированы друг от друга, хранятся в несовместимых форматах и по разным стандартам и не передаются для совместного использования. Причина — **лоскутная автоматизация**: каждое ведомство исторически создавало свою информационную систему автономно, под собственные задачи и со своими справочниками.\n\n## Почему колодцы данных опасны\n\n- **противоречивая отчётность:** одни и те же показатели (численность населения района, число получателей мер поддержки) в разных системах различаются; на совещании звучат несовпадающие цифры;\n- **дублирование функций и затрат:** одни и те же сведения собираются и хранятся несколько раз, гражданин повторно приносит справки;\n- **невозможность сквозной аналитики:** нельзя быстро получить картину по региону, увидеть связь между расходами одного ведомства и результатами другого;\n- **ошибки в решениях:** решение принимается по неполным данным, без учёта сведений смежных ведомств;\n- **угрозы качеству и безопасности:** копии данных «расходятся» во времени, теряется прослеживаемость происхождения, растёт число мест, где хранятся персональные данные.\n\n## Влияние на межведомственное взаимодействие и аналитику\n\nВ межведомственном взаимодействии колодцы данных проявляются в ручных запросах и письмах вместо автоматического обмена, в долгих сроках согласования и в нарушении принципа «одного окна»: Федеральный закон от 27.07.2010 № 210-ФЗ запрещает требовать от заявителя сведения, которые уже есть у органов власти, но выполнить это требование без интеграции систем невозможно.\n\nДля управленческой аналитики последствия ещё серьёзнее. Пример: министерство здравоохранения анализирует очереди в поликлиниках, а данные о численности прикреплённого населения, транспортной доступности и кадрах находятся в трёх разных системах с разными кодами территорий. Без сопоставления причина очередей остаётся невыясненной. Сотрудник тратит недели на ручное сведение таблиц — правило «80 % времени на подготовку данных» во многом объясняется именно колодцами.\n\n## Роль хранилища данных\n\nХранилище данных (DWH) — **интегрированная** совокупность данных: процесс ETL извлекает сведения из разрозненных систем, приводит их к единому формату, очищает и загружает в общую структуру. В результате формируется «единый источник истины» (Single Source of Truth): все ведомства региона строят свои витрины на одних и тех же выверенных данных. DWH хранит историю, поэтому сравнения во времени становятся корректными.\n\n## Роль единых справочников НСИ\n\nНормативно-справочная информация (НСИ) — общие классификаторы и справочники, которые служат «ключами» для сшивания данных разных систем. Использование общих классификаторов в качестве метаданных позволяет сопоставлять сведения разных ведомств:\n\n- **ОКТМО** — коды муниципальных образований: связывает бюджетные расходы, статистику и обращения граждан по территории;\n- **ФИАС / ГАР** — государственный адресный реестр: единый идентификатор адреса для связи объектов ЖКХ, жалоб и инцидентов;\n- **КБК** — коды бюджетной классификации: связывают расходы с программами и мероприятиями;\n- **ОКВЭД, ИНН, ОГРН, СНИЛС** — идентификаторы видов деятельности, организаций и граждан.\n\nБез единых справочников даже объединённые в одном хранилище данные не сопоставляются: «г. Ярославль», «Ярославль г.» и «Ярославль (городской округ)» остаются разными объектами.\n\n## Государственная инфраструктура преодоления колодцев\n\n- **СМЭВ** (система межведомственного электронного взаимодействия) — получение сведений из других ведомств без истребования документов у заявителя;\n- **национальная система управления данными (НСУД)** и её единая информационная платформа — каталогизация государственных данных, единые модели и справочники;\n- региональные **центры управления (ЦУР)** и аналитические платформы, интегрирующие данные ведомств региона.\n\n**Вывод.** Колодцы данных — следствие лоскутной автоматизации: они порождают противоречивую отчётность, дублирование и невозможность сквозной аналитики, мешают межведомственному взаимодействию. Архитектура DWH интегрирует данные в единый источник истины, а единые справочники НСИ (ОКТМО, ФИАС, КБК) дают общие ключи для их сопоставления. Только вместе технология интеграции и общие стандарты устраняют изоляцию данных."}, {"d": "avd", "q": 25, "title": "Различие OLTP- и OLAP-систем", "md": "## Определения\n\n**OLTP (On-Line Transaction Processing)** — системы оперативной обработки транзакций. Их задача — быстро и надёжно фиксировать отдельные операции в момент их совершения: регистрацию обращения гражданина, подачу заявления на Госуслугах, проведение платежа, запись к врачу. Ключевое преимущество — скорость операций.\n\n**OLAP (On-Line Analytical Processing)** — технология оперативной аналитической обработки многомерных данных для поддержки решений. Задача — выполнять сложные агрегирующие запросы по миллионам записей и проверять гипотезы «на лету». Ключевое преимущество — анализ без программистов.\n\nВ информационных системах государственного управления данные разделяются на оперативные (транзакционные) и исторические (аналитические): OLTP — источник данных, OLAP — потребитель, связанный с ним через ETL и хранилище данных.\n\n## Сравнение\n\nТаблица: Сравнение OLTP- и OLAP-систем\n{w:24,38,38}\n| Признак | OLTP | OLAP |\n|---|---|---|\n| Назначение | Выполнение текущих операций | Анализ и поддержка решений |\n| Пользователи | Операторы, специалисты, граждане (тысячи одновременно) | Аналитики, руководители (десятки) |\n| Типичная операция | Вставка, изменение, чтение одной записи (INSERT, UPDATE) | Чтение и агрегирование больших массивов (SELECT … GROUP BY) |\n| Объём запроса | Отдельные строки | Миллионы строк |\n| Данные | Текущие, детальные; старые значения перезаписываются | Исторические, интегрированные, агрегированные |\n| Структура | Нормализованная (3НФ), много таблиц | Денормализованная: «звезда», «снежинка», куб |\n| Обновление | Непрерывно, в реальном времени | Пакетно по расписанию (ночная загрузка ETL) |\n| Критерий качества | Время транзакции, целостность (ACID) | Время ответа на аналитический запрос (тест FASMI — до 5 секунд) |\n| Пример в ГМУ | ГИС приёма заявлений, ведомственный реестр | Хранилище и витрины ЦУР, дашборд губернатора |\n\n## Почему системы разделяют\n\n- **разная оптимизация:** OLTP оптимизирована под короткие транзакции и индексы по ключам, OLAP — под сканирование столбцов и агрегацию; одна структура не может быть быстрой для обоих типов нагрузки;\n- **конкуренция за ресурсы:** тяжёлый аналитический запрос к рабочей базе замедляет обслуживание граждан;\n- **история и интеграция:** OLTP хранит текущее состояние одной системы, а анализ требует истории и сведений из многих систем;\n- **безопасность:** аналитикам не нужно давать доступ к рабочим базам с персональными данными — в аналитический контур передаются только нужные, при необходимости обезличенные, сведения.\n\n**Пример.** Региональная ГИС «Электронная очередь в МФЦ» (OLTP) в реальном времени фиксирует каждое обращение: талон, окно, время начала и окончания приёма. Ночью ETL-процесс переносит записи в хранилище, где они связываются со справочниками МФЦ, услуг и территорий. Утром руководитель открывает OLAP-дашборд «Среднее и медианное время ожидания по МФЦ и услугам за год», выполняет срез по району и детализацию до дня недели. Рабочая система при этом продолжает обслуживать заявителей без задержек.\n\n**Вывод.** OLTP фиксирует текущие операции быстро и надёжно, OLAP анализирует большие объёмы исторических интегрированных данных. Системы различаются назначением, пользователями, структурой данных, типом запросов и режимом обновления. Их разделение — основа архитектуры аналитики: транзакционные ГИС служат источником, хранилище и OLAP-инструменты — средством принятия решений."}, {"d": "avd", "q": 26, "title": "Тест FASMI для OLAP-систем и обеспечение требования Fast", "md": "## Содержание теста FASMI\n\nТест FASMI (Fast Analysis of Shared Multidimensional Information — «быстрый анализ разделяемой многомерной информации») сформулировали Найджел Пендс и Ричард Крит (The OLAP Report, 1995) как компактное определение OLAP-системы. Система соответствует OLAP, если выполняет пять требований.\n\nТаблица: Требования теста FASMI\n{w:22,40,38}\n| Буква | Требование | Содержание в ГМУ |\n|---|---|---|\n| F — Fast | Быстродействие | Среднее время ответа на стандартный запрос аналитика — не более 5 секунд; простые запросы — около 1 секунды |\n| A — Analysis | Анализ | Глубокий числовой и статистический анализ любой сложности без программирования: расчёты, сравнения периодов, доли |\n| S — Shared | Разделяемость | Безопасный многопользовательский доступ с разграничением прав, например доступ только к данным своего муниципалитета |\n| M — Multidimensional | Многомерность | Ключевое требование — концептуально многомерное представление данных в виде куба с иерархиями |\n| I — Information | Информация | Способность работать с любыми объёмами данных независимо от места их физического хранения |\n\nТребование Fast связано с психологией работы аналитика: если ответ не приходит за несколько секунд, пользователь теряет нить рассуждения, перестаёт задавать уточняющие вопросы и возвращается к заранее подготовленным отчётам. Интерактивный анализ — «срез, детализация, ещё срез» — возможен только при мгновенном отклике.\n\n## Технические решения для обеспечения быстрого отклика\n\n1) **Предварительная агрегация.** Итоги по уровням иерархий (по месяцам, районам, отраслям) рассчитываются заранее при загрузке данных: MOLAP-кубы, агрегатные таблицы, материализованные представления. Запрос «расходы региона за год» читает одну готовую строку вместо миллионов транзакций.\n2) **Колоночное хранение и сжатие.** Колоночные СУБД (ClickHouse, Vertica) и движки BI (VertiPaq в Power BI) читают только нужные столбцы и хранят их в сжатом виде; агрегация по столбцу выполняется на порядки быстрее, чем в строковой транзакционной базе.\n3) **Вычисления в оперативной памяти (in-memory).** Модель данных целиком размещается в ОЗУ, исключая обращения к диску.\n4) **Денормализованная модель «звезда».** Минимум соединений (JOIN) между таблицей фактов и справочниками; связи «один ко многим» по целочисленным ключам.\n5) **Индексирование и секционирование (партиционирование).** Таблица фактов делится на секции по датам или территориям: запрос за текущий год не читает данные прошлых лет.\n6) **Кеширование результатов.** Повторяющиеся запросы дашборда (например, утренний просмотр KPI сотней пользователей) берутся из кеша.\n7) **Массивно-параллельная обработка (MPP) и горизонтальное масштабирование.** Данные распределяются по узлам кластера, запрос выполняется параллельно (Greenplum, кластеры ClickHouse).\n8) **Инкрементальная загрузка.** Обновляются только новые данные, что сокращает окна загрузки и позволяет чаще обновлять агрегаты.\n9) **Оптимизация на уровне дашборда.** Ограничение детализации на первом экране, отложенная загрузка детальных таблиц, использование мер вместо громоздких вычисляемых столбцов.\n\nДля Shared дополнительно нужны ролевая модель доступа и защита на уровне строк (Row-Level Security); для Information — подключение к распределённым источникам и масштабируемое хранилище.\n\n**Пример.** Дашборд «Исполнение региональных программ» строился напрямую по транзакционной базе казначейских платежей и открывался 40–60 секунд. После переноса данных в ClickHouse с секционированием по месяцам и создания агрегатной витрины по районам и кодам КБК время отклика сократилось до 1–2 секунд, а руководители начали самостоятельно выполнять срезы и детализацию.\n\n**Вывод.** Тест FASMI определяет OLAP-систему через пять требований: быстродействие, аналитические возможности, разделяемый защищённый доступ, многомерность и независимость от объёма данных. Требование Fast обеспечивается сочетанием предварительной агрегации, колоночного и in-memory хранения, схемы «звезда», секционирования, кеширования и параллельной обработки."}, {"d": "avd", "q": 27, "title": "Первичный и внешний ключи в реляционной модели данных", "md": "## Реляционная модель и ключи\n\nРеляционная модель представляет данные в виде отношений — двумерных таблиц, где строка (кортеж) описывает один объект или событие, а столбец (атрибут) — его характеристику; допустимые значения атрибута задаёт домен. Таблицы связываются между собой не указателями,
