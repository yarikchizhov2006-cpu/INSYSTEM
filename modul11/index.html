ьно-этические средства — единственный класс защиты, действующий за пределами контролируемой зоны и после увольнения работника: ни одно техническое средство не мешает пересказать содержание документа вслух.\n\n## Правила обращения с документами и носителями\n\n- **маркируйте документы** — пометка и номер экземпляра в правом верхнем углу первого листа;\n- **соблюдайте политику чистого стола** — документы в запираемом хранилище, экран блокируется при уходе;\n- **используйте только учтённые носители** — с инвентарным номером и шифрованием; личные накопители в служебном контуре запрещены;\n- **не пересылайте служебные файлы на личную почту** — данные покидают контролируемый контур;\n- **проверяйте адресата и вложения** — автодополнение адреса частая причина утечки;\n- **не подключайте найденные носители** — передайте их в подразделение по защите информации;\n- **уничтожайте правильно** — удаление и быстрое форматирование не уничтожают данные: нужно гарантированное затирание или физическое уничтожение по акту;\n- **сообщайте об инцидентах немедленно**, даже при сомнениях.\n\n## Контроль умышленных утечек и личная ответственность\n\nДля российского органа власти особенно значим **контроль умышленных утечек**: 95,6 % утечек по вине работников в России умышленные (InfoWatch, 9 месяцев 2025 года) — это торговля выгрузками из государственных систем и «пробив». Поэтому одного обучения недостаточно: нужны журналирование обращений к записям, поведенческая аналитика, системы предотвращения утечек (DLP), контроль каналов передачи и минимальные привилегии.\n\n**Личная ответственность служащего:** дисциплинарная (вплоть до увольнения за разглашение охраняемой тайны — подп. «в» п. 3 ч. 1 ст. 37 Федерального закона № 79-ФЗ), административная (ст. 13.11, 13.14 КоАП РФ), уголовная (ст. 137, 272, 272.1, 283 УК РФ), материальная — за ущерб органу.\n\n## Пример\n\nАналитик финансового управления района подготовил для главы аналитическую записку о рисках неисполнения бюджета с перечнем крупных должников-организаций и поставил на файле пометку «Секретно», а затем отправил его коллеге в мессенджере. Ошибки: сведения не составляют государственную тайну, и гриф «Секретно» присвоен неправомерно — должна применяться пометка «ДСП» по постановлению № 1233, проставленная уполномоченным лицом; передача через мессенджер выводит документ из контролируемого контура. Правильно: пометка ДСП и номер экземпляра, регистрация, передача через систему электронного документооборота, хранение в служебном каталоге с ограниченным доступом.\n\n**Вывод.** В органе власти действуют четыре уровня режима — государственная тайна, служебная информация ограниченного распространения, конфиденциальная информация и общедоступные сведения. Пометка «ДСП» не является грифом секретности: она проставляется в правом верхнем углу первой страницы, а за нарушение порядка обращения наступает ответственность по п. 1.8 Положения № 1233. Защита строится шестью методами, среди которых побуждение воплощает этику данных; при доминировании умышленных утечек необходим контроль обращений к данным, а служащий несёт личную ответственность за сохранность сведений."}, {"d": "ebod", "q": 23, "title": "Анализ защищённости программ; преступления в сфере компьютерной информации", "md": "## Статический и динамический анализ\n\nГосударственный служащий выступает заказчиком информационных систем и должен понимать, какие проверки безопасности требовать от разработчика.\n\nТаблица: Методы анализа защищённости программного обеспечения\n{w:20,28,22,30}\n| Метод | Суть | Когда применяется | Ограничения |\n|---|---|---|---|\n| Статический анализ | Анализ исходного или байт-кода без запуска: потоки данных и управления | При написании и приёмке кода | Много ложных срабатываний; не видит ошибок настройки и окружения |\n| Динамический анализ | Проверка работающего приложения тестовыми и атакующими запросами | На испытательном стенде | Не указывает строку кода; нужен развёрнутый стенд; проверяет только исполняемые пути |\n| Анализ состава ПО (SCA) | Инвентаризация сторонних библиотек и поиск в них известных уязвимостей | При сборке продукта | Не выявляет собственных ошибок разработчика |\n| Фаззинг | Подача аномальных и случайных входных данных для поиска отказов и ошибок работы с памятью | В цикле длительных проверок | Требует значительных вычислительных ресурсов |\n\n**Почему методы дополняют друг друга.** Статический анализ охватывает весь код, включая редко исполняемые ветви, но не видит поведения в реальном окружении; динамический анализ видит реальное поведение и ошибки конфигурации, но только на тех путях, которые удалось выполнить. Вместе с анализом состава и фаззингом они закрывают разные классы уязвимостей. Статический анализ — без запуска программы, динамический — в процессе её выполнения.\n\n## Стандарты и методический документ для технического задания\n\n- **ГОСТ Р 56939-2024** «Защита информации. Разработка безопасного программного обеспечения. Общие требования» — введён с 20.12.2024 вместо редакции 2016 года; устанавливает процессы безопасной разработки (моделирование угроз, безопасное программирование, анализ кода, управление уязвимостями).\n- **ГОСТ Р 71207-2024** — требования к статическому анализу программного обеспечения.\n- **Методический документ ФСТЭК России от 12.05.2026** «Методика выявления уязвимостей и недекларированных возможностей в программном обеспечении» — заменил методику 2020 года; применяется при сертификационных испытаниях средств защиты и для построения процессов безопасной разработки, включая анализ состава компонентов ПО.\n\nВ техническом задании заказчик закрепляет: требования по защите информации и класс защищённости системы; обязательность разработки по ГОСТ Р 56939-2024; статический анализ по ГОСТ Р 71207-2024 с предоставлением отчётов; динамический анализ, тестирование на проникновение и анализ состава библиотек на этапе испытаний; аттестацию системы перед вводом в эксплуатацию; управление обновлениями и уязвимостями при эксплуатации.\n\n## Понятие компьютерной информации и составы преступлений\n\n**Компьютерная информация** — сведения (сообщения, данные), представленные в форме электрических сигналов, независимо от средств их хранения, обработки и передачи (примечание 1 к ст. 272 УК РФ).\n\nТаблица: Преступления в сфере компьютерной информации (глава 28 УК РФ)\n{w:12,30,58}\n| Статья | Название | Состав |\n|---|---|---|\n| 272 | Неправомерный доступ к компьютерной информации | Доступ к охраняемой законом компьютерной информации, повлёкший её уничтожение, блокирование, модификацию либо копирование |\n| 272.1 | Незаконные использование и (или) передача, сбор и (или) хранение компьютерной информации, содержащей ПДн | Оборот ПДн, полученных незаконным путём, создание ресурсов для их распространения; введена Федеральным законом от 30.11.2024 № 421-ФЗ, действует с 11.12.2024 |\n| 273 | Создание, использование и распространение вредоносных компьютерных программ | Программы, заведомо предназначенные для несанкционированного уничтожения, блокирования, модификации, копирования информации или нейтрализации средств защиты |\n| 274 | Нарушение правил эксплуатации средств хранения, обработки или передачи компьютерной информации и информационно-телекоммуникационных сетей | Нарушение правил, повлёкшее уничтожение, блокирование, модификацию либо копирование информации и причинившее крупный ущерб |\n| 274.1 | Неправомерное воздействие на критическую информационную инфраструктуру | Создание вредоносных программ для КИИ, неправомерный доступ к охраняемой информации КИИ, нарушение правил эксплуатации значимых объектов КИИ |\n\nВажное следствие ст. 272.1: сам факт хранения незаконно полученной базы ПДн образует состав; квалифицированные составы предусматривают наказание до 10 лет лишения свободы.\n\n## Пример противоправных действий в органе власти и их квалификация\n\n- Системный администратор управления имущественных отношений по просьбе знакомого риелтора выгрузил из ГИС сведения о собственниках муниципальных квартир за вознаграждение — ст. 272.1 (ч. 3: корыстная заинтересованность, использование служебного положения), при копировании сведений с нарушением правил доступа — также ст. 272 УК РФ; для служащего — увольнение и дисциплинарная ответственность.\n- Специалист, в нарушение инструкции, подключил к служебному компьютеру личный накопитель с заражённой программой, что вызвало шифрование базы и простой системы с крупным ущербом, — ст. 274 УК РФ (нарушение правил эксплуатации); автор вредоносной программы — ст. 273.\n- Сотрудник, скачавший «из любопытства» слитую базу клиентов банка, — ст. 272.1 УК РФ (хранение).\n\n**Вывод.** Защищённость программ проверяется сочетанием статического и динамического анализа, анализа состава и фаззинга, поскольку каждый метод видит свой класс ошибок. Заказчик ссылается в ТЗ на ГОСТ Р 56939-2024, ГОСТ Р 71207-2024 и методику ФСТЭК России от 12.05.2026. Глава 28 УК РФ защищает компьютерную информацию составами ст. 272, 273, 274, 274.1, а ст. 272.1 (№ 421-ФЗ, с 11.12.2024) криминализует незаконный оборот ПДн, включая хранение незаконно полученных баз."}, {"d": "ebod", "q": 24, "title": "Модели передачи данных и угрозы по уровням сетевого взаимодействия", "md": "## Модели OSI и TCP/IP\n\n**Эталонная модель взаимосвязи открытых систем (OSI)** — семиуровневая модель (ГОСТ Р ИСО/МЭК 7498-1-99): физический, канальный, сетевой, транспортный, сеансовый, представления, прикладной уровни. **Модель TCP/IP** — четырёхуровневая практическая модель сети Интернет (RFC 1122): канальный (сетевого доступа), межсетевой, транспортный, прикладной.\n\nТаблица: Соответствие уровней OSI и TCP/IP\n{w:22,18,40,20}\n| Уровни OSI | Уровень TCP/IP | Протоколы | Единица данных |\n|---|---|---|---|\n| 7 Прикладной, 6 Представления, 5 Сеансовый | Прикладной | HTTP/HTTPS, DNS, SMTP, IMAP, FTP, SSH, LDAP, RDP | Сообщение |\n| 4 Транспортный | Транспортный | TCP (с установлением соединения), UDP | Сегмент, датаграмма |\n| 3 Сетевой | Межсетевой | IPv4, IPv6, ICMP, протоколы маршрутизации | Пакет |\n| 2 Канальный, 1 Физический | Канальный | Ethernet, Wi-Fi, ARP, VLAN; кабель, оптоволокно, радиоинтерфейс | Кадр, биты |\n\n## Инкапсуляция\n\nИнкапсуляция — вложение блока данных вышестоящего уровня в блок нижестоящего с добавлением служебного заголовка. Пример: гражданин подаёт заявление через портал.\n\n1) Приложение формирует HTTP-запрос с содержимым заявления.\n2) Транспортный уровень добавляет заголовок TCP с номерами портов — получается сегмент.\n3) Сетевой уровень добавляет заголовок IP с адресами отправителя и получателя — пакет.\n4) Канальный уровень добавляет заголовок Ethernet с MAC-адресами и контрольную сумму — кадр.\n5) Физический уровень передаёт кадр сигналами.\n6) У получателя заголовки снимаются в обратном порядке, и приложение получает заявление.\n\n**Значение для стоимости средств защиты:** чем глубже средству нужно разобрать блок данных, тем оно сложнее и дороже. Пакетный фильтр смотрит только заголовок IP и порты, а межсетевой экран уровня веб-приложений снимает все заголовки, восстанавливает сессию и анализирует содержимое HTTP-запроса, что требует значительно больших вычислительных ресурсов.\n\n## Угрозы по уровням TCP/IP и меры защиты\n\nТаблица: Угрозы и меры защиты по уровням модели TCP/IP\n{w:16,42,42}\n| Уровень | Типовые угрозы | Адекватные меры |\n|---|---|---|\n| Канальный | Прослушивание трафика, подмена соответствия адресов (ARP-спуфинг), переполнение таблицы коммутатора, поддельные точки доступа Wi-Fi, атаки на VLAN; на физическом — подключение к линии, перехват побочных излучений | Управляемые коммутаторы, контроль привязки адресов, защита портов, контроль доступа к сети (NAC) |\n| Межсетевой | Подмена IP-адреса (спуфинг), атаки на протоколы маршрутизации, злоупотребление ICMP, фрагментационные атаки | Списки контроля доступа на маршрутизаторах, фильтрация по обратному пути, защищённые туннели (VPN) |\n| Транспортный | SYN-флуд (исчерпание таблицы полуоткрытых соединений), сканирование портов, перехват сессии, атаки усиления через UDP-сервисы | Межсетевой экран с контролем состояния соединений, ограничение скорости, защитные механизмы TCP |\n| Прикладной | Фишинг, SQL-инъекции, межсайтовое выполнение сценариев, эксплуатация уязвимостей веб-приложений, отравление кэша DNS, туннелирование через DNS, подмена отправителя почты | Почтовый шлюз с проверкой вложений, межсетевой экран уровня веб-приложений, многофакторная аутентификация, проверка подлинности отправителя |\n\n## Комплексные угрозы\n\n- **атака «человек посередине» (MITM)** — злоумышленник размещается между сторонами, перехватывает и подменяет трафик; реализуется на канальном, сетевом или прикладном уровне; защита — сквозное шифрование и проверка сертификатов;\n- **распределённая атака на отказ в обслуживании (DDoS)** — одновременное обращение множества устройств для исчерпания ресурсов; бывает объёмной, протокольной и прикладной, последняя опаснее для порталов услуг: малый трафик — большой эффект;\n- **целенаправленная длительная атака (APT)** — многоступенчатое проникновение с закреплением на месяцы: разведка, фишинг, закрепление, скрытое управление, вывод данных; значительная доля таких атак направлена на государственные учреждения;\n- **атака на цепочку поставок** — проникновение через подрядчика, разработчика или поставщика ПО; по данным Solar 4RAYS, доля атак через подрядчиков в России выросла с 6 % до 24 % в 2025 году;\n- **атаки на механизмы аутентификации** — перехват и повторное использование учётных данных и сессионных признаков, позволяющее обойти в том числе многофакторную аутентификацию.\n\n## Почему средство одного уровня не останавливает угрозу другого\n\nКаждое средство анализирует только «свой» заголовок или содержимое. Межсетевой экран периметра, фильтрующий адреса и порты, не видит подмену адресов внутри сегмента (канальный уровень) и пропускает фишинговое письмо, которое приходит по разрешённому почтовому протоколу (прикладной уровень). HTTPS защищает канал от перехвата, но не защищает от уязвимостей самого приложения и ввода пароля на поддельном сайте. Поэтому защита строится эшелонированно, а угроза привязывается к уровню, чтобы выбрать адекватное средство.\n\n## Пример\n\nВедомство разместило портал приёма заявлений за межсетевым экраном, фильтрующим трафик по адресам и портам, и включило HTTPS. Злоумышленник отправил на портал запрос с SQL-инъекцией через разрешённый порт 443 и выгрузил базу заявлений. Угроза относилась к прикладному уровню, а средства защиты работали на сетевом и транспортном уровнях. Требовался межсетевой экран уровня веб-приложений (тип «Г» по классификации ФСТЭК России) и анализ защищённости кода портала.\n\n**Вывод.** Модель OSI (семь уровней, ГОСТ Р ИСО/МЭК 7498-1-99) и модель TCP/IP (четыре уровня) — карта сетевого взаимодействия, а инкапсуляция объясняет, почему глубокий разбор трафика дороже. Каждому уровню соответствуют свои угрозы и свои меры, комплексные угрозы (MITM, DDoS, APT, цепочка поставок, атаки на аутентификацию) охватывают несколько уровней. Средство одного уровня не останавливает угрозу другого — отсюда необходимость эшелонированной защиты и привязки угроз к уровням по банку данных угроз ФСТЭК России."}, {"d": "ebod", "q": 25, "title": "Межсетевые экраны и эшелонированная защита", "md": "## Назначение межсетевых экранов\n\n**Межсетевой экран (МЭ)** — программное или программно-аппаратное средство контроля и фильтрации сетевого трафика в соответствии с заданными правилами. Его назначение — разграничить сетевой доступ между сегментами разного уровня доверия: внешней сетью и сетью органа, сегментом рабочих мест и серверами, публичными сервисами и внутренними базами. Тип и класс МЭ определяются нормативно, а не по усмотрению.\n\n## Пять инженерных типов по глубине разбора трафика\n\n1) **Пакетный фильтр** — решения по адресам, портам и протоколу (уровни 3–4); состояние соединений не отслеживает, каждый пакет оценивается изолированно.\n2) **Экран с контролем состояния соединений** — ведёт таблицу активных соединений, автоматически разрешает обратный трафик установленных сеансов и отсекает пакеты, не относящиеся ни к одному соединению.\n3) **Шлюз прикладного уровня (прокси)** — полный разбор протокола прикладного уровня, терминирование соединений.\n4) **Экран нового поколения (NGFW)** — контроль состояния плюс обнаружение вторжений, распознавание приложений, инспекция шифрованного трафика.\n5) **Экран уровня веб-приложений (WAF)** — специализированная защита порталов от инъекций и иных атак на веб-приложения.\n\nЭта классификация инженерная (отраслевая) и нормативно не закреплена.\n\n## Нормативная классификация ФСТЭК России\n\nПриказом ФСТЭК России от 09.02.2016 № 9 «Об утверждении Требований к межсетевым экранам» (действует с 01.12.2016) и информационным сообщением ФСТЭК России от 28.04.2016 № 240/24/1986 установлены **пять типов** по области применения:\n\n- **тип А** — МЭ уровня сети: на физической границе (периметре) информационной системы или между её сегментами (граница ведомственной сети и сети «Интернет»);\n- **тип Б** — МЭ уровня логических границ сети (между сегментом рабочих мест и серверным сегментом);\n- **тип В** — МЭ уровня узла: на отдельном сервере или рабочей станции;\n- **тип Г** — МЭ уровня веб-сервера: перед порталом государственных услуг, защищает веб-приложения;\n- **тип Д** — МЭ уровня промышленной сети: в автоматизированных системах управления технологическими процессами.\n\n**Шесть классов защиты** — от 6-го (самого низкого) до 1-го (самого высокого). Классы 6–4 применяются в системах без государственной тайны: МЭ 4-го класса — в ГИС 1-го класса защищённости, в ИСПДн при обеспечении 1-го уровня защищённости ПДн и на значимых объектах КИИ 1-й категории; МЭ 5-го класса — в ГИС 2-го класса, при 2-м уровне защищённости ПДн и на объектах КИИ 2-й категории; МЭ 6-го класса — в ГИС 3-го класса, при 3-м и 4-м уровнях защищённости ПДн и на объектах КИИ 3-й категории. Классы 3–1 предназначены для систем, обрабатывающих государственную тайну.\n\n**Обозначение средства** складывается из типа (где МЭ стоит) и класса защиты (насколько он силён): например, «межсетевой экран типа А четвёртого класса защиты» — МЭ периметра, отвечающий требованиям 4-го класса.\n\n## Пять эшелонов защиты\n\nТаблица: Эшелонированная защита информационных систем органа власти\n{w:18,48,34}\n| Эшелон | Меры | Роль межсетевых экранов |\n|---|---|---|\n| 1. Организация | Политики и регламенты, обучение, разграничение обязанностей, ответственный за ИБ, контроль подрядчиков | Правила фильтрации утверждаются и пересматриваются как организационный документ |\n| 2. Периметр | Система обнаружения вторжений, защита от DDoS, почтовый шлюз с проверкой вложений | МЭ типа А на границе с сетью «Интернет» |\n| 3. Внутренняя сеть | Сегментация, контроль доступа к сети, защищённые каналы между территориальными органами | МЭ типа Б между сегментами |\n| 4. Узел и приложение | Средства защиты рабочих станций, контроль съёмных носителей, обновления | МЭ типа В на узлах; МЭ типа Г перед порталом |\n| 5. Данные | Разграничение доступа по ролям, шифрование, DLP, резервное копирование, регистрация обращений | МЭ ограничивают доступ к серверам баз данных только с прикладных серверов |\n\nАтакующему нужно преодолеть все эшелоны; защитнику достаточно, чтобы сработал один из них. Состав мер по эшелонам установлен приказами ФСТЭК России от 18.02.2013 № 21 и от 11.04.2025 № 117.\n\n## Почему экран периметра не защищает от угроз внутри сегмента и фишинга\n\n- **внутренние угрозы:** трафик между компьютерами одного сегмента не проходит через периметр — прослушивание, подмена адресов, распространение шифровальщика внутри сети экран периметра не видит; нужны сегментация, МЭ типа Б и В, контроль доступа к сети;\n- **фишинг:** письмо приходит по разрешённому каналу (почта, веб), и для экрана это легитимный трафик; ввод пароля на поддельном сайте — действие пользователя, а не сетевая аномалия. Против фишинга работают почтовый шлюз, обучение, многофакторная аутентификация — меры других эшелонов.\n\n## Пример\n\nРегиональное министерство социальной политики строит защиту ГИС учёта получателей мер поддержки: на границе с сетью «Интернет» — МЭ типа А 4-го класса и защита от DDoS; между сегментом специалистов и серверами — МЭ типа Б; на серверах базы данных — МЭ типа В, разрешающий подключения только от прикладного сервера; перед порталом подачи заявлений — МЭ типа Г; каналы с районными управлениями — VPN с сертифицированными СКЗИ. После фишинговой атаки на одного специалиста злоумышленник получил доступ к его компьютеру, но МЭ типа Б и В не позволили обратиться к базе данных напрямую — сработал внутренний эшелон.\n\n**Вывод.** Межсетевые экраны различаются по глубине разбора трафика (пакетный фильтр, контроль состояния, прокси, NGFW, WAF), а нормативно — по пяти типам А–Д и шести классам защиты ФСТЭК России (приказ № 9, информационное сообщение № 240/24/1986); обозначение средства — тип плюс класс. В эшелонированной защите МЭ разных типов работают на периметре, во внутренней сети, на узлах и перед веб-приложениями, но экран периметра не защищает от угроз внутри сегмента и от фишинга — эти угрозы закрывают другие эшелоны."}, {"d": "ebod", "q": 26, "title": "Криптографическая защита данных и требования регуляторов", "md": "## Задачи, которые решает криптография\n\nКриптография — единственное средство, защищающее данные там, где канал связи и носитель находятся вне контроля органа власти.\n\n- **Конфиденциальность** — шифрование данных при передаче по недоверенным каналам и при хранении на съёмных носителях и мобильных устройствах.\n- **Целостность** — криптографические хеш-функции позволяют обнаружить любое изменение документа или записи.\n- **Аутентичность и неотказуемость** — электронная подпись подтверждает авторство и неизменность документа; подписавший не может отказаться от подписи.\n- **Защищённый канал** — виртуальные частные сети (VPN): защищённые туннели между территориальными органами и для удалённого доступа сотрудников к служебным системам.\n\n**Виды электронной подписи** (ст. 5 Федерального закона от 06.04.2011 № 63-ФЗ «Об электронной подписи»):\n\n- **простая** — коды, пароли и иные средства подтверждают факт формирования подписи определённым лицом;\n- **усиленная неквалифицированная** — получена в результате криптографического преобразования с использованием ключа ЭП, позволяет определить подписавшего и обнаружить изменения документа после подписания;\n- **усиленная квалифицированная** — дополнительно ключ проверки указан в квалифицированном сертификате, выданном аккредитованным удостоверяющим центром, а средства ЭП имеют подтверждение соответствия требованиям ФСБ России. Документ с такой подписью равнозначен бумажному с собственноручной подписью (ч. 1 ст. 6).\n\n## Российские криптографические стандарты\n\n- **ГОСТ Р 34.10-2012** — процессы формирования и проверки электронной цифровой подписи;\n- **ГОСТ Р 34.11-2012** («Стрибог») — функция хеширования;\n- **ГОСТ Р 34.12-2015** — блочные шифры «Кузнечик» (блок 128 бит) и «Магма» (блок 64 бита);\n- **ГОСТ Р 34.13-2015** — режимы работы блочных шифров.\n\n## Классы СКЗИ\n\nСредства криптографической защиты информации (СКЗИ) делятся на классы **КС1, КС2, КС3, КВ, КА** (Положение ПКЗ-2005, утв. приказом ФСБ России от 09.02.2005 № 66; приказ ФСБ России от 10.07.2014 № 378, п. 10–14).\n\nТаблица: Классы СКЗИ и возможности нарушителя\n{w:12,88}\n| Класс | Против какого нарушителя рассчитано средство |\n|---|---|\n| КС1 | Атаки извне контролируемой зоны с использованием общедоступных сведений и средств, без специалистов по СКЗИ |\n| КС2 | Дополнительно — атаки изнутри контролируемой зоны без физического доступа к средствам вычислительной техники с установленным СКЗИ |\n| КС3 | Дополнительно — нарушитель имеет физический доступ к средствам вычислительной техники, на которых реализованы СКЗИ |\n| КВ | Дополнительно — привлекаются специалисты по анализу недекларированных возможностей прикладного ПО, с доступом к исходным текстам |\n| КА | Высший класс — специалисты по недекларированным возможностям системного ПО и аппаратных компонентов |\n\n**Принцип различия:** класс СКЗИ определяется не «мощностью шифра» (алгоритмы во всех классах одни и те же — ГОСТ), а **возможностями нарушителя**, которому средство должно противостоять. Чем сильнее нарушитель, тем строже требования к реализации, среде функционирования и защите от недекларированных возможностей.\n\n## Карта требований регуляторов\n\nТаблица: Карта документов, устанавливающих требования к защите\n{w:24,46,30}\n| Объект защиты | Документы | Показатель требований |\n|---|---|---|\n| Персональные данные в информационных системах | Постановление Правительства РФ от 01.11.2012 № 1119; приказ ФСТЭК России от 18.02.2013 № 21 | Уровень защищённости УЗ-1 … УЗ-4 |\n| Государственные информационные системы | Приказ ФСТЭК России от 11.04.2025 № 117 (с 01.03.2026, вместо приказа № 17) | Класс защищённости К1 … К3 |\n| Криптографическая защита ПДн | Приказ ФСБ России от 10.07.2014 № 378; ПКЗ-2005 | Класс СКЗИ КС1 … КА |\n| Объекты критической информационной инфраструктуры | Федеральный закон от 26.07.2017 № 187-ФЗ; постановление Правительства РФ от 08.02.2018 № 127; приказы ФСТЭК России | Категория значимости 1 … 3 |\n| Реагирование на компьютерные инциденты | Ст. 9 № 187-ФЗ, ч. 12 ст. 19 № 152-ФЗ; порядок взаимодействия с ГосСОПКА (НКЦКИ) | Сроки уведомления об инциденте |\n\nНад этой картой стоят указы Президента РФ: **№ 166 от 30.03.2022** — ограничения на закупку и (с 01.01.2025) использование иностранного программного обеспечения на значимых объектах КИИ; **№ 250 от 01.05.2022** — персональная ответственность руководителя за информационную безопасность, заместитель по ИБ, структурное подразделение по защите информации, запрет средств защиты из недружественных государств с 01.01.2025.\n\nЕсли к системе применимы несколько шкал, меры принимаются по наивысшей.\n\n## Пример применения криптографии в органе власти\n\nМинистерство имущественных отношений региона связывает центральный аппарат с районными отделами: каналы защищены VPN-шлюзами на сертифицированных ФСБ России СКЗИ (класс выбран по приказу № 378 исходя из уровня защищённости ИСПДн и того, что каналы проходят вне контролируемой зоны). Распоряжения о предоставлении земельных участков подписываются усиленной квалифицированной электронной подписью и передаются через СЭД — подпись по ГОСТ Р 34.10-2012 обеспечивает аутентичность и неотказуемость, хеш «Стрибог» — контроль целостности. Резервные копии реестра на отчуждаемых носителях шифруются «Кузнечиком» — утеря носителя не приводит к утечке.\n\n**Вывод.** Криптография решает задачи конфиденциальности, целостности, аутентичности и неотказуемости и обеспечивает защищённые каналы; правовую силу электронной подписи определяет № 63-ФЗ, алгоритмы — ГОСТ Р 34.10/34.11-2012 и 34.12/34.13-2015. Классы СКЗИ КС1–КА различаются возможностями нарушителя (приказ ФСБ № 378, ПКЗ-2005). Карта требований регуляторов: ПДн — постановление № 1119 и приказ ФСТЭК № 21 (УЗ), ГИС — приказ № 117 (класс), криптография — приказ ФСБ № 378, КИИ — № 187-ФЗ и постановление № 127 (категория), над ними — указы № 166 и № 250."}, {"d": "ebod", "q": 27, "title": "Кибератаки, вредоносное программное обеспечение и DDoS-атаки", "md": "## Компьютерная атака и компьютерный инцидент\n\n**Компьютерная атака** — целенаправленное воздействие программных и (или) программно-аппаратных средств на объекты критической информационной инфраструктуры, сети электросвязи, используемые для организации взаимодействия таких объектов, в целях нарушения и (или) прекращения их функционирования и (или) создания угрозы безопасности обрабатываемой такими объектами информации (п. 4 ст. 2 Федерального закона от 26.07.2017 № 187-ФЗ). Три элемента: целенаправленность (случайный сбой атакой не является), программное средство воздействия, цель нарушить работу или создать угрозу; наступление вреда не требуется.\n\n**Компьютерный инцидент** — факт нарушения и (или) прекращения функционирования объекта КИИ, сети электросвязи, используемой для организации взаимодействия таких объектов, и (или) нарушения безопасности обрабатываемой таким объектом информации, в том числе произошедший в результате компьютерной атаки (п. 5 ст. 2 № 187-ФЗ).\n\n**Разграничение:** атака — действие нарушителя, инцидент — наступивший факт нарушения. Инцидент возможен без атаки (сбой оборудования, ошибка работника), а атака может не повлечь инцидента, если сработали меры защиты. **Инцидент информационной безопасности** по ГОСТ Р 53114-2008 (п. 3.2.7) понимается шире — любое непредвиденное или нежелательное событие, которое может нарушить деятельность или информационную безопасность; событие (п. 3.2.8) — возникновение или наличие определённой совокупности обстоятельств.\n\n## Цели атак на государственный орган\n\n- **хищение данных** — персональные данные граждан, служебные сведения, учётные данные сотрудников;\n- **финансовая выгода** — вымогательство выкупа за расшифровку, хищение бюджетных средств, фиктивные счета;\n- **шпионаж** — длительное скрытое присутствие в сети для сбора сведений о деятельности органа;\n- **дестабилизация** — нарушение работы социально значимых сервисов, подрыв доверия граждан к государству.\n\nГосударственный сектор остаётся лидером по числу инцидентов среди отраслей.\n\n## Вредоносное ПО: признаки, классификация, цепочка атаки\n\n**Признаки вредоносной программы по УК РФ** (ч. 1 ст. 273): компьютерные программы либо иная компьютерная информация, заведомо предназначенные для несанкционированного уничтожения, блокирования, модификации, копирования компьютерной информации или нейтрализации средств её защиты.\n\n**Классификация по четырём основаниям:**\n\n- **по способу распространения:** вирус (внедряется в файлы, требует запуска), червь (самораспространяется по сети без участия человека), троян (маскируется под полезную программу), дроппер (доставляет основную нагрузку);\n- **по цели воздействия:** шифровальщик (шифрует данные ради выкупа), вайпер (необратимо уничтожает данные), похититель учётных данных (стилер), клавиатурный шпион, скрытый майнер, агент бот-сети;\n- **по способу закрепления:** бэкдор (скрытый канал повторного входа), средство удалённого управления (RAT), руткит (скрывает присутствие), бесфайловые программы, работающие в памяти;\n- **по применяемому инструменту:** легитимное ПО как инструмент атаки — средства удалённого доступа, системные утилиты администрирования; доля таких атак за год выросла вдвое.\n\n**Типовая цепочка атаки:** фишинговое вложение → дроппер → похититель учётных данных → средство удалённого управления → шифровальщик с предварительной выгрузкой данных.\n\n## Восемь мер защиты от вредоносного ПО\n\n1) антивирусная защита на всех рабочих станциях и серверах с автоматическим обновлением;\n2) своевременные обновления — четверть выявляемых уязвимостей старше трёх лет;\n3) ограничение запуска программ — только проверенное ПО из утверждённого перечня;\n4) отключение макросов в документах из внешних источников групповой политикой;\n5) фильтрация почты и веб-трафика, проверка вложений в изолированной среде;\n6) резервное копирование по правилу «три копии, два вида носителей, одна вне организации» с проверкой восстановления;\n7) минимальные привилегии — работа без прав администратора;\n8) сегментация сети — ограничивает распространение шифровальщика.\n\n**Роль резервной копии:** проверенная резервная копия, недоступная из основной сети, — единственная гарантированная защита от шифровальщика: она позволяет восстановить данные без выкупа. Копия, доступная из той же сети, будет зашифрована вместе с основными данными.\n\n## DDoS-атаки и доступность государственных услуг\n\n**DDoS-атака** — распределённая атака на отказ в обслуживании: одновременное обращение множества устройств для исчерпания ресурсов сервиса.\n\nТаблица: Виды DDoS-атак и меры противодействия\n{w:20,22,30,28}\n| Вид | Метрика | Механизм | Защита |\n|---|---|---|---|\n| Объёмный | Биты в секунду | Переполнение канала связи, в том числе усилением через сторонние сервисы | Фильтрация на стороне оператора связи, центры очистки трафика |\n| Протокольный (транспортный) | Пакеты в секунду | SYN-флуд исчерпывает таблицу полуоткрытых соединений сервера | Защитные механизмы TCP, ограничение числа соединений, контроль состояния |\n| Прикладной | Запросы в секунду | Лавина запросов к «дорогим» страницам портала, медленное удержание соединений | Анализ содержимого запросов, ограничение частоты, проверка клиента, экран уровня веб-приложений |\n\n**Влияние на доступность услуг:** DDoS нарушает доступность — свойство триады информационной безопасности. Недоступность портала в период подачи заявлений лишает граждан возможности реализовать право в срок (запись в школу, подача документов на выплату), увеличивает нагрузку на МФЦ и подрывает доверие к цифровым услугам. Число DDoS-атак в России в 2025 году выросло примерно в 1,8 раза (StormWall); отдельно фиксируется взрывной рост коротких зондирующих атак — разведки перед основным ударом.\n\n## Пример\n\nВ отделе кадров администрации муниципального округа специалист открыл письмо «Изменения в штатном расписании» с документом, содержащим макрос. Дроппер загрузил стилер, тот похитил пароли, через неделю злоумышленник с помощью средства удалённого управления выгрузил кадровую базу и запустил шифровальщик. Сработали бы: отключение макросов (мера 4), фильтрация вложений (5), минимальные привилегии (7) и сегментация (8); восстановление прошло за сутки только потому, что резервная копия хранилась вне основной сети (6). Утечка кадровой базы — инцидент с персональными данными (уведомление Роскомнадзора по правилу 24/72).\n\n**Вывод.** Компьютерная атака — целенаправленное программное воздействие (п. 4 ст. 2 № 187-ФЗ), компьютерный инцидент — наступивший факт нарушения (п. 5 ст. 2), а инцидент ИБ по ГОСТ Р 53114-2008 понимается шире. Цели атак на органы власти — хищение данных, выгода, шпионаж и дестабилизация. Вредоносное ПО (ст. 273 УК РФ) классифицируется по распространению, цели, закреплению и инструменту, а защищают от него восемь мер, ключевая из которых — изолированная резервная копия. DDoS-атаки — объёмные, протокольные и прикладные — бьют по доступности государственных услуг."}, {"d": "ebod", "q": 28, "title": "Социальная инженерия, OSINT-разведка и цифровой след служащего", "md": "## Понятие и виды социальной инженерии\n\n**Социальная инженерия** — манипуляция человеком для получения доступа к системам или сведениям. Она эксплуатирует не уязвимость техники, а особенности человеческого поведения, поэтому технические средства защиты против неё ограниченно эффективны.\n\n**Виды по каналу воздействия:**\n\n- **фишинг** — массовая рассылка писем с поддельных адресов в расчёте на то, что хотя бы один получатель перейдёт по ссылке;\n- **целевой фишинг** — письмо под конкретного человека с использованием собранных о нём открытых сведений;\n- **атака от имени руководителя** — поддельное или скомпрометированное письмо начальника с указанием срочно провести платёж или переслать документы;\n- **телефонное мошенничество** — звонок от «службы безопасности», «вышестоящего органа» или «сотрудника силового ведомства» с созданием паники;\n- **мессенджер-фишинг** — поддельный аккаунт руководителя с его фотографией и должностью, взятыми с сайта ведомства;\n- **приманка и предлог** — заражённый носитель, оставленный в приёмной или на парковке; заранее сконструированная легенда для получения сведений.\n\n**Офлайновые приёмы:** проход в здание «следом» за сотрудником, подглядывание за вводом пароля, выдача себя за курьера или техника, изучение выброшенных документов, подброшенный носитель.\n\n## Пять причин эффективности и главный признак мошенничества\n\n1) **Авторитет** — обращение от имени руководителя или вышестоящего органа воспринимается как не подлежащее проверке; служебная субординация играет против сотрудника.\n2) **Дефицит времени** — «до 17:00 сегодня», «срочно, иначе будет проверка» отключают критическое мышление.\n3) **Страх и паника** — угроза взыскания, уголовного дела или утраты средств вызывает эмоциональную реакцию вместо рациональной.\n4) **Требование секретности** — «никому не сообщайте», «идёт закрытая проверка».\n5) **Знакомый контекст** — ссылка на реальную закупку, документ или коллегу, собранные заранее из открытых источников.\n\n**Главный признак мошенничества — требование секретности:** законные процедуры не требуют скрывать их от коллег и непосредственного руководителя.\n\n## Цепочка целевой атаки и где её дешевле разорвать\n\n1) **Разведка по открытым источникам** — фамилии, должности, адреса почты с сайта ведомства и из закупочной документации, личные профили, проверка адресов по базам утечек.\n2) **Подготовка** — письмо со знакомым служебным контекстом, регистрация домена, похожего на официальный (замена одного символа).\n3) **Доставка** — отправка письма с адреса, имитирующего вышестоящий орган, с расчётом на срочность и авторитет.\n4) **Эксплуатация** — переход по ссылке и ввод учётных данных на поддельной странице или открытие вложения с макросом.\n5) **Закрепление** — доступ к почтовому ящику, скрытые правила пересылки, изучение переписки, расширение доступа.\n6) **Достижение цели** — рассылка фиктивных счетов контрагентам, выгрузка баз, шифрование информации.\n\n**Разорвать цепочку дешевле всего на первом и третьем этапах:** сократить цифровой след (меньше сведений для убедительной легенды) и распознать письмо (обучение, проверка домена, подтверждение по другому каналу). На поздних этапах ущерб уже наступает и его ликвидация многократно дороже.\n\n## Цифровой след государственного служащего\n\nТаблица: Слои цифрового следа и способы его сокращения\n{w:26,40,34}\n| Слой | Что собирается | Как сократить |\n|---|---|---|\n| Обязательные публикации | ФИО, должность, служебный телефон и почта, сведения о доходах, контактное лицо в закупках | Скрыть нельзя — публикуется по закону; использовать общие адреса подразделений, где допустимо |\n| Личные социальные сети | Круг общения, места отдыха, автомобиль, дети и школа, сообщения об отпуске | Закрыть профиль, не указывать место работы, не публиковать сведения об отъезде |\n| Фотографии рабочего места | Бейджи, экраны с документами, стикеры с паролями, схемы на доске, номера кабинетов | Не фотографировать рабочее место; проверять задний план |\n| Геоданные и метаданные | Координаты и время съёмки в файлах, маршруты фитнес-приложений | Отключить геотеги, скрыть маршруты |\n| Сквозные идентификаторы | Один телефон для служебных чатов и маркетплейсов, повторяющийся никнейм | Разделять служебные и личные контакты и псевдонимы |\n| Утечки третьих сторон | Базы служб доставки, медицинских центров, магазинов | Проверять собственную компрометацию, не использовать пароли повторно |\n\nКаждый элемент цифрового следа сам по себе законен и безобиден; профиль для атаки создаёт их сопоставление.\n\n## Правовые границы сбора сведений о людях\n\n- допустима работа с общедоступной информацией без обхода технических ограничений (ст. 7 Федерального закона № 149-ФЗ);\n- для обработки ПДн нужно основание по ст. 6 № 152-ФЗ, публичность сведений в социальной сети его не заменяет — распространение возможно только по ст. 10.1;\n- незаконное собирание сведений о частной жизни — ст. 137 УК РФ; тайна переписки и переговоров — ст. 138 УК РФ; частная жизнь охраняется ст. 152.2 ГК РФ;\n- обход защиты и подбор паролей — ст. 272 УК РФ; «пробив» и хранение слитых баз — ст. 272.1 УК РФ; использование собранного для обмана — мошенничество (ст. 159 УК РФ);\n- оперативно-розыскные мероприятия вправе проводить только уполномоченные органы (ст. 13 Федерального закона № 144-ФЗ).\n\n## Пример атаки и распознавание фишинга\n\nВедущему специалисту управления закупок пришло письмо с адреса zakupki@minfin-region.ru (вместо официального minfin-reg.ru) с темой «Срочная сверка по контракту № …» — номер реальной закупки, где специалист указан контактным лицом. Ссылка ведёт на копию страницы входа в почту. Признаки: домен отличается одним элементом; искусственная срочность; письма никто не ждал; ссылка ведёт на сторонний адрес. Правильные действия: не переходить, перезвонить в министерство по номеру из служебного справочника, сообщить в подразделение по защите информации — одно сообщение может остановить рассылку по всему ведомству.\n\n**Восемь признаков фишингового сообщения:** домен отличается посимвольно; искусственная срочность; требование секретности; реальный адрес ссылки не совпадает с текстом (наведите курсор, не сканируйте QR-код); опасные вложения (макросы, архивы с паролем, двойные расширения); вы не ждали письма; просьба подтвердить данные — подтвердите по другому каналу; при сомнении — сообщите.\n\n**Вывод.** Социальная инженерия — манипуляция человеком; её виды различаются каналом (письмо, телефон, мессенджер, носитель), а эффективность объясняется авторитетом, дефицитом времени, страхом, требованием секретности и знакомым контекстом; требование секретности — главный признак обмана. Убедительность целевой атаки обеспечивает разведка по открытым источникам, поэтому цепочку дешевле всего разорвать, сократив цифровой след и распознав письмо. Сбор сведений о людях ограничен ст. 7 № 149-ФЗ, ст. 6, 10.1 № 152-ФЗ и ст. 137, 138, 159, 272, 272.1 УК РФ."}, {"d": "ebod", "q": 29, "title": "Инсайдерская угроза, модель нарушителя и безопасность учётных записей", "md": "## Понятие и значение инсайдерской угрозы\n\n**Инсайдерская угроза** — угроза безопасности информации со стороны лица, имеющего легальный доступ к информационным ресурсам организации (работника, подрядчика, бывшего работника с неотозванными правами), которое умышленно или по небрежности наносит ущерб.\n\n**Особое значение для российских органов власти:** 95,6 % утечек по вине работников в России — умышленные, против 47,3 % в мире (InfoWatch, 9 месяцев 2025 года). Сведения государственных систем имеют рыночную цену: выгрузки на заказ, «пробив» по базам, продажа доступа. Поэтому одного обучения недостаточно — нужен контроль обращений к данным.\n\n**Матрица инсайдера** (намерение × уровень доступа): небрежный работник (переслал документ на личную почту, передал пароль), небрежный администратор (оставил тестовую базу открытой, не отозвал права уволенного), торговец данными (выгружает записи на заказ), саботажник или внедрённое лицо с привилегированным доступом (закладки, удаление резервных копий).\n\n## Модель нарушителя по Методике ФСТЭК России\n\nМодель нарушителя строится по **Методике оценки угроз безопасности информации** (утв. ФСТЭК России 05.02.2021) и входит в модель угроз системы.\n\n**Виды нарушителей** (п. 5.1.3): специальные службы иностранных государств; террористические, экстремистские группировки; преступные группы; отдельные физические лица (хакеры); конкурирующие организации; разработчики программных и программно-аппаратных средств; поставщики услуг; лица, привлекаемые для установки, настройки, испытаний; лица, обеспечивающие функционирование систем (администрация, охрана, уборщики); авторизованные пользователи; системные администраторы и администраторы безопасности; бывшие работники.\n\n**Категории** (п. 5.1.6, 5.1.7): **внешние** — не имеют права доступа в контролируемую зону и полномочий доступа к ресурсам, требующим авторизации; **внутренние** — имеют право доступа в контролируемую зону и (или) полномочия на автоматизированный доступ. Внутренние нарушители реализуют угрозы и преднамеренно, и непреднамеренно.\n\n**Уровни возможностей** (п. 5.1.5, приложение 8):\n\n- **Н1** — базовые: известные уязвимости, общедоступные инструменты (отдельные лица, обслуживающий персонал, пользователи, бывшие работники);\n- **Н2** — базовые повышенные: доработка инструментов, поиск неизвестных уязвимостей (преступные группы, конкуренты, поставщики услуг, наладчики, системные администраторы);\n- **Н3** — средние: покупка сведений об уязвимостях, собственные средства атаки (террористические и экстремистские группировки, разработчики средств);\n- **Н4** — высокие: уязвимости «нулевого дня», закладки при поставке (специальные службы иностранных государств).\n\n**Порядок построения:** определить виды актуальных нарушителей → отнести каждого к внешним или внутренним → оценить уровень возможностей → определить возможные цели и способы реализации угроз → связать с перечнем угроз модели угроз и выбрать соразмерные меры.\n\n## Признаки инсайдерской угрозы и средства выявления\n\n- **аномальный объём выгрузок** — массовое копирование записей без служебной необходимости, особенно перед увольнением;\n- **обращения вне обязанностей** — просмотр сведений о лицах, не относящихся к компетенции; запросы по «интересным» фамилиям;\n- **работа в нетипичное время** — ночью, в выходные, в отпуске;\n- **попытки обхода контроля** — архивы с паролем, переименование расширений, съёмка экрана телефоном, личные облачные хранилища;\n- **подключение личных устройств** для копирования служебных файлов.\n\n**Средства выявления:** регистрация событий и журналирование обращений к записям (меры РСБ приказов ФСТЭК России № 21 и № 117), системы предотвращения утечек (DLP), поведенческая аналитика (UEBA), управление привилегированным доступом (PAM), контроль съёмных носителей, правило двойного контроля для критичных операций, регулярный пересмотр прав.\n\n## Правила безопасности учётной записи\n\n1) уникальный пароль длиной не менее 12 символов для каждого сервиса;\n2) многофакторная аутентификация — приложение-аутентификатор или аппаратный ключ предпочтительнее SMS;\n3) никому не диктовать коды подтверждения — ни «банку», ни «техподдержке», ни «сотруднику ведомства»;\n4) минимальные привилегии — запрашивать только необходимый доступ;\n5) блокировка экрана при любом уходе с рабочего места;\n6) своевременный отзыв прав при переводе и увольнении — немедленно, а не в плановом порядке;\n7) контроль своей активности — проверять уведомления о входах и сообщать о чужих;\n8) разделение контуров — служебные задачи только на служебном устройстве и через служебную почту.\n\n## Риски публичных сетей Wi-Fi\n\n- **подменная точка доступа** — злоумышленник разворачивает сеть с названием, похожим на легитимное (кафе, гостиница, аэропорт), и весь трафик проходит через его оборудование;\n- **перехват и подмена трафика** — прослушивание незашифрованных соединений, подмена страниц, поддельные формы входа;\n- **незащищённый канал** — подключение к служебным системам произвольным приложением в обход штатных средств;\n- **личное устройство** — обработка служебных сведений выводит их из контролируемого контура.\n\n**Правило:** служебные информационные системы не открываются из публичных сетей без штатного защищённого канала (VPN на сертифицированных средствах), установленного органом; требования к удалённому доступу — меры управления доступом и защиты каналов по приказам ФСТЭК России № 21 и № 117.\n\n## Пример\n\nУправление социальной защиты района эксплуатирует систему учёта получателей (около 180 тыс. записей, включая доходы и сведения о здоровье). Модель нарушителя: специалисты отдела приёма и аналитики — внутренние, Н1 (риск — небрежность и «торговля» выгрузками; меры — журналирование, DLP, минимальные права); системные администраторы — внутренние, Н2 (удаление журналов, выгрузка всей базы; меры — PAM, двойной контроль, отдельный аудит действий администраторов); подрядчик сопровождения — внутренний при удалённом доступе, Н2 (компрометация его учётной записи; меры — доступ по заявке и на время работ, MFA); охрана и уборщики — внутренние без прав в системе, Н1 (физический доступ к незаблокированным компьютерам и документам; меры — политика чистого стола, блокировка экранов); преступные группы — внешние, Н2 (фишинг и покупка доступа). Уборщик и администратор относятся к разным уровням, хотя ни один не обрабатывает данные получателей: возможности администратора по обходу защиты несравнимо выше.\n\n**Вывод.** Инсайдерская угроза исходит от лиц с легальным доступом и в России преимущественно умышленна, поэтому требует контроля обращений к данным. Модель нарушителя строится по Методике ФСТЭК России 2021 года: виды (п. 5.1.3), категории внешних и внутренних (п. 5.1.6, 5.1.7) и уровни возможностей Н1–Н4 (п. 5.1.5, приложение 8). Безопасность учётной записи обеспечивают уникальные пароли, многофакторная аутентификация, минимальные привилегии и своевременный отзыв прав, а доступ к служебным системам из публичных сетей допустим только через штатный защищённый канал."}, {"d": "ebod", "q": 30, "title": "Действия при компрометации, ГосСОПКА и современные тенденции киберугроз", "md": "## Алгоритм действий служащего из шести шагов\n\n1) **Не выключайте компьютер — отключите его от сети** (кабель или Wi-Fi).\n2) **Сообщите немедленно** ответственному за информационную безопасность и непосредственному руководителю; зафиксируйте точное время обнаружения — от него исчисляются нормативные сроки.\n3) **Смените пароли с чистого устройства** — сначала служебной учётной записи и почты, затем всех сервисов с тем же или похожим паролем; завершите все активные сессии.\n4) **Сохраните доказательства** — скриншоты, полные заголовки писем, время, адреса и ссылки; ничего не удаляйте.\n5) **Предупредите коллег и контрагентов** — с вашей учётной записи могли уходить письма от вашего имени.\n6) **Обеспечьте уведомления** — при утечке ПДн, нарушившей права субъектов, Роскомнадзор: 24 часа — об инциденте, 72 часа — о результатах расследования; при компьютерном инциденте — НКЦКИ.\n\n**Почему компьютер отключают от сети, но не выключают.** Отключение от сети прекращает вывод данных и распространение вредоносной программы по сети органа. Выключение питания уничтожает содержимое оперативной памяти — запущенные процессы, сетевые соединения, ключи шифрования, бесфайловые вредоносные программы, работающие только в памяти. Эти сведения критичны для расследования и восстановления, а некоторые вредоносные программы при перезагрузке запускают разрушительные действия.\n\n## Основания и сроки уведомлений\n\nТаблица: Уведомления Роскомнадзора и НКЦКИ\n{w:22,40,38}\n| Адресат | Основание и сроки | Назначение |\n|---|---|---|\n| Роскомнадзор | Неправомерная или случайная передача ПДн, повлёкшая нарушение прав субъектов: 24 часа — уведомление о факте; 72 часа — о результатах расследования (ч. 3.1 ст. 21 № 152-ФЗ) | Защита прав субъектов ПДн, учёт инцидентов |\n| НКЦКИ (ГосСОПКА) | Для операторов ПДн — информирование о компьютерных инцидентах, повлёкших неправомерную передачу ПДн (ч. 12 ст. 19 № 152-ФЗ; порядок — приказ ФСБ России от 13.02.2023 № 77, в течение 24 часов); для субъектов КИИ — информирование о компьютерных инцидентах (ст. 9 № 187-ФЗ) в сроки, установленные ФСБ России (для значимых объектов — в течение 3 часов, для иных объектов КИИ — 24 часов) | Реагирование на компьютерные атаки, предупреждение атак на другие ресурсы |\n\n**Почему это самостоятельные обязанности:** у них разные цели (права граждан и реагирование на атаки), адресаты, правовые основания и содержание; уведомление одного органа не освобождает от уведомления другого, а нарушение каждой обязанности образует отдельный состав нарушения.\n\n## КИИ: основные понятия\n\nПо ст. 2 Федерального закона от 26.07.2017 № 187-ФЗ «О безопасности критической информационной инфраструктуры Российской Федерации» (в ред. Федерального закона от 07.04.2025 № 58-ФЗ):\n\n- **критическая информационная инфраструктура** — объекты КИИ, а также сети электросвязи, используемые для организации их взаимодействия (п. 6);\n- **объекты КИИ** — информационные системы, информационно-телекоммуникационные сети и автоматизированные системы управления субъектов КИИ (п. 7);\n- **субъекты КИИ** — государственные органы, государственные учреждения, российские юридические лица, которым на праве собственности, аренды или ином законном основании принадлежат такие системы в сферах здравоохранения, науки, транспорта, связи, энергетики, государственной регистрации прав на недвижимость, банковской сфере и иных сферах финансового рынка, топливно-энергетического комплекса, атомной энергии, оборонной, ракетно-космической, горнодобывающей, металлургической и химической промышленности, а также юридические лица, обеспечивающие их взаимодействие (п. 8); индивидуальные предприниматели исключены из числа субъектов КИИ с 01.09.2025;\n- **значимый объект КИИ** — объект, которому присвоена одна из категорий значимости и который включён в реестр значимых объектов КИИ (п. 3).\n\n## ГосСОПКА: назначение, функции, принципы, центры\n\n**ГосСОПКА** — государственная система обнаружения, предупреждения и ликвидации последствий компьютерных атак на информационные ресурсы Российской Федерации: единый территориально распределённый комплекс сил и средств обнаружения, предупреждения и ликвидации последствий компьютерных атак и реагирования на компьютерные инциденты (ч. 1 ст. 5 № 187-ФЗ). Создана Указом Президента РФ от 15.01.2013 № 31с; Концепция утверждена Президентом РФ 12.12.2014 № К 1274. Координацию осуществляет **Национальный координационный центр по компьютерным инцидентам (НКЦКИ)**, созданный ФСБ России.\n\n- **Назначение:** обмен сведениями об атаках и инцидентах, чтобы атака, выявленная в одном ведомстве, была предотвращена в остальных.\n- **Функции:** выявление признаков атак и их источников; прогнозирование обстановки; обмен сведениями об инцидентах; выявление уязвимостей; оперативное реагирование и ликвидация последствий; рассылка бюллетеней и индикаторов компрометации; методическая помощь в восстановлении.\n- **Принципы:** территориальная распределённость; отраслевая и территориальная организация; единство планирования и контроля; единая научно-техническая и организационно-методическая политика; достаточность сил и средств; разделение полномочий.\n- **Структура:** субъекты системы (уполномоченные органы, владельцы информационных ресурсов, операторы связи, лицензиаты в области защиты информации); силы и средства (подразделения, сотрудники, технические, программные, правовые и организационные средства, ситуационные центры); **центры ГосСОПКА**, организуемые по ведомственному и территориальному принципам, — основная организационно-техническая составляющая системы.\n\n## Современные тенденции киберугроз для органов власти\n\n- **рост числа атак:** количество обнаруженных и предотвращённых инцидентов в российских организациях в I квартале 2026 года выросло на 68 % к тому же периоду 2025 года («Лаборатория Касперского»);\n- **атаки через подрядчиков:** доля атак через подрядные организации выросла с 6 % до 24 % (Solar 4RAYS, 2025);\n- **доминирование умышленных утечек:** 95,6 % утечек по вине работников в России — умышленные (InfoWatch);\n- **DDoS и зондирование:** рост числа DDoS-атак примерно в 1,8 раза и взрывной рост коротких зондирующих атак (StormWall, 2025);\n- **легитимные инструменты и бесфайловые атаки**, использование искусственного интеллекта для персонализированного фишинга и подделки голоса;\n- **снижение прозрачности:** доля инцидентов 2025 года, где тип утёкших данных неизвестен, выросла до 30 % против 6,6 % годом ранее; после введения оборотных штрафов организации реже раскрывают детали. Зарегистрированных утечек стало меньше, а атак — больше: это не улучшение, а снижение прозрачности.\n\n**Почему данные разных источников о числе утечек нельзя сравнивать напрямую.** Они считают разное: регулятор — подтверждённые уведомления операторов; аналитические центры — публично зарегистрированные инциденты; исследователи — суммарный объём записей во всех объявленных дампах с дублированием. Различие методик даёт расхождение на порядки.\n\n## Пример\n\nСпециалист комитета по образованию заметил, что из его почты ушли письма родителям со ссылкой «на оплату питания», которых он не отправлял. Он отключил компьютер от сети, не выключая его, сообщил администратору безопасности, зафиксировав время 10:40, сменил пароль с другого, заведомо чистого служебного компьютера и завершил все сессии, сохранил заголовки писем и предупредил коллег. Расследование показало, что пароль был похищен через фишинговую страницу и использовался для чтения переписки с персональными данными учащихся. Комитет до 10:40 следующего дня уведомил Роскомнадзор, проинформировал НКЦКИ через установленный канал и в течение 72 часов направил результаты расследования.\n\n**Вывод.** При компрометации служащий действует по алгоритму из шести шагов: отключить от сети, но не выключать, сообщить, сменить пароли, сохранить доказательства, предупредить, обеспечить уведомления. Уведомления Роскомнадзора (ч. 3.1 ст. 21 № 152-ФЗ, правило 24/72) и НКЦКИ (ч. 12 ст. 19 № 152-ФЗ, ст. 9 № 187-ФЗ) — самостоятельные обязанности. ГосСОПКА (ст. 5 № 187-ФЗ, Указ № 31с, Концепция № К 1274) обеспечивает обмен сведениями об атаках, а современные тенденции — рост атак, подрядчики, умышленные утечки и снижение прозрачности — требуют осторожности при сравнении статистики разных источников."}, {"d": "avd", "q": 1, "title": "Жизненный цикл данных в аналитических системах и подготовка данных", "md": "## Этапы жизненного цикла данных\n\nЖизненный цикл данных в аналитической системе — последовательность стадий, через которые проходят сведения от момента появления до архивации или удаления. Цель цикла в государственном управлении — перейти по пирамиде DIKW от «сырых» фактов (Data) через информацию (Information) и знание (Knowledge) к обоснованному управленческому решению (Wisdom), то есть реализовать принцип Data-Driven Management.\n\n1) **Сбор и генерация.** Источники — государственные информационные системы (ГИС) и ведомственные реестры, обращения граждан, датчики и камеры, официальная статистика. На этом этапе фиксируются первичные факты: каждая транзакция на Госуслугах, каждая выплата, каждый вызов скорой помощи.\n2) **Хранение.** Данные размещаются в транзакционных базах ведомств, затем интегрируются в хранилище данных (DWH). Главная проблема этапа — «болота данных» (Data Silos): изоляция сведений в отдельных подразделениях и ведомствах.\n3) **Обработка и очистка (ETL).** Извлечение (Extract), преобразование (Transform) и загрузка (Load): приведение к единым форматам и справочникам, дедупликация, исправление ошибок, контроль аномалий.\n4) **Анализ и визуализация.** Расчёт показателей, построение витрин, дашбордов и моделей, интерпретация результатов для лица, принимающего решения (ЛПР).\n5) **Архивация и удаление.** Перенос в архив по срокам хранения, уничтожение по достижении цели обработки, защита персональных данных (ПДн) и обеспечение безопасности.\n\n## Ошибки, которые мешают использовать данные в DWH и BI-системе\n\nОшибки группируются по трём группам (реестр типичных проблем данных курса).\n\nТаблица: Типичные проблемы данных и их последствия для DWH и BI\n{w:24,38,38}\n| Группа | Ошибка | Последствие в DWH/BI |\n|---|---|---|\n| А. Нарушения структуры | Объединённые ячейки, несколько значений в ячейке («Иванов / Петров»), смысл через цвет заливки, строки «Итого» внутри массива | Машина читает значение только первой ячейки; «Итого» удваивает суммы; цвет теряется при загрузке |\n| Б. Технические дефекты | Пропуски (NaN), дубликаты, конфликт форматов (01.02.2023 и 2023-02-01; «ООО Ромашка» и «Ромашка, ООО»), текст в числовом поле («нет данных») | Завышение показателей, ошибки типов при загрузке, невозможность агрегации и связи по ключу |\n| В. Логические ошибки | Коды без справочника («Объект тип А-4»), противоречия (закрытие обращения раньше подачи), нарушенные связи (Москва — Приволжский ФО) | Неверная группировка, искажённые сроки, невозможность «сшить» данные разных ведомств |\n\nОтдельно выделяются аномальные значения (выбросы) и дубликаты ключей в справочниках: если в таблице измерения на стороне «один» оказались два одинаковых ключа (например, «Департамент ЖКХ» с лишним пробелом), BI-система размножает строки таблицы фактов, и итоговые суммы бюджета завышаются.\n\n## Почему подготовка занимает до 80 % времени проекта\n\nПравило 80/20 означает: аналитик тратит около 80 % времени на поиск, очистку и преобразование данных и лишь 20 % — на анализ и выводы. Порядок цифр подтверждают отраслевые опросы: по данным CrowdFlower (2016), около 60 % времени специалистов по данным уходит на очистку и упорядочивание данных и ещё около 19 % — на их сбор.\n\nПричины такой трудоёмкости:\n\n- **лоскутная автоматизация:** каждое ведомство исторически создавало свою систему с собственными форматами и справочниками;\n- **ручной ввод и «человеческий фактор»:** опечатки, лишние нули, перепутанные поля;\n- **отсутствие единой нормативно-справочной информации (НСИ):** без общих классификаторов (ОКТМО, КБК, ФИАС) записи разных систем нельзя сопоставить;\n- **принцип GIGO (Garbage In — Garbage Out):** ошибка на входе тиражируется во всех отчётах, поэтому этап очистки нельзя сократить без потери достоверности;\n- **итеративность:** каждая новая выгрузка приносит новые дефекты, процедуры очистки приходится уточнять и автоматизировать.\n\n**Пример.** При подготовке дашборда «Социальные выплаты» региона выгрузки из трёх муниципальных систем содержат разные написания районов, даты в разных форматах и строки «Итого по району». Без очистки сумма выплат по региону получится завышенной из-за промежуточных итогов, а сравнение районов — невозможным из-за расхождений в названиях.\n\n**Вывод.** Жизненный цикл данных включает пять этапов, и качество результата на этапе анализа определяется этапом подготовки. Поэтому основные усилия аналитика смещаются на ETL: чем раньше в цикле устранена ошибка, тем дешевле её исправление и тем надёжнее управленческое решение."}, {"d": "avd", "q": 2, "title": "Концепция Tidy Data и три правила «чистой» таблицы", "md": "## Понятие Tidy Data\n\nTidy Data («чистые», «аккуратные» данные) — стандарт структуры табличных данных, предложенный Хэдли Уикхемом (статья «Tidy Data», Journal of Statistical Software, 2014). Концепция описывает, как расположить данные, чтобы их можно было обрабатывать алгоритмами и формулами без ручной перестройки. Если структура нарушена, компьютер не сможет корректно применить формулы, сводные таблицы и алгоритмы машинного обучения.\n\n## Три правила «чистой» таблицы\n\n1) **Одна переменная — один столбец.** Каждая характеристика (дата, сумма, район, категория льготника) имеет свой столбец; тип данных в столбце не меняется.\n2) **Одно наблюдение — одна строка.** Каждое событие или объект (одна жалоба, одна закупка, одна выплата) занимает ровно одну строку.\n3) **Одно значение — одна ячейка.** На пересечении строки и столбца находится одно атомарное значение: без списков, комментариев и нескольких сущностей внутри.\n\nВ исходной статье Уикхема третье правило сформулировано на уровне таблиц: каждый тип объектов наблюдения образует отдельную таблицу. Например, сведения о получателях и сведения о выплатах хранятся в разных таблицах и связываются ключом. Формулировка «одно значение — одна ячейка» закреплена в учебнике Уикхема «R for Data Science» и используется в курсе.\n\n## Пример нарушения правила «одна переменная — один столбец»\n\nТипичный отчёт органа власти — «широкая» таблица, где годы вынесены в заголовки столбцов. Здесь одна переменная «Год» размазана по трём столбцам, а значения переменной «Число обращений» оказались в разных колонках.\n\nТаблица: «Широкая» таблица, нарушающая правило\n{w:40,20,20,20}\n| Район | 2023 | 2024 | 2025 |\n|---|---|---|---|\n| Кировский | 1 240 | 1 315 | 1 402 |\n| Заволжский | 980 | 1 012 | 1 105 |\n\nПриведённая к Tidy Data «длинная» таблица содержит три переменные — три столбца.\n\nТаблица: «Длинная» таблица в формате Tidy Data\n{w:40,25,35}\n| Район | Год | Число обращений |\n|---|---|---|\n| Кировский | 2023 | 1 240 |\n| Кировский | 2024 | 1 315 |\n| Заволжский | 2023 | 980 |\n\nДругой вариант нарушения — два признака в одном столбце: «Пол_Возраст» со значениями «М_35–44», или столбец «Адрес», где вместе записаны город, улица и район. Такие столбцы нужно разделять до загрузки в BI-систему.\n\n## Почему это важно\n\n- **Универсальность алгоритмов:** один шаблон обработки и визуализации подходит для всех таблиц одного стандарта; решение масштабируется на новые файлы.\n- **Масштабируемость:** новые периоды добавляются строками, логика формул не меняется. В «широкой» таблице каждый новый год требует нового столбца и правки всех формул.\n- **Совместимость:** формат поддерживают Power BI, Yandex DataLens, Excel (сводные таблицы) и Python (pandas).\n- **Прозрачность:** исключается двусмысленность при расчёте KPI.\n\nУикхем перечисляет пять типичных дефектов «грязных» наборов: заголовки столбцов — значения, а не имена переменных; несколько переменных в одном столбце; переменные одновременно в строках и столбцах; несколько типов объектов в одной таблице; один объект разнесён по нескольким таблицам.\n\n**Вывод.** Tidy Data — не эстетика, а условие автоматизации: таблица «одна переменная — столбец, одно наблюдение — строка, одно значение — ячейка» позволяет сразу строить сводные, связи и дашборды. Для органа власти переход к такому формату отчётности сокращает время подготовки аналитики и снижает число ошибок при сведении данных муниципалитетов."}, {"d": "avd", "q": 3, "title": "Типы показателей ГМУ по смыслу", "md": "## Логическая модель показателей\n\nПоказатели государственного и муниципального управления (ГМУ) классифицируются по месту в цепочке «ресурсы — действия — результат — эффект». Эта логическая модель (logic model) позволяет отделить затраты от достигнутых изменений и не путать «освоение бюджета» с решением проблемы.\n\nТаблица: Типология показателей ГМУ по смыслу\n{w:22,38,40}\n| Тип показателя | Что измеряет | Примеры |\n|---|---|---|\n| Ресурсные (Inputs) | Затраченные ресурсы: бюджет, штат, техника, время | Объём финансирования программы, число инспекторов ГЖИ, количество машин скорой помощи |\n| Процессные (Activities) | Объём выполненных работ и операций | Число проведённых проверок, количество оказанных услуг, число принятых заявлений в МФЦ |\n| Непосредственный результат (Outputs) | Прямой продукт деятельности органа | Километры отремонтированных дорог, число выданных лицензий, количество построенных школ |\n| Социальный эффект (Outcomes) | Социально значимые изменения в жизни граждан | Снижение смертности в ДТП, рост удовлетворённости граждан, снижение уровня бедности |\n\n## Характеристика типов\n\n**Ресурсные показатели** отвечают на вопрос «что вложено». Они легко измеряются и контролируются, но сами по себе не говорят об эффективности: рост расходов не означает рост качества.\n\n**Процессные показатели** отвечают на вопрос «что сделано». Они характеризуют загрузку и интенсивность работы органа. Риск — подмена цели процессом: можно увеличить число проверок, не снизив число нарушений.\n\n**Показатели непосредственного результата** отвечают на вопрос «что произведено». В бюджетной практике это результаты федеральных и региональных проектов: построенные объекты, оказанные услуги, выданные документы.\n\n**Показатели социального эффекта** отвечают на вопрос «что изменилось для граждан». Именно они отражают цели государственной политики. На этом уровне сформулированы национальные цели развития (Указ Президента Российской Федерации от 07.05.2024 № 309): например, увеличение ожидаемой продолжительности жизни до 78 лет к 2030 году. Показатели эффекта заложены и в оценку эффективности высших должностных лиц субъектов (Указ Президента Российской Федерации от 28.11.2024 № 1014): суммарный коэффициент рождаемости, доверие к власти, качество среды для жизни.\n\n## Сквозной пример: дорожная безопасность\n\n- ресурсный: 500 млн руб. на ремонт дорог и установку камер;\n- процессный: 120 проведённых обследований аварийных участков;\n- непосредственный результат: 85 км дорог приведены в нормативное состояние, установлено 40 камер;\n- социальный эффект: снижение числа погибших в ДТП на 100 тыс. населения.\n\n## Другие классификации, используемые в аналитике\n\nПо формату показатели делятся на количественные (сумма контракта, число жителей — допускают математические методы) и качественные (категория льготника, текст жалобы — используются для сегментации и фильтрации). По степени обработки — на первичные (каждый чек, каждая выплата) и агрегированные (итоги по месяцу, среднее по ведомству). Агрегаты удобны для отчётов, но могут сглаживать аномалии и выбросы.\n\n## Как использовать типологию\n\nЭффект наступает с лагом и зависит от внешних факторов, поэтому для оценки решения нужны показатели всех уровней. Если ресурсы и процессы растут, а эффект нет, — проблема в логике программы. Если эффект изменился без изменения ресурсов, вероятно, сработал внешний фактор. На дашборде руководителя главный KPI — показатель эффекта, а ресурсные и процессные показатели служат детализацией для поиска причин.\n\n**Вывод.** Четыре типа показателей образуют цепочку «вложили — сделали — произвели — изменили». Управление на основе данных требует измерять всю цепочку, но оценивать эффективность прежде всего по показателям социального эффекта, а не по объёму затрат и операций."}, {"d": "avd", "q": 4, "title": "Хранилище данных (DWH) и витрина данных (Data Mart)", "md": "## Определения\n\n**Хранилище данных (Data Warehouse, DWH)** — предметно-ориентированная, интегрированная, вариантная по времени и неразрушаемая совокупность данных для поддержки принятия управленческих решений. Определение восходит к Биллу Инмону («Building the Data Warehouse», 1992). Четыре свойства раскрываются так:\n\n- **предметная ориентация:** данные организованы вокруг предметов анализа (граждане, выплаты, объекты), а не вокруг приложений;\n- **интеграция:** сведения из разных систем приведены к единым форматам, справочникам и единицам измерения;\n- **вариантность по времени:** хранится история изменений, каждая запись привязана к периоду;\n- **неразрушаемость (non-volatile):** данные загружаются и читаются, но не изменяются и не удаляются оперативными транзакциями.\n\n**Витрина данных (Data Mart)** — облегчённая тематическая часть хранилища для конкретной группы пользователей, подразделения или направления деятельности: «ЖКХ», «Финансы», «Здравоохранение». Витрина министра содержит агрегированные KPI и динамику региона, витрина инспектора — детальные записи.\n\n## Отличия DWH и витрины\n\nТаблица: Сравнение хранилища и витрины данных\n{w:26,37,37}\n| Признак | Хранилище (DWH) | Витрина (Data Mart) |\n|---|---|---|\n| Охват | Вся организация (регион), все предметные области | Одна предметная область или группа пользователей |\n| Источники | Множество систем: ГИС, реестры, ERP, Excel | Чаще всего само хранилище (зависимая витрина) |\n| Детализация | Детальные данные и полная история | Агрегаты и отобранные показатели под задачу |\n| Объём и сроки создания | Большой, создаётся годами | Небольшой, создаётся за недели |\n| Пользователи | Аналитики, разработчики витрин | Руководители и специалисты конкретного направления |\n\n## Архитектурное отличие\n\nВ типовой архитектуре данные проходят путь: источники (ГИС, реестры) → промежуточная зона (Staging Area), где выполняется очистка и трансформация → ядро хранилища с интегрированной историей → витрины → BI-инструменты. Хранилище — это интеграционный слой «единого источника истины» (Single Source of Truth), витрина — слой представления, оптимизированный под конкретные запросы, обычно по схеме «звезда».\n\nРазличают два подхода. По Инмону сначала строится нормализованное корпоративное хранилище, из которого «нарезаются» зависимые витрины. По Ральфу Кимбаллу хранилище собирается из согласованных витрин с общими (conformed) измерениями. Независимые витрины, создаваемые напрямую из источников, быстро превращаются в новые «болота данных».\n\n## Почему не строить отчёты напрямую из OLTP\n\nТранзакционные базы (OLTP — On-Line Transaction Processing) ГИС предназначены для быстрой записи отдельных операций: регистрации обращения, проведения платежа. Аналитические запросы к ним нежелательны по ряду причин:\n\n- **нагрузка:** тяжёлый агрегирующий запрос по миллионам строк замедляет или блокирует работу системы, в которой граждане подают заявления;\n- **нормализованная структура:** данные разбиты на десятки таблиц, отчёт требует множества соединений (JOIN) и выполняется медленно;\n- **отсутствие истории:** OLTP хранит текущее состояние, а старые значения перезаписываются;\n- **отсутствие интеграции:** каждая система видит только свои данные, сквозная аналитика по региону невозможна;\n- **разные версии правды:** отчёты из разных источников дают несовпадающие цифры;\n- **безопасность:** аналитикам пришлось бы выдавать доступ к рабочим базам с персональными данными.\n\n**Пример.** Отчёт «Динамика обращений в сфере ЖКХ за пять лет» по базе портала обращений требует исторических данных, справочника районов и сведений ГЖИ. В DWH эти данные уже интегрированы, а витрина «ЖКХ» содержит готовые агрегаты по месяцам и районам: дашборд открывается за секунды и не мешает приёму новых обращений.\n\n**Вывод.** DWH — интегрированное историческое хранилище уровня организации, витрина — его тематическая проекция для конкретных пользователей. Разделение транзакционного и аналитического контуров защищает работу ГИС, обеспечивает единую версию данных и скорость аналитики."}, {"d": "avd", "q": 5, "title": "ETL и ELT: процессы интеграции данных", "md": "## Что означает ETL\n\nETL (Extract, Transform, Load — «извлечение, преобразование, загрузка») — процесс наполнения хранилища данных из разрозненных источников.\n\n1) **Extract (извлечение)** — получение данных из ГИС, реестров, ERP- и CRM-систем, файлов Excel, API. Извлечение бывает полным или инкрементальным (только новые и изменённые записи).\n2) **Transform (преобразование)** — приведение к единому формату и справочникам, очистка от ошибок и дублей, проверка ссылочной целостности, расчёт производных полей, агрегация. Выполняется в промежуточной зоне (Staging Area) на отдельном ETL-сервере.\n3) **Load (загрузка)** — перемещение подготовленных данных в целевое хранилище или витрину; полная перезагрузка или добавление изменений.\n\nETL описывает не только техническое перемещение, но и управление качеством: на этапе Transform реализуются правила, которые превращают «сырые» данные в достоверные. ETL-процессы занимают значительную часть времени аналитического проекта (правило 80/20).\n\n## ELT и его отличия\n\nELT (Extract, Load, Transform) меняет порядок: данные сначала загружаются в целевую систему в «сыром» виде, а преобразуются уже внутри неё средствами SQL мощного аналитического движка (колоночные СУБД ClickHouse, Greenplum, облачные хранилища, озёра данных).\n\nТаблица: Сравнение ETL и ELT\n{w:26,37,37}\n| Признак | ETL | ELT |\n|---|---|---|\n| Порядок этапов | Извлечь → преобразовать → загрузить | Извлечь → загрузить → преобразовать |\n| Место преобразования | Отдельный ETL-сервер, промежуточная зона | Целевое хранилище или озеро данных |\n| Что хранится | Только очищенные данные | Сырые и преобразованные данные |\n| Схема | Задаётся до загрузки (schema-on-write) | Может задаваться при чтении (schema-on-read) |\n| Скорость появления данных | Ниже: ждём завершения трансформации | Выше: данные доступны сразу после загрузки |\n| Требования к целевой системе | Умеренные | Высокая вычислительная мощность, масштабируемость |\n| Защита чувствительных данных | Можно обезличить до загрузки | Сырые ПДн попадают в хранилище, нужны меры защиты внутри |\n\n## Когда ELT предпочтительнее при больших объёмах\n\n- **большие и быстро растущие объёмы:** терабайты логов, телеметрии, данных датчиков — отдельный ETL-сервер становится «бутылочным горлышком», а массивно-параллельное хранилище обрабатывает данные быстрее;\n- **разнообразные и полуструктурированные данные** (JSON, логи, тексты), для которых схема заранее неизвестна;\n- **потребность в сырых данных** для повторной обработки, машинного обучения и новых вопросов: при ETL отброшенные детали уже не восстановить;\n- **гибкость:** правила трансформации меняются без перезагрузки источников — достаточно переписать SQL-модель;\n- **облачная инфраструктура** с эластичным масштабированием вычислений.\n\nETL остаётся предпочтительным, когда объёмы умеренные, правила трансформации стабильны, целевая система маломощная, а требования к качеству и защите данных строгие: например, когда персональные данные нужно обезличить до попадания в аналитический контур.\n\n**Пример.** Региональный центр управления (ЦУР) собирает сообщения граждан из социальных сетей, портала обратной связи и телеметрию городских датчиков — миллионы записей в сутки. Рациональна схема ELT: сырые данные загружаются в ClickHouse, а классификация тем, геопривязка и агрегаты рассчитываются SQL-моделями внутри хранилища. Для ежемесячной отчётности по социальным выплатам с небольшим объёмом и строгими требованиями к ПДн уместен классический ETL с обезличиванием на этапе Transform.\n\n**Вывод.** ETL и ELT решают одну задачу — интеграцию данных, но различаются местом и моментом преобразования. ELT выигрывает при больших объёмах, разнородных данных и мощной целевой платформе; ETL — при умеренных объёмах и высоких требованиях к очистке и защите данных до загрузки."}, {"d": "avd", "q": 6, "title": "Преимущества SQL перед Excel при обработке больших массивов данных", "md": "## Исходные различия инструментов\n\nExcel — табличный процессор: данные, формулы и оформление хранятся вместе в ячейках файла, обработка идёт на компьютере пользователя. SQL (Structured Query Language) — декларативный язык запросов к реляционной базе данных: данные хранятся в связанных таблицах на сервере СУБД (PostgreSQL, ClickHouse, Microsoft SQL Server), а пользователь описывает, какой результат нужен, — способ выполнения выбирает оптимизатор СУБД. Базы данных в ГИС, как правило, реляционные, поэтому SQL — основной язык доступа к государственным данным.\n\n## Реляционная целостность\n\nРеляционная модель хранит данные в отношениях (таблицах), где строка — кортеж (одна выплата, одно обращение), столбец — атрибут, а допустимые значения задаёт домен. Целостность обеспечивается ограничениями на уровне СУБД:\n\n- **первичный ключ (PK)** гарантирует уникальность записи (СНИЛС получателя, ID выплаты) — дубликат просто не будет записан;\n- **внешний ключ (FK)** не позволяет сослаться на несуществующую строку справочника (выплата с кодом района, которого нет в справочнике районов);\n- ограничения **NOT NULL, UNIQUE, CHECK** запрещают пустые значения в обязательных полях и значения вне допустимого диапазона (возраст от 0 до 120);\n- **транзакции ACID** гарантируют, что операция либо выполнена целиком, либо не выполнена вовсе, даже при одновременной работе многих пользователей.\n\nВ Excel таких механизмов нет: любой пользователь может удалить строку, вписать текст вместо кода, создать дубль. Связь таблиц через ВПР хрупкая — она ломается при сдвиге столбцов.\n\n## Типизация данных\n\nВ базе данных каждый столбец имеет строгий тип: INTEGER, NUMERIC(15,2) для денежных сумм, DATE, VARCHAR. Значение неверного типа отклоняется при загрузке. В Excel тип определяется каждой ячейкой отдельно: дата может оказаться текстом, сумма — строкой «нет данных», номер с ведущими нулями (код ОКТМО, ИНН) превращается в число и теряет нули. Такие ошибки незаметны визуально, но искажают агрегаты и блокируют связи между таблицами.\n\n## Автоматизация и воспроизводимость\n\n- запрос SQL — это текст, который хранится, проверяется, документируется и выполняется повторно на новых данных с тем же результатом;\n- запросы встраиваются в ETL-процессы и выполняются по расписанию, а представления (VIEW) и витрины обновляются автоматически;\n- изменения логики фиксируются в системе контроля версий, что обеспечивает аудит расчёта показателя;\n- в Excel обработка часто состоит из ручных действий (фильтр, копирование, вставка), которые нельзя воспроизвести и проверить, а макросы зависят от структуры конкретного файла.\n\n## Нагрузка на оперативную память и масштаб\n\nExcel загружает книгу целиком в память компьютера пользователя; лист ограничен 1 048 576 строками и 16 384 столбцами. Уже на сотнях тысяч строк с формулами пересчёт замедляется, а файлы в сотни мегабайт открываются с ошибками. СУБД обрабатывает данные на сервере, читает с диска только нужные блоки благодаря индексам и секционированию, а колон
