а значениями специальных атрибутов — ключей.\n\n**Первичный ключ (Primary Key, PK)** — атрибут или набор атрибутов, однозначно идентифицирующий каждую строку таблицы. Требования: уникальность (нет двух строк с одинаковым PK), обязательность (NOT NULL), стабильность (значение не меняется со временем). Примеры: ID выплаты, код района, СНИЛС гражданина. На практике часто используют суррогатный ключ — искусственный целочисленный идентификатор, не несущий смысла, — а естественные идентификаторы (СНИЛС, ИНН, ОКТМО) хранят как обычные атрибуты с ограничением уникальности.\n\n**Внешний ключ (Foreign Key, FK)** — атрибут таблицы, значения которого ссылаются на первичный ключ другой таблицы и создают связь между ними. Ограничение FK обеспечивает **ссылочную целостность**: СУБД не позволит записать выплату с кодом района, которого нет в справочнике, и не даст удалить район, на который ссылаются выплаты (или удалит их каскадно, если так настроено).\n\n## Назначение ключей\n\n- **идентификация:** PK позволяет найти, изменить и удалить конкретную запись без двусмысленности;\n- **связывание:** пара FK → PK реализует связь «один ко многим»: одному району соответствует множество выплат;\n- **целостность:** база не допускает «висячих» ссылок, дубликатов и несогласованных значений;\n- **нормализация:** описательные атрибуты (название района, ОКТМО) хранятся один раз в справочнике, а в таблице фактов — только короткий ключ; изменение названия делается в одном месте.\n\n## Пример: таблица фактов и справочник в BI-системе\n\nВ модели «Социальные выплаты» таблица фактов содержит события выплат, а справочник — районы.\n\n![Связь таблицы фактов и справочника через первичный и внешний ключи](img/avd27_keys.webp){560}\n\nТаблица: Структура таблиц модели «Социальные выплаты»\n{w:30,20,50}\n| Таблица и поле | Ключ | Назначение |\n|---|---|---|\n| Районы.ID_района | PK | Уникальный код района в справочнике |\n| Районы.Название, Районы.ОКТМО | — | Атрибуты для фильтрации и подписей |\n| Выплаты.ID_выплаты | PK | Уникальный номер выплаты |\n| Выплаты.ID_района | FK → Районы.ID_района | Связь выплаты с районом |\n| Выплаты.ID_категории | FK → Категории.ID_категории | Связь с категорией льготника |\n| Выплаты.Дата, Выплаты.Сумма | — | Время события и мера для агрегации |\n\nВ BI-системе (Power BI, DataLens) создаётся связь «один ко многим» от справочника (сторона «1», уникальные ID) к таблице фактов (сторона «N», повторяющиеся ID). Фильтр распространяется однонаправленно — от справочника к фактам: пользователь выбирает «Кировский район» в срезе, и в таблице фактов остаются только выплаты с ID_района этого района. В SQL та же связь реализуется соединением: SELECT r.Название, SUM(p.Сумма) FROM Выплаты p JOIN Районы r ON p.ID_района = r.ID_района GROUP BY r.Название.\n\n## Типичные ошибки\n\n- **дубликаты на стороне «один»:** если в справочнике окажутся «Департамент ЖКХ» и «Департамент ЖКХ » с пробелом под разными ключами или один ключ повторится, связь размножит строки фактов, и суммы будут завышены — поэтому дедупликация справочников обязательна до построения связей;\n- **«сироты»:** значения FK, которых нет в справочнике (выплаты с неизвестным кодом района), выпадают из отчёта или попадают в категорию «пусто»;\n- **несовпадение типов:** код района в одной таблице хранится как текст «07», в другой — как число 7, и связь не устанавливается.\n\n**Вывод.** Первичный ключ однозначно идентифицирует запись, внешний ключ ссылается на него и связывает таблицы, обеспечивая ссылочную целостность. В BI-системе пара «FK в таблице фактов — PK в справочнике» реализует связь «один ко многим», через которую работают фильтры и подписи. Корректность ключей — условие правильности всех агрегатов на дашборде."}, {"d": "avd", "q": 28, "title": "Свойства социально-экономических систем, усложняющие государственное управление", "md": "## Государство как сверхсложная система\n\nПринятие решений в ГМУ принципиально отличается от бизнес-анализа: государство оперирует сверхсложными системами, где экономические, социальные, инфраструктурные и политические процессы неразрывно связаны. Объект управления — система пассажирских перевозок, занятость населения, качество городской среды — обладает свойствами, которые делают простые линейные решения неэффективными.\n\n## Основные свойства\n\n1) **Нелинейность взаимосвязей.** Нет прямой пропорциональности между воздействием и эффектом: увеличение финансирования на 5 % не гарантирует улучшения показателя на 5 %. Связи описываются логарифмическими, степенными, пороговыми функциями; малые изменения могут вызвать лавинообразный эффект, а крупные вливания — «затухнуть» из-за сопротивления среды. Пример курса: незначительное изменение налоговой ставки может вызвать массовый уход в «теневой» сектор или резкую легализацию.\n2) **Эмерджентность (системный эффект).** Система обладает свойствами, которых нет у её элементов. «Инвестиционный климат» региона не равен сумме финансовых показателей предприятий: он формируется на стыке законодательства, инфраструктуры, безопасности и человеческого капитала. Улучшение отдельных элементов не гарантирует улучшения целого.\n3) **Инерционность и временные лаги.** Эффект решения проявляется с существенной задержкой: реформа образования отразится на рынке труда через 4–6 лет, программа переобучения безработных — через месяцы или годы. Управленец может не увидеть результата в своём горизонте планирования, а оценка «по горячим следам» оказывается ошибочной.\n4) **Контуры обратной связи.** Усиливающие петли порождают «снежный ком» (рост или обвал), стабилизирующие — гасят отклонения, в том числе полезные реформы. С запаздыванием обратные связи вызывают колебания и перерегулирование.\n\n## Дополнительные свойства\n\n5) **Открытость и зависимость от внешней среды.** На объект влияют факторы вне контроля органа власти: макроэкономика, ключевая ставка, федеральное законодательство, демография, климат. Неверно определённые границы системы ведут к сбоям управления.\n6) **Активность и рефлексивность элементов.** Элементы системы — люди и организации — имеют собственные цели и адаптируются к решениям: меняют поведение в ответ на льготы, штрафы и показатели. Если показатель становится целью, его начинают «достигать» формально (закон Кэмпбелла — Гудхарта): например, сокращают сроки рассмотрения обращений за счёт формальных ответов.\n7) **Многоцелевость и конфликт интересов.** Разные группы граждан, бизнес, уровни власти преследуют различные цели; улучшение одного показателя ухудшает другой (тарифы и надёжность сетей).\n8) **Неопределённость и стохастичность.** Многие факторы случайны (погода, эпидемии, цены), поэтому результат решения — не точка, а распределение вероятностей.\n9) **Иерархичность и многоуровневость.** Федеральный, региональный и муниципальный уровни, межведомственные связи; полномочия и ресурсы распределены между ними.\n10) **Трудность измерения.** Ключевые результаты (доверие, качество жизни) не измеряются напрямую и требуют прокси-показателей и экспертных оценок.\n\n## Следствия для аналитики\n\n- требуется системный анализ: определение границ, разделение факторов на управляемые, промежуточные и внешние;\n- нужны диаграммы влияния и модели «что если», учитывающие нелинейность, лаги и обратные связи;\n- оценка эффективности должна учитывать внешние факторы и временной горизонт;\n- для сложных задач — межведомственное проектное управление.\n\n**Пример.** Региональная программа поддержки занятости: рост субсидий работодателям (решение) влияет на занятость нелинейно — до определённого порога эффект мал. Результат проявляется с лагом в несколько кварталов, на него действуют внешняя конъюнктура и миграция, а работодатели адаптируются, «переоформляя» уже существующие рабочие места как новые. Без учёта этих свойств программа будет оценена неверно.\n\n**Вывод.** Государственное управление усложняют нелинейность, эмерджентность, инерционность, обратные связи, открытость к внешней среде, активность участников, многоцелевость, неопределённость и трудность измерения. Эти свойства исключают простые линейные решения и требуют системного анализа, моделирования и аналитики на основе данных."}, {"d": "avd", "q": 29, "title": "Эндогенные и экзогенные факторы", "md": "## Определения\n\n**Эндогенные (внутренние) факторы** — параметры внутри системы, которые поддаются административному изменению субъектом управления: объёмы финансирования госпрограмм, численность инспекторов, регламенты, тарифы, графики проверок. В модели они образуют контур прямого контроля (решения) и контур влияния (промежуточные переменные, меняющиеся под действием решений).\n\n**Экзогенные (внешние) факторы** — переменные среды, которые критически влияют на систему, но не изменяются ведомством в краткосрочной перспективе: ключевая ставка Банка России, федеральное законодательство, демография, инфляция, погода, мировые цены. Их динамику нужно непрерывно мониторить и закладывать в модель как ограничения — это контур наблюдения.\n\nТаблица: Эндогенные и экзогенные факторы\n{w:24,38,38}\n| Признак | Эндогенные | Экзогенные |\n|---|---|---|\n| Источник | Внутри системы | Внешняя среда |\n| Управляемость | Изменяются решением органа власти | Не изменяются ведомством в краткосрочной перспективе |\n| Роль в модели | Решения и промежуточные переменные | Ограничения, сценарные условия |\n| Узел диаграммы влияния | Прямоугольник (решение), овал (промежуточный) | Овал (неопределённость), часто пунктирный |\n| Примеры | Субсидии, штат, тарифы, регламенты | Ставка ЦБ, законы, демография, погода |\n\nДеление относительно: фактор, экзогенный для муниципалитета (региональный тариф), может быть эндогенным для субъекта Федерации. Поэтому классификация зависит от выбранных границ системы.\n\n## Как неучёт экзогенного фактора искажает оценку решения\n\nЭффективность решения оценивается по изменению результата. Если одновременно с решением изменился внешний фактор, наблюдаемое изменение — сумма двух эффектов. Неучёт внешнего фактора приводит к двум ошибкам:\n\n- **переоценка решения:** улучшение, вызванное благоприятной внешней средой, приписывается управленческим мерам;\n- **недооценка решения:** эффективная мера признаётся провальной, потому что внешний шок перекрыл её эффект.\n\n**Пример 1 (переоценка).** Регион в 2023 году запустил программу содействия занятости, и уровень безработицы снизился с 4,5 до 3,0 %. Отчёт оценивает программу как высокоэффективную. Однако в тот же период безработица снижалась по всей стране из-за дефицита кадров и роста спроса на труд — экзогенного фактора. Если в соседних регионах без программы безработица снизилась почти так же, собственный вклад программы невелик, а продление её финансирования может быть необоснованным.\n\n**Пример 2 (недооценка).** Управление ЖКХ провело замену изношенных сетей, но число аварий зимой выросло. Без учёта погодного фактора (аномальные морозы) мероприятие признают неэффективным. Если сравнить частоту аварий на заменённых и незаменённых участках при одинаковой температуре, видно, что замена снизила аварийность.\n\n## Как учитывать экзогенные факторы\n\n- явно включать их в диаграмму влияния и модель как узлы-неопределённости;\n- использовать сравнение с контрольной группой — территориями без вмешательства (метод «разность разностей»);\n- нормировать показатели (аварии на градусо-сутки отопительного периода, выплаты в реальном выражении с учётом инфляции);\n- закладывать сценарии изменения внешних факторов в прогноз и KPI;\n- на дашборде показывать внешние факторы рядом с результатом.\n\n**Вывод.** Эндогенные факторы — рычаги и промежуточные переменные, которыми управляет орган власти, экзогенные — внешние условия, которые можно только наблюдать. Неучёт экзогенного фактора приводит к ошибочной атрибуции результата: решение переоценивается или недооценивается. Корректная оценка требует явного моделирования внешней среды и сравнения с контрольными группами."}, {"d": "avd", "q": 30, "title": "Два статистических метода обнаружения аномалий и границы их применимости", "md": "## Методы, рассмотренные в курсе\n\nВ курсе рассмотрены два метода статистического обнаружения выбросов: **правило трёх сигм (3σ)** и **метод межквартильного размаха (IQR)**. Оба формализуют понятие «существенного отклонения от закономерности распределения» и позволяют находить аномалии алгоритмически, а не вручную.\n\n## Правило трёх сигм\n\nЗначение признаётся выбросом, если |xᵢ − μ| > 3σ, где μ — среднее, σ — стандартное отклонение. Для нормального (гауссовского) распределения в интервал μ ± 3σ попадает 99,73 % значений, поэтому вероятность случайно выйти за границу — около 0,27 %.\n\n**Применимо, когда:**\n\n- распределение близко к нормальному и симметрично: ошибки измерений, рост, давление, отклонения размеров изделий, суточные колебания многих технических показателей;\n- выборка достаточно велика, а выбросы единичны;\n- нужно оценить вероятность отклонения (статистический контроль процессов, контрольные карты).\n\n**Неприменимо, когда:**\n\n- распределение асимметрично или с «тяжёлым хвостом»: доходы, суммы контрактов, бюджеты, сроки исполнения — правило даёт неверные границы;\n- выбросов несколько или они крупные: они раздувают σ и маскируют себя (эффект маскировки);\n- выборка мала: отклонение одного значения от среднего не может превышать (n − 1)/√n стандартных отклонений, поэтому при n ≤ 10 правило в принципе не срабатывает, а при n = 11 предел — около 3,02σ;\n- распределение многомодальное (смешаны разные группы).\n\n## Метод межквартильного размаха\n\nГраницы нормы: Q₁ − 1,5 × IQR и Q₃ + 1,5 × IQR, где IQR = Q₃ − Q₁. Метод непараметрический и робастный: квартили не зависят от величины экстремальных значений.\n\n**Применим, когда:**\n\n- форма распределения неизвестна или асимметрична: бюджеты, сроки исполнения заявок, социальные выплаты;\n- в данных возможны грубые ошибки ввода (лишние нули);\n- нужен простой визуальный контроль (boxplot) и разведочный анализ.\n\n**Ограничения:**\n\n- при очень сильной асимметрии и длинном «хвосте» метод относит к выбросам много реальных значений — нужны логарифмирование или скорректированные границы;\n- на очень малых выборках квартили неустойчивы;\n- при многомодальном распределении нужно анализировать группы отдельно.\n\n## Общие ограничения обоих методов\n\n- оба метода **одномерные**: не выявляют аномальных сочетаний признаков (нормальная сумма выплаты при неподходящей категории получателя);\n- оба не учитывают **тренд и сезонность**: декабрьский пик бюджетных расходов — закономерность, а не аномалия; для временных рядов метод применяется к остаткам после удаления сезонности;\n- оба лишь **сигнализируют** о подозрительном значении — решение об ошибке или реальном событии принимает аналитик после проверки первоисточника.\n\nТаблица: Сравнение методов обнаружения аномалий\n{w:24,38,38}\n| Признак | Правило 3σ | Метод IQR |\n|---|---|---|\n| Основа | Среднее и стандартное отклонение | Квартили |\n| Требование к распределению | Нормальное | Не требуется |\n| Устойчивость к выбросам | Низкая (эффект маскировки) | Высокая (точка излома 25 %) |\n| Малые выборки | Плохо | Удовлетворительно, но неустойчиво |\n| Типичные данные ГМУ | Технические измерения | Бюджеты, сроки, выплаты |\n\n**Пример.** Бюджеты 14 проектов благоустройства (млн руб.): у двенадцати — от 1,2 до 2,4, у двух — 14,0 и 15,5. Среднее — 3,63, σ = 4,73, верхняя граница 3σ — 17,8 млн руб.: ни один проект не признан аномальным. Метод IQR: Q₁ = 1,53, Q₃ = 2,18, IQR = 0,65, верхняя граница — 3,15 млн руб.: оба крупных проекта выявлены. Проверка показала, что один из них — реальный комплексный проект (его нужно анализировать отдельно), а второй — ошибка в единицах измерения (тыс. руб. вместо млн руб.).\n\n**Вывод.** Правило трёх сигм применимо для нормально распределённых данных с единичными выбросами и большими выборками; метод IQR — для асимметричных данных неизвестной формы, типичных для ГМУ. Ни один из методов не учитывает сезонность и многомерные аномалии, и оба лишь указывают на подозрительные значения, окончательную оценку которых даёт содержательный анализ."}, {"d": "udo", "q": 1, "title": "Хранилище данных (Data Warehouse) и озеро данных (Data Lake)", "md": "## Определения\n\n**Хранилище данных (Data Warehouse, DWH)** — предметно-ориентированная, интегрированная, неизменяемая и поддерживающая хронологию совокупность данных для поддержки управленческих решений (определение Билла Инмона). Данные из учётных систем очищаются, согласуются и приводятся к единой модели **до** загрузки — схема задаётся при записи (schema-on-write).\n\n**Озеро данных (Data Lake)** — хранилище, в котором данные любых типов сохраняются в исходном, «сыром» виде, а структура задаётся только в момент чтения и анализа (schema-on-read). Термин предложил Джеймс Диксон (Pentaho, 2010): хранилище — это «бутилированная вода», очищенная и упакованная, озеро — тот же водоём в естественном состоянии.\n\n## Принципиальное отличие\n\nХранилище отвечает на **заранее известные** вопросы: модель данных проектируется под отчётность, лишнее отсекается. Озеро сохраняет **всё**, чтобы отвечать на вопросы, которые ещё не сформулированы: схема и смысл придаются данным позже, под конкретную задачу.\n\nТаблица: Сравнение хранилища и озера данных\n{w:22,39,39}\n| Признак | Data Warehouse | Data Lake |\n|---|---|---|\n| Тип данных | Структурированные таблицы из ERP, CRM, учётных систем | Любые: таблицы, JSON, логи, тексты, изображения, видео, телеметрия |\n| Момент задания схемы | При записи (schema-on-write): модель «звезда» или нормализованное ядро | При чтении (schema-on-read): структура определяется запросом или программой |\n| Способ обработки | ETL до загрузки, SQL-запросы, OLAP, регламентные отчёты | ELT, пакетная и потоковая обработка (Spark, Kafka), машинное обучение |\n| Типичные пользователи | Руководители, бизнес-аналитики, финансовая служба | Специалисты по данным (data scientists), инженеры данных |\n| Стоимость и масштабируемость | Дорогое хранение, связка хранения и вычислений, масштабирование ограничено | Дешёвое объектное хранилище, вычисления отделены от хранения, почти неограниченный объём |\n| Назначение | Единая достоверная отчётность, KPI, BI | Исследование данных, ML-модели, хранение полной истории событий |\n| Качество данных | Высокое: данные очищены и согласованы | Неоднородное: без управления озеро превращается в «болото данных» |\n\n## Преимущества озера для логов веб-сервера и данных IoT\n\n1) **Низкая стоимость хранения больших объёмов.** Логи и телеметрия дают терабайты в месяц; объектное хранилище (S3-совместимое, HDFS) и сжатые колоночные форматы (Parquet, ORC) дешевле таблиц реляционного хранилища в разы.\n2) **Не нужна схема заранее.** Форматы логов меняются с версиями сайта, а состав показаний — с прошивками датчиков; озеро принимает данные «как есть».\n3) **Сохраняется полная детализация.** Для машинного обучения нужны сырые события — каждый клик и каждое показание датчика, а не дневные агрегаты; при появлении новой гипотезы модель переобучается на всей истории.\n4) **Высокая скорость приёма.** Потоковая загрузка через Apache Kafka выдерживает миллионы событий в минуту.\n5) **Горизонтальное масштабирование и разделение хранения и вычислений.** Вычислительный кластер Spark поднимается только на время обучения модели и затем останавливается.\n6) **Один источник для разных инструментов.** С одними файлами работают Python, Spark, SQL-движки (Trino, ClickHouse).\n\nУсловие успеха — **каталог метаданных, контроль качества и разграничение доступа**; иначе через год никто не знает, что лежит в озере и можно ли этим данным доверять.\n\n**Пример.** Интернет-магазин пишет 40–50 млн строк журналов веб-сервера в сутки, а на складе каждые 10 секунд передают показания датчики температуры холодильных камер. Данные загружаются в озеро в формате Parquet с разбиением по датам. На них обучаются модель прогнозирования оттока покупателей по поведению на сайте и модель предиктивного обслуживания холодильного оборудования. Отчёт о продажах для директора по-прежнему строится по хранилищу.\n\n**Вывод.** Хранилище и озеро не конкурируют, а дополняют друг друга: хранилище — источник единой проверенной отчётности, озеро — дешёвый «склад сырья» для исследований и машинного обучения. Для логов и данных IoT озеро предпочтительнее, поскольку сохраняет полную историю без затрат на предварительное моделирование."}, {"d": "udo", "q": 2, "title": "ER-диаграмма предметной области «Прокат автомобилей»", "md": "## Сущности, атрибуты и первичные ключи\n\nER-модель (Entity — Relationship, Питер Чен, 1976) описывает предметную область через сущности, их атрибуты и связи. Для проката автомобилей выделены четыре сущности.\n\nТаблица: Сущности модели «Прокат автомобилей»\n{w:22,20,58}\n| Сущность | Первичный ключ (PK) | Ключевые атрибуты |\n|---|---|---|\n| Клиент | ID_клиента | ФИО, номер водительского удостоверения, дата рождения, телефон |\n| Автомобиль | ID_автомобиля | VIN, госномер, марка и модель, тариф в сутки; внешний ключ ID_пункта |\n| Пункт проката | ID_пункта | Адрес, телефон |\n| Договор проката | ID_договора | Внешние ключи ID_клиента и ID_автомобиля; дата выдачи, плановая и фактическая дата возврата, сумма |\n\nВ качестве первичных ключей выбраны суррогатные идентификаторы: естественные ключи (номер удостоверения, госномер) могут меняться — удостоверение заменяют, автомобиль перерегистрируют.\n\n![ER-диаграмма «Прокат автомобилей» в нотации «воронья лапка»](img/udo02_er_rent.webp){600}\n\nНа диаграмме использована нотация «воронья лапка»: две черты — «ровно один», кружок с «лапкой» — «ноль или много».\n\n## Связи и их кардинальность\n\nТаблица: Связи между сущностями\n{w:30,14,56}\n| Связь | Тип | Логика |\n|---|---|---|\n| Клиент — Договор проката | 1 : N | Клиент может заключить много договоров (или ни одного), каждый договор заключён ровно с одним клиентом |\n| Автомобиль — Договор проката | 1 : N | Автомобиль многократно выдаётся в разные периоды, договор оформляется на один автомобиль |\n| Пункт проката — Автомобиль | 1 : N | В пункте числится много автомобилей, автомобиль приписан к одному пункту |\n| Клиент — Автомобиль | M : N | Клиент брал разные машины, одну машину брали разные клиенты; связь реализована через «Договор проката» |\n| Договор проката — Акт приёма-передачи (при расширении модели) | 1 : 1 | На один договор составляется один акт; такие сущности часто объединяют в одну таблицу |\n\n## Реализация связи «многие ко многим»\n\nВ реляционной модели связь M : N нельзя хранить напрямую: в ячейке таблицы не может находиться список значений, а дублирование строк нарушает нормализацию. Поэтому вводится **ассоциативная (связующая) сущность**, которая содержит внешние ключи обеих сторон и раскладывает M : N на две связи 1 : N. Здесь эту роль выполняет «Договор проката». Он имеет собственные атрибуты — даты и сумму, которые не принадлежат ни клиенту, ни автомобилю, а описывают именно факт их взаимодействия.\n\nПервичный ключ ассоциативной сущности — собственный ID_договора, а не составной ключ (ID_клиента, ID_автомобиля): один клиент может брать один и тот же автомобиль несколько раз, и составной ключ перестал бы быть уникальным. Уникальность проката обеспечивает альтернативный ключ (ID_автомобиля, Дата_выдачи).\n\n**Пример.** Клиент Петров в марте взял Kia Rio, в июне — снова Kia Rio, в августе — Skoda Octavia. В таблице «Договор проката» три строки с одинаковым ID_клиента; для Kia Rio две строки различаются датами выдачи. Запрос «какие автомобили брал Петров» выполняется соединением трёх таблиц по внешним ключам.\n\n**Вывод.** Модель из четырёх сущностей покрывает основной процесс проката: три связи 1 : N и одна связь M : N, разрешённая через договор как ассоциативную сущность. Такой подход устраняет дублирование данных о клиентах и автомобилях и позволяет хранить полную историю прокатов."}, {"d": "udo", "q": 3, "title": "DFD уровня 0 для процесса «Обработка обращения в службу технической поддержки»", "md": "## Нотация диаграмм потоков данных\n\nДиаграмма потоков данных (Data Flow Diagram, DFD) показывает, откуда данные приходят, как преобразуются, где хранятся и куда передаются. Используется нотация Гейна — Сарсона (1979); в нотации Йордона — Де Марко отличается лишь форма процесса и накопителя.\n\nТаблица: Графические элементы DFD\n{w:20,30,22,28}\n| Элемент | Гейн — Сарсон | Йордон — Де Марко | Смысл |\n|---|---|---|---|\n| Внешняя сущность | Прямоугольник с утолщённой рамкой или тенью | Прямоугольник | Источник или получатель данных вне системы |\n| Процесс | Прямоугольник со скруглёнными углами: номер и название-глагол | Круг | Преобразование входных потоков в выходные |\n| Накопитель данных | Прямоугольник, открытый с одной стороны, с номером D1, D2… | Две параллельные линии | Данные, сохраняемые между процессами |\n| Поток данных | Стрелка с названием-существительным | Стрелка | Данные в движении и направление передачи |\n\n## Диаграмма уровня 0\n\nВнешние сущности: **пользователь** (сотрудник или клиент), **специалист 2-й линии**, **руководитель службы поддержки**. Процессы: 1 — приём и регистрация обращения; 2 — классификация и назначение исполнителя; 3 — диагностика и решение; 4 — закрытие и уведомление; 5 — формирование отчётности. Накопители: D1 «Обращения», D2 «Пользователи и оборудование», D3 «База знаний».\n\n![DFD уровня 0 «Обработка обращения в службу технической поддержки» (нотация Гейна — Сарсона)](img/udo03_dfd_support.webp){620}\n\n## Логика потоков\n\n1) Пользователь направляет **обращение** (портал, почта, телефон); процесс 1 сверяет его с данными D2, записывает **новую заявку** в D1 и возвращает **номер заявки**.\n2) Процесс 2 читает заявку, присваивает **категорию и приоритет** по матрице «влияние × срочность», определяет нормативный срок (SLA) и передаёт **назначенную заявку** исполнителю.\n3) Процесс 3 ищет **типовое решение** в D3; если оно не найдено, выполняется **эскалация** на 2-ю линию. Найденное **новое решение** пополняет базу знаний.\n4) Процесс 4 сообщает пользователю результат, получает **оценку** качества и записывает **статус «закрыта»** в D1.\n5) Процесс 5 по **истории заявок** формирует **отчёт по SLA** для руководителя.\n\n## Правила построения\n\n- Каждый процесс имеет хотя бы один входной и один выходной поток.\n- Потоки не соединяют напрямую внешние сущности и накопители — данные проходят через процесс.\n- Диаграмма уровня 0 сбалансирована с контекстной: внешние потоки совпадают по составу.\n\n**Пример.** Сотрудник пишет «не подключается VPN». Заявка № 1045 получает категорию «Сеть» и высокий приоритет со сроком решения 4 часа. Первая линия находит в базе знаний инструкцию по сбросу сертификата; через 40 минут заявка закрыта с оценкой «5». В месячном отчёте видно, что 18 % обращений связаны с VPN, — основание для автоматизации сброса сертификатов.\n\n**Вывод.** DFD уровня 0 раскрывает процесс поддержки как пять подпроцессов, связанных потоками и накопителями. Диаграмма показывает, какие данные нужны на каждом шаге и где они хранятся, — это основа для выбора и настройки системы Service Desk."}, {"d": "udo", "q": 4, "title": "Реляционные (SQL) и нереляционные (NoSQL) базы данных", "md": "## Понятия и ключевые различия\n\n**Реляционная база данных** хранит данные в связанных таблицах (отношениях) по модели Эдгара Кодда (1970). Структура таблиц задаётся заранее, связи обеспечиваются первичными и внешними ключами, запросы пишутся на SQL, изменения выполняются транзакциями со свойствами ACID (атомарность, согласованность, изолированность, долговечность). Примеры — PostgreSQL, Oracle, MS SQL Server.\n\n**NoSQL** («не только SQL») — семейство нереляционных СУБД с иными моделями данных, гибкой схемой и ориентацией на горизонтальное масштабирование. В распределённой системе нельзя одновременно гарантировать согласованность, доступность и устойчивость к разделению сети (теорема CAP, Эрик Брюер, 2000), поэтому многие NoSQL-системы жертвуют строгой согласованностью ради доступности (принцип BASE — «согласованность в конечном счёте»).\n\nТаблица: Сравнение SQL и NoSQL\n{w:24,38,38}\n| Критерий | SQL | NoSQL |\n|---|---|---|\n| Модель данных | Таблицы из строк и столбцов, связи через ключи | Пары «ключ — значение», документы, семейства колонок, графы |\n| Схема | Строгая, задаётся до записи; изменение — миграцией | Гибкая или отсутствует: записи одного набора могут иметь разные поля |\n| Связи | Соединения (JOIN) во время запроса | Вложенные документы, денормализация, рёбра графа |\n| Согласованность | ACID-транзакции | Чаще BASE, настраиваемая согласованность |\n| Масштабирование | В основном вертикальное | Горизонтальное: шардирование и репликация |\n| Типичные задачи | Учёт, финансы, заказы, где важна целостность | Большие объёмы, высокая нагрузка, изменчивая структура |\n\n## Четыре типа NoSQL-баз\n\n![Модели данных четырёх типов NoSQL-баз](img/udo04_nosql.webp){620}\n\nТаблица: Типы NoSQL-баз данных\n{w:20,40,20,20}\n| Тип | Модель | Примеры СУБД | Задачи |\n|---|---|---|---|\n| Ключ — значение | Значение любого вида доступно по уникальному ключу | Redis, Tarantool | Кэш, сессии, счётчики |\n| Документная | JSON-подобные документы с вложенной структурой | MongoDB, Couchbase | Профили, каталоги, контент |\n| Колоночная (wide-column) | Строки с произвольным набором колонок, сгруппированных в семейства | Apache Cassandra, HBase | Журналы событий, телеметрия, временные ряды |\n| Графовая | Узлы и рёбра со свойствами | Neo4j | Социальные связи, рекомендации, выявление мошенничества |\n\n## Выбор для двух задач\n\n**Социальная сеть с анализом связей → графовая БД (Neo4j).** Связи хранятся как самостоятельные объекты, и каждый узел «знает» соседей. Запрос «друзья друзей, состоящие в той же группе» выполняется обходом графа на 2–3 шага за миллисекунды. В реляционной модели тот же запрос требует многократного самосоединения таблицы «Дружба» с миллиардами строк, и время ответа растёт с каждым уровнем. Графовые алгоритмы (кратчайший путь, сообщества, центральность) поддерживаются «из коробки».\n\n**Кэш пользовательских сессий → БД «ключ — значение» (Redis).** Данные находятся в оперативной памяти, доступ по ключу session_id занимает доли миллисекунды. Для ключа задаётся время жизни (TTL), и просроченная сессия удаляется автоматически. Сложные запросы и связи здесь не нужны, а репликация и кластеризация выдерживают сотни тысяч запросов в секунду.\n\n**Вывод.** SQL-базы незаменимы там, где важны строгая схема и транзакционная целостность, NoSQL — там, где важны масштаб, скорость и гибкость структуры. Современные системы используют обе модели одновременно (polyglot persistence): заказы и платежи — в PostgreSQL, сессии — в Redis, граф связей — в Neo4j."}, {"d": "udo", "q": 5, "title": "Централизованные, распределённые и облачные системы хранения данных", "md": "## Характеристика трёх классов\n\n![Три класса систем хранения данных](img/udo05_storage.webp){620}\n\nТаблица: Сравнение классов систем хранения\n{w:16,28,28,28}\n| Класс | Особенности | Преимущества | Недостатки |\n|---|---|---|---|\n| Централизованные | Одна СУБД или СХД в одном ЦОД; все пользователи обращаются к единому узлу | Простота администрирования, единая точка контроля доступа, строгая согласованность | Единая точка отказа, предел вертикального роста, задержки для удалённых филиалов |\n| Распределённые | Данные разнесены по узлам и площадкам (шардирование, репликация): Greenplum, Cassandra, HDFS | Горизонтальное масштабирование, отказоустойчивость, близость данных к пользователям | Сложность администрирования, компромиссы согласованности (CAP), сетевые задержки |\n| Облачные | Ресурсы провайдера по модели IaaS, PaaS, DBaaS с оплатой по факту | Эластичность, нет капитальных затрат на ЦОД, быстрый запуск, управляемые сервисы | Зависимость от провайдера и сети, риск привязки (vendor lock-in), требования к размещению данных |\n\n## Выбор архитектуры для оператора персональных данных граждан РФ\n\n**Нормативные требования.**\n- **Локализация:** ч. 5 ст. 18 Федерального закона от 27.07.2006 № 152-ФЗ «О персональных данных» (в ред. Федерального закона от 28.02.2025 № 23-ФЗ, с 01.07.2025): при сборе персональных данных граждан РФ, в том числе через интернет, их запись, систематизация, накопление, хранение, уточнение и извлечение с использованием баз данных за пределами РФ **не допускаются**, кроме случаев п. 2, 3, 4, 8 ч. 1 ст. 6.\n- **Ответственность:** ч. 8 ст. 13.11 КоАП РФ — штраф для юридических лиц от 1 до 6 млн руб., при повторном нарушении (ч. 9) — от 6 до 18 млн руб.; по решению суда ресурс может быть включён в реестр нарушителей прав субъектов персональных данных и заблокирован (ст. 15.5 Федерального закона № 149-ФЗ).\n- **Защита:** уровни защищённости по постановлению Правительства РФ от 01.11.2012 № 1119, состав мер — приказ ФСТЭК России от 18.02.2013 № 21.\n- **Трансграничная передача** копий — только после уведомления Роскомнадзора (ч. 3 ст. 12 № 152-ФЗ).\n\n**Обоснование выбора.** Подходит **распределённая архитектура в российском контуре**: первичная база с персональными данными размещается в собственном ЦОД или в аттестованном сегменте российского облачного провайдера, синхронная реплика — на второй площадке в РФ для отказоустойчивости. Публичное облако допустимо, если ЦОД провайдера находится в России, а обработка поручена ему по договору с требованиями ч. 3 ст. 6 № 152-ФЗ (ответственность перед субъектом сохраняет оператор). Обезличенные и агрегированные данные можно обрабатывать в облачных аналитических сервисах. Зарубежные облака для первичной базы исключены.\n\n## Вертикальная и горизонтальная масштабируемость\n\nТаблица: Вертикальное и горизонтальное масштабирование\n{w:22,39,39}\n| Критерий | Вертикальное (scale up) | Горизонтальное (scale out) |\n|---|---|---|\n| Суть | Наращивание ресурсов одного сервера: процессоры, память, диски | Добавление однотипных узлов в кластер |\n| Предел | Физическая мощность самой крупной машины | Практически не ограничен |\n| Отказоустойчивость | Единая точка отказа | Отказ узла компенсируется репликами |\n| Сложность | Минимальна: приложение не меняется | Нужны шардирование, балансировка, распределённые транзакции |\n| Стоимость | Растёт нелинейно: топовое железо дорого | Линейная, на типовом оборудовании |\n\n**Пример.** Страховая компания с 3 млн клиентов хранит договоры и персональные данные в PostgreSQL в собственном московском ЦОД и держит потоковую реплику в резервном ЦОД в Санкт-Петербурге. Сервис расчёта стоимости полисов работает в российском облаке на обезличенных данных, а отчётность строится в облачном хранилище по агрегатам.\n\n**Вывод.** Централизованная схема проще, распределённая надёжнее и масштабируемее, облачная гибче и быстрее во внедрении. Для оператора персональных данных выбор ограничен требованием локализации: первичные данные — только в базах на территории РФ, облако — российское и с подтверждённым уровнем защиты."}, {"d": "udo", "q": 6, "title": "Управление данными (Data Management) и руководство данными (Data Governance)", "md": "## Понятия и их соотношение\n\nПо своду знаний DAMA-DMBOK (2-е изд., 2017) **управление данными (Data Management)** — разработка, исполнение и контроль планов, политик, программ и практик, которые обеспечивают, контролируют, защищают и повышают ценность данных на протяжении их жизненного цикла. **Руководство данными (Data Governance)** — осуществление полномочий, контроля и совместного принятия решений (планирование, мониторинг, обеспечение исполнения) в отношении управления данными.\n\nСоотношение: Data Governance — **центр «колеса DAMA»**, вокруг которого расположены остальные десять областей знаний (архитектура, моделирование, хранение, безопасность, интеграция, документы, мастер-данные, хранилища и BI, метаданные, качество). Governance отвечает на вопрос «**кто и по каким правилам** принимает решения о данных», Management — «**как** эти решения исполняются». DMBOK сравнивает их с аудитом и бухгалтерским учётом: одни устанавливают правила и проверяют, другие ежедневно ведут работу.\n\nТаблица: Data Governance и Data Management\n{w:22,39,39}\n| Критерий | Data Governance | Data Management |\n|---|---|---|\n| Суть | Правила, полномочия, контроль | Исполнение: процессы и технологии |\n| Вопрос | Кто решает, что правильно и кто отвечает | Как хранить, интегрировать, очищать, защищать |\n| Результаты | Политики, стандарты, роли, метрики, решения совета | Модели, хранилища, ETL, справочники, отчёты |\n| Исполнители | Совет, CDO, владельцы и стюарды данных | Архитекторы, инженеры, администраторы, аналитики |\n\n## Роли и структуры Data Governance\n\n![Организационная структура Data Governance](img/udo06_dg_roles.webp){600}\n\nТаблица: Роли и функции\n{w:28,72}\n| Роль | Функции |\n|---|---|\n| Совет по управлению данными (Data Governance Council) | Утверждает стратегию и политики работы с данными, определяет приоритеты, разрешает межфункциональные споры (например, чьё определение «клиента» правильное) |\n| Директор по данным (Chief Data Officer, CDO) | Отвечает за программу управления данными, руководит офисом управления данными, отчитывается перед руководством о ценности данных и рисках |\n| Владелец данных (Data Owner) | Руководитель бизнес-подразделения, отвечающий за домен данных: утверждает правила доступа, требования к качеству, сроки хранения |\n| Стюард данных (Data Steward) | Эксперт предметной области: ведёт бизнес-глоссарий и справочники, контролирует качество, разбирает инциденты с данными |\n| Хранитель данных (Data Custodian) | ИТ-специалист: обеспечивает хранение, резервное копирование, техническую защиту по правилам владельца |\n\n## Разграничение полномочий ИТ и управления данными\n\nИТ отвечает за **технологии** — как хранить, передавать и защищать данные. Бизнес отвечает за **смысл и правила** — что означают данные, какое качество достаточно, кому их можно выдать. Разграничение нужно, потому что:\n\n- ИТ не знает бизнес-смысла: «активный клиент» для маркетинга и финансов — разные понятия, и разрешить спор может только бизнес;\n- качество данных создаётся там, где данные вводятся, то есть в бизнес-процессах, а не в серверной;\n- принцип разделения обязанностей: администратор базы не должен единолично решать, кому открыть доступ к персональным данным;\n- закон требует отдельной ответственности: оператор назначает лицо, ответственное за организацию обработки персональных данных (ст. 22.1 № 152-ФЗ).\n\n## Инструменты Data Governance\n\n- политики, стандарты и регламенты работы с данными, матрица ответственности RACI;\n- бизнес-глоссарий и **каталог данных** с происхождением данных (lineage): Arenadata Catalog, DataHub, OpenMetadata, Collibra;\n- классификация данных по конфиденциальности;\n- инструменты контроля качества: правила и проверки (Great Expectations, тесты dbt), дашборды метрик качества;\n- системы управления мастер-данными и НСИ (например, «Юнидата»);\n- метрики программы: доля данных с владельцем, индекс качества, число инцидентов.\n\nВ государственном управлении элементы Data Governance закреплены в национальной системе управления данными — Концепция утверждена распоряжением Правительства РФ от 03.06.2019 № 1189-р, единая информационная платформа — постановлением от 14.05.2021 № 733.\n\n**Пример.** В торговой сети маркетинг отчитывался о 1,2 млн «активных клиентов», финансы — о 0,9 млн. Совет по данным утвердил единое определение «покупка за последние 90 дней», владельцем домена «Клиенты» назначен директор по маркетингу, стюардом — аналитик CRM, хранителем — администратор базы. Определение внесено в глоссарий, расхождение отчётов устранено.\n\n**Вывод.** Data Governance задаёт правила и ответственность, Data Management исполняет их с помощью процессов и технологий. Чёткие роли — совет, CDO, владельцы, стюарды и хранители — превращают данные из «проблемы ИТ» в управляемый актив организации."}, {"d": "udo", "q": 7, "title": "Безопасность хранилищ данных, стандарты и меры защиты интернет-магазина", "md": "## Основные методы защиты\n\nТаблица: Методы обеспечения безопасности хранилищ данных\n{w:20,44,36}\n| Метод | Содержание | Технологии и примеры |\n|---|---|---|\n| Шифрование | Данные «в покое» (диски, базы, резервные копии), «в пути» (каналы связи) и на уровне отдельных полей; управление ключами | AES-256, ГОСТ Р 34.12-2015 в сертифицированных СКЗИ, TDE, TLS 1.2–1.3, HSM и KMS |\n| Контроль доступа | Идентификация и аутентификация, ролевая (RBAC) и атрибутная (ABAC) модели, минимальные привилегии, ограничение по строкам и столбцам | Многофакторная аутентификация, Row-Level Security, маскирование и токенизация |\n| Мониторинг и аудит | Журналирование входов, запросов и изменений, анализ аномалий, регулярный пересмотр прав | SIEM, мониторинг активности СУБД (DAM), DLP, тесты на проникновение |\n| Резервирование | Восстановление после сбоя или атаки шифровальщика | Правило 3-2-1, неизменяемые копии, проверка восстановления |\n| Сетевая защита | Изоляция хранилища от интернета и пользовательских сегментов | Сегментация, межсетевые экраны, WAF |\n\n## Стандарты и нормативные акты\n\n- **GDPR** — Регламент ЕС 2016/679, применяется с 25.05.2018. Принципы законности, минимизации и ограничения цели; права субъекта (доступ, удаление, переносимость); защита «по умолчанию и при проектировании» (ст. 25), меры безопасности (ст. 32), уведомление надзорного органа об утечке в течение 72 часов (ст. 33), штрафы до 20 млн евро или 4 % мирового годового оборота (ст. 83). Действует экстерриториально — для российской компании, если она предлагает товары жителям ЕС.\n- **ISO/IEC 27001:2022** — требования к системе менеджмента информационной безопасности: цикл PDCA, оценка и обработка рисков, Приложение A из 93 мер в четырёх группах (организационные, кадровые, физические, технологические); возможна сертификация. Национальный аналог — ГОСТ Р ИСО/МЭК 27001-2021.\n- **Федеральный закон № 152-ФЗ** — принципы обработки (ст. 5), согласие (ст. 9), обязанности оператора и меры защиты (ст. 18.1, 19), уровни защищённости (постановление Правительства РФ № 1119), состав мер (приказ ФСТЭК России № 21), уведомление Роскомнадзора об инциденте за 24 и 72 часа (ч. 3.1 ст. 21), взаимодействие с ГосСОПКА (ч. 12 ст. 19), локализация (ч. 5 ст. 18). За утечки — штрафы по ч. 12–18 ст. 13.11 КоАП РФ, при повторной утечке — оборотный штраф до 3 % выручки, но не более 500 млн руб.\n- **PCI DSS v4.0.1** — отраслевой стандарт безопасности данных платёжных карт (Совет PCI SSC): обязателен для всех, кто хранит, обрабатывает или передаёт данные карт; запрещает хранить CVV-код после авторизации.\n\n## Комплекс мер для интернет-магазина\n\n**Организационно-правовые:** политика обработки персональных данных на сайте (ч. 2 ст. 18.1 № 152-ФЗ); согласия на рассылки; уведомление Роскомнадзора; назначение ответственного; модель угроз и определение уровня защищённости (для базы более 100 тыс. покупателей при угрозах 3-го типа — как правило, УЗ-3); обучение персонала; план реагирования на инциденты.\n\n**Платёжные данные:** магазин **не хранит** реквизиты карт — оплата идёт на платёжной странице банка-эквайера или через токенизацию; это сужает область применения PCI DSS до минимального опросника и снимает главный риск. Используется 3-D Secure.\n\n**Технические:** TLS 1.3 на всём сайте и WAF; шифрование базы и резервных копий; многофакторная аутентификация администраторов и ролевой доступ (оператор колл-центра видит телефон частично); маскирование данных в тестовых средах; сегментация — база недоступна из интернета; журналирование с передачей в SIEM; DLP для выгрузок; управление уязвимостями и ежегодный пентест; резервные копии по правилу 3-2-1.\n\n**Пример.** Магазин с 400 тыс. клиентов перевёл приём оплаты на страницу эквайера, удалил из базы старые маски карт, закрыл прямой доступ к СУБД и включил MFA. Через полгода утечка учётной записи менеджера не дала злоумышленнику выгрузить базу: DLP заблокировал экспорт, SIEM поднял тревогу, Роскомнадзор уведомлён в течение 24 часов.\n\n**Вывод.** Безопасность хранилища обеспечивается сочетанием шифрования, контроля доступа и непрерывного мониторинга. Для интернет-магазина главное — не хранить лишнего (особенно данные карт), выполнить требования 152-ФЗ и построить защиту по риск-ориентированной логике ISO/IEC 27001."}, {"d": "udo", "q": 8, "title": "Проблемы с данными, выбросы и обеспечение качества", "md": "## Распространённые проблемы с данными\n\nТаблица: Типичные проблемы качества данных\n{w:18,40,42}\n| Проблема | Суть | Пример и последствие |\n|---|---|---|\n| Выбросы | Значения, резко отличающиеся от основной массы | Чек на 1 250 тыс. руб. в магазине у дома искажает средние |\n| Дублирование | Одна сущность представлена несколькими записями | «Иванов И. И.» и «Иванов Иван» — двойные рассылки, завышенная клиентская база |\n| Несогласованность | Одно и то же значение записано по-разному в разных системах или полях | «г. Москва», «Москва», «MSK»; даты 03.04 и 04/03 — продажи «расползаются» по строкам отчёта |\n| Пропуски | Отсутствуют значения обязательных полей | Нет региона у 20 % клиентов — региональный анализ неполон |\n| Устаревшие данные | Значения потеряли актуальность | Старый адрес — недоставленные заказы; доступ уволенного сотрудника |\n| «Тёмные» данные | Собранные и хранимые, но не используемые данные (термин Gartner) | Архивы логов и записей звонков: затраты на хранение и риск утечки без пользы |\n\n## Выбросы и их причины\n\n**Выброс (outlier)** — наблюдение, значительно отклоняющееся от остальных значений выборки. Для выявления применяют правило межквартильного размаха (значения за пределами Q1 − 1,5·IQR и Q3 + 1,5·IQR), z-оценку (|z| > 3) и визуальные методы — ящичковую диаграмму и диаграмму рассеяния.\n\n![Выбросы на ящичковой диаграмме: ошибка ввода и реальное событие](img/udo08_outliers.webp){600}\n\nРеальные причины выбросов:\n\n1) **ошибки ввода** — лишний ноль, перепутанные поля, неверный десятичный разделитель;\n2) **ошибки измерения** — неисправный датчик, сбой кассы;\n3) **ошибки интеграции** — разные единицы (рубли и тысячи рублей), форматы дат, кодировки;\n4) **намеренные искажения** — мошенничество, «накрутка» показателей;\n5) **реальные редкие события** — «чёрная пятница», оптовая закупка, авария.\n\nВыбросы первых трёх типов исправляют или исключают; выбросы пятого типа **удалять нельзя** — они несут ценную информацию о пиковом спросе или мошенничестве. Поэтому каждый выброс сначала объясняют, а потом решают, что с ним делать.\n\n## Пример ошибочного управленческого решения\n\nКассир магазина ввёл дневную выручку 1 250 тыс. руб. вместо 125 тыс. руб. Средняя дневная выручка за месяц выросла со 128 до 166 тыс. руб. (+29 %). Руководство приняло магазин за точку роста: увеличило закупки на следующий квартал на четверть и расширило штат. Спрос не изменился — сеть получила затоваривание, списание скоропортящихся товаров и лишний фонд оплаты труда. Медиана или правило IQR выявили бы ошибку сразу.\n\n## Меры по обеспечению качества данных\n\n- **контроль на входе:** маски полей, выпадающие списки вместо ручного ввода, проверка контрольных сумм ИНН и диапазонов;\n- **профилирование и правила качества в ETL:** проверка дублей, пропусков и выбросов при каждой загрузке;\n- **единая НСИ и MDM:** общие справочники и классификаторы (ОКТМО, ФИАС), «золотая запись» клиента;\n- **метрики и мониторинг:** пороговые значения полноты, уникальности, своевременности, дашборд качества с оповещениями;\n- **роли:** владельцы и стюарды данных, исправление ошибки в источнике, а не только в отчёте;\n- **управление жизненным циклом:** актуализация, архивирование, удаление «тёмных» данных — хранение не дольше, чем требуют цели обработки (ч. 7 ст. 5 № 152-ФЗ).\n\n**Вывод.** Проблемы качества — выбросы, дубли, несогласованность, пропуски, устаревшие и «тёмные» данные — напрямую превращаются в ошибочные решения. Качество обеспечивается не разовой очисткой, а системой: контроль на входе, автоматические проверки, единые справочники, метрики и ответственные лица."}, {"d": "udo", "q": 9, "title": "Бизнес-стратегия, ИТ-стратегия и карта уровней архитектуры организации", "md": "## Взаимосвязь бизнес- и ИТ-стратегии\n\n**Бизнес-стратегия** определяет цели организации, рынки, продукты и источники конкурентного преимущества. **ИТ-стратегия** определяет, как информационные технологии поддерживают и расширяют эти цели: приоритеты, целевую архитектуру, ресурсы, модель сорсинга и бюджет.\n\nСвязь двунаправленная:\n\n1) **«Бизнес → ИТ» (согласование, alignment).** Цели бизнеса порождают требования к ИТ: выход в онлайн-продажи требует интернет-магазина, CRM и интеграции со складом.\n2) **«ИТ → бизнес» (возможности, enabling).** Технологии создают новые продукты и бизнес-модели (маркетплейсы, мобильный банк, Госуслуги, генеративный ИИ) и задают ограничения — сроки, стоимость, санкционные риски, требования импортозамещения.\n\nМодель стратегического соответствия Хендерсона и Венкатрамана (1993) описывает четыре домена — бизнес-стратегию, ИТ-стратегию, организационную и ИТ-инфраструктуру — и требует их согласования по вертикали (стратегия — инфраструктура) и по горизонтали (бизнес — ИТ).\n\n## Бизнес-инжиниринг как «мост»\n\n**Бизнес-инжиниринг** (подход школы Санкт-Галлена, Х. Эстерле) — методическое преобразование стратегии в бизнес-процессы, организационную структуру и требования к информационным системам. Стратегия отвечает на вопрос «что делать», процессы — «как делать», информационные системы — «чем делать». Бизнес-инжиниринг переводит цели в модели процессов (BPMN, ARIS), роли и показатели, а затем — в требования к ИС. Без этого моста стратегия остаётся документом, а ИТ автоматизирует старые процессы.\n\n## Карта уровней архитектуры\n\n![Карта уровней архитектуры организации](img/udo09_arch_map.webp){600}\n\nТаблица: Уровни архитектуры организации\n{w:28,72}\n| Уровень | Содержание |\n|---|---|\n| Бизнес- и ИТ-стратегия | Цели, KPI, стратегия цифровой трансформации, дорожная карта ИТ |\n| Бизнес-инжиниринг | Модели процессов, организационная структура, требования к ИС |\n| Архитектура ИС | Состав информационных систем, их функции и связи — карта ИТ-ландшафта |\n| Архитектура данных и приложений | Модели данных, справочники и потоки данных; портфель приложений, интерфейсы и API |\n| Техническая архитектура | Серверы, сети, системы хранения, платформы, облака, технологические стандарты |\n| Корпоративные ИТ-системы | Работающие системы: ERP, CRM, СЭД, DWH и BI, HRM, порталы |\n\nСверху вниз идёт **декомпозиция**: цели превращаются в требования и технические решения. Снизу вверх идёт **обратная связь**: фактические показатели, возможности и ограничения технологий корректируют стратегию.\n\n**Пример.** Банк ставит цель привлечь малый бизнес онлайн (бизнес-стратегия). ИТ-стратегия: «цифровой банк» на облачной платформе с открытыми API. Бизнес-инжиниринг описывает процесс открытия счёта за 15 минут без визита в офис. Архитектура ИС связывает мобильное приложение, автоматизированную банковскую систему, скоринг и ЕСИА через интеграционную шину; данные — единый профиль клиента. Техническая основа — контейнерная платформа и PostgreSQL. Обратная связь: удалённая биометрическая идентификация позволила сделать процесс полностью дистанционным, и банк расширил стратегию на индивидуальных предпринимателей из регионов.\n\n**Вывод.** Бизнес- и ИТ-стратегия влияют друг на друга, а бизнес-инжиниринг соединяет стратегию с процессами и системами. Карта уровней показывает путь от цели до конкретной ИТ-системы и позволяет проверить, что каждое ИТ-решение работает на стратегию."}, {"d": "udo", "q": 10, "title": "Модель корневых процессов системы хранения данных", "md": "## Понятие модели корневых процессов\n\nМодель корневых процессов — карта процессов верхнего уровня, в которой деятельность делится на три группы. **Основные (корневые)** процессы создают результат для потребителя — в системе хранения это готовые к анализу данные. **Управляющие** задают цели, правила и контролируют исполнение. **Поддерживающие** обеспечивают основные процессы ресурсами и сервисами. Управляющие процессы размещают сверху, корневые — в центре, поддерживающие — снизу.\n\n![Модель корневых процессов системы хранения данных](img/udo10_root_dwh.webp){600}\n\n## Корневые процессы и движение данных\n\nТаблица: Корневые процессы системы хранения\n{w:26,22,22,30}\n| Процесс | Вход | Выход | Пример |\n|---|---|---|---|\n| 1. Сбор и приём данных | События в ERP, CRM, на датчиках | Сырые данные | Выгрузка чеков из 300 касс каждый час |\n| 2. Загрузка и интеграция (ETL или ELT) | Сырые данные | Очищенные, согласованные данные | Дедупликация клиентов, приведение дат и валют |\n| 3. Хранение и организация | Очищенные данные | Структурированные данные, витрины и агрегаты | Модель «звезда», партиционирование по месяцам |\n| 4. Доступ и анализ | Витрины, агрегаты | Отчёты, дашборды, выгрузки по API | Дашборд продаж для директоров магазинов |\n| 5. Архивирование и удаление | Устаревшие данные | Архив; уничтоженные данные | Детальные чеки старше трёх лет — в архив |\n\nСтрелки на модели показывают движение данных: сырые → очищенные → витрины и агрегаты → отчёты; устаревшие данные из процесса хранения уходят в архивирование.\n\n## Управляющие процессы\n\n**Назначение:** определить, *что* и *по каким правилам* хранится, и контролировать результат. Они не обрабатывают данные сами, а задают параметры корневым процессам и получают от них обратную связь — метрики и отчёты.\n\n- **Стратегия и архитектура хранения** — выбор платформ (хранилище, озеро), прогноз объёмов, бюджет.\n- **Политики** — классификация данных, сроки хранения, права доступа, требования защиты (в том числе 152-ФЗ).\n- **Мониторинг SLA, ёмкости и качества** — контроль своевременности загрузок, заполненности дисков, метрик качества.\n\n## Поддерживающие процессы\n\n**Назначение:** обеспечить работу корневых процессов. Потребитель их не видит, но без них корневые процессы останавливаются.\n\n- **Администрирование инфраструктуры** — серверы, СХД, сеть, обновления.\n- **Резервное копирование и восстановление** — с целевыми RPO и RTO (допустимые потеря данных и время простоя).\n- **Управление метаданными и каталогом** — описание таблиц, происхождение данных.\n- **Информационная безопасность и поддержка пользователей** — журналы, средства защиты, обработка заявок аналитиков.\n\n**Пример.** В хранилище розничной сети управляющий процесс утвердил политику: детальные чеки хранятся три года, агрегаты — бессрочно; данные о продажах должны быть доступны к 7:00. Корневые процессы ежечасно забирают чеки, ночью очищают и строят витрины. Поддерживающий процесс делает резервную копию каждый час (RPO = 1 час). Метрика «загрузка завершена к 06:40» возвращается в управляющий процесс мониторинга.\n\n**Вывод.** Модель корневых процессов разделяет создание ценности (сбор, интеграция, хранение, доступ, архивирование), управление (стратегия, политики, контроль) и обеспечение (инфраструктура, резервирование, метаданные, безопасность). Такое разделение помогает назначить ответственных и увидеть, где возникают узкие места системы хранения."}, {"d": "udo", "q": 11, "title": "ER-диаграмма предметной области «Интернет-магазин»", "md": "## Сущности, атрибуты и первичные ключи\n\nТаблица: Сущности модели «Интернет-магазин»\n{w:20,22,58}\n| Сущность | Первичный ключ | Атрибуты |\n|---|---|---|\n| Покупатель | ID_покупателя | ФИО, e-mail, телефон, адрес доставки |\n| Заказ | ID_заказа | Внешний ключ ID_покупателя; дата, статус, сумма |\n| Позиция заказа | (ID_заказа, ID_товара) | Количество, цена продажи |\n| Товар | ID_товара | Артикул, наименование, текущая цена, остаток; внешний ключ ID_категории |\n| Категория | ID_категории | Название; ID_родителя — ссылка на вышестоящую категорию |\n| Оплата | ID_оплаты | Внешний ключ ID_заказа; дата, сумма, способ, статус |\n\n![ER-диаграмма «Интернет-магазин»](img/udo11_er_shop.webp){620}\n\n## Связи и их логика\n\nТаблица: Связи между сущностями\n{w:30,12,58}\n| Связь | Тип | Логика |\n|---|---|---|\n| Покупатель — Заказ | 1 : N | Покупатель оформляет любое число заказов (возможно, ни одного); заказ принадлежит одному покупателю |\n| Заказ — Позиция заказа | 1 : N | Заказ содержит хотя бы одну позицию; позиция относится к одному заказу |\n| Товар — Позиция заказа | 1 : N | Товар входит во многие заказы; позиция ссылается на один товар |\n| Категория — Товар | 1 : N | В категории много товаров; товар отнесён к одной категории |\n| Категория — Категория | 1 : N (рекурсивная) | «Электроника → Смартфоны → Аксессуары»: подкатегория ссылается на родителя через ID_родителя |\n| Заказ — Оплата | 1 : N | Возможны неуспешные попытки, частичная оплата или доплата |\n| Заказ — Товар | M : N | Заказ включает много товаров, товар входит во многие заказы; реализуется через «Позицию заказа» |\n\n## Реализация связи «многие ко многим»\n\nРеляционная модель не позволяет хранить в строке заказа список товаров (нарушение первой нормальной формы), а повторение строки заказа для каждого товара порождает аномалии обновления. Поэтому M : N реализуется **связующей таблицей** «Позиция заказа»:\n\n- она содержит внешние ключи обеих таблиц — ID_заказа и ID_товара;\n- их комбинация образует **составной первичный ключ**: товар встречается в заказе один раз, количество хранится в отдельном поле;\n- в таблицу выносятся атрибуты самой связи — количество и **цена продажи**. Цена фиксируется на момент заказа: текущая цена товара меняется, а история заказов должна оставаться неизменной.\n\nТак связь M : N раскладывается на две связи 1 : N, а целостность обеспечивается внешними ключами: нельзя добавить позицию несуществующего товара или удалить заказ, не удалив его позиции.\n\n**Пример.** Заказ № 501 покупателя Анны содержит две позиции: смартфон (1 шт. по 24 990 руб.) и чехол (2 шт. по 790 руб.). В таблице «Позиция заказа» две строки с ключами (501, 1017) и (501, 2230). Запрос «десять товаров с наибольшей выручкой за месяц» соединяет «Заказ», «Позицию заказа» и «Товар» и суммирует произведение количества на цену продажи.\n\n**Вывод.** Шесть сущностей покрывают основной цикл интернет-магазина: покупатель — заказ — товары — оплата, с иерархией категорий. Связь «заказ — товар» типа M : N реализована через связующую таблицу с составным ключом, в которой хранятся атрибуты самой связи."}, {"d": "udo", "q": 12, "title": "DFD уровня 0 для процесса «Оформление заказа в интернет-магазине»", "md": "## Границы процесса и окружение\n\n**Граница** проходит от выбора товаров покупателем до передачи оплаченного заказа в доставку. Сборка заказа на складе, сама доставка, возвраты и обработка претензий остаются вне границы — это смежные процессы.\n\n**Окружение** образуют внешние сущности, с которыми процесс обменивается данными: **покупатель**, **платёжная система** (банк-эквайер) и **служба доставки**. Окружение фиксирует контекстная диаграмма: весь процесс показан одним блоком с номером 0.\n\n![Контекстная диаграмма процесса «Оформление заказа»](img/udo12_dfd_context.webp){460}\n\n## Диаграмма уровня 0\n\nНа уровне 0 процесс раскрыт на пять подпроцессов и четыре накопителя: D1 «Каталог и остатки», D2 «Покупатели», D3 «Заказы», D4 «Платежи».\n\n![DFD уровня 0 «Оформление заказа в интернет-магазине»](img/udo12_dfd_level0.webp){600}\n\n1) **Формирование корзины** — покупатель выбирает товары, процесс читает цены и наличие из D1.\n2) **Ввод данных и оформление** — контакты и адрес; профиль берётся из D2 или создаётся новый; заказ записывается в D3.\n3) **Проверка наличия и резервирование** — резерв товара в D1, расчёт суммы к оплате.\n4) **Оплата заказа** — запрос в платёжную систему, подтверждение, запись платежа в D4 и статуса «оплачен» в D3.\n5) **Передача в доставку** — заявка в службу доставки, получение трек-номера, подтверждение и чек покупателю.\n\n## Графические элементы нотации Гейна — Сарсона\n\nТаблица: Обозначения DFD\n{w:24,40,36}\n| Элемент | Обозначение | Правило именования |\n|---|---|---|\n| Внешняя сущность | Прямоугольник с утолщённой рамкой | Существительное: «Покупатель» |\n| Процесс | Скруглённый прямоугольник с номером | Глагол с объектом: «Оплата заказа» |\n| Накопитель данных | Открытый прямоугольник с номером D | Существительное во множественном числе: «Заказы» |\n| Поток данных | Именованная стрелка | Существительное: «запрос оплаты» |\n\n## Контекстный уровень и детализация\n\nТаблица: Отличия уровней DFD\n{w:24,38,38}\n| Признак | Контекстная диаграмма | Диаграмма уровня 0 и ниже |\n|---|---|---|\n| Число процессов | Один — система целиком | 3–9 подпроцессов с номерами 1, 2, 3… |\n| Накопители | Не показываются | Показываются |\n| Цель | Зафиксировать границу и внешние потоки | Раскрыть внутреннюю логику обработки |\n| Связь уровней | — | Баланс: внешние потоки те же, что на контекстной диаграмме |\n\nДалее каждый процесс детализируется на следующем уровне: процесс 4 раскладывается на 4.1 «Выбор способа оплаты», 4.2 «Авторизация платежа», 4.3 «Формирование чека». Детализация прекращается, когда процесс можно описать короткой спецификацией. В части литературы контекстную диаграмму саму называют уровнем 0, а первую детализацию — уровнем 1; смысл деления от этого не меняется.\n\n**Пример.** Покупатель положил в корзину наушники, указал адрес, система зарезервировала последнюю единицу на складе и выставила сумму 5 490 руб. Банк подтвердил оплату, заказ получил статус «оплачен», служба доставки вернула трек-номер — покупатель получил письмо с чеком и номером отслеживания.\n\n**Вывод.** Контекстная диаграмма задаёт границу и окружение процесса, DFD уровня 0 раскрывает его логику через пять подпроцессов и четыре накопителя. Баланс потоков между уровнями гарантирует, что детализация не теряет и не добавляет внешних данных."}, {"d": "udo", "q": 13, "title": "Модель корневых процессов управления данными организации", "md": "## Структура модели\n\nМодель корневых процессов управления данными описывает **весь жизненный цикл данных организации** — от их появления в учётных системах до уничтожения. В центре расположены основные (корневые) процессы, создающие ценность из данных, сверху — управляющие, снизу — поддерживающие.\n\n![Модель корневых процессов управления данными организации](img/udo13_root_dm.webp){600}\n\n## Корневые процессы и движение данных\n\n1) **Создание и сбор данных** — ввод в учётных системах, обращения граждан и клиентов, датчики, внешние источники. Выход — первичные данные.\n2) **Интеграция и хранение** — консолидация из разных систем, приведение к единым справочникам, загрузка в хранилище. Выход — единые данные.\n3) **Обработка и анализ** — расчёт показателей, отчёты, аналитические и ML-модели. Выход — отчёты и модели.\n4) **Использование и обмен данными** — принятие решений, предоставление данных подразделениям, партнёрам, органам власти.\n5) **Архивирование и уничтожение** — неактуальные данные переводятся в архив или уничтожаются по истечении срока хранения.\n\n## Управляющие процессы\n\n**Назначение:** определить, как организация обращается с данными, и проверить, что правила соблюдаются. Управляющие процессы не создают данные, но задают «правила игры» всем корневым процессам и получают от них обратную связь — показатели качества и инциденты.\n\nТаблица: Управляющие процессы\n{w:30,70}\n| Процесс | Пример |\n|---|---|\n| Стратегия данных и Data Governance | Совет по данным под руководством CDO утверждает приоритеты: единый профиль клиента в 2026 году |\n| Политики и стандарты | Политика качества: доля заполненных обязательных полей не ниже 98 %; регламент доступа; сроки хранения |\n| Контроль соответствия и рисков | Ежегодный аудит обработки персональных данных на соответствие 152-ФЗ, оценка рисков утечки |\n\n## Поддерживающие процессы\n\n**Назначение:** обеспечить корневые процессы сервисами, инструментами и компетенциями. Без них корневые процессы технически возможны, но работают медленно, дорого и с ошибками.\n\nТаблица: Поддерживающие процессы\n{w:30,70}\n| Процесс | Пример |\n|---|---|\n| Управление метаданными и НСИ | Каталог данных с описанием показателей; единый справочник контрагентов (MDM) |\n| Управление качеством данных | Ночное профилирование загрузок, поиск дублей и пропусков |\n| ИТ-инфраструктура и информационная безопасность | Серверы и облако, резервное копирование, разграничение доступа, журналы |\n| Обучение и культура работы с данными | Курсы для сотрудников по работе с BI и правилам обращения с персональными данными |\n\n**Пример.** В региональном министерстве социальной защиты корневые процессы — приём заявлений через Госуслуги, интеграция сведений из межведомственных запросов через СМЭВ, расчёт права на меру поддержки и передача решений в казначейство. Управляющий процесс — политика управления данными и назначение ответственного за обработку персональных данных. Поддерживающий — ведение справочника мер поддержки и обучение специалистов. Показатель «доля заявлений с ошибками в данных» передаётся вверх, в процесс контроля, и служит основанием для изменения формы заявления.\n\n**Вывод.** Модель корневых процессов показывает управление данными как систему: корневые процессы проводят данные по жизненному циклу, управляющие задают правила и контролируют их, поддерживающие дают инструменты и компетенции. Обратная связь от корневых процессов к управляющим делает систему самонастраивающейся."}, {"d": "udo", "q": 14, "title": "ER-диаграмма предметной области «Поликлиника»", "md": "## Сущности, атрибуты и ключи\n\nТаблица: Сущности модели «Поликлиника»\n{w:22,22,56}\n| Сущность | Первичный ключ | Атрибуты |\n|---|---|---|\n| Пациент | ID_пациента | ФИО, дата рождения, полис ОМС, адрес, телефон |\n| Врач | ID_врача | ФИО, кабинет; внешний ключ ID_специальности |\n| Специальность | ID_специальности | Название (терапевт, кардиолог) |\n| Приём | ID_приёма | Внешние ключи ID_пациента, ID_врача, Код_МКБ; дата и время, жалобы, назначения |\n| Диагноз МКБ-10 | Код_МКБ | Наименование диагноза по Международной классификации болезней |\n\n![ER-диаграмма «Поликлиника»](img/udo14_er_clinic.webp){620}\n\n## Связи и кардинальность\n\nТаблица: Связи между сущностями\n{w:30,12,58}\n| Связь | Тип | Логика |\n|---|---|---|\n| Пациент — Приём | 1 : N | Пациент посещает поликлинику многократно; приём относится к одному пациенту |\n| Врач — Приём | 1 : N | Врач проводит много приёмов; приём ведёт один врач |\n| Специальность — Врач | 1 : N | Одной специальностью владеют несколько врачей |\n| Диагноз МКБ-10 — Приём | 1 : N | Один код диагноза устанавливается на многих приёмах |\n| Пациент — Врач | M : N | Реализуется через сущность «Приём» |\n\n## Моделирование ситуации «много пациентов — много врачей»\n\nСвязь «пациент посещает многих врачей, врач принимает многих пациентов» имеет тип M : N. Напрямую в реляционной модели она не реализуется, поэтому вводится **ассоциативная сущность «Приём»** — сам факт визита. Она содержит внешние ключи ID_пациента и ID_врача и раскладывает M : N на две связи 1 : N.\n\nУ «Приёма» есть собственные атрибуты — дата и время, жалобы, диагноз, назначения; они описывают не пациента и не врача, а их конкретную встречу. Первичный ключ — суррогатный ID_приёма, поскольку один пациент может много раз приходить к одному врачу. Уникальность расписания обеспечивает альтернативный ключ (ID_врача, Дата_время): врач не может принять двух пациентов в одну минуту. При развитии модели добавляется сущность «Слот расписания» со связью 1 : 0..1 к приёму — так моделируется запись на приём.\n\nМедицинские сведения относятся к специальной категории персональных данных (ст. 10 № 152-ФЗ) и составляют врачебную тайну (ст. 13 Федерального закона от 21.11.2011 № 323-ФЗ). Поэтому в базе разграничивается доступ: регистратура видит расписание и контакты, но не диагнозы и назначения.\n\n**Пример.** Пациентка Сидорова в марте была у терапевта дважды и один раз у кардиолога; кардиолог Петров за тот же день принял 22 пациента. В таблице «Приём» у Сидоровой три строки, у Петрова — 22 строки за день. Запрос «к каким специалистам обращалась пациентка» соединяет «Приём», «Врача» и «Специальность».\n\n**Вывод.** Модель поликлиники строится вокруг ассоциативной сущности «Приём», которая разрешает связь M : N между пациентами и врачами и хранит данные визита. Справочники специальностей и диагнозов МКБ-10 обеспечивают единообразие данных и корректную медицинскую статистику."}, {"d": "udo", "q": 15, "title": "Карта уровней архитектуры организации: мосты и обратные связи", "md": "## Карта уровней с примерами\n\n![Карта уровней архитектуры с примерами, мостами и обратной связью](img/udo15_arch_map_ex.webp){600}\n\nТаблица: Задачи уровней и примеры (розничная сеть)\n{w:22,38,40}\n| Уровень | Задача | Пример |\n|---|---|---|\n| Бизнес-стратегия | Определить цели, рынки, конкурентное преимущество | Увеличить долю онлайн-продаж до 30 % за три года |\n| ИТ-стратегия | Определить, как ИТ поддержит и расширит цели | Омниканальная платформа, единые данные о клиенте, переход в облако |\n| Бизнес-инжиниринг | Перевести стратегию в процессы, роли и показатели | Процесс «заказ онлайн — выдача в магазине», норматив выдачи — 2 часа |\n| Архитектура ИС | Определить состав систем и их взаимодействие | Сайт, CRM, ERP и складская система обмениваются заказами через шину интеграции и API |\n| Архитектура данных и приложений | Задать модели данных, справочники, портфель приложений | Единый справочник товаров и клиентов (MDM), CRM, ERP, WMS, хранилище данных |\n| Техническая архитектура | Обеспечить инфраструктуру и платформы | Облачный кластер, СУБД PostgreSQL, каналы связи магазинов, резервирование |\n| Корпоративные ИТ-системы | Реализовать решения в работающих системах | 1С:ERP, CRM, WMS, интернет-магазин, мобильное приложение, BI-дашборды |\n\n## Роль «мостов» между уровнями\n\n**Мост 1 — бизнес-инжиниринг** соединяет стратегию и процессы. Цель «30 % онлайн-продаж» сама по себе ничего не меняет; бизнес-инжиниринг превращает её в конкретный процесс, роли кладовщика и продавца, нормативы и показатели. Это перевод с языка целей на язык действий.\n\n**Мост 2 — архитектура ИС (интеграционный уровень)** соединяет процессы и ИТ. Процесс «заказ онлайн — выдача в магазине» проходит через пять систем; архитектура ИС определяет, какая система «ведёт» заказ, какие данные передаются, через какие интерфейсы. Без этого моста каждая система автоматизирует свой участок, а сквозной процесс рвётся.\n\nКроме вертикальных, существует **горизонтальный мост — согласование бизнес- и ИТ-стратегии**: ИТ-директор участвует в стратегической сессии, а ИТ-бюджет формируется из стратегических инициатив.\n\n## Обратные связи\n\nСвязи направлены не только сверху вниз. Снизу вверх передаются:\n\n- **фактические показатели** — данные BI о работе процессов и выполнении стратегии;\n- **возможности технологий** — новые решения, которые меняют бизнес-модель;\n- **ограничения** — сроки, стоимость, санкционные риски, требования регуляторов;\n- **результаты архитектурного контроля** — архитектурный комитет проверяет соответствие проектов целевой архитектуре.\n\n**Пример обратной связи.** BI-отчёты показали, что 40 % онлайн-заказов покупатели забирают в магазине. Стратегия скорректирована: сеть расширяет пункты выдачи и включает их в программу лояльности. Одновременно внедрение рекомендательной модели на сайте подняло средний чек онлайн-заказа — технология стала источником новой стратегической инициативы «персональные предложения».\n\n**Вывод.** Карта уровней показывает путь от цели до конкретной системы, «мосты» гарантируют, что смысл стратегии не теряется при переходе к процессам и ИТ, а обратные связи позволяют стратегии учиться на фактических данных и новых возможностях технологий."}, {"d": "udo", "q": 16, "title": "Процесс ETL: загрузка данных из CRM и ERP в хранилище", "md": "## Схема процесса\n\n**ETL (Extract — Transform — Load)** — процесс извлечения данных из источников, их преобразования к единой модели и загрузки в хранилище. Источники — транзакционные (OLTP) системы: CRM хранит клиентов и сделки, ERP — заказы, финансы и складские операции; дополнительно используются файлы и внешние API.\n\n![Схема процесса ETL](img/udo16_etl.webp){600}\n\n## Назначение этапов\n\nТаблица: Этапы процесса ETL\n{w:22,78}\n| Этап | Назначение |\n|---|---|\n| Extract (извлечение) | Получить данные из источников с минимальной нагрузкой на них: выгрузка таблиц, вызов API, чтение журнала изменений; фиксация времени выгрузки |\n| Staging (промежуточная область) | Сохранить «сырую» копию: преобразования выполняются здесь, а не в рабочих системах; при ошибке шаг можно повторить, не обращаясь к источнику |\n| Transform (преобразование) | Очистить, согласовать и привести данные к модели хранилища (подробно — ниже) |\n| Load (загрузка) | Записать результат в таблицы фактов и измерений хранилища, обновить витрины и агрегаты |\n| Метаданные и контроль | Расписание запусков, журнал ошибок, сверка количества строк и контрольных сумм, оповещения |\n\n## Действия при преобразовании\n\n1) **Очистка:** удаление лишних пробелов и служебных символов, исправление регистра, отбраковка недопустимых значений в «карантин».\n2) **Проверка качества:** обязательные поля, диапазоны, ссылочная целостность, поиск выбросов.\n3) **Дедупликация:** один клиент из CRM и тот же контрагент из ERP сопоставляются по ИНН, телефону, e-mail.\n4) **Стандартизация форматов:** даты к ISO 8601, суммы к рублям по курсу на дату, единицы измерения к единому виду.\n5) **Сопоставление справочников:** коды регионов, статусов, товарных групп разных систем приводятся к единому справочнику хранилища.\n6) **Суррогатные ключи:** присвоение собственных ключей хранилища вместо разнородных ключей источников.\n7) **Расчёт и обогащение:** маржа, длительность сделки, признак «новый клиент», геокоординаты по адресу.\n8) **Агрегирование:** итоги по дням, магазинам, категориям для витрин.\n9) **История изменений (SCD 2-го типа):** при смене региона клиента старая версия закрывается датой, создаётся новая — отчёты прошлых периодов не меняются.\n10) **Защита:** маскирование или обезличивание персональных данных для аналитических витрин.\n\n## Полная и инкрементальная загрузка\n\nТаблица: Полная и инкрементальная загрузка\n{w:22,39,39}\n| Признак | Полная загрузка | Инкрементальная загрузка |\n|---|---|---|\n| Что загружается | Весь объём данных, таблица перезаписывается | Только новые и изменённые записи с прошлого запуска |\n| Как выявляются изменения | Не требуется | Метка времени изменения, возрастающий идентификатор, CDC по журналу транзакций (Debezium), сравнение хэшей |\n| Время и нагрузка | Высокие, растут с объёмом | Низкие, пропорциональны изменениям |\n| Сложность | Минимальная, удаления учитываются автоматически | Выше: нужны слияние (MERGE, upsert) и учёт удалённых записей |\n| Когда применять | Первичная загрузка, небольшие справочники, восстановление после сбоя | Регулярные загрузки крупных таблиц фактов |\n\n**Пример.** Торговая компания каждую ночь загружает данные из CRM и 1С:ERP. Справочник товаров (30 тыс. позиций) перезагружается полностью. Заказы загружаются инкрементально по дате изменения: вместо 50 млн строк — около 200 тыс. за сутки. Клиенты двух систем сопоставляются по ИНН и телефону, суммы в валюте пересчитываются в рубли. Витрины готовы к 6:00, а при расхождении числа строк с источником дежурный инженер получает оповещение.\n\n**Вывод.** ETL превращает разрозненные данные CRM и ERP в согласованное содержимое хранилища: извлечение без нагрузки на источники, преобразование по правилам качества и единым справочникам, загрузка в аналитическую модель. Полная загрузка проста, но дорога; инкрементальная экономична и потому служит основным режимом регулярного обновления."}, {"d": "udo", "q": 17, "title": "DFD уровня 0 для процесса «Обслуживание клиента в банке»", "md": "## Окружение процесса\n\nВнешние сущности — источники и получатели данных за границей процесса:\n\n- **клиент** — подаёт документы и заявки, получает уведомления и выписки;\n- **ЕБС / ЕСИА** — Единая биометрическая система и Единая система идентификации и аутентификации для удалённой идентификации (Федеральный закон от 29.12.2022 № 572-ФЗ);\n- **бюро кредитных историй** — кредитный отчёт с согласия клиента (Федеральный закон от 30.12.2004 № 218-ФЗ «О кредитных историях»);\n- **Росфинмониторинг** — сведения об операциях, подлежащих контролю (Федеральный закон от 07.08.2001 № 115-ФЗ);\n- **платёжная система (СБП)** — исполнение переводов.\n\n![DFD уровня 0 «Обслуживание клиента в банке»](img/udo17_dfd_bank.webp){600}\n\n## Внутренняя логика\n\n1) **Идентификация клиента** — проверка документа или биометрии через ЕБС/ЕСИА, сверка и обновление досье в D1.\n2) **Приём заявки** — открытие счёта, кредит, перевод.\n3) **Проверка и решение** — запрос кредитной истории, проверка лимитов и счетов в D2, контроль по 115-ФЗ с передачей сведений в Росфинмониторинг.\n4) **Проведение операции** — платёжное поручение в платёжную систему, запись договора и остатка в D2, проводки в журнал D3.\n5) **Уведомление и выписка** — данные из D3 передаются клиенту.\n\n## Отражение хранения данных клиента\n\nДанные клиента отражаются **накопителями** — открытыми прямоугольниками с идентификаторами: D1 «Клиенты (досье)», D2 «Счета и договоры», D3 «Журнал операций». Правила:\n\n- накопитель пассивен: данные попадают в него и извлекаются из него только через процесс;\n- направление стрелки показывает операцию: от процесса к накопителю — запись или обновление («обновлённые данные»), от накопителя к процессу — чтение («досье», «счета, лимиты»);\n- один накопитель могут использовать несколько процессов — это показывает, где данные клиента «живут» и кто к ним обращается.\n\nСостав досье определяется законом: банк идентифицирует клиента и хранит документы не менее пяти лет после прекращения отношений с ним (ст. 7 № 115-ФЗ); сведения об операциях и счетах составляют банковскую тайну (ст. 26 Федерального закона «О банках и банковской деятельности»).\n\n## Отражение обмена с внешними системами\n\nВнешние системы показываются **внешними сущностями** за границей процесса, а обмен — **парами потоков** «запрос — ответ»: «запрос проверки» и «результат» для ЕБС/ЕСИА, «запрос КИ» и «кредитная история» для бюро. Внутренняя логика внешней системы не раскрывается: для банка это «чёрный ящик» с известным интерфейсом. Внешняя сущность никогда не связывается напрямую с накопителем — запись ответа в базу выполняет процесс. Поток только в одну сторону (сведения в Росфинмониторинг) отражает обязанность отчитываться без получения ответа.\n\n**Пример.** Клиент обращается за кредитной картой через мобильное приложение. Процесс 1 подтверждает личность по биометрии в ЕБС, процесс 3 получает кредитный отчёт из бюро и проверяет действующие кредиты в D2, решение принимается за три минуты. Процесс 4 открывает договор и счёт, процесс 5 отправляет уведомление с лимитом.\n\n**Вывод.** DFD уровня 0 раскрывает обслуживание клиента как пять процессов: идентификация, приём заявки, проверка, проведение операции, уведомление. Накопители показывают, где хранятся досье, счета и операции, а внешние сущности с парными потоками — какими данными банк обменивается с государственными и платёжными системами."}, {"d": "udo", "q": 18, "title": "ER-диаграмма предметной области «Складской учёт»", "md": "## Сущности, атрибуты и ключи\n\nТаблица: Сущности модели «Складской учёт»\n{w:22,26,52}\n| Сущность | Первичный ключ | Атрибуты |\n|---|---|---|\n| Поставщик | ID_поставщика | Наименование, ИНН, контакты |\n| Поставка | ID_поставки | Внешние ключи ID_поставщика и ID_склада; номер накладной, дата |\n| Позиция поставки | (ID_поставки, ID_товара) | Количество, цена закупки |\n| Товар | ID_товара | Артикул, наименование, единица измерения |\n| Склад | ID_склада | Адрес, ответственное лицо |\n| Остаток | (ID_склада, ID_товара) | Количество, ячейка хранения |\n\n![ER-диаграмма «Складской учёт»](img/udo18_er_stock.webp){620}\n\n## Связи и кардинальность\n\nТаблица: Связи между сущностями\n{w:30,12,58}\n| Связь | Тип | Логика |\n|---|---|---|\n| Поставщик — Поставка | 1 : N | Поставщик выполняет много поставок; накладная выписана одним поставщиком |\n| Склад — Поставка | 1 : N | Склад принимает много поставок; поставка приходит на один склад |\n| Поставка — Позиция поставки | 1 : N | В накл
