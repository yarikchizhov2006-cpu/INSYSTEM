'avd-20-3':'Сумма ряда была 66, после замены 10 на 1000 стала 1056, а среднее — 1056 / 9 ≈ 117,3. Один ошибочный ввод исказил среднее в 16 раз, а медиана осталась 7.',
'avd-20-4':'Неверно. Выброс может быть ошибкой (лишний ноль), а может быть реальным событием — крупным проектом или чрезвычайной ситуацией. Его сначала проверяют по первоисточнику, а удаляют только подтверждённые ошибки.',
'avd-21-0':'Межквартильный размах — разность третьего и первого квартилей: IQR = Q3 − Q1. Он показывает разброс средних 50 % значений и не зависит от крайних точек.',
'avd-21-1':'По Тьюки нормальными считают значения от Q1 − 1,5·IQR до Q3 + 1,5·IQR; всё, что за пределами, — выбросы. С коэффициентом 3·IQR выделяют экстремальные выбросы.',
'avd-21-2':'IQR = 7,5 − 4,5 = 3. Верхняя граница = Q3 + 1,5 × IQR = 7,5 + 4,5 = 12. Значение 45 дней больше 12 — это выброс.',
'avd-21-3':'Квартили считают в разных инструментах так: в Excel — КВАРТИЛЬ.ВКЛ, в DAX (Power BI) — PERCENTILE.INC, в SQL — оконная функция PERCENTILE_CONT.',
'avd-21-4':'Правило 3σ использует стандартное отклонение, а оно само растёт из-за выброса: значение 45 раздувает σ, и граница отодвигается до 45,2. Это «маскировка». Квартили зависят от порядка, поэтому IQR выброс не «прячет».',
'avd-22-0':'Сначала выясняют природу аномалии. Если найден первоисточник (платёжное поручение, акт), значение исправляют по нему — это единственный способ получить истинное значение. Удаление и замена — уже приближения.',
'avd-22-1':'Винзоризация приравнивает выброс к границе нормы; аппроксимация заменяет его медианой соседей или интерполяцией; логарифмирование сжимает шкалу и уменьшает влияние крайних значений; маркировка оставляет значение, но помечает его для анализа.',
'avd-22-2':'Замена становится фальсификацией, если аномалия — реальное событие, если её делают ради красивого KPI, если заменена значимая доля данных, если замена не задокументирована или если аномалия указывает на мошенничество, которое так скрывается.',
'avd-22-3':'Выплата в 100 раз больше обычной похожа на ошибку ввода, но это нужно подтвердить. Сверка с платёжным поручением показывает истинную сумму, и данные исправляют по первоисточнику.',
'avd-23-0':'Три «греха» отчётов: объединённые ячейки и многоуровневые шапки (машина не понимает, к чему относится значение); несколько значений в ячейке и смысл в цвете заливки; внутренние итоги и «широкий» формат (годы в столбцах).',
'avd-23-1':'Строка «Итого по району» выглядит как ещё одно поселение. При суммировании её значение прибавляется к значениям поселений, и выплаты района учитываются дважды.',
'avd-23-2':'Цвет заливки машина не прочитает и не отфильтрует. Смысл, переданный цветом («просрочено»), выносят в отдельный столбец-признак со значениями «да/нет».',
'avd-23-3':'Верно. Данные хранят в Tidy-формате — одна шапка, без объединений и итогов. Красивое оформление для печати делают в представлении, на этапе отчёта, не портя исходник.',
'avd-24-0':'Колодец данных (Data Silo) — данные одного подразделения или системы, недоступные остальным. Он возникает при лоскутной автоматизации, когда системы закупаются отдельно и не интегрируются.',
'avd-24-1':'Колодцы ведут к противоречивой отчётности (у каждого своё число), дублированию ввода (одни сведения вводят в несколько систем) и невозможности сквозной аналитики — например, проследить путь семьи через все услуги.',
'avd-24-2':'Сопоставить данные разных ведомств можно только по общим ключам: ОКТМО (территории), ФИАС (адреса), КБК (бюджетная классификация). Это нормативно-справочная информация (НСИ).',
'avd-24-3':'Каждое ведомство считает многодетные семьи по своей базе. Сопоставив записи по СНИЛС и ОКТМО в хранилище, получают одно согласованное число и находят причины расхождений.',
'avd-24-4':'Государственная инфраструктура против колодцев: СМЭВ (межведомственный обмен), НСУД (национальная система управления данными) и региональные центры управления (ЦУР), которые собирают данные из разных систем.',
'avd-25-0':'OLTP обслуживает операции: короткие транзакции, нормализованная структура, текущие данные, пользователи — операторы. OLAP обслуживает анализ: агрегирующие запросы по истории, схема «звезда», пакетная загрузка, пользователи — аналитики.',
'avd-25-1':'Системы разделяют, потому что оптимизация для транзакций и для анализа противоположна; тяжёлые запросы конкурируют за ресурсы с работой операторов; для анализа нужна история и данные других систем; аналитикам можно дать обезличенные данные, не открывая рабочую базу.',
'avd-25-2':'Электронная очередь регистрирует талоны и время приёма в реальном времени — это транзакционная система (OLTP). Анализ времени ожидания по МФЦ и часам делают в хранилище и кубе, куда данные переносятся ночью.',
'avd-26-0':'Тест FASMI (Пендс и Крит, 1995) — пять требований к OLAP: Fast — быстрый ответ; Analysis — анализ без программирования; Shared — многопользовательский защищённый доступ; Multidimensional — многомерное представление; Information — работа с любыми объёмами данных.',
'avd-26-1':'Требование Fast: ответ на большинство запросов — не дольше 5 секунд, на простые — около 1 секунды. Дольше пользователь теряет ход мысли и перестаёт исследовать данные.',
'avd-26-2':'Ключевое требование FASMI — многомерность: именно возможность смотреть данные в разрезе нескольких измерений с иерархиями отличает OLAP от обычной отчётности.',
'avd-26-3':'Быстрый отклик дают: предагрегация (MOLAP-кубы, материализованные представления), колоночное хранение со сжатием (ClickHouse, VertiPaq), обработка в памяти, партиционирование и кэш, а также схема «звезда», MPP и инкрементальная загрузка. Глубокая нормализация, наоборот, замедляет аналитику.',
'avd-26-4':'Транзакционная база не рассчитана на агрегирование миллионов строк. Перенос в колоночную ClickHouse с предрасчитанными агрегатами сократил время открытия дашборда с минуты до секунд.',
'avd-27-0':'Первичный ключ (PK) однозначно идентифицирует запись: значение уникально и не пусто. Внешний ключ (FK) — поле, ссылающееся на PK другой таблицы; оно связывает таблицы и не даёт сослаться на несуществующую запись.',
'avd-27-1':'В модели BI справочник районов — сторона «1»: каждый район в нём один раз. Таблица выплат — сторона «N»: на один район много выплат. Фильтр, выбранный по справочнику, распространяется на факты.',
'avd-27-2':'Типичные ошибки: дубли на стороне «1» (один департамент записан дважды из-за пробела), из-за чего связь «один ко многим» ломается; «сироты» — FK без записи в справочнике; несовпадение типов («07» текстом и 7 числом не сопоставляются).',
'avd-27-3':'Верно. Ссылочная целостность означает, что каждое значение FK указывает на существующую запись в справочнике. СУБД с ограничением FOREIGN KEY не даст записать выплату с несуществующим кодом района.',
'avd-28-0':'Государство как система обладает нелинейностью (эффект непропорционален усилию), эмерджентностью (у целого есть свойства, которых нет у частей), инерционностью и лагами, обратными связями и открытостью внешней среде. Поэтому точное предсказание невозможно.',
'avd-28-1':'Нелинейность — до порога субсидия почти не влияет на занятость. Временной лаг — эффект проявляется через месяцы. Активность и рефлексивность участников — работодатели меняют поведение, приспосабливаясь к правилам субсидии.',
'avd-28-2':'Из свойств систем следует: строить сценарии вместо точечных прогнозов, учитывать лаги при оценке эффекта и отслеживать побочные эффекты решений.',
'avd-29-0':'Эндогенные факторы — внутренние, ими орган управляет (рычаги и промежуточные переменные). Экзогенные — внешние: макроэкономика, погода, демография; их можно только наблюдать и учитывать.',
'avd-29-1':'Безработица снизилась и там, где программы не было, — значит, причина в общем дефиците кадров по стране, а не только в программе. Если этого не учесть, эффект программы будет переоценён.',
'avd-29-2':'Внешние факторы учитывают через контрольную группу («разность разностей» — сравнить изменение с регионами без программы), нормирование (градусо-сутки, реальные цены), сценарии и узлы-неопределённости в диаграмме влияния.',
'avd-29-3':'Аварий стало больше не из-за новых сетей, а из-за аномальных морозов. Без учёта погоды эффект замены будет недооценён; правильно нормировать число аварий на градусо-сутки.',
'avd-30-0':'Правило 3σ предполагает нормальное распределение и большую выборку. Метод IQR опирается на квартили и подходит для любой формы распределения, в том числе асимметричной, как большинство данных ГМУ.',
'avd-30-1':'Точка излома IQR — 25 %: чтобы сдвинуть первый или третий квартиль, нужно испортить четверть данных. У среднего и σ она 0 %.',
'avd-30-2':'Оба метода смотрят на одну переменную (одномерные), не учитывают тренд и сезонность (летний рост — не аномалия) и только сигнализируют: решение, ошибка это или реальное событие, принимает аналитик.',
'avd-30-3':'Два больших значения раздули σ, и граница 3σ отодвинулась до 17,8 млн — аномалий «нет». Квартили почти не изменились, граница IQR — 3,15 млн, и оба проекта отмечены. Проверка показала: один — реальный крупный проект, второй — ошибка единиц (тыс. вместо млн).',
'avd-30-4':'Верно. Данные ГМУ обычно асимметричны: много малых значений и немного больших. Для них 3σ ненадёжно, а IQR устойчив и не требует нормальности.'

EXPL({
'udo-1-0':'В хранилище схема задаётся до записи (schema-on-write): данные очищаются и приводятся к модели при загрузке. В озеро данные кладут «как есть», а структуру определяют при чтении (schema-on-read) — под конкретную задачу. Отсюда главное различие: проверенная отчётность против гибкого сырья.',
'udo-1-1':'Термин Data Lake предложил Джеймс Диксон (Pentaho) в 2010 году: витрина — бутилированная вода, очищенная и упакованная, а озеро — вода в естественном виде, из которой каждый берёт что нужно. Инмон и Кимбалл — авторы подходов к хранилищам, Брюер — теоремы CAP.',
'udo-1-2':'Логи и данные датчиков огромны, однородны по смыслу и меняют формат. Озеро хранит их дёшево в объектном хранилище (S3, Parquet), не требует схемы заранее, сохраняет полную детализацию для машинного обучения, принимает потоки через Kafka и масштабирует хранение отдельно от вычислений.',
'udo-1-3':'Без каталога, метаданных и правил никто не знает, что лежит в озере, откуда данные и можно ли им доверять. Такое озеро называют «болотом данных» (data swamp): данные есть, но использовать их невозможно.',
'udo-1-4':'Сырые логи и показания датчиков нужны для моделей оттока и предиктивного обслуживания — их хранят в озере. Директору нужны проверенные согласованные цифры — отчёт строится из хранилища. Организации часто используют оба контура.',
'udo-2-0':'Модель проката строится вокруг четырёх сущностей: Клиент (кто берёт), Автомобиль (что берут), Пункт проката (где выдают) и Договор проката (факт аренды с датами и суммой). Договор связывает клиента и автомобиль.',
'udo-2-1':'Клиент может заключить много договоров (1:N), в пункте числится много автомобилей (1:N). Клиент за всё время берёт много машин, а машину берут многие клиенты — это M:N, реализованная через Договор. Договор и акт приёма-передачи соотносятся один к одному.',
'udo-2-2':'В нотации «воронья лапка» две черты «||» означают «ровно один» (обязательно и единственный), кружок с лапкой «o<» — «ноль или много». Так на конце связи читают её минимальную и максимальную кардинальность.',
'udo-2-3':'Один клиент может несколько раз взять один и тот же автомобиль (Kia Rio в марте и июне). Пара (клиент, автомобиль) повторяется и не может быть первичным ключом. Поэтому каждому договору дают собственный суррогатный ключ ID_договора.',
'udo-2-4':'Верно. Ассоциативная сущность (Договор) получает внешние ключи обеих сторон связи и собственные атрибуты факта — даты выдачи и возврата, сумму, — которые не принадлежат ни клиенту, ни автомобилю.',
'udo-3-0':'В нотации Гейна — Сарсона: внешняя сущность — прямоугольник с утолщённой рамкой; процесс — скруглённый прямоугольник с номером; накопитель — прямоугольник, открытый с одной стороны, с номером D1, D2; поток — стрелка с названием передаваемых данных. У Йордона процесс — круг, накопитель — две параллельные линии.',
'udo-3-1':'Правила DFD: у каждого процесса есть хотя бы один вход и один выход (иначе это «чёрная дыра» или «чудо»); внешние сущности и накопители не соединяются напрямую — только через процесс; потоки детальной диаграммы должны быть сбалансированы с контекстной.',
'udo-3-2':'Обращение в поддержку проходит путь: приём и регистрация заявки → классификация и назначение исполнителя → диагностика и решение → закрытие и уведомление пользователя → отчётность по обращениям для руководителя.',
'udo-3-3':'Накопители хранят данные между процессами: D1 — сами обращения, D2 — сведения о пользователях и оборудовании, D3 — база знаний с типовыми решениями. Руководитель получает отчёты — это внешняя сущность, а не хранилище.',
'udo-3-4':'Нотацию DFD, используемую в курсе, предложили Крис Гейн и Триш Сарсон в 1979 году. Кодд — автор реляционной модели, Пендс и Крит — теста FASMI, Кливленд и Макгилл — исследования восприятия графиков.',
'udo-4-0':'Реляционные СУБД хранят таблицы со строгой схемой, гарантируют ACID и связывают данные через JOIN, масштабируются в основном вертикально. NoSQL используют гибкую схему, модель согласованности BASE и горизонтальное масштабирование на много узлов.',
'udo-4-1':'Типы NoSQL: ключ–значение — Redis, Tarantool (быстрый доступ по ключу); документные — MongoDB (JSON-документы); колоночные wide-column — Cassandra, HBase (огромные таблицы на кластерах); графовые — Neo4j (узлы и связи).',
'udo-4-2':'Запрос «друзья друзей» в реляционной базе требует многократных JOIN таблицы связей самой с собой, и с глубиной он резко замедляется. Графовая СУБД хранит связи напрямую и обходит граф по ним — это её специализация.',
'udo-4-3':'Кэш сессий — данные вида «ключ (ID сессии) → значение», которые нужны за доли миллисекунды и должны сами исчезать по TTL. Redis хранит их в оперативной памяти и поддерживает срок жизни ключей.',
'udo-4-4':'Эдгар Кодд в 1970 году предложил реляционную модель данных — основу SQL-баз. Эрик Брюер в 2000 году сформулировал теорему CAP: распределённая система не может одновременно гарантировать согласованность, доступность и устойчивость к разделению сети.',
'udo-4-5':'Polyglot persistence — использование нескольких типов СУБД в одной системе, каждая под свою задачу: платежи — в PostgreSQL, профили — в MongoDB, связи — в Neo4j, кэш — в Redis.',
'udo-5-0':'Централизованная система проста и управляема, но её отказ останавливает всё (единая точка отказа). Распределённая устойчива и растёт горизонтально, но сложна и подчиняется ограничениям CAP. Облачная эластична и оплачивается по факту, но создаёт зависимость от провайдера.',
'udo-5-1':'Вертикальное масштабирование (scale up) — замена сервера на более мощный: просто, но есть предел и растущая цена. Горизонтальное (scale out) — добавление узлов: почти без предела, но требует распределённой архитектуры.',
'udo-5-2':'Ч. 8 ст. 13.11 КоАП: за невыполнение требования о локализации баз ПДн юридическое лицо платит 1–6 млн руб., при повторном нарушении (ч. 9) — 6–18 млн руб.',
'udo-5-3':'Ч. 5 ст. 18 № 152-ФЗ в редакции № 23-ФЗ действует с 01.07.2025: при сборе ПДн граждан РФ обработка должна вестись в базах на территории России, и прямо указано, что базы за рубежом не допускаются.',
'udo-5-4':'Оператор ПДн обязан хранить базы в России и защищать их по уровню защищённости. Распределённая архитектура с репликой в другом российском ЦОД даёт отказоустойчивость, а облако допустимо только российское и с подтверждённым уровнем защиты.',
'udo-6-0':'По DAMA-DMBOK2 Data Governance — осуществление полномочий, контроля и совместного принятия решений об управлении данными: кто решает и по каким правилам. Data Management — исполнение планов, политик и практик. Аналогия: аудит задаёт правила и проверяет, бухгалтерия ведёт учёт.',
'udo-6-1':'«Колесо DAMA» включает 11 областей управления данными: архитектура, моделирование, хранение, безопасность, интеграция, документы и контент, мастер- и справочные данные, хранилища и BI, метаданные, качество данных — и Data Governance в центре, связывающее остальные.',
'udo-6-2':'Data Owner — руководитель бизнес-направления, отвечает за доступ и качество своего домена. Data Steward ведёт глоссарий, справочники и контроль качества. Data Custodian — ИТ-специалист, обеспечивающий хранение и техническую защиту. Совет по данным утверждает политики и разрешает споры.',
'udo-6-3':'Расхождение в определении «активного клиента» — спор между доменами, и ИТ не вправе выбирать за бизнес. Совет по данным утверждает единое определение («покупка за последние 90 дней»), и все отчёты считают по нему.',
'udo-6-4':'В госсекторе Data Governance реализуется через НСУД: её концепция утверждена распоряжением Правительства № 1189-р (2019), положение — постановлением № 733 (2021). Ответственного за организацию обработки ПДн назначают по ст. 22.1 № 152-ФЗ.',
'udo-7-0':'Ст. 33 GDPR требует уведомить надзорный орган об утечке в течение 72 часов с момента, когда о ней стало известно. Штраф по ст. 83 — до 20 млн евро или 4 % мирового годового оборота. В России срок первичного уведомления РКН короче — 24 часа.',
'udo-7-1':'Правило резервного копирования 3-2-1: три копии данных (рабочая и две резервные), на двух разных типах носителей, одна из копий хранится вне основной площадки. Так данные переживут и сбой диска, и пожар, и шифровальщика.',
'udo-7-2':'ISO/IEC 27001:2022 задаёт систему менеджмента ИБ и 93 меры защиты в четырёх группах (российский аналог — ГОСТ Р ИСО/МЭК 27001-2021). PCI DSS v4.0.1 — стандарт защиты данных платёжных карт. ГОСТ Р 34.12-2015 — российские блочные шифры.',
'udo-7-3':'Неверно. PCI DSS запрещает хранить CVV/CVC после авторизации платежа в любом виде, даже зашифрованном. Лучшее решение для магазина — принимать оплату на странице эквайера и вообще не хранить данные карт.',
'udo-7-4':'Магазин минимизировал риски: данные карт не хранит (оплата у эквайера), учётные записи защищены MFA, база закрыта от интернета, DLP и SIEM отслеживают аномалии. Поэтому компрометация учётной записи менеджера не превратилась в утечку базы.',
'udo-8-0':'Типичные проблемы данных: выбросы, дубли, несогласованность между системами, пропуски, устаревшие сведения и «тёмные» данные (по Gartner — собранные, но не используемые; они занимают место и создают риски). Нормализация — приём проектирования, а не проблема.',
'udo-8-1':'Z-оценка показывает, на сколько стандартных отклонений значение удалено от среднего. Если по модулю она больше 3, значение считают выбросом — это то же правило трёх сигм. Для асимметричных данных надёжнее IQR.',
'udo-8-2':'Неверно. Выручка «чёрной пятницы» — реальное редкое событие, а не ошибка. Её удаление исказит анализ сезонности и планирование. Удаляют или исправляют только подтверждённые ошибки.',
'udo-8-3':'Один ошибочный ввод (1 250 тыс. вместо 125) поднял среднюю выручку со 128 до 166 тыс. — на 29 %. На эту цифру опирались при закупках, увеличили их на четверть, и склад оказался затоварен.',
'udo-8-4':'Качество обеспечивает система: контроль на входе (форматы, справочники), правила качества в ETL, единая НСИ и MDM, метрики с порогами и стюарды, которые отвечают за данные. Разовая очистка не мешает ошибкам появляться снова.',
'udo-9-0':'Связь стратегий двунаправленная. Бизнес → ИТ: ИТ-стратегия согласуется с целями бизнеса (alignment). ИТ → бизнес: новые технологии открывают возможности (enabling) — например, биометрия позволяет обслуживать удалённых клиентов, — а технические ограничения сужают выбор.',
'udo-9-1':'Хендерсон и Венкатраман в 1993 году предложили модель стратегического соответствия, связывающую бизнес-стратегию, ИТ-стратегию, организационную и ИТ-инфраструктуру. Хуберт Эстерле (Санкт-Галленский университет) — автор концепции бизнес-инжиниринга.',
'udo-9-2':'Карта уровней архитектуры идёт от целей к системам: бизнес- и ИТ-стратегия → бизнес-инжиниринг (процессы и оргструктура) → архитектура ИС → архитектура данных и приложений → техническая архитектура → конкретные корпоративные системы (ERP, CRM, СЭД, DWH/BI).',
'udo-9-3':'Бизнес-инжиниринг переводит стратегию в процессы, оргструктуру и требования к информационным системам. Без него стратегия «отрывается» от ИТ: системы внедряются, но не поддерживают целевые процессы.',
'udo-10-0':'Корневые процессы создают ценность — данные проходят путь: сбор и приём из источников → загрузка и интеграция (ETL/ELT) → хранение и организация → доступ и анализ. Из хранения выходит ещё один процесс — архивирование и удаление.',
'udo-10-1':'Управляющие процессы задают правила и контролируют: политики сроков хранения и доступа, мониторинг SLA, ёмкости и качества. Поддерживающие дают ресурсы: администрирование инфраструктуры, резервное копирование, метаданные и каталог, информационная безопасность.',
'udo-10-2':'По корневым процессам данные меняют форму: сырые данные из источников → очищенные и интегрированные → витрины и агрегаты → отчёты для пользователей.',
'udo-10-3':'RPO (Recovery Point Objective) — допустимая потеря данных, измеряемая временем. При ежечасном резервном копировании в худшем случае пропадут изменения за последний час, значит RPO = 1 час. RTO — допустимое время восстановления.',
'udo-11-0':'Модель интернет-магазина включает Покупателя, Заказ, Позицию заказа (что и сколько в заказе), Товар, Категорию (с иерархией) и Оплату. Пункт проката — сущность из другой модели.',
'udo-11-1':'Позиция заказа описывает связь «заказ — товар». Пара (ID_заказа, ID_товара) уникальна: один товар встречается в заказе один раз (количество — атрибут). Поэтому первичный ключ составной, и обе его части — внешние ключи.',
'udo-11-2':'Поле ID_родителя в таблице Категория ссылается на эту же таблицу: «Чехлы» входят в «Аксессуары», а те — в «Электронику». Связь сущности с самой собой называется рекурсивной.',
'udo-11-3':'Верно. Цена в карточке товара меняется со временем, а заказ должен сохранить ту цену, по которой его оплатили. Поэтому цену продажи копируют в Позицию заказа на момент оформления.',
'udo-11-4':'В заказе два разных товара — смартфон и чехол, поэтому в Позиции заказа две строки: (501, 1017) и (501, 2230). Количество чехлов (2) — атрибут строки, а не повод для второй строки.',
'udo-12-0':'Внешние сущности — участники за границей системы, которые обмениваются с ней данными: Покупатель, Платёжная система, Служба доставки. «Каталог и остатки» хранится внутри системы — это накопитель D1.',
'udo-12-1':'Контекстная диаграмма показывает систему одним процессом «0» с внешними сущностями и задаёт границу; накопителей на ней нет. Уровень 0 раскрывает её на 3–9 процессов с накопителями. Уровень 1 детализирует отдельный процесс: 4 → 4.1, 4.2, 4.3. Внешние потоки уровней должны совпадать.',
'udo-12-2':'Заказ в магазине проходит пять процессов: формирование корзины → ввод данных и оформление → проверка наличия и резервирование товара → оплата → передача заказа в доставку.',
'udo-12-3':'Граница процесса «Оформление заказа» — от выбора товаров покупателем до передачи оплаченного заказа в службу доставки. Закупка у поставщиков и сама доставка — за её пределами.',
'udo-13-0':'Корневые процессы управления данными повторяют жизненный цикл: создание и сбор → интеграция и хранение → обработка и анализ → использование и обмен → архивирование и уничтожение.',
'udo-13-1':'Управляющие процессы задают правила: стратегия данных и Data Governance (совет, CDO), политики и стандарты, контроль соответствия 152-ФЗ и аудит. Поддерживающие обеспечивают: метаданные и НСИ (MDM), управление качеством, ИТ-инфраструктуру и ИБ, обучение и культуру работы с данными.',
'udo-13-2':'Показатель качества («доля заявлений с ошибками») поднимается к управляющему уровню, и тот меняет форму заявления — то есть правила на входе. Это обратная связь, благодаря которой система самонастраивается.',
'udo-14-0':'Пациент посещает многих врачей, врач принимает многих пациентов — связь M:N. Её реализуют ассоциативной сущностью Приём: в каждой строке FK пациента и врача плюс атрибуты визита (дата, жалобы, назначения, диагноз).',
'udo-14-1':'Врач не может вести два приёма в одно и то же время, поэтому пара (ID_врача, Дата_время) уникальна. Это альтернативный (потенциальный) ключ при суррогатном первичном ID_приёма.',
'udo-14-2':'Медицинские сведения — специальная категория ПДн по ст. 10 № 152-ФЗ и одновременно врачебная тайна по ст. 13 № 323-ФЗ. Поэтому в модели предусматривают разграничение доступа: регистратор не видит диагнозы.',
'udo-14-3':'Каждый визит — отдельная строка Приёма: два визита к терапевту и один к кардиологу дают три строки. Именно поэтому PK — суррогатный ID_приёма, а не пара «пациент — врач».',
'udo-14-4':'Слот расписания может быть свободным (без приёма) или занятым одним приёмом, но не двумя. Поэтому связь «Слот — Приём» — 1 : 0..1.',
'udo-15-0':'На карте архитектуры есть три моста. Бизнес-инжиниринг переводит стратегию в процессы. Архитектура ИС и интеграция переводят процессы в требования к ИТ. Горизонтальный мост согласует бизнес- и ИТ-стратегию между собой.',
'udo-15-1':'Обратная связь идёт снизу вверх: фактические показатели из BI, новые возможности технологий, ограничения (сроки, санкции, требования регуляторов) и результаты архитектурного контроля. Курс валют к источникам обратной связи архитектуры не относится.',
'udo-15-2':'Данные BI показали, что 40 % онлайн-заказов клиенты забирают в магазине. Стратегия корректируется по фактам: расширить пункты выдачи и процесс «заказ онлайн — выдача в магазине».',
'udo-16-0':'Схема ETL: источники (CRM, ERP, файлы, API) → Extract (извлечение) → Staging (промежуточная зона с сырой копией) → Transform (преобразование) → Load (загрузка) → DWH → витрины → BI. Сбоку работают метаданные, расписание, журнал и контроль качества.',
'udo-16-1':'В staging сохраняют сырую копию извлечённых данных. Преобразования и повторные проверки выполняют над копией, не обращаясь снова к рабочим CRM и ERP и не нагружая их.',
'udo-16-2':'Полная загрузка заново переносит все данные — так делают при первой загрузке и для небольших справочников. Инкрементальная берёт только изменения (по метке времени, ID, CDC или хэшам) и применяет их через MERGE/upsert — это регулярный режим для больших таблиц.',
'udo-16-3':'На этапе Transform данные очищают и дедуплицируют, приводят к единым форматам дат и валют, сопоставляют со справочниками, присваивают суррогатные ключи, рассчитывают показатели, ведут историю изменений (SCD 2) и маскируют ПДн.',
'udo-16-4':'Справочник на 30 тыс. строк дешевле перезагрузить целиком. Таблица заказов на 50 млн строк — только инкрементально: за ночь переносят около 200 тыс. изменённых строк, и витрины готовы к утру.',
'udo-17-0':'Банк обменивается данными с клиентом, ЕБС/ЕСИА (идентификация), бюро кредитных историй (кредитный отчёт), Росфинмониторингом (сведения по № 115-ФЗ) и платёжной системой (СБП). D1 «Клиенты» — внутренний накопитель.',
'udo-17-1':'Верно. Накопитель не может сам передать данные: стрелка от процесса к накопителю — запись, от накопителя к процессу — чтение. Поэтому накопитель не соединяют напрямую с внешней сущностью или другим накопителем.',
'udo-17-2':'Банк передаёт сведения об операциях в Росфинмониторинг, но ответа не получает — это односторонний поток. С ЕБС и БКИ обмен двусторонний: запрос и ответ.',
'udo-17-3':'Каждая внешняя сущность действует на основании своего закона: ЕБС — № 572-ФЗ о биометрической идентификации; бюро кредитных историй — № 218-ФЗ «О кредитных историях»; Росфинмониторинг — № 115-ФЗ о противодействии отмыванию доходов.',
'udo-17-4':'Ст. 7 № 115-ФЗ обязывает банк хранить документы и сведения об операциях и клиентах не менее 5 лет. Это требование определяет срок хранения в накопителях D1–D3.',
'udo-18-0':'Один товар лежит на многих складах, на складе много товаров — связь M:N. Её реализует сущность Остаток с составным ключом (ID_склада + ID_товара) и атрибутами количества и ячейки хранения.',
'udo-18-1':'Поставщик привозит много товаров, а товар поставляют разные поставщики. Связь M:N реализуется через Поставку (накладная от поставщика на склад) и Позицию поставки (товар, количество и цена закупки).',
'udo-18-2':'Перемещение между складами — отдельный факт с датой, складом-отправителем и складом-получателем. Его моделируют сущностью «Перемещение», а остатки на обоих складах меняются по её строкам.',
'udo-18-3':'Остатки хранятся по парам «склад — товар»: 400 пачек на «Севере» и 250 на «Юге». Общий остаток — сумма по всем складам: 400 + 250 = 650 пачек.',
'udo-19-0':'По Кимбаллу таблица фактов хранит числовые меры событий (количество, выручка) и внешние ключи измерений. Измерения дают контекст: когда (дата), что (товар), где (магазин), кто (клиент), как (канал).',
'udo-19-1':'Зерно — уровень детализации одной строки факта. В модели продаж это позиция чека: одна строка — один товар в одном чеке. Из детального зерна можно получить любые итоги, обратное невозможно.',
'udo-19-2':'Средний чек — отношение выручки к числу чеков. Отношения неаддитивны: средние нельзя суммировать по магазинам или месяцам. Поэтому в факте хранят аддитивные меры, а средний чек считают в BI.',
'udo-19-3':'«Звезда» хранит измерения денормализованными: меньше соединений и быстрые запросы, но атрибуты повторяются. «Снежинка» нормализует измерения (Товар → Подкатегория → Категория): меньше избыточности, больше JOIN. Её выбирают для огромных и общих иерархий.',
'udo-19-4':'Иерархия времени снизу вверх: день → месяц → квартал → год. По ней работают операции детализации и консолидации в кубе.',
'udo-20-0':'Медальонная архитектура Lakehouse: Bronze — сырые данные как из источника; Silver — очищенные и согласованные; Gold — витрины и агрегаты для BI. Каждый слой строится из предыдущего.',
'udo-20-1':'Lakehouse работает поверх файлов Parquet в объектном хранилище с помощью табличных форматов Delta Lake, Apache Iceberg и Apache Hudi. Они добавляют транзакции, версии и контроль схемы. CSV и DOCX такими форматами не являются.',
'udo-20-2':'Табличные форматы дают озеру свойства хранилища: ACID-транзакции, контроль схемы, версионирование (time travel) и быстрый SQL для BI. Данные при этом остаются в дешёвом объектном хранилище.',
'udo-20-3':'Концепцию Lakehouse описали Майкл Армбруст и соавторы (Databricks) в статье на конференции CIDR 2021. Инмон — автор хранилища данных, Диксон — термина Data Lake, Кодд — реляционной модели.',
'udo-20-4':'Журналы сети попадают в Bronze как есть. Очищенный и согласованный справочник абонентов — Silver. Витрины выручки для отчётов — Gold. Отчёты строят по Gold, а модель оттока обучают на Silver.',
'udo-21-0':'Матрица TIME (Gartner) оценивает приложения по ценности для бизнеса и техническому состоянию: Tolerate — терпеть (низкая ценность, хорошее состояние); Invest — развивать (высокая ценность, хорошее состояние); Migrate — заменить (высокая ценность, плохое состояние); Eliminate — вывести (низкая ценность, плохое состояние).',
'udo-21-1':'Система нужна бизнесу, но технически устарела: дорого поддерживать, есть риски отказа. Её функции сохраняют, но переносят на новую платформу — квадрант Migrate.',
'udo-21-2':'AS-IS — текущий ландшафт приложений, TO-BE — целевой. Разрыв между ними превращается в дорожную карту: какие системы заменить, интегрировать или вывести и в каком порядке.',
'udo-21-3':'Постановление Правительства № 1236 установило запрет на допуск иностранного ПО при закупках для государственных и муниципальных нужд и ввело единый реестр российского ПО. Замену CRM выбирают из этого реестра.',
'udo-21-4':'Сравнение по совокупной стоимости владения за 5 лет: старая система ≈ 30 млн руб., новая ≈ 24,5 млн. Замена окупается, поэтому миграция за 18 месяцев, а старая CRM после неё — Eliminate.',
'udo-22-0':'По NIST SP 800-145 IaaS даёт инфраструктуру — виртуальные серверы, хранилища, сети; PaaS — платформу с управляемыми СУБД и средами выполнения; SaaS — готовое приложение по подписке.',
'udo-22-1':'Неверно. В модели разделённой ответственности провайдер SaaS обслуживает всё вплоть до приложения, но за данные, их классификацию и права доступа пользователей всегда отвечает клиент.',
'udo-22-2':'В IaaS клиент управляет ОС, СУБД и приложениями — максимум гибкости и контроля. В PaaS платформу ведёт провайдер. В SaaS клиент только пользуется приложением. Скорость внедрения растёт в обратном порядке.',
'udo-22-3':'PaaS — баланс: управляемый ClickHouse или Greenplum разворачивается за часы без администрирования серверов, а SaaS BI сразу даёт дашборды. При ПДн облако должно быть российским, с договором поручения.',
'udo-22-4':'Облачный провайдер обрабатывает ПДн по поручению оператора. Ч. 3 ст. 6 № 152-ФЗ требует для этого договор, в котором перечислены действия, цели и требования к защите; ответственность перед субъектом остаётся на операторе.',
'udo-23-0':'В SQL схема задаётся заранее, а СУБД проверяет ограничения при каждой записи. В NoSQL поля можно добавлять «на лету», и за корректность отвечает приложение; в MongoDB можно включить JSON Schema.',
'udo-23-1':'Изменение структуры таблицы — миграция командой ALTER TABLE: добавить столбец, изменить тип, создать ограничение. На больших таблицах это требует планирования, зато данные всегда соответствуют схеме.',
'udo-23-2':'Каждая задача — своя СУБД: профили с переменным набором полей — документная MongoDB; граф из миллиардов связей — Neo4j; платежи, где важны транзакции, — PostgreSQL; кэш для мгновенного доступа — Redis.',
'udo-23-3':'Графовые базы поддерживают анализ связей: PageRank (влиятельность узла), выделение сообществ, поиск путей. Запросы к Neo4j пишут на языке Cypher.',
'udo-24-0':'Статическая модель описывает структуру — из чего состоит система: классы, их атрибуты и связи, без времени. Динамическая модель описывает поведение — что система делает: сценарии, последовательности действий, смену состояний.',
'udo-24-1':'Диаграммы классов, объектов и компонентов UML показывают структуру — это статическая модель. Диаграммы вариантов использования, последовательности, деятельности и состояний описывают поведение — динамическая модель.',
'udo-24-2':'В диаграмме вариантов использования система — «чёрный ящик»: видно, какие функции она выполняет для акторов (покупатель, платёжная система), но не видно, как устроена внутри.',
'udo-24-3':'Композиция (закрашенный ромб) означает, что часть не существует без целого: позиции заказа создаются и удаляются вместе с заказом. Кратность 1 — 1..∗: в заказе хотя бы одна позиция.',
'udo-24-4':'Отношение «include» означает обязательное включение: каждый раз при выполнении «Оформить заказ» выполняется и «Оплатить заказ». «Extend» — необязательное расширение при условии.',
'udo-25-0':'Scale up — один более мощный сервер: просто для приложения, но есть физический предел, а цена растёт быстрее мощности. Scale out — много обычных узлов: рост почти без предела и отказоустойчивость, но сложная координация данных.',
'udo-25-1':'Сервис масштабируют поэтапно: сначала делают серверы приложений без состояния и автоматически добавляют их; затем снимают нагрузку кэшем Redis и CDN; затем выносят чтение на реплики; затем шардируют базу по ID пользователя; затем разносят задачи по специализированным хранилищам и очередям Kafka.',
'udo-25-2':'Распределённая архитектура опирается на шардирование (данные делятся между узлами, например по ID пользователя) и репликацию (копии данных на нескольких узлах для чтения и отказоустойчивости).',
'udo-25-3':'По примеру курса платформа сначала увеличила сервер с 16 до 64 ядер, затем вынесла сессии в Redis, добавила три реплики для чтения и разделила данные на 8 шардов по ID пользователя.',
'udo-26-0':'В ELT данные загружаются в хранилище без изменений, а преобразуются внутри него: SQL-запросами, инструментом dbt или Spark. Мощности хранилища заменяют отдельный ETL-сервер.',
'udo-26-1':'ELT распространился с облаками: появились мощные MPP- и колоночные движки, хранение отделилось от вычислений, ресурсы стали эластичными, а машинному обучению нужны сырые данные. Инструменты вроде dbt упростили преобразования внутри хранилища.',
'udo-26-2':'Если сырые данные содержат ПДн, их маскируют или хэшируют ещё на входе — схема ETLT (небольшое преобразование до загрузки). Каталог данных не даёт озеру превратиться в «болото».',
'udo-26-3':'В ELT сырые клики за два года сохранены. Когда меняется определение «сессии», витрины просто пересчитывают из сырых данных за часы. В ETL исходник был бы потерян после преобразования.',
'udo-27-0':'Эдгар Кодд в 1993 году ввёл термин OLAP (оперативная аналитическая обработка) и 12 правил для таких систем. Кимбалл — автор размерной модели, Пендс и Крит — теста FASMI (1995).',
'udo-27-1':'OLAP-система включает: источники (OLTP-системы) → ETL → хранилище и витрины → OLAP-сервер, который строит кубы → метаданные → клиентские BI-инструменты, через которые аналитик работает с кубом.',
'udo-27-2':'По способу хранения OLAP-серверы бывают MOLAP (куб в собственном многомерном хранилище, максимальная скорость), ROLAP (данные в реляционной базе, запросы SQL) и HOLAP (гибрид: агрегаты в кубе, детали в реляционной базе).',
'udo-27-3':'Верно. OLTP нормализуют до 3НФ, чтобы быстро и без аномалий записывать транзакции. OLAP денормализуют в «звезду» и хранят по столбцам, чтобы быстро агрегировать большие объёмы.',
'udo-28-0':'По ч. 5 ст. 18 № 152-ФЗ запись, систематизация, накопление, хранение и уточнение ПДн граждан РФ при сборе ведутся с использованием баз на территории России. ЦОД первичной записи должен быть в РФ; шифрование этого требования не снимает.',
'udo-28-1':'Ограничения облака: передача копий за рубеж — после уведомления РКН (ч. 3 ст. 12); поручение обработки провайдеру оформляется договором (ч. 3 ст. 6); ответственность перед субъектом всё равно несёт оператор (ч. 5 ст. 6).',
'udo-28-2':'Данные о здоровье — специальная категория, субъектов 300 тыс. (больше 100 000), угрозы 3-го типа. По ПП № 1119 это УЗ-2, и меры защиты выбирают по приказу ФСТЭК № 21 для этого уровня.',
'udo-28-3':'Курс рекомендует гибридную архитектуру в российском контуре: критичные данные — в частном облаке или своём ЦОД с репликой в другом городе, массовые сервисы — в аттестованном сегменте российского облака.',
'udo-29-0':'Измеримые характеристики качества по DAMA-DMBOK и ISO/IEC 25012: полнота, точность, согласованность между системами, своевременность, валидность (соответствие формату и правилам), уникальность и целостность (корректные ссылки).',
'udo-29-1':'Метрика полноты — доля заполненных записей: (всего − пустые) / всего × 100 %. Так каждую характеристику выражают долей записей, удовлетворяющих правилу, и сравнивают с порогом.',
'udo-29-2':'Метрику задают по шагам: объект и правило (поле «телефон» заполнено) → формула → базовый уровень (как сейчас) → пороги «зелёный — жёлтый — красный» по влиянию на бизнес → владелец, периодичность и действия при нарушении.',
'udo-29-3':'Полнота = (1000 − 30) / 1000 × 100 % = 97 %. При пороге 95 % для телефона показатель в «зелёной» зоне.',
'udo-29-4':'Одна область записана в CRM тремя способами и распалась на три строки: в рейтинге она оказалась седьмой вместо второй, и ей урезали бюджет. Решение — единая НСИ: справочник регионов с кодами ОКТМО, обязательный для всех систем.',
'udo-30-0':'Мастер-данные — ключевые сущности, общие для многих процессов: клиенты, товары, поставщики. Транзакционные — события: заказы, платежи. Метаданные — данные о данных (структура, происхождение). Справочные — классификаторы: ОКВ (валюты), ОКСМ (страны), ОКЕИ (единицы измерения).',
'udo-30-1':'«Золотую запись» получают так: стандартизируют записи из всех источников → сопоставляют, находя одного и того же клиента → сливают по правилам выживания → ведут перекрёстные ссылки ID_MDM на исходные ID → публикуют в системы-потребители → спорные случаи разбирают стюарды.',
'udo-30-2':'Ложное несовпадение — один клиент остаётся тремя записями, и его история разорвана. Ложное совпадение — разных людей (однофамильцев) сливают в одну запись, и их данные смешиваются. Пороги сопоставления балансируют эти риски.',
'udo-30-3':'Для нечёткого сопоставления строк (ФИО с опечатками) используют расстояние Левенштейна (число правок) и меру Джаро — Винклера (сходство с учётом начала строки). Пары со сходством выше 0,95 сливают автоматически, от 0,80 до 0,95 — передают стюарду.',
'udo-30-4':'Правила выживания решают, какое значение атрибута попадёт в золотую запись: из более надёжного источника (приоритет), более свежее или более полное. Так ФИО берут из CRM, адрес — из биллинга, e-mail — из интернет-магазина.'
});

и уничтожение; документирование делает решение проверяемым."}, {"d": "ebod", "q": 5, "title": "Данные как стратегический актив и управление данными", "plan": "почему данные — актив → четыре цели использования → компоненты и роли управления данными → уровни и национальная система управления данными → пример.", "anch": "отличия от материального актива: не расходуются при использовании, обесцениваются, несут риск. Цели: обоснование решений, проактивные услуги, контроль и надзор (риск-ориентированный), стратегическое планирование. Роли (DAMA-DMBOK): владелец данных отвечает за качество, распорядитель (стюард) ведёт данные, ИТ даёт инструменты. Государственный уровень — НСУД (постановления Правительства № 710 и № 733), стратегическая рамка — Указ № 203.", "ex": "реестр записей к врачу регионального минздрава: владелец — начальник отдела организации медпомощи, распорядитель — специалист справочников, архитектор — сотрудник центра информатизации, связывающий реестр с ЕГИСЗ.", "concl": "данные — стратегический актив, управлять которым нужно системно с распределёнными ролями: за качество отвечает бизнес-владелец, а не ИТ."}, {"d": "ebod", "q": 6, "title": "Качество и достоверность данных", "plan": "шесть критериев качества → ошибка измерения и ошибка отбора → три формы адекватности → пять критериев достоверности источника → инструменты → пример.", "anch": "критерии качества: точность, полнота, непротиворечивость, актуальность, уникальность, репрезентативность. Адекватность: синтаксическая, семантическая, прагматическая. Достоверность источника: первичность, полномочия, регламент, методика, прослеживаемость. Рамка — постановление № 710, DAMA-DMBOK.", "ex": "средства на ямочный ремонт распределяли по числу жалоб: в 4 % записей адрес в поле «Описание» (ошибка измерения), на окраинах с пожилым населением жалоб втрое меньше при худших дорогах (ошибка отбора) → добавили данные диагностики дорог.", "concl": "корректные данные ещё не пригодны: нужна прагматическая адекватность задаче; качество обеспечивается контролем на входе и регулярным аудитом."}, {"d": "ebod", "q": 7, "title": "Этика данных и этические дилеммы государственных решений", "plan": "«можно ли» и «следует ли» → пять рисков алгоритмического управления → дилеммы и их разрешение → нормативная рамка → этическая экспертиза → пример.", "anch": "риски: предвзятость, социальный скоринг, слежка, цифровое неравенство, «чёрный ящик». Меры: соразмерность, прозрачность, контроль человека, экспертиза до запуска; запрет решений исключительно на автоматизированной обработке — ст. 16 № 152-ФЗ. Рамка: принципы п. 19 Национальной стратегии развития ИИ (Указ № 490), ГОСТ Р 59276-2020, кодексы этики (2019, 2021), требования ФСТЭК к ИИ.", "ex": "центр занятости хочет ранжировать безработных по «перспективности»: основание есть, но модель занижает рейтинг людей старше 50 лет и жителей сёл → корректировка признаков, решение принимает человек.", "concl": "право отвечает на вопрос «можно ли», этика — «следует ли»; риски снимаются соразмерностью, прозрачностью и контролем человека."}, {"d": "ebod", "q": 8, "title": "Система правового регулирования персональных данных и регуляторы", "plan": "пять уровней регулирования → сфера действия и цель № 152-ФЗ → регуляторы → этапы развития → пример.", "anch": "уровни: Конституция (ст. 23, 24) → № 152-ФЗ и смежные законы → акты Правительства (№ 1119 — уровни защищённости; № 687 — без автоматизации) → акты ФСТЭК (№ 21, № 117) и ФСБ (№ 378) → локальные акты оператора. Регуляторы: Роскомнадзор — права субъектов (ст. 23), ФСТЭК — техническая защита, ФСБ — криптография. Вехи: 2006 — принятие закона; 2011 — № 261-ФЗ; 2014 — локализация (№ 242-ФЗ); 2022 — № 266-ФЗ; 2024 — оборотные штрафы (№ 420-ФЗ) и ст. 272.1 УК (№ 421-ФЗ); 2025 — № 23-ФЗ, № 156-ФЗ.", "ex": "электронный журнал управления образования: основания и сведения о здоровье — ст. 6, 10 № 152-ФЗ; уровень защищённости — постановление № 1119; меры — приказ ФСТЭК № 21 (как ГИС — № 117).", "concl": "регулирование выстроено в пять уровней; Роскомнадзор — права субъектов, ФСТЭК — техзащита, ФСБ — криптография."}, {"d": "ebod", "q": 9, "title": "Понятие и категории персональных данных; биометрия", "plan": "определение и признаки → категории → биометрия → оператор ПДн и оператор ИС → пример.", "anch": "ПДн — любая информация о прямо или косвенно определённом или определяемом физлице (п. 1 ст. 3 № 152-ФЗ). Категории: общие; специальные — раса, политические взгляды, религия, здоровье, интимная жизнь (ст. 10); биометрические (ст. 11 — только если используются для установления личности); разрешённые для распространения (ст. 10.1); обезличенные (ст. 13.1). Биометрия собирается в ЕБС (№ 572-ФЗ). Оператор ПДн (п. 2 ст. 3) ≠ оператор ИС (п. 12 ст. 2 № 149-ФЗ).", "ex": "анкета на субсидию на газификацию: ФИО, СНИЛС, адрес — общие; инвалидность — специальная; фото в анкете — не биометрия, пока не используется для установления личности.", "concl": "удаление фамилии не устраняет косвенную определяемость; каждая категория — свои условия обработки."}, {"d": "ebod", "q": 10, "title": "Принципы обработки персональных данных", "plan": "шесть принципов в семи частях ст. 5 → одновременное применение → двухшаговая проверка → примеры нарушений → пример проверки.", "anch": "ст. 5 № 152-ФЗ: законность и справедливость (ч. 1); ограничение целью (ч. 2); недопустимость объединения несовместимых баз (ч. 3); минимизация — соответствие содержания и объёма целям (ч. 4, 5); точность и актуальность (ч. 6); ограничение срока хранения и уничтожение (ч. 7). Наличие основания по ст. 6 не снимает принципов.", "ex": "комитет культуры хочет выгрузить ФИО, даты рождения, адреса участников мероприятий для анализа «охвата»: шаг 1 — цель законна; шаг 2 — достаточно возрастной группы и поселения → данные агрегируются.", "concl": "принципы действуют одновременно; любая операция проверяется в два шага — законная цель, затем необходимый состав данных."}, {"d": "ebod", "q": 11, "title": "Правовые основания обработки ПДн и согласие субъекта", "plan": "двенадцать оснований ч. 1 ст. 6 → базовое основание органа власти → требования к согласию → согласие на распространение и обезличенные данные → алгоритм выбора → пример.", "anch": "ч. 1 ст. 6 № 152-ФЗ: п. 1 — согласие; п. 2 — договор или закон; п. 3 — правосудие; п. 4 — исполнение полномочий органов и предоставление госуслуг (базовое для органа); п. 5 — договор с субъектом; п. 6 — жизнь и здоровье; п. 7 — права оператора; п. 8 — журналистика, наука; п. 9 — статистика при обезличивании; п. 10 утратил силу — общедоступность не основание; п. 11 — опубликование по закону. Согласие: свободно, конкретно, информированно, однозначно (ч. 1 ст. 9); с 01.09.2025 — отдельным документом (№ 156-ФЗ); отзыв (ч. 2), бремя доказывания на операторе (ч. 3), письменная форма — ч. 4 ст. 9. Распространение — отдельное согласие (ст. 10.1).", "ex": "МФЦ включал «согласие» в бланк заявления о регистрации: обработка ведётся по п. 4 ч. 1 ст. 6, согласие не нужно, а с 01.09.2025 вписывать его в бланк нельзя.", "concl": "для органа основание — полномочия; согласие «на всякий случай» вредно; общедоступность — не основание."}, {"d": "ebod", "q": 12, "title": "Права субъекта ПДн и обязанности органа-оператора", "plan": "шесть прав → корреспондирующие обязанности и сроки → обязанности при сборе → как орган обеспечивает доступ и уточнение → пример.", "anch": "права: доступ к своим данным, уточнение, блокирование и уничтожение (ст. 14); отзыв согласия (ч. 2 ст. 9); обжалование в РКН или суд (ст. 17); возмещение вреда (ст. 17, 24); дополнительно — запрет решений исключительно на автоматизированной обработке (ст. 16). Сроки: ответ на запрос — 10 рабочих дней (+5) (ч. 1 ст. 20); уточнение — 7 рабочих дней (ч. 3 ст. 20, ч. 2 ст. 21); прекращение неправомерной обработки — 3 рабочих дня (ч. 3 ст. 21); уничтожение по достижении цели — 30 дней (ч. 4 ст. 21). При сборе: цель и основание, политика (ст. 18.1), ответственный (ст. 22.1), запрет зарубежных баз (ч. 5 ст. 18), меры защиты.", "ex": "гражданин спросил департамент соцзащиты, какие сведения о нём хранятся и кому передавались: через 8 рабочих дней — перечень, цели, передача в Социальный фонд по СМЭВ, сроки; найденная ошибка в адресе исправлена за 7 дней.", "concl": "каждому праву соответствует обязанность с жёстким сроком: 10 — 7 — 3 — 30."}, {"d": "ebod", "q": 13, "title": "Требования к защите персональных данных", "plan": "порядок определения требований → меры приказа ФСТЭК № 21 и криптография → обработка без автоматизации → три линейки требований → организационные меры → пример.", "anch": "обязанность защищать — ч. 1 ст. 19 № 152-ФЗ. Порядок: категория ПДн → тип угроз (1 — недекларированные возможности системного ПО, 2 — прикладного ПО, 3 — нет таких угроз) → число субъектов (100 000) → уровень защищённости УЗ-1…УЗ-4 (ПП № 1119) → меры (приказ ФСТЭК № 21) → при шифровании — приказ ФСБ № 378. Без автоматизации — ПП № 687. Три линейки: УЗ ПДн, класс ГИС (приказ ФСТЭК № 117), категория объекта КИИ (ПП № 127) — при совпадении берётся наивысшее.", "ex": "реестр получателей мер соцподдержки: 180 тыс. граждан, доходы и инвалидность, угрозы 3-го типа → специальные данные более 100 тыс. → УЗ-2; одновременно ГИС — класс по приказу № 117, применяется более строгое.", "concl": "уровень защищённости определяется формально, а он задаёт перечень мер; шкалы УЗ, класса ГИС и категории КИИ не путать."}, {"d": "ebod", "q": 14, "title": "Трансграничная передача и уведомления Роскомнадзора", "plan": "понятие и уведомительный порядок → государства из перечня и вне его → соотношение с запретом зарубежных баз → уведомление об обработке → уведомление об инциденте 24/72 → пример.", "anch": "трансграничная передача — п. 11 ст. 3 № 152-ФЗ; с 01.03.2023 — уведомление РКН до начала (ст. 12, № 266-ФЗ); в государства вне перечня — после 10 рабочих дней рассмотрения; критерий перечня — соответствие Конвенции 108 (№ 265-ФЗ). Запрет зарубежных баз при сборе — ч. 5 ст. 18 (№ 23-ФЗ). Уведомление об обработке — ст. 22 (исключения после 01.09.2022 — только три). Инцидент: 24 часа — первичное, 72 часа — по итогам расследования (ч. 3.1 ст. 21); параллельно — ГосСОПКА (ч. 12 ст. 19).", "ex": "центр отдыха детей хотел использовать зарубежный сервис опросов — нарушение ч. 5 ст. 18; правильно: сбор российским сервисом, передача данных о группе принимающей стороне — после уведомления РКН.", "concl": "передача не отменяет локализации; уведомления — об обработке, передаче и инцидентах — самостоятельные обязанности."}, {"d": "ebod", "q": 15, "title": "Ответственность и действия при утечке ПДн", "plan": "четыре вида ответственности → оборотные штрафы и ответственность в госоргане → ст. 272.1 УК → алгоритм из семи шагов → структура ущерба → пример.", "anch": "дисциплинарная (ст. 57, подп. «в» п. 3 ч. 1 ст. 37 № 79-ФЗ); гражданско-правовая (ст. 24 № 152-ФЗ, ст. 151 ГК); административная — ст. 13.11 КоАП (ред. № 420-ФЗ, с 30.05.2025): неуведомление об инциденте — ч. 11, утечки — ч. 12–14 (организации — 3–15 млн руб.), спецкатегории и биометрия — ч. 16, 17, повторная — ч. 15, 18: оборотный штраф 1–3 % выручки, не менее 20/25 млн и не более 500 млн — только коммерческим операторам; в органе власти — должностные лица. Уголовная — ст. 272.1 УК (№ 421-ФЗ, с 11.12.2024; до 10 лет). Шаги: зафиксировать → локализовать → РКН за 24 часа → НКЦКИ (приказ ФСБ № 77) → расследование → РКН за 72 часа → устранить причины.", "ex": "специалист ЖКХ отправил таблицу на 3 200 получателей компенсации не тому адресату → удаление с подтверждением, уведомление РКН в тот же день, служебная проверка.", "concl": "четыре вида ответственности; при утечке — не скрывать, соблюдать 24/72 и сохранять доказательства."}, {"d": "ebod", "q": 16, "title": "Открытые данные: понятие, принципы, правовые основы", "plan": "определение и признаки → принципы и «пять звёзд» → правовая основа → режимы раскрытия → условия правомерности → соотношение с ПДн → пример.", "anch": "открытые данные — общедоступная информация в машиночитаемом формате для повтор т → обратная связь → расширение. Матрица «польза × риск» (№ 8-ФЗ, ст. 7 № 149-ФЗ, № 152-ФЗ).", "ex": "проект «Карта ДТП» по данным Госавтоинспекции показывает очаги аварийности → жители добиваются светофоров и ограждений.", "concl": "ценность открытых данных создаётся их использованием, а не публикацией."}, {"d": "ebod", "q": 19, "title": "Риски публикации, мозаичный эффект и этика OSINT", "plan": "риски → мозаичный эффект → исследования реидентификации → восемь мер → этика и границы OSINT → пример.", "anch": "риски: раскрытие ПДн и служебных сведений, реидентификация, угрозы объектам. Мозаичный эффект — эмерджентный: опасно сочетание безвредных наборов. Меры: удалить прямые идентификаторы → оценить квазиидентификаторы → огрубить точность → агрегировать группы менее 5 записей → проверить связывание с другими наборами → экспертиза до публикации (ответственный за ПДн и служба защиты) → регламент отзыва набора (ч. 6 ст. 7 № 149-ФЗ) → документирование решения. Нормы: ч. 5, 6 ст. 7 № 149-ФЗ; ст. 3, 13.1 № 152-ФЗ; OSINT — ст. 137, 272, 272.1 УК, ст. 13 № 144-ФЗ.", "ex": "набор «Результаты олимпиад» без ФИО, но с «школа, класс, год рождения, ОВЗ»: в сельской школе один девятиклассник → ребёнок узнаваем, ОВЗ — сведения о здоровье → огрубить и агрегировать.", "concl": "риск нельзя оценить по одному набору; меры принимаются до публикации."}, {"d": "ebod", "q": 20, "title": "Информационная безопасность и триада КЦД", "plan": "понятие → триада → техническое и правовое значения конфиденциальности → дополнительные свойства → цепочка угрозы → пример.", "anch": "безопасность информации — состояние защищённости, при котором обеспечены конфиденциальность, целостность, доступность (п. 2.4.5 ГОСТ Р 50922-2006). Конфиденциальность: техническая (свойство системы) и правовая (обязанность лица, п. 7 ст. 2 № 149-ФЗ). Дополнительно: аутентичность, неотказуемость, подотчётность. Цепочка: источник угрозы → уязвимость → способ реализации → последствия; управлять можно уязвимостями.", "ex": "в З , "plan": "ETL → ELT и отличия → когда ELT предпочтительнее.", "anch": "ETL — преобразование до загрузки на отдельном сервере; ELT — загрузка «как есть» и преобразование внутри мощного хранилища (ClickHouse, Greenplum, облако). ELT — при больших объёмах, разнородных данных, нужде в сырых данных; ETL — при умеренных объёмах и требовании очистить и защитить данные до загрузки.", "ex": "ЦУР собирает миллионы сообщений из соцсетей, портала обратной связи и датчиков в сутки → ELT: сырое в хранилище, преобразование SQL-запросами.", "concl": "ETL и ELT различаются местом и моментом преобразования."}, {"d": "avd", "q": 6, "title": "Преимущества SQL перед Excel при больших массивах данных", "plan": "различия инструментов → целостность → типизация → автоматизация и воспроизводимость → память и масштаб → пример.", "anch": "SQL — декларативный язык к реляционной СУБД на сервере; ключи и ограничения (PRIMARY KEY, FOREIGN KEY, NOT NULL, CHECK); строгие типы; запрос — воспроизводимый сценарий; Excel ограничен 1 048 576 строками и памятью компьютера.", "ex": "сумма выплат по районам из таблицы фактов на 3 млн строк — один запрос: SELECT r.name, SUM(p.amount) … JOIN regions … WHERE период … GROUP BY r.name; в Excel пришлось бы сводить несколько файлов, каждый не помещается на лист.", "concl": "при больших массивах SQL выигрывает по целостности, типизации, автоматизации и масштабу; Excel — для небольших расчётов и оформления."}, {"d": "avd", "q": 7, "title": "F- и Z-паттерны сканирования экрана и размещение KPI", "plan": "паттерны внимания → правило 30 секунд → куда помещать KPI.", "anch": "F-паттерн (исследования Nielsen Norman Group) — для текстовых и табличных отчётов; Z-паттерн — для обзорных дашбордов: левый верхний угол — вход, правый нижний — завершение. Правило 30 секунд: руководитель должен увидеть статус и «красную зону» за первые 30 секунд. Главный KPI — в левом верхнем углу.", "draw": "экран с траекториями F и Z; KPI-карточка слева вверху, детализация ниже.", "ex": "дашборд губернатора по нацпроекту: слева вверху красная карточка «87 % (план 95 %)», справа — исполнение бюджета, ниже — графики по муниципалитетам.", "concl": "расположение элементов должно совпадать с траекторией взгляда."}, {"d": "avd", "q": 8, "title": "Столбчатая и круговая диаграммы с точки зрения восприятия", "plan": "назначение → почему длина точнее угла и площади → пример ошибки → когда круговая допустима.", "anch": "Кливленд и Макгилл (1984): точнее всего положение на общей шкале и длина, хуже — угол и площадь; принцип «Длина > Площадь». Круговая — только доли целого, не больше 5–6 секторов, сумма 100 %.", "ex": "перераспределение бригад ЖКХ по доле жалоб на отопление: круговая из 12 районов с долями 6–11 % — секторы неразличимы → столбчатая с сортировкой; ошибка и «исполнение бюджета по программам» на круговой, где сумма не 100 %.", "concl": "столбчатая — для сравнения и ранжирования, круговая — для простой структуры из немногих долей."}, {"d": "avd", "q": 9, "title": "Визуальный шум в дашбордах", "plan": "понятие → почему шум ухудшает решения → три примера → как устранить.", "anch": "визуальный шум — оформление без информации (chartjunk, Э. Тафти; принцип максимума «данные/чернила»). Примеры: 3D-круговая с тенями (искажает доли), избыточная сетка и фоновые картинки, случайный цвет без смысла; также обрезанная ось Y, «График 1» вместо заголовка-вывода.", "ex": "3D-диаграмма: ближний сектор 18 % выглядит больше дальнего 22 % — руководитель делает обратный вывод.", "concl": "шум перегружает внимание и маскирует отклонения; удалять всё, что не несёт данных, цвет — только со смыслом."}, {"d": "avd", "q": 10, "title": "Четыре критерия определения границ системы", "plan": "зачем границы → четыре критерия → проблема размытых границ → пример.", "anch": "критерии: юридический (полномочия и НПА ведомства), ресурсный (бюджет, штат, имущество), информационный (своя отчётность и ГИС), управляемости (контуры контроля, влияния и наблюдения). Факторы делятся на рычаги, промежуточные переменные и внешние факторы.", "ex": "снижение жалоб на теплоснабжение: внутри — полномочия минЖКХ и ГЖИ, программа капремонта, данные ГИС ЖКХ; снаружи — погода, тарифная политика федерального уровня.", "concl": "четыре критерия разделяют, чем орган управляет, а что только учитывает; размытые границы ведут к ответственности за неуправляемое."}, {"d": "avd", "q": 11, "title": "Положительная и отрицательная обратная связь", "plan": "понятие → различие → знак не равен оценке → значение для управления.", "anch": "положительная (усиливающая, R-петля) — «снежный ком»: инвестиции → инфраструктура → ниже издержки → выше привлекательность → новые инвестиции. Отрицательная (стабилизирующая, B-петля) — возврат к равновесию: рост тарифов → жалобы → проверки ГЖИ → корректировка тарифов. «Положительная» не значит «хорошая»: может раскручивать и кризис.", "ex": "отток молодёжи: закрытие школ → отъезд семей → меньше детей → закрытие новых школ (порочный круг, R-петля).", "concl": "положительная связь усиливает отклонение, отрицательная стабилизирует; знак — про механизм, а не про результат."}, {"d": "avd", "q": 12, "title": "Диаграммы влияния и техническое задание для BI", "plan": "понятие и назначение → место в моделировании → переход к ТЗ → пример.", "anch": "диаграмма влияния — граф причинно-следственных связей между решениями, неопределённостями и целью. Переход в ТЗ: решение → фильтр, срез, параметр сценария; переменная → график динамики; результат → крупная KPI-карточка; стрелка → связь таблиц, формула; узлы-решения и факторы → справочники; узлы-результаты → витрины.", "draw": "прямоугольники-решения → овалы-переменные → ромб-цель «Жалобы на портале».", "ex": "социальная напряжённость в ЖКХ: «тарифы на капремонт» и «плановые проверки ГЖИ» — фильтры-параметры; погода и износ сетей — графики; число жалоб — KPI.", "concl": "диаграмма влияния — каркас ТЗ: определяет фильтры, графики, KPI, расчёты и источники."}, {"d": "avd", "q": 13, "title": "Типы узлов диаграмм влияния", "plan": "общая характеристика → типы узлов → правила построения → пример.", "anch": "решение — прямоугольник (рычаг: субсидии, график проверок); неопределённость или промежуточная переменная — овал (инфляция, число заявителей); результат, ценность — ромб или восьмиугольник (уровень бедности); влияние — стрелка. Правила: начинать с результата и идти «назад» к причинам; про каждый узел спрашивать «кто им управляет?» (субъект — прямоугольник, среда — овал); каждая стрелка объяснима; узлы, не связанные с результатом, удалять.", "ex": "оценка соцподдержки: решения — финансирование льгот и информирование; внешний фактор — демография; переменные — численность нуждающихся и охват; результат — реальный доход льготников.", "concl": "три типа узлов и стрелки формализуют управленческую задачу."}, {"d": "avd", "q": 14, "title": "Элементы OLAP-куба и группы измерений", "plan": "понятие куба → элементы → группы измерений → связь с реляционной моделью.", "anch": "факты (меры) — агрегируемые числа; измерения — контекст; элементы (члены) — «2026», «Кировский район»; иерархии и уровни (год → квартал → месяц); ячейка — пересечение; агрегаты — предрасчитанные итоги. Группы измерений: время (когда), география (где), объекты, отрасли (что), субъекты (кто). Реляционно — схема «звезда».", "draw": "куб: ГЕОГРАФИЯ × ОТРАСЛЬ × ВРЕМЯ, выделенная ячейка с фактом.", "ex": "ячейка «Кировский район × ЖКХ × I квартал 2026» = выделено 15 млн руб.", "concl": "куб — факты на пересечении измерений с иерархиями."}, {"d": "avd", "q": 15, "title": "Операции над OLAP-кубом", "plan": "назначение → срез → вращение → консолидация → детализация → сценарий.", "anch": "срез (slice, dice) — фиксация значений измерений; вращение (pivot) — смена осей отчёта; консолидация (roll-up) — переход вверх по иерархии; детализация (drill-down) — вниз до первичных записей.", "ex": "консолидация — расходы на соцподдержку региона за 2026 год +12 % → срез по категории «Ветераны» → вращение: районы в строках, кварталы в столбцах — выделяется Заволжский район в III квартале → детализация до месяцев и получателей — дубли после сбоя выгрузки.", "concl": "четыре операции дают интерактивный цикл анализа «общее → частное»."}, {"d": "avd", "q": 16, "title": "Вычисляемый столбец и мера в DAX", "plan": "язык DAX → время вычисления и память → контексты → когда что выбирать → пример.", "anch": "вычисляемый столбец — вычисляется при загрузке, хранится в модели, занимает память, контекст строки, не реагирует на фильтры; мера — вычисляется «на лету» при запросе, не хранится, контекст фильтра, реагирует на срезы. Столбец — для атрибутов фильтрации и группировки; мера — для агрегатов и KPI.", "ex": "«Возрастная группа» — вычисляемый столбец в справочнике получателей (срез); «Сумма выплат», «Средняя выплата» — меры.", "concl": "если результат нужен как срез — столбец, если как показатель — мера."}, {"d": "avd", "q": 17, "title": "Self-Service BI в ГМУ", "plan": "понятие → актуальность для ГМУ → организационные риски → технические риски → как снижать.", "anch": "Self-Service BI — пользователи сами строят отчёты на подготовленных данных без ИТ-службы. Организационные риски: «зоопарк» отчётов и разные версии правды, низкая грамотность в данных, размытая ответственность, сопротивление, «теневая» аналитика. Технические: безопасность и ПДн (152-ФЗ), качество «сырых» выгрузок, нагрузка на ГИС, производительность, зависимость от облака. Снижение: Data Governance (владельцы, каталог показателей), сертифицированные датасеты и витрины, ролевой доступ и обезличивание, обучение и стандарты, гибридная модель «ИТ — данные, бизнес — анализ».", "ex": "у трёх отделов разное «число получателей» на совещании → единая сертифицированная витрина и мера.", "concl": "Self-Service BI ускоряет решения, если опирается на управляемые данные."}, {"d": "avd", "q": 18, "title": "Четыре сущности архитектуры Yandex DataLens", "plan": "характеристика DataLens → четыре сущности → логическая последовательность → пример.", "anch": "подключение (доступ к источнику: PostgreSQL, ClickHouse, CSV) → датасет (поля, типы, связи, вычисляемые поля) → чарт (визуализация) → дашборд (чарты, селекторы, вкладки). Дополнительно — воркбуки и коллекции. Изменение на нижнем уровне распространяется наверх.", "draw": "цепочка «Источник → Подключение → Датасет → Чарт → Дашборд».", "ex": "«Мониторинг обращений в сфере ЖКХ»: подключение к PostgreSQL портала → датасет с ОКТМО и полем «Просрочено» → чарты KPI и карта → дашборд для заместителя главы.", "concl": "четыре последовательные сущности разделяют доступ, логику данных, визуализацию и интерфейс."}, {"d": "avd", "q": 19, "title": "Виды геовизуализации", "plan": "значение геоаналитики для ГМУ → виды → требования к данным.", "anch": "точечная карта (где объекты: школы, ДТП); тепловая (где концентрация: жалобы на отопление); фоновая картограмма (choropleth — сравнение территорий по относительному показателю: безработица); картодиаграмма (абсолютные величины значком: субсидии); карта потоков (перемещения: маятниковая миграция). Данные: координаты WGS 84 или нормализованные адреса (ФИАС/ГАР) с геокодированием; контроль ошибок (точки 0;0 — перепутанные широта и долгота); справочник ОКТМО для полигонов.", "ex": "тепловая карта жалоб показала кластер протечек кровли в одном микрорайоне → внеплановая проверка управляющей компании.", "concl": "вид карты выбирается по вопросу: где, где больше, как различаются территории, сколько, куда движется."}, {"d": "avd", "q": 20, "title": "Выбросы и устойчивость медианы", "plan": "понятие выброса → почему аномалии мешают → почему среднее смещается, а медиана устойчива → пример → выводы для аналитика.", "anch": "выброс — наблюдение, существенно отклоняющееся от закономерности; бывает ошибкой или реальным событием. Среднее использует величину каждого значения (точка излома — 0 %), медиана — только порядок (точка излома — 50 %); мода тоже устойчива.", "ex": "сроки рассмотрения обращений: 5, 6, 6, 7, 7, 8, 8, 9, 10 дней — среднее 7,3, медиана 7; ошибка 1000 вместо 10 → среднее 117,3, медиана 7.", "concl": "при выбросах и асимметрии — медиана; среднее — только после проверки данных."}, {"d": "avd", "q": 21, "title": "Метод межквартильного размаха (IQR)", "plan": "квартили и IQR → алгоритм → почему IQR устойчивее трёх сигм → пример → ограничения.", "anch": "Q1, Q3; IQR = Q3 − Q1; границы нормы Q1 − 1,5 × IQR и Q3 + 1,5 × IQR (Тьюки; экстремальные — 3 × IQR). Функции: КВАРТИЛЬ.ВКЛ (Excel), PERCENTILE.INC (DAX), PERCENTILE_CONT (SQL). Квартили зависят от порядка, а не от величины крайних значений; правило 3σ страдает от «маскировки» — выброс раздувает σ.", "draw": "box plot: ящик Q1–Q3, медиана, «усы», точки-выбросы.", "ex": "сроки 11 заявок: 3, 4, 4, 5, 5, 6, 6, 7, 8, 9, 45 → 3σ: граница 45,2 — 45 «не выброс»; IQR: Q1 = 4,5, Q3 = 7,5, граница 12 — 45 выброс.", "concl": "IQR робастен и подходит для асимметричных данных ГМУ; он сигнализирует, а решение принимает аналитик."}, {"d": "avd", "q": 22, "title": "Методы нейтрализации аномалий и границы замены", "plan": "сначала диагностика → методы → когда замена оправдана → когда превращается в фальсификацию → пример.", "anch": "методы: исправление по первоисточнику (лучший); удаление (тесты, дубли, координаты 0;0); аппроксимация (медиана соседей, интерполяция); винзоризация (приравнять к границе); преобразование шкалы (логарифм); робастные статистики (медиана) без изменения данных; маркировка. Фальсификация: аномалия — реальное событие; замена ради KPI; заменена значимая доля; замена не документирована; аномалия — признак мошенничества.", "ex": "выплата 1 250 000 вместо 12 500 → сверка с платёжным поручением → исправлена по первоисточнику.", "concl": "сначала выяснить природу аномалии; замену документировать и не применять к реальным событиям."}, {"d": "avd", "q": 23, "title": "Три «греха» данных в отчётах (Tidy Data)", "plan": "почему «грехи» возникают → три «греха» → общие последствия для автоматизации.", "anch": "1) объединённые ячейки и многоуровневые шапки; 2) несколько значений в одной ячейке и смысл через цвет; 3) внутренние итоги и «широкий» формат. Исправление: одна строка заголовков, разделение значений по столбцам, цвет → отдельный признак, удаление итогов, разворот в «длинный» формат. Последствия: незаметные ошибки, ручной труд (до 80 % времени), невоспроизводимость, невозможность межведомственного обмена и публикации.", "ex": "отчёт района: «Итого по району» среди строк поселений → при суммировании выплаты учитываются дважды.", "concl": "отчёт «для глаз» не годится для машины: данные хранить в Tidy-формате, оформление — только в представлении."}, {"d": "avd", "q": 24, "title": "«Колодцы данных» (Data Silos) и пути их преодоления", "plan": "понятие → опасность → влияние на межведомственное взаимодействие → роль хранилища → роль НСИ → государственная инфраструктура.", "anch": "колодец данных — изолированный набор данных одного подразделения или системы, недоступный остальным; следствие лоскутной автоматизации. Последствия: противоречивая отчётность, дублирование ввода, нет сквозной аналитики. Решения: DWH — единый источник истины; НСИ — общие ключи (ОКТМО, ФИАС, КБК); СМЭВ, НСУД, региональные ЦУР.", "ex": "число многодетных семей в соцзащите, образовании и МФЦ различается → сопоставление по СНИЛС и ОКТМО в хранилище даёт одно число.", "concl": "колодцы устраняются вместе технологией интеграции и общими стандартами данных."}, {"d": "avd", "q": 25, "title": "Различие OLTP- и OLAP-систем", "plan": "определения → сравнение → почему системы разделяют → пример.", "anch": "OLTP — операции (короткие транзакции, нормализация, реальное время, текущие данные, операторы); OLAP — анализ (агрегирующие запросы, «звезда» и колонки, пакетная загрузка, история, аналитики). Разделяют из-за разной оптимизации, конкуренции за ресурсы, нужды в истории и интеграции, безопасности (аналитикам — обезличенные данные).", "ex": "ГИС «Электронная очередь в МФЦ» (OLTP) фиксирует талоны и время приёма; ночью ETL переносит данные в хранилище, куб показывает время ожидания по МФЦ и часам.", "concl": "OLTP фиксирует операции, OLAP анализирует историю; совмещение вредит обоим."}, {"d": "avd", "q": 26, "title": "Тест FASMI и требование Fast", "plan": "содержание теста → технические решения быстрого отклика → пример.", "anch": "FASMI (Пендс и Крит, 1995): Fast — ответ до 5 секунд, простые запросы около 1 секунды; Analysis — анализ без программирования; Shared — многопользовательский защищённый доступ; Multidimensional — многомерность (ключевое); Information — любые объёмы. Решения для Fast: предагрегация (MOLAP, материализованные представления), колоночное хранение и сжатие (ClickHouse, VertiPaq), in-memory, «звезда», партиционирование, кэш, MPP (Greenplum), инкрементальная загрузка, оптимизация дашборда.", "ex": "дашборд «Исполнение региональных программ» по транзакционной базе открывался 40–60 секунд → перенос в ClickHouse с агрегатами → секунды.", "concl": "FASMI определяет OLAP пятью требованиями; Fast обеспечивается предагрегацией, колонками и памятью."}, {"d": "avd", "q": 27, "title": "Первичный и внешний ключи", "plan": "реляционная модель и ключи → назначение → пример «факт — справочник» → типичные ошибки.", "anch": "PK — уникальный, не пустой идентификатор записи; FK — ссылка на PK другой таблицы, обеспечивает ссылочную целостность. В BI: справочник — сторона «1» (уникальные ключи), факты — сторона «N», фильтр идёт от справочника к фактам. Ошибки: дубли на стороне «1» («Департамент ЖКХ» и с пробелом), «сироты» — FK без записи в справочнике, несовпадение типов («07» и 7).", "draw": "Районы (PK ID_района) 1 — N Выплаты (FK ID_района).", "ex": "«Социальные выплаты»: выбор «Кировский район» в срезе фильтрует выплаты по ID_района; в SQL — JOIN по ключу.", "concl": "пара PK–FK связывает таблицы и защищает целостность — основа модели BI."}, {"d": "avd", "q": 28, "title": "Свойства социально-экономических систем", "plan": "государство как сверхсложная система → основные свойства → дополнительные → следствия для аналитики → пример.", "anch": "нелинейность; эмерджентность; инерционность и временные лаги; обратные связи; открытость внешней среде; активность и рефлексивность участников; многоцелевость и конфликт интересов; неопределённость и стохастичность; иерархичность; трудность измерения. Следствия: сценарии вместо точечных прогнозов, учёт лагов, мониторинг побочных эффектов.", "ex": "рост субсидий работодателям влияет на занятость нелинейно (до порога эффект мал) и с лагом; работодатели адаптируются к правилам субсидии.", "concl": "эти свойства делают решения рискованными; аналитика должна учитывать нелинейность, лаги и реакцию участников."}, {"d": "avd", "q": 29, "title": "Эндогенные и экзогенные факторы", "plan": "определения → как неучёт экзогенного фактора искажает оценку → как учитывать.", "anch": "эндогенные — внутренние, управляемые органом (рычаги и промежуточные переменные); экзогенные — внешние, только наблюдаемые (макроэкономика, погода, демография). Учёт: узлы-неопределённости в диаграмме влияния, контрольная группа («разность разностей»), нормирование (градусо-сутки, реальные цены), сценарии, показ внешних факторов на дашборде.", "ex": "переоценка — безработица снизилась с 4,5 до 3,0 %, но так же и в регионах без программы (дефицит кадров по стране); недооценка — после замены сетей аварий больше из-за аномальных морозов.", "concl": "без учёта экзогенных факторов эффект решения переоценивается или недооценивается."}, {"d": "avd", "q": 30, "title": "Два статистических метода обнаружения аномалий", "plan": "методы курса → правило трёх сигм → метод IQR → общие ограничения → сравнение → пример.", "anch": "3σ: |x − μ| > 3σ, требует нормальности и больших выборок, чувствительно к выбросам (маскировка). IQR: квартили, форма распределения не важна, точка излома 25 %. Общие ограничения: оба одномерные, не учитывают тренд и сезонность, только сигнализируют.", "ex": "14 проектов благоустройства: 12 по 1,2–2,4 млн, два — 14,0 и 15,5 → 3σ: граница 17,8 — аномалий нет; IQR: граница 3,15 — найдены оба; один — реальный крупный проект, второй — ошибка единиц (тыс. вместо млн).", "concl": "3σ — для нормальных данных, IQR — для асимметричных данных ГМУ; решение принимает аналитик после проверки."}, {"d": "udo", "q": 1, "title": "Хранилище данных и озеро данных", "plan": "определения → принципиальное отличие → сравнение по признакам → преимущества озера для логов и IoT → пример.", "anch": "DWH (Инмон) — очищенные структурированные данные, схема при записи (schema-on-write). Data Lake (Дж. Диксон, 2010) — сырые данные любых типов, схема при чтении (schema-on-read). Признаки: тип данных, момент схемы, способ обработки (ETL/SQL vs ELT/Spark/ML), пользователи (аналитики vs data scientists), стоимость и масштабируемость, назначение. Озеро для логов и IoT: дешёвое объектное хранение (S3, Parquet), не нужна схема, полная детализация для ML, потоковый приём (Kafka), разделение хранения и вычислений. Риск — «болото данных» без каталога.", "ex": "интернет-магазин: 50 млн строк логов в сутки и датчики холодильников каждые 10 секунд → озеро; модели оттока и предиктивного обслуживания; отчёт директору — из DWH.", "concl": "хранилище — проверенная отчётность, озеро — «склад сырья» для исследований и ML."}, {"d": "udo", "q": 2, "title": "ER-диаграмма «Прокат автомобилей»", "plan": "сущности, атрибуты, PK → диаграмма → связи и кардинальность → реализация M:N.", "anch": "Клиент (ID_клиента; ФИО, номер ВУ), Автомобиль (ID_автомобиля; VIN, госномер, тариф; FK ID_пункта), Пункт проката (ID_пункта; адрес), Договор проката (ID_договора; FK клиента и автомобиля; даты выдачи и возврата, сумма). Связи: Клиент–Договор 1:N, Автомобиль–Договор 1:N, Пункт–Автомобиль 1:N, Клиент–Автомобиль M:N через Договор; 1:1 — Договор–Акт приёма-передачи. Нотация «воронья лапка»: «||» — ровно один, «o<» — ноль или много.", "draw": "четыре прямоугольника с PK/FK, Договор в центре между Клиентом и Автомобилем.", "ex": "Петров брал Kia Rio в марте и июне и Skoda в августе → три строки в Договоре; поэтому PK — суррогатный ID_договора, а не пара (клиент, автомобиль).", "concl": "M:N разрешается ассоциативной сущностью с внешними ключами обеих сторон и собственными атрибутами факта."}, {"d": "udo", "q": 3, "title": "DFD уровня 0 «Обработка обращения в техподдержку»", "plan": "нотация и элементы → диаграмма → логика потоков → правила построения → пример.", "anch": "Гейн — Сарсон: внешняя сущность — прямоугольник с толстой рамкой; процесс — скруглённый прямоугольник с номером (у Йордона — круг); накопитель — открытый прямоугольник D1 (у Йордона — две линии); поток — именованная стрелка. Правила: у процесса есть вход и выход; сущность и накопитель не соединяются напрямую; баланс с контекстной диаграммой.", "draw": "сущности — Пользователь, Специалист 2-й линии, Руководитель; процессы — 1 Приём и регистрация, 2 Классификация и назначение, 3 Диагностика и решение, 4 Закрытие и уведомление, 5 Отчётность; накопители — D1 Обращения, D2 Пользователи и оборудование, D3 База знаний.", "ex": "«не подключается VPN» → заявка № 1045, приоритет высокий, SLA 4 часа → решение из базы знаний за 40 минут → в отчёте 18 % обращений по VPN.", "concl": "DFD показывает, какие данные нужны на каждом шаге и где хранятся, — основа выбора Service Desk."}, {"d": "udo", "q": 4, "title": "Реляционные (SQL) и нереляционные (NoSQL) базы данных", "plan": "понятия и различия → четыре типа NoSQL → выбор для двух задач.", "anch": "SQL — таблицы (Кодд, 1970), строгая схема, ACID, JOIN, вертикальное масштабирование. NoSQL — гибкая схема, горизонтальное масштабирование, BASE; теорема CAP (Брюер, 2000). Типы: ключ–значение (Redis, Tarantool), документная (MongoDB), колоночная wide-column (Cassandra, HBase), графовая (Neo4j).", "ex": "соцсеть с анализом связей → графовая Neo4j («друзья друзей» обходом графа вместо многократных JOIN); кэш сессий → Redis (в памяти, доступ по ключу за доли миллисекунды, TTL).", "concl": "SQL — для целостности, NoSQL — для масштаба и гибкости; на практике их сочетаю
