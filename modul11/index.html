т (polyglot persistence)."}, {"d": "udo", "q": 5, "title": "Централизованные, распределённые и облачные системы хранения", "plan": "три класса: особенности, плюсы, минусы → выбор для оператора ПДн → вертикальное и горизонтальное масштабирование → пример.", "anch": "централизованная — простота, но единая точка отказа; распределённая — отказоустойчивость, горизонтальный рост, сложность (CAP); облачная — эластичность, оплата по факту, зависимость от провайдера. Локализация: ч. 5 ст. 18 № 152-ФЗ (ред. № 23-ФЗ, с 01.07.2025) — базы при сборе только в РФ; штраф ч. 8 ст. 13.11 КоАП — 1–6 млн руб., повторно (ч. 9) — 6–18 млн; защита — ПП № 1119, приказ ФСТЭК № 21; передача копий за рубеж — уведомление РКН (ч. 3 ст. 12). Scale up — мощнее один сервер; scale out — больше узлов.", "ex": "страховая: основная база в московском ЦОД, реплика в Петербурге, расчёт полисов в российском облаке на обезличенных данных.", "concl": "для оператора ПДн — распределённая архитектура в российском контуре; облако только российское и с подтверждённым уровнем защиты."}, {"d": "udo", "q": 6, "title": "Data Management и Data Governance", "plan": "понятия и соотношение → роли и структуры → разграничение ИТ и управления данными → инструменты → пример.", "anch": "DAMA-DMBOK2 (2017): Governance — полномочия, контроль и совместное принятие решений о данных; Management — исполнение планов, политик и практик. Governance — центр «колеса DAMA» из 11 областей; аналогия: аудит и бухгалтерия. Роли: Совет по данным (политики, споры), CDO (программа), владелец (Data Owner — бизнес, доступ и качество домена), стюард (Data Steward — глоссарий, справочники, качество), хранитель (Data Custodian — ИТ, техника). Инструменты: политики, RACI, глоссарий, каталог и lineage, контроль качества, MDM. В госсекторе — НСУД (распоряжение № 1189-р, ПП № 733); ответственный за ПДн — ст. 22.1 № 152-ФЗ.", "draw": "иерархия Совет → CDO → Владельцы / Стюарды / Хранители → Пользователи.", "ex": "маркетинг считал 1,2 млн «активных клиентов», финансы — 0,9 млн → Совет утвердил определение «покупка за 90 дней».", "concl": "Governance задаёт правила и ответственность, Management исполняет."}, {"d": "udo", "q": 7, "title": "Безопасность хранилищ, стандарты и защита интернет-магазина", "plan": "методы защиты → стандарты → комплекс мер для магазина → пример.", "anch": "шифрование (в покое, в пути — TLS, поля; ГОСТ Р 34.12-2015, AES; управление ключами), контроль доступа (MFA, RBAC/ABAC, минимальные права, RLS, маскирование), мониторинг и аудит (журналы, SIEM, DAM, DLP), резервирование 3-2-1, сегментация. GDPR (2016/679): ст. 25, 32, 33 (72 часа), штраф до 20 млн евро или 4 % оборота (ст. 83). ISO/IEC 27001:2022 — СМИБ, 93 меры в 4 группах (ГОСТ Р ИСО/МЭК 27001-2021). 152-ФЗ: ст. 18.1, 19, ч. 3.1 ст. 21 (24/72), ч. 12 ст. 19 (ГосСОПКА), штрафы за утечки ч. 12–18 ст. 13.11 КоАП. PCI DSS v4.0.1 — данные карт, CVV не хранить.", "ex": "магазин на 400 тыс. клиентов: оплата на странице эквайера (карты не хранятся), MFA, база закрыта от интернета, DLP и SIEM — утечка учётки менеджера не превратилась в утечку базы.", "concl": "главное — не хранить лишнего, выполнить 152-ФЗ и строить защиту по рискам (ISO 27001)."}, {"d": "udo", "q": 8, "title": "Проблемы с данными, выбросы и качество", "plan": "проблемы → выбросы и причины → пример ошибочного решения → меры.", "anch": "выбросы, дублирование, несогласованность, пропуски, устаревшие и «тёмные» (собранные, но не используемые — Gartner) данные. Выявление выбросов: IQR (за Q1 − 1,5·IQR и Q3 + 1,5·IQR), z-оценка > 3, box plot. Причины: ошибки ввода, измерения, интеграции (единицы, форматы), мошенничество, реальные редкие события — их удалять нельзя. Меры: контроль на входе, правила качества в ETL, НСИ и MDM, метрики, стюарды, удаление «тёмных» данных (ч. 7 ст. 5 № 152-ФЗ).", "draw": "box plot с двумя выбросами: «лишний ноль» и «чёрная пятница».", "ex": "кассир ввёл 1 250 тыс. вместо 125 → средняя выручка выросла со 128 до 166 тыс. (+29 %) → закупки увеличили на четверть → затоваривание.", "concl": "качество обеспечивает система контроля, а не разовая очистка."}, {"d": "udo", "q": 9, "title": "Бизнес-стратегия, ИТ-стратегия и карта уровней архитектуры", "plan": "связь стратегий и её двунаправленность → бизнес-инжиниринг как «мост» → карта уровней → пример.", "anch": "«бизнес → ИТ» — согласование (alignment), «ИТ → бизнес» — новые возможности (enabling) и ограничения. Модель стратегического соответствия Хендерсона и Венкатрамана (1993). Бизнес-инжиниринг (Х. Эстерле, Санкт-Галлен): стратегия → процессы, оргструктура, требования к ИС. Уровни: бизнес- и ИТ-стратегия → бизнес-инжиниринг → архитектура ИС → архитектура данных и приложений → техническая архитектура → корпоративные ИТ-системы (ERP, CRM, СЭД, DWH/BI).", "draw": "вертикальная карта из шести уровней; слева стрелка вниз «требования», справа вверх «обратная связь».", "ex": "банк выходит к малому бизнесу онлайн → «цифровой банк» → процесс открытия счёта за 15 минут → интеграция приложения, АБС, скоринга, ЕСИА → контейнеры и PostgreSQL; биометрия расширила стратегию на регионы.", "concl": "карта показывает путь от цели к системе; бизнес-инжиниринг не даёт стратегии оторваться от ИТ."}, {"d": "udo", "q": 10, "title": "Модель корневых процессов системы хранения данных", "plan": "понятие модели → корневые процессы и потоки данных → управляющие → поддерживающие → пример.", "anch": "корневые: 1 сбор и приём → 2 загрузка и интеграция (ETL/ELT) → 3 хранение и организация → 4 доступ и анализ; из 3 → 5 архивирование и удаление; потоки: сырые → очищенные → витрины и агрегаты → отчёты. Управляющие (сверху) задают правила и контролируют: стратегия и архитектура хранения, политики (сроки, доступ, защита), мониторинг SLA, ёмкости, качества. Поддерживающие (снизу) дают ресурсы: администрирование инфраструктуры, резервное копирование (RPO/RTO), метаданные и каталог, ИБ и поддержка.", "draw": "три полосы: управляющие / корневые со стрелками данных / поддерживающие.", "ex": "сеть магазинов: политика — чеки три года, агрегаты бессрочно, данные к 7:00; чеки грузятся ежечасно; бэкап каждый час (RPO = 1 ч).", "concl": "модель разделяет создание ценности, управление и обеспечение и помогает назначить ответственных."}, {"d": "udo", "q": 11, "title": "ER-диаграмма «Интернет-магазин»", "plan": "сущности, атрибуты, PK → диаграмма → связи и логика → реализация M:N.", "anch": "Покупатель (ID_покупателя; ФИО, e-mail, телефон, адрес), Заказ (ID_заказа; FK покупателя; дата, статус, сумма), Позиция заказа (PK = ID_заказа + ID_товара, оба FK; количество, цена продажи), Товар (ID_товара; артикул, цена, остаток; FK категории), Категория (ID_категории; ID_родителя — рекурсивная связь), Оплата (ID_оплаты; FK заказа). Связи 1:N: Покупатель–Заказ, Заказ–Позиция (не менее одной), Товар–Позиция, Категория–Товар, Категория–Категория, Заказ–Оплата; M:N Заказ–Товар через Позицию.", "draw": "шесть сущностей, Позиция заказа между Заказом и Товаром с составным ключом.", "ex": "заказ № 501: смартфон 1 × 24 990 и чехол 2 × 790 → две строки (501, 1017) и (501, 2230); цена продажи фиксируется на момент заказа.", "concl": "M:N реализуется связующей таблицей с составным ключом и атрибутами самой связи."}, {"d": "udo", "q": 12, "title": "DFD уровня 0 «Оформление заказа в интернет-магазине»", "plan": "граница и окружение → контекстная диаграмма → DFD уровня 0 → обозначения → отличие контекстного уровня от детализации → пример.", "anch": "граница — от выбора товаров до передачи оплаченного заказа в доставку; окружение — Покупатель, Платёжная система, Служба доставки. Процессы: 1 Формирование корзины, 2 Ввод данных и оформление, 3 Проверка наличия и резервирование, 4 Оплата, 5 Передача в доставку; накопители: D1 Каталог и остатки, D2 Покупатели, D3 Заказы, D4 Платежи. Контекстная диаграмма — один процесс «0», без накопителей, задаёт границу; уровень 0 — 3–9 процессов и накопители; правило баланса внешних потоков; дальше 4 → 4.1, 4.2, 4.3.", "draw": "сначала контекстную (один блок и три сущности), затем уровень 0.", "ex": "наушники в корзине → адрес → резерв последней единицы → оплата 5 490 руб. → трек-номер и чек.", "concl": "контекстная задаёт границу, уровень 0 раскрывает логику; баланс потоков сохраняет согласованность уровней."}, {"d": "udo", "q": 13, "title": "Модель корневых процессов управления данными организации", "plan": "структура модели → корневые процессы и потоки → управляющие → поддерживающие → пример.", "anch": "корневые (жизненный цикл): 1 создание и сбор → 2 интеграция и хранение → 3 обработка и анализ → 4 использование и обмен → 5 архивирование и уничтожение; потоки: первичные → единые данные → отчёты и модели → неактуальные данные. Управляющие: стратегия данных и Data Governance (совет, CDO), политики и стандарты (качество, доступ, жизненный цикл), контроль соответствия и рисков (152-ФЗ, аудит). Поддерживающие: метаданные и НСИ (MDM), управление качеством (профилирование), ИТ-инфраструктура и ИБ, обучение и культура работы с данными.", "draw": "три полосы, как в УДО 10, с жизненным циклом в центре.", "ex": "минсоцзащиты региона: заявления через Госуслуги, сведения по СМЭВ, расчёт права, передача решений в казначейство; показатель «доля заявлений с ошибками» идёт вверх и меняет форму заявления.", "concl": "корневые процессы ведут данные по жизненному циклу, управляющие задают правила, поддерживающие дают инструменты; обратная связь делает систему самонастраивающейся."}, {"d": "udo", "q": 14, "title": "ER-диаграмма «Поликлиника»", "plan": "сущности и ключи → связи → моделирование «много пациентов — много врачей» → пример.", "anch": "Пациент (ID_пациента; ФИО, дата рождения, полис ОМС), Врач (ID_врача; FK специальности; кабинет), Специальность, Приём (ID_приёма; FK пациента, врача, кода МКБ; дата и время, жалобы, назначения), Диагноз МКБ-10 (Код_МКБ). M:N Пациент–Врач через ассоциативную сущность Приём; суррогатный PK, альтернативный ключ (ID_врача, Дата_время); расширение — Слот расписания 1 : 0..1 Приём. Медданные — специальная категория (ст. 10 № 152-ФЗ), врачебная тайна (ст. 13 № 323-ФЗ) → разграничение доступа.", "draw": "Пациент — Приём — Врач в ряд, Специальность к Врачу, МКБ к Приёму.", "ex": "Сидорова: два приёма у терапевта и один у кардиолога → три строки в Приёме.", "concl": "модель строится вокруг Приёма, справочники обеспечивают единообразие медицинской статистики."}, {"d": "udo", "q": 15, "title": "Карта уровней архитектуры: мосты и обратные связи", "plan": "карта с примерами → роль мостов → обратные связи → пример обратной связи.", "anch": "уровни: бизнес-стратегия ⇄ ИТ-стратегия → бизнес-инжиниринг → архитектура ИС → архитектура данных и приложений → техническая архитектура → корпоративные ИТ-системы. Мост 1 — бизнес-инжиниринг (стратегия → процессы); мост 2 — архитектура ИС, интеграция (процессы → ИТ); горизонтальный мост — согласование бизнес- и ИТ-стратегии. Обратные связи: фактические показатели BI, возможности технологий, ограничения (сроки, санкции, регуляторы), архитектурный контроль.", "draw": "две колонки — уровни и примеры розничной сети; внизу блок «Обратная связь» со стрелкой вверх.", "ex": "цель — 30 % онлайн-продаж → омниканальная платформа → процесс «заказ онлайн — выдача в магазине» за 2 часа → сайт, CRM, ERP, склад через шину и API → MDM, CRM, ERP, WMS, DWH → облако, PostgreSQL → 1С:ERP, сайт, приложение, BI. Обратно: BI — 40 % онлайн-заказов забирают в магазине → расширить пункты выдачи.", "concl": "мосты сохраняют смысл стратегии при переходе к процессам и ИТ, обратные связи учат стратегию на фактах."}, {"d": "udo", "q": 16, "title": "Схема процесса ETL из CRM и ERP в хранилище", "plan": "схема → назначение этапов → действия при преобразовании → полная и инкрементальная загрузка → пример.", "anch": "источники (CRM, ERP, файлы, API) → Extract → Staging (сырая копия, источники не нагружаются) → Transform → Load → DWH → витрины → BI; сбоку — метаданные, расписание, журнал, контроль качества. Transform: очистка, проверка качества, дедупликация, единые форматы (даты, валюты), сопоставление справочников, суррогатные ключи, расчёт и обогащение, агрегирование, история изменений (SCD 2), маскирование ПДн. Полная загрузка — всё заново (первичная, малые справочники); инкрементальная — только изменения (метка времени, ID, CDC, хэши; MERGE/upsert).", "draw": "вертикальная цепочка E → Staging → T → L → DWH → витрины → BI.", "ex": "справочник товаров 30 тыс. — полностью; заказы — инкрементально (200 тыс. вместо 50 млн строк); клиенты CRM и ERP — по ИНН и телефону; витрины к 6:00.", "concl": "ETL превращает разрозненные данные в согласованные; регулярный режим — инкрементальный."}, {"d": "udo", "q": 17, "title": "DFD уровня 0 «Обслуживание клиента в банке»", "plan": "окружение → внутренняя логика → отражение хранения данных клиента → отражение обмена с внешними системами → пример.", "anch": "внешние сущности: Клиент, ЕБС/ЕСИА (№ 572-ФЗ), бюро кредитных историй (№ 218-ФЗ), Росфинмониторинг (№ 115-ФЗ), платёжная система (СБП). Процессы: 1 Идентификация, 2 Приём заявки, 3 Проверка и решение, 4 Проведение операции, 5 Уведомление и выписка. Накопители: D1 Клиенты (досье), D2 Счета и договоры, D3 Журнал операций. Накопитель пассивен: доступ только через процесс; стрелка к накопителю — запись, от него — чтение. Внешняя система — «чёрный ящик» с парой потоков «запрос — ответ»; в Росфинмониторинг — односторонний поток. Документы хранятся не менее 5 лет (ст. 7 № 115-ФЗ); банковская тайна — ст. 26 закона «О банках».", "ex": "кредитная карта в приложении: биометрия через ЕБС → кредитный отчёт из БКИ → решение за 3 минуты → договор и уведомление.", "concl": "накопители показывают, где живут данные клиента, внешние сущности с парными потоками — обмен с внешними системами."}, {"d": "udo", "q": 18, "title": "ER-диаграмма «Складской учёт»", "plan": "сущности и ключи → связи → один товар от нескольких поставщиков → один товар на нескольких складах → пример.", "anch": "Поставщик, Поставка (FK поставщика и склада; накладная, дата), Позиция поставки (PK = ID_поставки + ID_товара; количество, цена закупки), Товар, Склад, Остаток (PK = ID_склада + ID_товара; количество, ячейка). Поставщик–Товар M:N через Поставку и Позицию поставки (цена у конкретного поставщика; при договорных ценах — «Прайс поставщика»); Товар–Склад M:N через Остаток; движение между складами — «Перемещение».", "draw": "Поставщик → Поставка → Позиция ← Товар → Остаток ← Склад; Склад → Поставка.", "ex": "бумага А4: от «Альфы» по 320 руб. на склад «Север», от «Беты» по 305 руб. на склад «Юг» → остатки 400 и 250 пачек, всего 650.", "concl": "обе ситуации — M:N через ассоциативные сущности с составными ключами."}, {"d": "udo", "q": 19, "title": "Многомерная модель «звезда» для анализа продаж", "plan": "идея многомерного анализа → схема «звезда»: факты и измерения → «снежинка» и когда её применять → пример.", "anch": "Кимбалл: факты — числа событий, измерения — контекст; куб и операции slice, dice, drill-down, roll-up, pivot. Факт продаж (зерно — позиция чека): FK даты, товара, магазина, клиента, канала; меры — количество, выручка, себестоимость, скидка, валовая прибыль (аддитивные); средний чек считается в BI. Измерения с иерархиями: Дата (день → месяц → квартал → год), Товар (→ подкатегория → категория), Магазин (→ город → регион), Клиент (сегмент), Канал. «Снежинка» — нормализованные измерения: меньше избыточности, больше соединений; для огромных и общих иерархий.", "draw": "факт в центре, пять измерений вокруг; рядом фрагмент Товар → Подкатегория → Категория.", "ex": "падение выручки в Поволжье в марте: фильтр региона → недели → категории → «Электроника» не поставлялась две недели.", "concl": "«звезда» — простая быстрая основа анализа; «снежинка» оправдана при больших разделяемых иерархиях."}, {"d": "udo", "q": 20, "title": "Data Warehouse, Data Lake и Data Lakehouse", "plan": "определения → сравнение → выбор для организации с отчётностью и ML → пример.", "anch": "Lakehouse (Армбруст и соавторы, Databricks, CIDR 2021) — озеро плюс ACID, контроль схемы, версии, быстрый SQL за счёт табличных форматов Delta Lake, Apache Iceberg, Hudi поверх Parquet; медальонные слои Bronze → Silver → Gold. Признаки сравнения: типы данных, схема, транзакции, производительность BI, ML, стоимость, управление, число копий данных. Выбор — Lakehouse: одна копия для BI и ML, ACID для отчётности, дешёвое хранение, единый каталог; условие — инженеры данных и Data Governance; при действующем DWH — поэтапный переход.", "draw": "объектное хранилище → табличный формат → Bronze / Silver / Gold → BI и ML сверху.", "ex": "оператор связи: журналы сети в Bronze, абоненты в Silver, витрины выручки в Gold; отчёты по Gold, модель оттока по Silver.", "concl": "Lakehouse объединяет надёжность хранилища и дешевизну озера."}, {"d": "udo", "q": 21, "title": "Архитектура приложений, портфель и целевой ландшафт", "plan": "архитектура приложений и две области → зачем оценивать ценность → целевой ландшафт → пример замены системы.", "anch": "домен корпоративной архитектуры (бизнес, данные, приложения, технологии): состав систем, функции, интеграция (ESB, API). Две области: разработка прикладных систем (жизненный цикл, «купить или разработать», ГОСТ 34) и управление портфелем приложений (инвентаризация, оценка, решения, дорожная карта). Оценка по двум осям: ценность для бизнеса и техническое состояние (+ TCO); матрица TIME (Gartner): Tolerate — сохранить, Invest — развивать, Migrate — заменить, Eliminate — вывести. Целевой ландшафт (TO-BE) против текущего (AS-IS) → разрыв → дорожная карта.", "draw": "матрица 2 × 2 TIME.", "ex": "самописная CRM 2009 года: высокая ценность, плохое состояние, 6 млн руб. в год → Migrate; CRM из реестра российского ПО (ПП № 1236); 5 лет: старая ≈ 30 млн, новая ≈ 24,5 млн → миграция за 18 месяцев, старая — Eliminate.", "concl": "портфельная оценка превращает замену системы в обоснованное инвестиционное решение."}, {"d": "udo", "q": 22, "title": "Облачные модели IaaS, PaaS и SaaS", "plan": "характеристика моделей → разделённая ответственность → сравнение → выбор для быстрого хранилища → пример.", "anch": "NIST SP 800-145 (2011). IaaS — серверы, хранилища, сети; клиент ведёт ОС, СУБД, приложения. PaaS — готовая платформа и управляемые СУБД; клиент — приложения и данные. SaaS — готовое приложение по подписке. Данные и права доступа всегда на стороне клиента. Гибкость и контроль: IaaS > PaaS > SaaS; скорость внедрения — наоборот. Выбор — PaaS: управляемый ClickHouse или Greenplum в российском облаке + SaaS BI; при ПДн — ЦОД в РФ и договор поручения (ч. 3 ст. 6 № 152-ФЗ).", "draw": "таблица «слои × модели», закрашены зоны клиента.", "ex": "сеть из 80 магазинов за две недели развернула управляемый ClickHouse, ночную загрузку из 1С и дашборды DataLens без закупки серверов.", "concl": "IaaS — контроль, SaaS — скорость, PaaS — баланс; для быстрого хранилища — PaaS."}, {"d": "udo", "q": 23, "title": "SQL и NoSQL: модель данных, строгость схемы и выбор", "plan": "различие по модели и схеме → четыре типа NoSQL → выбор для двух задач → пример.", "anch": "SQL — таблицы, схема при записи, ограничения проверяет СУБД, миграции (ALTER TABLE), ACID. NoSQL — гибкая схема, поля добавляются «на лету», контроль в приложении (опционально JSON Schema в MongoDB). Типы: ключ–значение (Redis, Tarantool), документная (MongoDB), колоночная (Cassandra, HBase), графовая (Neo4j). Анализ связей в соцсети → графовая (обход графа, PageRank, сообщества, Cypher); профили с быстрым доступом → документная MongoDB (профиль — один документ, шардирование по ID) + кэш Redis.", "ex": "профили 20 млн пользователей — MongoDB, граф 1,5 млрд связей — Neo4j, платежи — PostgreSQL.", "concl": "строгая схема — для целостности, гибкая — для изменчивых данных; модели сочетают."}, {"d": "udo", "q": 24, "title": "Динамическая и статическая модели проектирования", "plan": "принципиальное различие → динамическая модель: «чёрный ящик» и акторы → статическая модель: классы и связи → связь моделей.", "anch": "статическая — структура (что есть в системе), без времени: диаграммы классов, объектов, компонентов UML. Динамическая — поведение во времени: диаграммы вариантов использования, последовательности, деятельности, состояний. «Чёрный ящик» — система описывается реакциями на акторов без внутреннего устройства. Акторы: Покупатель, Платёжная система, Служба доставки; варианты: найти товар, добавить в корзину, оформить заказ («include» → оплатить заказ), отследить доставку. Классы: Покупатель 1 — 0..∗ Заказ; Заказ ◆ 1 — 1..∗ ПозицияЗаказа (композиция); Позиция 0..∗ — 1 Товар; Заказ 1 — 0..1 Оплата, Доставка; обобщение «ОплатаКартой», «ОплатаСБП». Шаги сценариев → операции классов.", "draw": "диаграмму вариантов использования (рамка системы, эллипсы, человечки) и диаграмму классов с кратностями.", "ex": "сценарий «Оформить заказ»: корзина → проверка наличия → адрес → оплата → передача в доставку; отказ оплаты — статус «ожидает оплаты».", "concl": "динамическая модель — что система делает для акторов, статическая — из чего она построена."}, {"d": "udo", "q": 25, "title": "Централизованная и распределённая архитектуры, масштабирование", "plan": "сравнение архитектур → вертикальное и горизонтальное масштабирование → подход для быстрорастущего сервиса → пример.", "anch": "централизованная — простота, ACID, контроль, но единая точка отказа и предел сервера; распределённая — шардирование и репликация, отказоустойчивость, рост, но CAP и сложность. Scale up — мощнее сервер (простота, предел, нелинейная цена); scale out — больше узлов (почти без предела, отказоустойчивость, сложность). Для растущего сервиса: сервисы без состояния и автомасштабирование → кэш Redis и CDN → реплики для чтения → шардирование по ID пользователя → разные хранилища под задачи, очередь Kafka.", "draw": "слева большой сервер (scale up), справа балансировщик и узлы-шарды (scale out).", "ex": "платформа обучения выросла с 50 тыс. до 2 млн пользователей: сервер 16 → 64 ядра, сессии в Redis, три реплики, 8 шардов.", "concl": "поэтапный переход к горизонтальному масштабированию."}, {"d": "udo", "q": 26, "title": "ETL и ELT", "plan": "сравнение по порядку этапов, месту преобразований и применимости → почему ELT распространился с облаками → выбор для загрузки сырых данных → пример.", "anch": "ETL: извлечь → преобразовать на ETL-сервере → загрузить готовое; ELT: извлечь → загрузить как есть → преобразовать внутри хранилища (SQL, dbt, Spark). Причины роста ELT: мощные MPP и колоночные движки, разделение хранения и вычислений, эластичность, схема при чтении, потребности ML, инструменты вроде dbt. Для больших сырых данных — ELT; ПДн маскировать на входе (ETLT), каталог против «болота».", "draw": "две строки блоков: E → T → L → DWH и E → L → облако → T.", "ex": "маркетплейс получает 2 ТБ кликов в сутки → Parquet в объектное хранилище, ID покупателей хэшируются → Spark и dbt строят витрины; смена определения «сессии» — пересчёт двух лет за часы.", "concl": "ELT стал основным подходом для больших объёмов в облаке."}, {"d": "udo", "q": 27, "title": "OLAP и OLTP", "plan": "сравнение по назначению, запросам, структуре, частоте обновления → компоненты OLAP-системы → куб, измерения, меры → когда что применять → пример.", "anch": "OLTP — операции, короткие транзакции, 3НФ, непрерывное обновление; OLAP — анализ, агрегирующие запросы, «звезда» и колонки, пакетная загрузка (термин — Э. Кодд, 1993). Компоненты: источники (OLTP) → ETL → хранилище и витрины → OLAP-сервер (MOLAP, ROLAP, HOLAP) → метаданные → клиентские средства (BI). Куб: измерения на осях, меры в ячейках, иерархии; операции срез, детализация, свёртка, поворот.", "draw": "цепочку компонентов и куб «Регион × Категория × Квартал».", "ex": "кассы (OLTP) — 2 млн чеков в день; ночью загрузка, утром директор видит падение «Электроники» в Самаре в III квартале.", "concl": "OLTP — надёжные операции, OLAP — быстрый многомерный анализ истории."}, {"d": "udo", "q": 28, "title": "Классы систем хранения и ограничения облака при локализации ПДн", "plan": "три класса → требования 152-ФЗ и выбор архитектуры → ограничения облака → пример.", "anch": "централизованные, распределённые, облачные (особенности, плюсы, минусы). Ч. 5 ст. 18 № 152-ФЗ (ред. № 23-ФЗ, с 01.07.2025); ч. 8, 9 ст. 13.11 КоАП (1–6 и 6–18 млн руб.). Ограничения облака: 1) ЦОД первичной записи — в РФ; 2) передача копий — уведомление РКН (ч. 3 ст. 12), РКН может запретить (ч. 8, 12 ст. 12); 3) поручение обработки провайдеру — договор (ч. 3 ст. 6), отвечает оператор (ч. 5 ст. 6); 4) уровень защищённости — ПП № 1119, приказ ФСТЭК № 21, для ГИС — приказ № 117 и аттестация; 5) сертифицированные СЗИ и СКЗИ ФСБ; 6) зависимость от провайдера, санкционные риски, план выхода. Выбор — гибридная архитектура в российском контуре.", "ex": "сеть клиник, 300 тыс. пациентов, данные о здоровье, угрозы 3-го типа → УЗ-2; медкарты в частном облаке ЦОД в Москве с репликой в Казани, запись на приём — в аттестованном сегменте российского облака.", "concl": "облако допустимо только российское, с подтверждённым уровнем защиты и договором поручения."}, {"d": "udo", "q": 29, "title": "Измеримые характеристики качества, метрики и пороги", "plan": "характеристики → как задать метрику и порог → пример несогласованного справочника → меры.", "anch": "DAMA-DMBOK, ISO/IEC 25012: полнота, точность, согласованность, своевременность, валидность, уникальность, целостность; метрика — доля записей, удовлетворяющих правилу (полнота = (всего − пустые) / всего × 100 %). Порядок: объект и правило → формула → базовый уровень → пороги «зелёный — жёлтый — красный» по влиянию на бизнес → владелец, периодичность, действия. Пример порогов: телефон ≥ 95 %, дубли ≤ 0,5 %, коды регионов — 100 %.", "ex": "в ERP регион — код ОКТМО, в CRM — текст «Московская обл.», «МО», «Подмосковье» → область распалась на три строки, выглядит седьмой вместо второй → урезан бюджет, отложен склад.", "concl": "каждая характеристика — метрика с формулой, порогом и владельцем; справочники выравниваются единой НСИ."}, {"d": "udo", "q": 30, "title": "Управление мастер-данными и «золотая запись»", "plan": "определение MDM → мастер-данные, транзакционные и метаданные → проблема «золотой записи» → подход к решению → пример.", "anch": "MDM (Gartner) — дисциплина, в которой бизнес и ИТ обеспечивают единообразие, точность и согласованность общих мастер-данных. Мастер-данные — клиенты, товары, поставщики, сотрудники, объекты; транзакционные — заказы, платежи; метаданные — данные о данных; справочные — ОКВ, ОКСМ, ОКЕИ. Риски: ложное несовпадение (один клиент — три) и ложное совпадение (однофамильцы слиты). Подход: стандартизация → сопоставление (точное: ИНН, СНИЛС, телефон + дата рождения; нечёткое: Левенштейн, Джаро — Винклер; пороги 0,95 и 0,80) → слияние по правилам выживания (приоритет источника, свежесть, полнота) → перекрёстные ссылки ID_MDM → публикация → стюардинг.", "draw": "три карточки источников → стандартизация → сопоставление → слияние → золотая запись; спорные пары → стюард.", "ex": "Иванов в CRM, интернет-магазине и биллинге совпал по телефону и сходству ФИО 0,97 → ФИО из CRM, дата рождения и адрес из биллинга, e-mail из магазина → ID_MDM 100245.", "concl": "«золотая запись» — стандартизация, сопоставление, слияние, публикация при участии стюардов."}];
const ANSWERS = [{"d": "ebod", "q": 1, "title": "Данные, информация и документированная информация", "md": "## Легальные определения\n\nФедеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» (далее — № 149-ФЗ) закрепляет базовый понятийный ряд:\n\n- **информация** — сведения (сообщения, данные) независимо от формы их представления (п. 1 ст. 2). Определение намеренно предельно широкое: устное сообщение, бумажный документ, файл, запись в базе данных — всё это информация; правовое значение имеет не форма, а режим доступа и наличие реквизитов;\n- **информационная система** — совокупность содержащейся в базах данных информации и обеспечивающих её обработку информационных технологий и технических средств (п. 3 ст. 2);\n- **документированная информация** — зафиксированная на материальном носителе путём документирования информация с реквизитами, позволяющими определить такую информацию или в установленных случаях её материальный носитель (п. 11 ст. 2);\n- **электронный документ** — документированная информация, представленная в электронной форме, то есть в виде, пригодном для восприятия человеком с использованием ЭВМ, а также для передачи по сетям или обработки в информационных системах (п. 11.1 ст. 2).\n\n**Почему понятие «данные» отдельно не определено.** Законодатель использует слово «данные» как синоним сведений внутри определения информации («сведения (сообщения, данные)»). Правовой режим — доступ, ограничение, защита, ответственность — привязывается к содержанию сведений, а не к технической форме их записи, поэтому отдельная легальная дефиниция «данных» не требуется. Термин используется в специальных актах для конкретных объектов регулирования: «персональные данные» (Федеральный закон № 152-ФЗ), «открытые данные» (ч. 4 ст. 7 № 149-ФЗ). В методическом смысле данные — зафиксированные факты, пригодные для автоматизированной обработки.\n\n## Модель DIKW\n\nМодель «данные — информация — знание — мудрость» (DIKW, Р. Акофф) — доктринальная, нормативно не закреплена, но объясняет, где возникает управленческая ценность:\n\n- **данные** — разрозненные зафиксированные факты: 4 820 автомобилей в час на перекрёстке, 137 обращений граждан;\n- **информация** — данные в контексте: поток на перекрёстке вырос на 18 % за квартал;\n- **знание** — обобщение и объяснение причин: рост вызван закрытием параллельной улицы на ремонт;\n- **мудрость (решение)** — обоснованное действие: изменить режим светофоров и график ремонта.\n\nЦенность данных для государственного управления возникает только на уровне обоснованного решения: накопленные, но не используемые данные создают лишь издержки хранения и риск утечки.\n\n## Реквизиты и электронная подпись\n\nРеквизиты (дата, регистрационный номер, автор, подпись, наименование органа) превращают сведения в документированную информацию и придают им свойства, необходимые для управления:\n\n- **идентифицируемость** — документ можно однозначно найти и сослаться на него;\n- **доказательственное значение** — документ подтверждает факт и служит основанием решения в проверке или суде;\n- **подлинность и целостность** — можно установить источник и неизменность содержания.\n\nДля электронного документа эту роль играет **электронная подпись** — информация в электронной форме, присоединённая к другой информации и используемая для определения лица, подписывающего информацию (п. 1 ст. 2 Федерального закона от 06.04.2011 № 63-ФЗ «Об электронной подписи»). Закон выделяет простую, усиленную неквалифицированную и усиленную квалифицированную подписи (ст. 5). Электронный документ, подписанный квалифицированной подписью, признаётся равнозначным документу на бумаге с собственноручной подписью (ч. 1 ст. 6).\n\n## Группы сведений государственного органа\n\nМетодически выделяются шесть групп: **реестры и регистры** (юридически значимые сведения — ЕГРН, реестр лицензий), **статистика** (агрегированные показатели Росстата, ЕМИСС), **обращения граждан** (почти всегда содержат персональные данные), **ведомственные ГИС** (операционные данные исполнения полномочий), **телеметрия** (камеры, датчики городской инфраструктуры), **внешние источники** (открытые данные иных ведомств, публикации). Правовой режим каждой группы определяется ст. 5 № 149-ФЗ.\n\n## Пример из деятельности органа власти\n\nОтдел опеки администрации муниципального района:\n\n- **данные** — записи в журнале приёма: дата, ФИО заявителя, тема обращения, отметка «выезд»;\n- **информация** — справка «за полугодие число обращений по вопросам опеки выросло на 25 %, из них 60 % — из двух поселений»;\n- **документированная информация** — служебная записка начальника отдела главе района с датой, номером и подписью, обосновывающая выделение дополнительной ставки специалиста;\n- **электронный документ** — та же записка, зарегистрированная в системе электронного документооборота и подписанная усиленной квалифицированной электронной подписью.\n\nТолько последние два объекта могут служить основанием распорядительного акта: справка без реквизитов не подтверждает ни источник цифр, ни ответственность за них.\n\n## Почему служащему важно различать понятия\n\n- от вида объекта зависит его юридическая сила: решение органа должно опираться на документированную информацию, иначе его невозможно проверить и защитить;\n- запрос гражданина касается информации, а не носителя: ответ даётся по существу сведений, а не «по наличию файла»;\n- требования к хранению, регистрации и уничтожению распространяются на документы и электронные документы, а меры защиты — на информацию в любой форме;\n- ИТ-подразделению ставится задача в терминах данных и систем, а правовое основание формулируется в терминах информации и документов.\n\n**Вывод.** Информация — родовое понятие (п. 1 ст. 2 № 149-ФЗ), документированная информация отличается наличием реквизитов (п. 11 ст. 2), электронный документ — её электронная форма (п. 11.1 ст. 2), юридическую силу которой обеспечивает электронная подпись (№ 63-ФЗ). Данные — исходный материал, ценность которого реализуется лишь при переходе к обоснованному и задокументированному решению."}, {"d": "ebod", "q": 2, "title": "Классификация информации по категориям доступа", "md": "## Общедоступная информация и информация ограниченного доступа\n\nИнформация в зависимости от категории доступа подразделяется на **общедоступную** и **информацию, доступ к которой ограничен федеральными законами** (ч. 2 ст. 5 № 149-ФЗ). Общедоступная информация — общеизвестные сведения и иная информация, доступ к которой не ограничен (ч. 1 ст. 7); её можно использовать любым лицом с соблюдением установленных ограничений.\n\n**Ограничение доступа устанавливается федеральными законами** в целях защиты основ конституционного строя, нравственности, здоровья, прав и законных интересов других лиц, обеспечения обороны страны и безопасности государства (ч. 1 ст. 9 № 149-ФЗ). Акты Президента и Правительства (Указ № 188, постановление № 1233) лишь систематизируют и конкретизируют такие сведения. Ведомственным приказом или устным распоряжением руководителя ограничить доступ нельзя.\n\n## Режимы информации ограниченного доступа\n\n- **Государственная тайна** — защищаемые государством сведения в области военной, внешнеполитической, экономической, разведывательной, контрразведывательной и оперативно-розыскной деятельности (Закон РФ от 21.07.1993 № 5485-1 «О государственной тайне»). Степени секретности — «особой важности», «совершенно секретно», «секретно»; допуск оформляется по особой процедуре.\n- **Конфиденциальная информация** — систематизирована Перечнем сведений конфиденциального характера (Указ Президента РФ от 06.03.1997 № 188), включающим **семь групп**: 1) персональные данные; 2) тайна следствия и судопроизводства, сведения о защищаемых лицах; 3) служебная тайна; 4) профессиональная тайна (врачебная, нотариальная, адвокатская, тайна переписки); 5) коммерческая тайна (Федеральный закон № 98-ФЗ); 6) сущность изобретения, полезной модели, промышленного образца до официальной публикации; 7) сведения в личных делах осуждённых и о принудительном исполнении судебных актов, кроме общедоступных (группа добавлена в 2015 году).\n- **Служебная информация ограниченного распространения** — несекретные сведения, касающиеся деятельности органов власти, ограничение распространения которых диктуется служебной необходимостью (Положение, утв. постановлением Правительства РФ от 03.11.1994 № 1233). На документах проставляется пометка «Для служебного пользования»; это не гриф секретности, режим гостайны на такие сведения не распространяется.\n\n## Сведения, доступ к которым не может быть ограничен\n\nПо ч. 4 ст. 8 № 149-ФЗ не может быть ограничен доступ к: 1) нормативным правовым актам, затрагивающим права, свободы и обязанности человека и гражданина, правовое положение организаций и полномочия органов; 2) информации о состоянии окружающей среды; 3) информации о деятельности государственных органов и органов местного самоуправления, а также об использовании бюджетных средств (за исключением сведений, составляющих государственную или служебную тайну); 4) информации в открытых фондах библиотек, музеев, архивов и в информационных системах, созданных для обеспечения граждан информацией; 5) иной информации, если недопустимость ограничения установлена федеральными законами.\n\n**Обязанности служащего:** не присваивать таким сведениям пометку «ДСП» «на всякий случай»; обеспечивать их размещение и предоставление по Федеральному закону от 09.02.2009 № 8-ФЗ; отказ в доступе к ним образует нарушение права на информацию.\n\n## Дополнительные основания классификации\n\nТаблица: Дополнительные основания классификации информации\n{w:28,72}\n| Основание | Виды |\n|---|---|\n| Форма представления | Структурированные наборы (таблицы, реестры) и неструктурированные документы (письма, сканы); бумажные и электронные носители |\n| Источник получения | Собственные данные ведомства; сведения граждан и организаций; данные межведомственного запроса; внешние открытые источники |\n| Степень обработки | Первичные (исходные) и производные (агрегированные, обезличенные, аналитические) |\n| Юридическая значимость | Юридически значимые сведения реестров, порождающие права, и справочные данные |\n| Актуальность | Оперативные данные реального времени, периодически обновляемые наборы, архивные сведения |\n\nКатегория доступа определяет три вещи: круг допущенных лиц, состав мер защиты и вид ответственности за разглашение.\n\n## Пример: одни и те же сведения в разных категориях\n\nКомитет по транспорту муниципального образования ведёт реестр льготных проездных: ФИО, адрес, категория льготы (в том числе инвалидность), даты поездок.\n\n- **Запись реестра** — персональные данные, а сведения об инвалидности — специальная категория (ст. 10 Федерального закона № 152-ФЗ); режим конфиденциальной информации.\n- **Агрегированные сведения** «число льготных поездок по маршрутам и месяцам» после обезличивания и агрегирования становятся общедоступными и могут публиковаться как открытые данные (ч. 4 ст. 7 № 149-ФЗ).\n- **Сводный аналитический отчёт** о загрузке маршрутов с выводами о схеме оптимизации до принятия решения может быть отнесён к служебной информации ограниченного распространения (пометка «ДСП» по постановлению № 1233).\n- **Обратный эффект агрегирования:** если опубликовать набор поездок по каждой карте с точным временем и остановками, даже без фамилий человека можно вычислить по месту жительства и регулярным маршрутам — сведения снова становятся персональными данными. Обезличивание меняет категорию только тогда, когда обратная идентификация действительно невозможна.\n\n**Вывод.** Классификация по категориям доступа (ст. 5 № 149-ФЗ) делит информацию на общедоступную и ограниченного доступа, причём ограничение возможно только федеральным законом (ч. 1 ст. 9). Внутри ограниченного доступа действуют режимы гостайны (№ 5485-1), конфиденциальной информации (Указ № 188) и служебной информации (ДСП, постановление № 1233). Категория сведений не постоянна: агрегирование и обезличивание могут её снизить, а сопоставление наборов — повысить."}, {"d": "ebod", "q": 3, "title": "Обладатель информации, доступ и конфиденциальность; виды доступа", "md": "## Легальные определения\n\nСт. 2 № 149-ФЗ закрепляет:\n\n- **обладатель информации** — лицо, самостоятельно создавшее информацию либо получившее на основании закона или договора право разрешать или ограничивать доступ к информации, определяемой по каким-либо признакам (п. 5);\n- **доступ к информации** — возможность получения информации и её использования (п. 6);\n- **конфиденциальность информации** — обязательное для выполнения лицом, получившим доступ к определённой информации, требование не передавать такую информацию третьим лицам без согласия её обладателя (п. 7);\n- **предоставление информации** — действия, направленные на получение информации определённым кругом лиц или передачу информации определённому кругу лиц (п. 8);\n- **распространение информации** — действия, направленные на получение информации неопределённым кругом лиц или передачу информации неопределённому кругу лиц (п. 9);\n- **оператор информационной системы** — гражданин или юридическое лицо, осуществляющие деятельность по эксплуатации информационной системы, в том числе по обработке информации в её базах данных (п. 12).\n\n**Взаимосвязь понятий.** Обладатель решает, кому и на каких условиях открыть доступ; доступ даёт возможность получить и использовать сведения; получивший доступ обязан соблюдать конфиденциальность; передача сведений происходит в форме предоставления (определённому кругу) или распространения (неопределённому кругу).\n\n## Почему служащий не является обладателем служебных данных\n\nОбладателями государственной информации выступают Российская Федерация, субъекты РФ и муниципальные образования; их правомочия осуществляют органы власти в пределах компетенции (ч. 2 ст. 6 № 149-ФЗ). Служащий действует от имени органа и в пределах должностных полномочий: он не вправе по своему усмотрению разрешать доступ, передавать или распространять сведения, хотя технически к ним имеет доступ.\n\n**Обладатель и оператор ИС различаются по функции.** Обладатель решает вопрос о праве доступа (юридическая власть над сведениями), оператор эксплуатирует систему и обрабатывает информацию (техническая деятельность). Пример: обладатель сведений реестра — министерство, оператор системы — подведомственный центр информационных технологий или подрядчик. Оператор не вправе использовать данные для собственных целей.\n\n## Права обладателя информации\n\nПо ч. 3 ст. 6 № 149-ФЗ обладатель вправе: разрешать или ограничивать доступ к информации, определять порядок и условия доступа; использовать информацию, в том числе распространять её, по своему усмотрению; передавать информацию другим лицам по договору или на ином законном основании; защищать установленными законом способами свои права при незаконном получении или использовании информации; осуществлять иные действия. Одновременно он обязан соблюдать права и законные интересы иных лиц, принимать меры по защите информации и ограничивать доступ, если это предусмотрено федеральным законом (ч. 4 ст. 6).\n\n## Предоставление и распространение\n\nТаблица: Разграничение предоставления и распространения информации\n{w:24,38,38}\n| Признак | Предоставление | Распространение |\n|---|---|---|\n| Круг лиц | Определённый | Неопределённый |\n| Пример в органе власти | Ответ на запрос гражданина; передача сведений по межведомственному запросу через СМЭВ | Публикация набора на портале открытых данных; размещение сведений на официальном сайте |\n| Основание | Запрос, соглашение, норма закона | Обязанность размещения (№ 8-ФЗ), решение обладателя |\n| Риск | Ошибка адресата | Необратимость: распространённые сведения нельзя отозвать |\n\nПубликация в сети «Интернет» всегда является распространением.\n\n## Виды доступа к информации\n\n- **свободный доступ** к общедоступной информации (ст. 7 № 149-ФЗ);\n- **обязательное размещение** сведений о деятельности органа — структура, нормативные акты, планы, отчёты, сведения о бюджете (ст. 13 Федерального закона от 09.02.2009 № 8-ФЗ);\n- **предоставление по запросу** гражданина или организации (ст. 18–20 № 8-ФЗ);\n- **публикация открытых данных** в машиночитаемых форматах (ч. 4 ст. 7 № 149-ФЗ);\n- **ограниченный доступ** — по принципу минимально необходимых полномочий, с регистрацией действий пользователей и ответственностью за разглашение вплоть до уголовной;\n- кроме того, № 8-ФЗ предусматривает присутствие граждан на заседаниях коллегиальных органов.\n\n## Организация доступа в ГИС\n\n1) **Идентификация** — система получает заявленный идентификатор (логин, учётная запись, идентификатор в ЕСИА).\n2) **Аутентификация** — проверка подлинности: пароль, второй фактор, сертификат электронной подписи; отвечает на вопрос «тот ли это пользователь».\n3) **Авторизация** — проверка полномочий: какие данные и операции доступны роли.\n4) **Регистрация событий** — фиксация в журналах: кто, когда, к каким сведениям обращался и что сделал.\n5) **Контроль и пересмотр прав** — периодический аудит, отзыв избыточных прав, блокировка учётных записей уволенных работников.\n\nМеры идентификации и аутентификации, управления доступом и регистрации событий обязательны для ГИС по Требованиям, утверждённым приказом ФСТЭК России от 11.04.2025 № 117.\n\n## Пример\n\nСпециалист управления социальной защиты по просьбе знакомого проверил в региональной ГИС, получает ли его сосед пособие, и сообщил ему ответ. Технически доступ у специалиста был, но права доступа для такой цели — нет: обладатель сведений — субъект РФ в лице министерства, а специалист нарушил обязанность конфиденциальности (п. 7 ст. 2 № 149-ФЗ) и неправомерно предоставил персональные данные. Журнал регистрации событий ГИС позволит установить факт обращения, а пересмотр ролевой модели — ограничить просмотр карточек только при наличии заявления в работе.\n\n**Вывод.** Обладатель информации определяет режим доступа, служащий лишь реализует полномочия органа; конфиденциальность — обязанность получившего доступ; предоставление адресовано определённому кругу лиц, распространение — неопределённому. Виды доступа — от свободного и обязательного размещения до ограниченного — реализуются в ГИС через цепочку «идентификация — аутентификация — авторизация — регистрация — пересмотр прав»."}, {"d": "ebod", "q": 4, "title": "Этапы обработки данных в государственном органе", "md": "## Жизненный цикл данных: семь этапов\n\nКаждый этап жизненного цикла порождает собственные обязанности: документировать, защищать, актуализировать и своевременно уничтожать сведения.\n\nТаблица: Этапы жизненного цикла данных и требования к ним\n{w:20,40,40}\n| Этап | Содержание | Ключевые требования |\n|---|---|---|\n| 1. Сбор | Личный приём, ЕПГУ, СМЭВ, ведомственные формы | Законная цель и правовое основание; минимизация состава (ч. 2, 5 ст. 5 № 152-ФЗ) |\n| 2. Регистрация и учёт | Присвоение номера, даты, реквизитов, сроков | Реквизиты документированной информации; учёт источника и даты |\n| 3. Хранение | Базы данных, архивы, резервные копии | Защита по приказу ФСТЭК России № 117; запрет зарубежных баз данных (ч. 5 ст. 18 № 152-ФЗ) |\n| 4. Обработка и анализ | Проверка, сопоставление, подготовка решения | Точность и актуальность (ч. 6 ст. 5 № 152-ФЗ); допуск по ролям |\n| 5. Передача и предоставление | Межведомственный обмен, ответы на запросы | Правовое основание, защищённые каналы, регистрация передачи |\n| 6. Архивирование | Передача на хранение по номенклатуре и срокам | Сроки хранения по перечням архивных документов |\n| 7. Уничтожение | По достижении цели или истечении срока | Хранение не дольше цели (ч. 7 ст. 5 № 152-ФЗ); уничтожение с актом (ст. 21) |\n\nОбязанность уничтожить данные по достижении цели обработки — такое же требование закона, как обязанность их защищать.\n\n## Инфраструктура электронного правительства\n\n- **ЕПГУ** (Единый портал государственных и муниципальных услуг) — фронт-офис: приём заявлений, информирование, выдача результатов, обратная связь;\n- **ЕСИА** (единая система идентификации и аутентификации) — единая учётная запись гражданина и служащего для доступа к государственным сервисам;\n- **СМЭВ** (система межведомственного электронного взаимодействия) — получение сведений из других ведомств без истребования документов у заявителя;\n- **ведомственные ГИС** — реестры и регистры органа; требования к их защите с 01.03.2026 установлены приказом ФСТЭК России от 11.04.2025 № 117.\n\n## Запрет истребовать документы и межведомственное взаимодействие\n\nОрганы, предоставляющие услуги, не вправе требовать от заявителя документы и информацию, которые находятся в распоряжении государственных органов, органов местного самоуправления и подведомственных организаций (п. 2 ч. 1 ст. 7 Федерального закона от 27.07.2010 № 210-ФЗ). Такие сведения орган получает сам по межведомственному запросу; обязанность органов предоставлять документы и информацию по межведомственным запросам закреплена ст. 7.1, а требования к запросу и срок ответа (не более пяти рабочих дней) — ст. 7.2 того же закона. Гражданин вправе представить документы по собственной инициативе. Принцип «одного окна» означает, что сведения, имеющиеся у государства, повторно у заявителя не истребуются.\n\n## Требования к документированию работы с данными\n\n- фиксировать **источник** сведений: из какой системы, реестра или документа и на какую дату;\n- указывать **правовое основание** запроса, обработки и передачи;\n- **сохранять историю изменений**: кто и когда вносил правки, прежние значения не удаляются бесследно;\n- **обосновывать решение данными**: в деле видно, какие показатели легли в основу вывода;\n- **регистрировать передачу**: кому, когда, в каком объёме и на каком основании;\n- **соблюдать сроки хранения**: по истечении срока — архивирование либо уничтожение с актом.\n\nНезадокументированное решение на основе данных невозможно ни проверить, ни защитить при проверке или в суде.\n\n## Сквозной пример: назначение пособия через ЕПГУ\n\n1) **Сбор.** Гражданка авторизуется через ЕСИА и подаёт заявление на назначение пособия на ЕПГУ; ФИО, СНИЛС и адрес подставляются из профиля. *Риск:* заявление заполнено с чужого устройства, сессия не завершена.\n2) **Регистрация.** Заявление получает номер и дату в ведомственной ГИС, запускается срок рассмотрения.\n3) **Обработка.** Орган направляет через СМЭВ запросы о доходах (ФНС), о составе семьи (ЗАГС), о регистрации по месту жительства (МВД), не требуя справок от заявителя. Сведения проверяются на полноту и непротиворечивость. *Риск:* специалист выгружает сведения в личную таблицу Excel для «удобства» — данные покидают защищённый контур.\n4) **Решение и передача.** Уполномоченное лицо принимает решение; результат направляется в личный кабинет; сведения о назначении передаются в систему выплат. *Риск:* ошибка адресата, перехват при передаче по незащищённому каналу.\n5) **Хранение и архивирование.** Дело хранится в ГИС установленный срок, затем передаётся в архив. *Риск:* избыточный круг лиц с доступом к архиву.\n6) **Уничтожение.** По истечении срока хранения данные уничтожаются с составлением акта. *Риск:* «вечное» хранение копий в почте и на локальных дисках.\n\n**Вывод.** Жизненный цикл данных в органе власти включает семь этапов — от сбора до уничтожения, и на каждом действуют свои требования: законная цель и минимизация, учёт, защита, точность, правомерная передача, архивное хранение и своевременное уничтожение (ст. 5 № 152-ФЗ). Инфраструктура электронного правительства (ЕПГУ, ЕСИА, СМЭВ) реализует запрет истребовать у заявителя сведения, имеющиеся у государства (ст. 7 № 210-ФЗ), а документирование каждого шага делает решение проверяемым."}, {"d": "ebod", "q": 5, "title": "Данные как стратегический актив и управление данными", "md": "## Почему данные — актив\n\n**Данные как актив** — ресурс, который контролируется органом власти, требует вложений и способен создавать управленческую, социальную и экономическую ценность. Это три признака актива:\n\n1) **контроль** — орган определяет, кто и как использует данные;\n2) **вложения** — сбор, хранение, очистка, защита и актуализация стоят денег и труда;\n3) **способность создавать ценность** — обоснованные решения, проактивные услуги, экономия ресурсов.\n\nОтличия данных от материальных активов:\n\n- **не расходуются при использовании**: могут применяться многократно и одновременно многими субъектами без уменьшения объёма;\n- **обесцениваются со временем**: устаревшие сведения теряют ценность и становятся источником ошибок;\n- **несут риск**: накопленные данные одновременно и актив, и объект ответственности при утечке.\n\nОтсюда вывод: неиспользуемые данные не являются активом — они создают только издержки хранения и риск утечки.\n\n## Четыре цели использования данных\n\n- **обоснование решений** — переход от решений «по интуиции» к решениям на проверенных данных; появляется возможность оценить эффект (адаптивное управление светофорами по данным камер, приоритизация благоустройства по обращениям жителей);\n- **проактивные услуги** — услуга назначается по данным о жизненной ситуации без заявления (выплаты семьям при рождении ребёнка по данным ЗАГС и социальных реестров);\n- **контроль и надзор** — риск-ориентированный подход: проверки там, где данные указывают на высокую вероятность нарушения (категорирование объектов контроля по риску причинения вреда; контроль НДС и онлайн-касс в налоговом администрировании);\n- **стратегическое планирование** — прогноз потребности в инфраструктуре, бюджетное планирование, моделирование последствий (планирование мощностей медицинских организаций по данным о загрузке и маршрутизации пациентов).\n\n## Управление данными: компоненты и роли\n\nМетодической основой служит свод знаний DAMA-DMBOK (Data Management Body of Knowledge) — международный стандарт де-факто; в российском законодательстве состав компонентов нормативно не закреплён. Основные компоненты: **стратегия и политика данных**; **архитектура и модели данных**; **нормативно-справочная информация** (единые справочники и классификаторы); **метаданные** (структура, источник, владелец, периодичность обновления); **качество данных**; **безопасность данных**.\n\nТаблица: Роли в управлении данными органа власти\n{w:28,72}\n| Роль | Функции |\n|---|---|\n| Владелец данных | Руководитель, отвечающий за состав, качество, полноту и предоставление данных своего домена; решает вопросы публикации и передачи |\n| Распорядитель (стюард) данных | Операционное ведение: справочники, правила качества, обработка сообщений об ошибках |\n| Архитектор данных | Модели данных, интеграция систем, стандарты обмена между ведомствами |\n| ИТ-подразделение | Инфраструктура, доступность, резервное копирование, техническая реализация правил доступа |\n| Подразделение по защите информации | Модель угроз, меры защиты, контроль режима, расследование инцидентов |\n\n**Почему за качество отвечает владелец, а не ИТ-служба.** Качество — содержательное свойство: только профильное подразделение знает, что означает показатель, каковы допустимые значения и как он формируется. ИТ-служба обеспечивает инструменты (валидацию, хранение), но не может определить, верна ли запись о размере выплаты. Кроме того, ошибка ввода на рабочем месте распространяется вверх по всем уровням: качество национальных данных начинается с дисциплины конкретного исполнителя.\n\n## Уровни управления и национальная система управления данными\n\n- **рабочее место** — корректный ввод, соблюдение справочников и форматов;\n- **подразделение** — домен данных: владелец, распорядитель, регламент актуализации;\n- **ведомство** — единая политика, архитектура, НСИ, ведомственные ГИС;\n- **государство** — национальная система управления данными (НСУД).\n\n**НСУД** — система мер по повышению качества и доступности государственных данных и их обмену между органами власти. Правовая основа: постановление Правительства РФ от 03.06.2019 № 710 (эксперимент по повышению качества и связанности данных), постановление Правительства РФ от 14.05.2021 № 733 (Положение о федеральной государственной информационной системе «Единая информационная платформа НСУД»). Стратегическая рамка: Стратегия развития информационного общества на 2017–2030 годы (Указ Президента РФ от 09.05.2017 № 203), национальная цель «цифровая трансформация государственного и муниципального управления» (Указ Президента РФ от 07.05.2024 № 309) и национальный проект «Экономика данных и цифровая трансформация государства».\n\n## Пример\n\nРегиональное министерство здравоохранения ведёт реестр записей на приём. Владелец данных — начальник отдела организации медицинской помощи, распорядитель — специалист, ведущий справочник медицинских организаций и специальностей, архитектор — сотрудник регионального центра информатизации, который связывает реестр с ЕГИСЗ. После того как владелец утвердил правила качества (обязательность кода специальности, контроль дублей пациентов по СНИЛС), отчёт о доступности узких специалистов перестал «расходиться» с данными медицинских организаций, и министерство смогло обосновать перераспределение ставок кардиологов между районами.\n\n**Вывод.** Данные — стратегический актив: они контролируются, требуют вложений и создают ценность, но, в отличие от материальных активов, не расходуются, обесцениваются и несут риск. Управление данными — системная деятельность с распределёнными ролями (DAMA-DMBOK): за качество отвечает владелец, ИТ обеспечивает инструменты. На уровне государства эту функцию выполняет НСУД (постановления Правительства № 710 и № 733) в стратегической рамке Указа № 203."}, {"d": "ebod", "q": 6, "title": "Качество и достоверность данных", "md": "## Шесть критериев качества данных\n\nРешение, принятое на некачественных данных, хуже решения без данных: оно выглядит обоснованным, но ведёт к системной ошибке. Критерии качества — методические (свод знаний DAMA-DMBOK, раздел «Качество данных»; серия стандартов ISO 8000); единых нормативных требований к качеству данных органов власти не установлено, а задача повышения качества и связанности государственных данных поставлена постановлением Правительства РФ от 03.06.2019 № 710.\n\nТаблица: Критерии качества данных\n{w:24,46,30}\n| Критерий | Содержание | Типичное нарушение |\n|---|---|---|\n| Точность | Соответствие значений действительности, отсутствие ошибок ввода и неверных единиц | Выплата 1 250 000 руб. вместо 12 500 руб. |\n| Полнота | Наличие всех нужных атрибутов и записей | Не заполнен код района у трети обращений |\n| Непротиворечивость | Согласованность значений между системами, реестрами, формами | Численность получателей в отчёте и в реестре различается |\n| Актуальность | Своевременное обновление, известная дата среза | Адрес из реестра пятилетней давности |\n| Уникальность | Отсутствие дублей одного объекта или лица | Две карточки одного гражданина с разным написанием фамилии |\n| Репрезентативность | Данные отражают целевую совокупность без систематического смещения | Опрос только пользователей портала как мнение всех жителей |\n\n## Ошибка измерения и ошибка отбора; устойчивость показателя\n\n**Ошибка измерения** — неверно записанное значение конкретного наблюдения: опечатка, перепутанное поле, неверная категория обращения. Она нарушает точность и устраняется сверкой с первоисточником.\n\n**Ошибка отбора** — систематическое смещение состава наблюдений: в данные попадают не все объекты совокупности, а определённая их часть. Пример — обращения граждан. Даже если каждое обращение записано безошибочно, совокупность обращений не репрезентативна для населения: на портал чаще пишут молодые, цифрово активные жители центральных районов, а пожилые и сельские жители — реже. Поэтому «число жалоб по районам» измеряет склонность жаловаться и доступность канала, а не распространённость проблемы. Ошибку отбора нельзя исправить чисткой записей — нужны нормирование, дополнительные источники (выборочные опросы, данные обходов) и явные оговорки в выводах.\n\n**Устойчивость показателя** — его способность сохранять значение и ранжирование объектов при небольших изменениях исходных данных, периода или методики. Неустойчивый показатель «скачет» случайно: в поселении на 300 жителей смертность «выросла на 100 %» из-за двух случаев вместо одного. Устойчивость обеспечивают достаточная база расчёта, нормирование на численность, скользящие средние, медиана вместо среднего, указание доверительных интервалов.\n\n## Три формы адекватности информации\n\n- **синтаксическая** — соответствие формальной структуре: формат, тип, кодировка, машиночитаемость;\n- **семантическая** — соответствие смыслу: что означает показатель, по какой методике рассчитан, совпадает ли понятие у источника и пользователя;\n- **прагматическая** — пригодность для конкретной управленческой цели: уместные детализация, период, своевременность.\n\n**Почему корректные данные могут быть непригодны.** Данные могут быть безупречны синтаксически и семантически, но не отвечать задаче. Пример: выверенная годовая статистика Росстата по региону не поможет решить, где в городе открыть новый маршрут автобуса, — нужна детализация до остановок и часов. Устаревшие, слишком агрегированные или нерепрезентативные данные прагматически неадекватны, даже если в них нет ни одной ошибки.\n\n## Пять критериев достоверности источника\n\n1) **Первичность** — источник создаёт данные сам или переписывает их у другого; приоритет — первоисточникам и юридически значимым реестрам.\n2) **Полномочия** — закреплено ли ведение ресурса нормативным актом, кто отвечает за достоверность.\n3) **Регламент актуализации** — известны ли периодичность и процедура обновления, дата последнего обновления.\n4) **Методика формирования** — как собраны данные, каков охват, какие объекты не попали.\n5) **Прослеживаемость (data lineage)** — можно ли восстановить происхождение значения и историю изменений.\n\nЧем выше цена ошибки решения, тем строже требования к качеству и прослеживаемости исходных данных: при низком качестве данных и высокой значимости решения оно откладывается до улучшения данных либо принимается с явной оговоркой и планом проверки.\n\n## Инструменты обеспечения качества\n\n**На входе:** валидация при вводе (форматно-логический контроль, маски полей, выбор из справочников, проверка диапазонов); верификация по эталонам (сверка с реестрами и данными межведомственного обмена через СМЭВ); правила идентификации объекта и устранения дублей.\n\n**В процессе ведения:** регулярный аудит качества (измерение полноты, точности, актуальности по каждому набору); канал обратной связи от потребителей данных со сроком реагирования; паспорт набора данных (структура, источник, владелец, регламент обновления, ограничения использования); единая нормативно-справочная информация.\n\n## Пример\n\nДепартамент дорожного хозяйства города распределяет средства ямочного ремонта по числу жалоб с портала обращений. Проверка показала: в 4 % записей адрес указан в поле «Описание» (ошибка измерения), а на окраинах, где проживает много пожилых людей, жалоб в 3 раза меньше при худшем состоянии дорог по данным диагностики (ошибка отбора). Департамент ввёл обязательный выбор адреса из справочника ГАР, стал нормировать жалобы на километр дорог и дополнил их данными инструментальной диагностики — источника с полномочиями, регламентом и методикой. Распределение средств стало отражать состояние дорог, а не активность жителей.\n\n**Вывод.** Качество данных оценивается по шести критериям — точности, полноте, непротиворечивости, актуальности, уникальности и репрезентативности; достоверность источника — по первичности, полномочиям, регламенту, методике и прослеживаемости. Корректность данных не гарантирует их пригодности: нужна и прагматическая адекватность. Качество обеспечивается контролем на входе и регулярным аудитом в процессе ведения в рамках задач, поставленных постановлением Правительства № 710 и сводом DAMA-DMBOK."}, {"d": "ebod", "q": 7, "title": "Этика данных и этические дилеммы государственных решений", "md": "## «Можно ли» и «следует ли»\n\n**Правовой подход** отвечает на вопрос «можно ли»: есть ли правовое основание обработки (ст. 6 Федерального закона № 152-ФЗ), соблюдены ли требования к защите, сроки и процедуры. Ответственность за нарушение прямо установлена законом — административная, уголовная, дисциплинарная.\n\n**Этический подход** отвечает на вопрос «следует ли»: справедливо ли решение, недискриминационно ли оно, понятно ли гражданину, соразмерно ли вмешательство цели, кто отвечает за алгоритм. Законность — необходимое, но не достаточное условие: решение может быть формально законным и при этом несправедливым к конкретному гражданину.\n\n**Характер ответственности за неэтичное решение** органа власти — прежде всего репутационная и общественная: падение доверия к государству, жалобы, общественный резонанс, отказ граждан пользоваться цифровыми сервисами. Неэтичное решение нередко со временем становится и незаконным — через судебную практику или новые нормы.\n\n## Пять этических рисков алгоритмического управления\n\n1) **Предвзятость обучающих выборок** — алгоритм воспроизводит и усиливает исторические перекосы: если в прошлом группа граждан чаще получала отказы, модель закрепит эту практику.\n2) **Скоринг граждан** — непрозрачные рейтинги «благонадёжности» влияют на доступ к услугам, а гражданин не знает критериев и способа их оспорить.\n3) **Избыточная слежка** — сбор данных «на всякий случай» без конкретной законной цели нарушает принцип минимизации и подрывает доверие.\n4) **Цифровое неравенство** — решения по данным ущемляют тех, кто слабо представлен в цифровой среде: пожилых граждан, жителей отдалённых территорий.\n5) **Эффект «чёрного ящика»** — невозможно объяснить гражданину, почему алгоритм принял решение, и потому его невозможно оспорить по существу.\n\n## Типичные дилеммы и способы их разрешения\n\n**Дилемма 1. Прозрачность и приватность.** Общество вправе знать, как расходуются бюджетные средства (ч. 4 ст. 8 № 149-ФЗ), но публикация реестров получателей поддержки раскрывает сведения о конкретных людях. *Разрешение:* раскрывать максимум о деятельности органа и минимум о людях — агрегирование, обезличивание, публикация сумм по категориям и территориям, а не по лицам.\n\n**Дилемма 2. Использование данных не по первоначальной цели.** Данные, собранные для назначения пособия, «удобно» использовать для контроля, рекламы услуг или выявления должников. Это противоречит ч. 2 ст. 5 Федерального закона № 152-ФЗ и ожиданиям гражданина. *Разрешение:* проверка совместимости новой цели с исходной, отдельное правовое основание, информирование граждан, обезличивание для аналитики.\n\n**Дилемма 3. Эффективность и справедливость.** Предиктивная модель отбора объектов проверки повышает результативность, но может систематически «наказывать» районы с исторически большим числом проверок. *Разрешение:* аудит модели на смещения, контроль человека за итоговым решением, право на возражение против решения, принятого исключительно автоматизированно (ст. 16 № 152-ФЗ).\n\n## Нормативная рамка\n\n- **Национальная стратегия развития искусственного интеллекта на период до 2030 года** (Указ Президента РФ от 10.10.2019 № 490, п. 19) закрепляет принципы: защита прав и свобод человека; безопасность; прозрачность (объяснимость работы ИИ и недискриминационный доступ к информации об алгоритмах); технологический суверенитет; целостность инновационного цикла; разумная бережливость; поддержка конкуренции. Принцип прозрачности — прямой нормативный ответ на проблему «чёрного ящика».\n- **ГОСТ Р 59276-2020** «Системы искусственного интеллекта. Способы обеспечения доверия. Общие положения» — факторы снижения качества систем ИИ и меры обеспечения доверия на стадиях жизненного цикла.\n- **Требования ФСТЭК России:** приказ от 11.04.2025 № 117 относит защиту информации при использовании ИИ к обязательным мероприятиям оператора ГИС и запрещает передавать разработчику модели информацию ограниченного доступа; методический документ ФСТЭК России от 12.04.2026 к этому приказу детализирует меры защиты моделей, обучающих данных и инфраструктуры разработки и эксплуатации ИИ.\n- **Документы саморегулирования:** Кодекс этики использования данных (2019) и Кодекс этики в сфере искусственного интеллекта (2021).\n\n## Клиентоцентричность и этическая экспертиза\n\nСтандарт клиентоцентричности (федеральный проект «Государство для людей») требует оценивать решение глазами того, кого оно касается. Правила: **добросовестность** — данные используются в заявленных целях и в интересах граждан; **прозрачность** — гражданин понимает, какие данные о нём обрабатываются и на каком основании; **управляемость** — значимые решения контролирует человек, алгоритм не выносит окончательный вердикт единолично; **безопасность** — защита данных как обязательное условие проекта.\n\n**Этическая экспертиза проводится до запуска проекта**, потому что ущерб от алгоритмического решения массовый и часто необратим: ошибочный отказ получат тысячи граждан, а утраченное доверие восстанавливается годами. Устранить смещение модели до внедрения дешевле, чем компенсировать последствия.\n\n## Пример\n\nРегиональный центр занятости планирует модель, которая по данным о прежних трудоустройствах ранжирует безработных по «перспективности» и направляет ресурсы на первых в списке. Правовое основание есть (исполнение полномочий), но этическая экспертиза выявляет риски: модель занижает рейтинг людей старше 50 лет и жителей сёл — исторически их трудоустраивали реже. Решение: ранжирование используется только как подсказка консультанту, критерии публикуются, гражданин может оспорить оценку, а модель ежеквартально проверяется на смещения по возрасту и территории.\n\n**Вывод.** Право отвечает на вопрос «можно ли», этика — «следует ли». Пять рисков алгоритмического управления — предвзятость, скоринг, слежка, цифровое неравенство и «чёрный ящик» — снимаются соразмерностью, прозрачностью, контролем человека и этической экспертизой до запуска. Нормативную рамку образуют принципы п. 19 Национальной стратегии (Указ № 490), ГОСТ Р 59276-2020, требования ФСТЭК России к ИИ и кодексы этики 2019 и 2021 годов."}, {"d": "ebod", "q": 8, "title": "Система правового регулирования персональных данных и регуляторы", "md": "## Пять уровней регулирования\n\n1) **Конституция Российской Федерации:** право на неприкосновенность частной жизни, личную и семейную тайну (ч. 1 ст. 23); запрет сбора, хранения, использования и распространения информации о частной жизни лица без его согласия (ч. 1 ст. 24); международные договоры — составная часть правовой системы (ч. 4 ст. 15). На этой основе Россия ратифицировала Конвенцию Совета Европы о защите физических лиц при автоматизированной обработке персональных данных (Федеральный закон от 19.12.2005 № 160-ФЗ).\n2) **Федеральные законы:** базовый Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных» и № 149-ФЗ; отраслевые законы, определяющие случаи и особенности обработки (Трудовой кодекс, законы об организации предоставления услуг, об основах охраны здоровья, о биометрической идентификации № 572-ФЗ).\n3) **Акты Правительства РФ:** требования к защите ПДн в информационных системах (постановление от 01.11.2012 № 1119), обработка без средств автоматизации (постановление от 15.09.2008 № 687), перечень мер для операторов — государственных органов (постановление от 21.03.2012 № 211).\n4) **Акты регуляторов:** приказ ФСТЭК России от 18.02.2013 № 21 (меры защиты ПДн), приказ ФСТЭК России от 11.04.2025 № 117 (защита ГИС), приказ ФСБ России от 10.07.2014 № 378 (криптографическая защита), формы уведомлений и разъяснения Роскомнадзора.\n5) **Локальные акты оператора:** политика обработки ПДн (ч. 1 ст. 18.1 № 152-ФЗ), положения, инструкции, приказы о допуске и об ответственном лице.\n\n**Основание соподчинённости.** Конституция имеет высшую юридическую силу (ч. 1 ст. 15). Законодательство о ПДн основывается на Конституции и международных договорах и состоит из № 152-ФЗ и других федеральных законов (ч. 1 ст. 4 № 152-ФЗ); государственные органы в пределах полномочий принимают нормативные акты по отдельным вопросам обработки на основании и во исполнение федеральных законов (ч. 2 ст. 4). Каждый нижестоящий акт конкретизирует вышестоящий и не может ему противоречить; локальный акт оператора не может ухудшать положение субъекта.\n\n## Сфера действия и цель № 152-ФЗ\n\n**Цель** — обеспечение защиты прав и свобод человека и гражданина при обработке его персональных данных, в том числе прав на неприкосновенность частной жизни, личную и семейную тайну (ст. 2).\n\n**Сфера действия** (ст. 1) — отношения, связанные с обработкой ПДн государственными органами, органами местного самоуправления, юридическими и физическими лицами с использованием средств автоматизации или без них (если обработка без автоматизации по характеру действий соответствует автоматизированной). С 2022 года закон распространяется и на иностранных лиц, обрабатывающих данные граждан России (ч. 1.1 ст. 1). Закон не применяется, в частности, к обработке ПДн физическими лицами исключительно для личных и семейных нужд, к обработке ПДн в архивных документах, к сведениям, составляющим государственную тайну (ч. 2 ст. 1).\n\n## Разграничение полномочий регуляторов\n\nТаблица: Регуляторы в области персональных данных\n{w:20,42,38}\n| Регулятор | Полномочия | Когда обращаться к его актам |\n|---|---|---|\n| Роскомнадзор | Уполномоченный орган по защите прав субъектов ПДн: надзор, реестр операторов, рассмотрение жалоб, требования об уточнении, блокировании, уничтожении, обращения в суд (ст. 23 № 152-ФЗ) | Правовые вопросы: основания обработки, согласие, права субъектов, уведомления, трансграничная передача, инциденты |\n| ФСТЭК России | Состав и содержание организационных и технических мер защиты без криптографии (ч. 4 ст. 19 № 152-ФЗ) | Меры защиты в ИСПДн (приказ № 21), защита ГИС (приказ № 117), модели угроз |\n| ФСБ России | Требования к криптографической защите (ч. 4 ст. 19 № 152-ФЗ); ГосСОПКА и НКЦКИ | Выбор и применение СКЗИ (приказ № 378), взаимодействие с ГосСОПКА при инцидентах |\n\nДополнительно Минцифры России участвует в регулировании оборота обезличенных ПДн (ст. 13.1 № 152-ФЗ) и выступает стратегическим регулятором цифровой трансформации.\n\n## Пять этапов развития регулирования\n\n1) **2005–2006 — формирование основ.** Ратификация Конвенции 108 (2005), принятие № 149-ФЗ и № 152-ФЗ (2006). Логика — имплементация европейского стандарта защиты данных.\n2) **2007–2013 — формализация мер защиты.** Постановления № 687 (2008), № 211 и № 1119 (2012), масштабные поправки 2011 года (Федеральный закон № 261-ФЗ: ст. 18.1, 19, 22.1 об обязанностях оператора), приказ ФСТЭК № 21 (2013). Логика — от деклараций к обязательным организационно-техническим мерам.\n3) **2014–2016 — суверенизация данных.** Требование локализации баз данных граждан России (Федеральный закон от 21.07.2014 № 242-ФЗ, с 01.09.2015), приказ ФСБ № 378 (2014), реестр нарушителей прав субъектов. Логика — контроль над местом хранения данных.\n4) **2020–2023 — прозрачность и подотчётность операторов.** Режим ПДн, разрешённых для распространения (Федеральный закон № 519-ФЗ, с 01.03.2021); экстерриториальность, уведомления об инцидентах по правилу 24/72 и уведомительный порядок трансграничной передачи (Федеральный закон от 14.07.2022 № 266-ФЗ); единая биометрическая система (Федеральный закон № 572-ФЗ). Логика — оператор отчитывается перед регулятором о каждом значимом событии.\n5) **2024–2026 — реальная ответственность и экономика данных.** Оборотные штрафы (№ 420-ФЗ, с 30.05.2025) и уголовная ответственность по ст. 272.1 УК РФ (№ 421-ФЗ, с 11.12.2024); оборот обезличенных ПДн (№ 233-ФЗ, с 01.09.2025); отдельное согласие (№ 156-ФЗ, с 01.09.2025); прямой запрет зарубежных баз данных (№ 23-ФЗ, с 01.07.2025); приказ ФСТЭК № 117 (с 01.03.2026); новый критерий «адекватных» государств (№ 265-ФЗ, 2026). Логика — от формального соответствия к ответственности за результат при одновременном вовлечении данных в экономический оборот.\n\n## Пример\n\nУправление образования города внедряет электронный журнал. Вопрос «можно ли обрабатывать сведения о здоровье учащихся и на каком основании» решается по № 152-ФЗ (ст. 6, 10) с учётом разъяснений Роскомнадзора; уровень защищённости системы определяется по постановлению № 1119, а меры — по приказу ФСТЭК № 21 (журнал как муниципальная ИС — также по приказу № 117); если для каналов связи со школами используется шифрование, класс СКЗИ выбирается по приказу ФСБ № 378. Политика обработки ПДн управления публикуется на сайте (ч. 2 ст. 18.1).\n\n**Вывод.** Регулирование ПДн выстроено в пять уровней — от Конституции (ст. 23, 24) через № 152-ФЗ и акты Правительства (№ 1119, № 687) к актам ФСТЭК, ФСБ и локальным актам оператора. Роскомнадзор отвечает за права субъектов, ФСТЭК — за некриптографическую защиту, ФСБ — за криптографию. Развитие регулирования прошло путь от имплементации международного стандарта к локализации, подотчётности и реальной ответственности."}, {"d": "ebod", "q": 9, "title": "Понятие и категории персональных данных; биометрические персональные данные", "md": "## Определение и признаки\n\n**Персональные данные** — любая информация, относящаяся к прямо или косвенно определённому или определяемому физическому лицу (субъекту персональных данных) (п. 1 ст. 3 Федерального закона № 152-ФЗ).\n\nСведения квалифицируются как ПДн по четырём признакам:\n\n1) **«любая информация»** — форма и содержание не важны: текст, фото, аудиозапись, номер, отметка в журнале;\n2) **относится к физическому лицу** — сведения о юридическом лице ПДн не являются, но сведения о его работниках, руководителе, индивидуальном предпринимателе — являются;\n3) **лицо прямо определено** — сведения содержат идентификатор: ФИО с датой рождения, паспортные данные, СНИЛС;\n4) **лицо косвенно определяемо** — личность можно установить сопоставлением сведений между собой или с дополнительной информацией, доступной оператору: адрес и возраст, номер телефона, государственный регистрационный знак, фотография, место работы и должность.\n\n**Почему удаление фамилии не делает набор обезличенным.** Обезличивание — действия, в результате которых становится невозможным без использования дополнительной информации определить принадлежность ПДн конкретному субъекту (п. 9 ст. 3). После удаления фамилии в наборе остаются квазиидентификаторы — дата рождения, адрес, пол, место работы, редкие признаки. Их сочетание выделяет конкретного человека: по исследованию Л. Свини, комбинация почтового индекса, даты рождения и пола уникальна для 87 % жителей США. Лицо остаётся определяемым, значит, сведения — персональными данными.\n\n## Категории персональных данных\n\nТаблица: Категории персональных данных и условия их обработки\n{w:24,38,38}\n| Категория | Состав | Условия обработки |\n|---|---|---|\n| Общие (иные) | ФИО, адрес, телефон, СНИЛС, сведения о доходах, образовании | Любое основание ч. 1 ст. 6 № 152-ФЗ |\n| Специальные (ст. 10) | Расовая, национальная принадлежность, политические взгляды, религиозные или философские убеждения, состояние здоровья, интимная жизнь | Запрещена, кроме случаев ч. 2 ст. 10: согласие в письменной форме, исполнение законодательства о социальной помощи, медицинские цели и др.; сведения о судимости — только в случаях ч. 3 ст. 10 |\n| Биометрические (ст. 11) | Физиологические и биологические особенности, по которым устанавливается личность | Только с письменного согласия, кроме случаев ч. 2 ст. 11 (правосудие, ОРД, оборона, безопасность, транспортная безопасность и др.) |\n| Разрешённые субъектом для распространения (ст. 10.1) | Сведения, на распространение которых дано отдельное согласие | Отдельное согласие с возможностью установить запреты и условия; молчание не является согласием |\n| Обезличенные (ст. 13.1) | Данные, принадлежность которых субъекту без дополнительной информации не определить | Особый режим обработки, в том числе в целях повышения эффективности государственного управления (п. 9.1 ч. 1 ст. 6) |\n\n## Биометрические персональные данные\n\n**Понятие:** сведения, которые характеризуют физиологические и биологические о
