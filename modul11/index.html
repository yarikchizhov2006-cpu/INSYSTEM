<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Тренажёр ЭБОД · АВД · УДО</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Макет: верхняя полоса с режимами, одна рабочая колонка до 860px; задание — «лист билета» с полями-метками. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#141C2B; --muted:#596377; --line:#D3D9E2;
  --stamp:#5134C4; --stamp-ink:#FFFFFF; --stamp-soft:#ECE8FB;
  --ebod:#B3343A; --avd:#17786A; --udo:#2F55B5;
  --ok:#1E7F47; --ok-bg:#E2F3E8; --bad:#BE3229; --bad-bg:#FBE6E4; --warn:#A86C10; --warn-bg:#FBF0DA; --none:#DCE1E8;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#171F2B; --sunk:#121924; --ink:#E6EBF2; --muted:#98A3B5; --line:#2A3443;
  --stamp:#9C88FF; --stamp-ink:#140F2C; --stamp-soft:#241D45;
  --ebod:#F27C81; --avd:#4FC4AF; --udo:#82A0FF;
  --ok:#5ECB8C; --ok-bg:#132B1C; --bad:#FF8378; --bad-bg:#371816; --warn:#E9B65C; --warn-bg:#33270F; --none:#263040;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171F2B; --sunk:#121924; --ink:#E6EBF2; --muted:#98A3B5; --line:#2A3443;
  --stamp:#9C88FF; --stamp-ink:#140F2C; --stamp-soft:#241D45;
  --ebod:#F27C81; --avd:#4FC4AF; --udo:#82A0FF;
  --ok:#5ECB8C; --ok-bg:#132B1C; --bad:#FF8378; --bad-bg:#371816; --warn:#E9B65C; --warn-bg:#33270F; --none:#263040;
  color-scheme:dark; }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Верхняя полоса */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .dots{display:inline-flex;gap:3px}
.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.tab[aria-current="page"]{background:var(--stamp-soft);color:var(--stamp);font-weight:600}
.tab:hover{color:var(--ink)}
.who{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px 5px 6px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;max-width:220px}
.who .av{width:24px;height:24px;border-radius:50%;background:var(--stamp);color:var(--stamp-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.person:hover{border-color:var(--muted)}
.person.me{border-color:var(--stamp);box-shadow:inset 3px 0 0 var(--stamp)}
.person .av{width:36px;height:36px;border-radius:50%;background:var(--stamp-soft);color:var(--stamp);display:grid;place-items:center;font-weight:700}
.person .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.person .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .lvbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:260px}
.person .lvbar i{display:block;height:100%;background:var(--ok)}
.person .sc{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.person .sc b{display:block;font-size:18px;color:var(--ink);font-family:var(--f-display)}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
.namebox input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);font-size:16px}
textarea.code{width:100%;min-height:84px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-family:var(--f-mono);font-size:12px;word-break:break-all}

main{padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.2vw,30px);line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.25}
h3{font-size:15px;font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{background:transparent;border-style:dashed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>.label{font-size:13px;font-weight:600;color:var(--muted)}

/* Переключатели-чипы */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);padding:6px 11px;border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px var(--bg)}
.num{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-family:var(--f-mono)}
select.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);max-width:100%}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.d{color:var(--surface);border-color:transparent}
.tag.d.ebod{background:var(--ebod)} .tag.d.avd{background:var(--avd)} .tag.d.udo{background:var(--udo)}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:6px;height:10px;border-radius:2px;background:var(--line);display:block}
.lvl i.on{background:var(--stamp)}

/* Сводка на главной */
.counter{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.counter b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* Лист задания */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px dashed var(--line);background:var(--sunk)}
.sheet-body{padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.qtext{font-size:18px;font-weight:600;line-height:1.4;max-width:68ch}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--stamp);transition:width .25s}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 13px;line-height:1.4}
.opt:hover{border-color:var(--muted)}
.opt .mk{flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:1px}
.opt.sq .mk{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--stamp);background:var(--stamp-soft)}
.opt[aria-pressed="true"] .mk{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600;padding:14px}

.match{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mrow .left{font-weight:500;min-width:0}
.mrow select{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.mrow.good{border-color:var(--ok);background:var(--ok-bg)} .mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{grid-column:1/-1;font-size:13.5px;color:var(--ok);font-weight:600}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}

.order{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.order li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px;background:var(--surface)}
.order li .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:18px;flex:none}
.order li .t{flex:1;min-width:0}
.order li .mv{display:flex;gap:4px;flex:none}
.order li .mv button{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);line-height:1}
.order li.good{border-color:var(--ok);background:var(--ok-bg)} .order li.wrong{border-color:var(--bad);background:var(--bad-bg)}

.answer-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:17px}
.answer-input.good{border-color:var(--ok);background:var(--ok-bg)} .answer-input.wrong{border-color:var(--bad);background:var(--bad-bg)}
textarea.draft{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);resize:vertical;line-height:1.45}

.verdict{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict.good{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.verdict.wrong{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.verdict.part{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.verdict b{font-weight:700}
.verdict .ex{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* Карточка ответа */
.card dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 16px;margin:0}
.card dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.card dd{margin:0;max-width:70ch}
@media (max-width:560px){.card dl{grid-template-columns:1fr;gap:2px}.card dd{margin-bottom:10px}}
.grade{display:flex;gap:8px;flex-wrap:wrap}
.grade .btn.g1{border-color:var(--ok);color:var(--ok)} .grade .btn.g2{border-color:var(--warn);color:var(--warn)} .grade .btn.g3{border-color:var(--bad);color:var(--bad)}
.grade .btn[aria-pressed="true"].g1{background:var(--ok);color:var(--surface)}
.grade .btn[aria-pressed="true"].g2{background:var(--warn);color:var(--surface)}
.grade .btn[aria-pressed="true"].g3{background:var(--bad);color:var(--surface)}

/* Билет */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.stamp{width:84px;height:84px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-9deg);line-height:1.25;flex:none}
.stamp b{font-family:var(--f-display);font-size:20px;display:block;letter-spacing:0}
.timer{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.tq{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tq:last-child{border-bottom:0}
.tq .qn{display:flex;gap:10px;align-items:baseline}
.tq .qn .no{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}

/* Прогресс */
.cov{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
@media (max-width:520px){.cov{grid-template-columns:repeat(10,minmax(0,1fr))}}
.cell{aspect-ratio:1;max-width:100%;border:0;border-radius:5px;background:var(--none);font-family:var(--f-mono);font-size:11px;color:var(--muted);display:grid;place-items:center;padding:0}
.cell.c1{background:var(--bad);color:var(--surface)} .cell.c2{background:var(--warn);color:var(--surface)} .cell.c3{background:var(--ok);color:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:60px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

.big{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,10vw,64px);line-height:1}
.mist{display:flex;flex-direction:column;gap:8px}
.mist .it{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.mist .it .a{color:var(--ok);font-size:14px}
.empty{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;justify-content:flex-end}
.drawer .in{width:min(560px,100%);height:100%;overflow:auto;background:var(--surface);padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
@media (hover:none){.kbd{display:none}}
@media (max-width:640px){.who{order:2}.tabs{order:3;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dots"><i style="background:var(--ebod)"></i><i style="background:var(--avd)"></i><i style="background:var(--udo)"></i></span>Модуль 11 · тренажёр</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-go="test">Тест</button>
      <button class="tab" data-go="ticket">Билет</button>
      <button class="tab" data-go="cards">Карточки</button>
      <button class="tab" data-go="progress">Прогресс</button>
    </nav>
    <button class="who" id="who-btn" data-go="who" title="Сменить участника"><span class="av" id="who-av">?</span><span class="nm" id="who-nm">Войти</span></button>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="drawer" hidden></div>

<script>
const BANK = [];
function Q(d, q, items){ items.forEach((it, i) => BANK.push(Object.assign({ id: d + '-' + q + '-' + i, d, q }, it))); }
function FIX(m){ Object.keys(m).forEach(id => { const it = BANK.find(x => x.id === id); if (it) it.o = m[id]; else console.warn('FIX: нет задания', id); }); }
// ЭБОД — Этичное и безопасное обращение с данными
// Формат: s — один ответ (первый вариант верный), m — несколько ('+' — верные), tf — верно/неверно,
// mt — соответствие, or — порядок, in — ввод. l — уровень 1..3.
Q('ebod', 1, [
  {l:1,t:'s',x:'Какой закон даёт легальное определение информации как «сведений независимо от формы их представления»?',o:['№ 149-ФЗ «Об информации…» (п. 1 ст. 2)','№ 152-ФЗ «О персональных данных»','№ 63-ФЗ «Об электронной подписи»','№ 8-ФЗ о доступе к информации'],e:'Определение — п. 1 ст. 2 № 149-ФЗ.'},
  {l:1,t:'or',x:'Расположите уровни модели DIKW (Р. Акофф) снизу вверх.',s:['Данные','Информация','Знание','Мудрость (решение)'],e:'DIKW: данные → информация → знание → мудрость.'},

я после 01.09.2022 — только три). Инцидент: 24 часа — первичное, 72 часа — по итогам расследования (ч. 3.1 ст. 21); параллельно — ГосСОПКА (ч. 12 ст. 19).", "ex": "центр отдыха детей хотел использовать зарубежный сервис опросов — нарушение ч. 5 ст. 18; правильно: сбор российским сервисом, передача данных о группе принимающей стороне — после уведомления РКН.", "concl": "передача не отменяет локализации; уведомления — об обработке, передаче и инцидентах — самостоятельные обязанности."}, {"d": "ebod", "q": 15, "title": "Ответственность и действия при утечке ПДн", "plan": "четыре вида ответственности → оборотные штрафы и ответственность в госоргане → ст. 272.1 УК → алгоритм из семи шагов → структура ущерба → пример.", "anch": "дисциплинарная (ст. 57, подп. «в» п. 3 ч. 1 ст. 37 № 79-ФЗ); гражданско-правовая (ст. 24 № 152-ФЗ, ст. 151 ГК); административная — ст. 13.11 КоАП (ред. № 420-ФЗ, с 30.05.2025): неуведомление об инциденте — ч. 11, утечки — ч. 12–14 (организации — 3–15 млн руб.), спецкатегории и биометрия — ч. 16, 17, повторная — ч. 15, 18: оборотный штраф 1–3 % выручки, не менее 20/25 млн и не более 500 млн — только коммерческим операторам; в органе власти — должностные лица. Уголовная — ст. 272.1 УК (№ 421-ФЗ, с 11.12.2024; до 10 лет). Шаги: зафиксировать → локализовать → РКН за 24 часа → НКЦКИ (приказ ФСБ № 77) → расследование → РКН за 72 часа → устранить причины.", "ex": "специалист ЖКХ отправил таблицу на 3 200 получателей компенсации не тому адресату → удаление с подтверждением, уведомление РКН в тот же день, служебная проверка.", "concl": "четыре вида ответственности; при утечке — не скрывать, соблюдать 24/72 и сохранять доказательства."}, {"d": "ebod", "q": 16, "title": "Открытые данные: понятие, принципы, правовые основы", "plan": "определение и признаки → принципы и «пять звёзд» → правовая основа → режимы раскрытия → условия правомерности → соотношение с ПДн → пример.", "anch": "открытые данные — общедоступная информация в машиночитаемом формате для повтор т → обратная связь → расширение. Матрица «польза × риск» (№ 8-ФЗ, ст. 7 № 149-ФЗ, № 152-ФЗ).", "ex": "проект «Карта ДТП» по данным Госавтоинспекции показывает очаги аварийности → жители добиваются светофоров и ограждений.", "concl": "ценность открытых данных создаётся их использованием, а не публикацией."}, {"d": "ebod", "q": 19, "title": "Риски публикации, мозаичный эффект и этика OSINT", "plan": "риски → мозаичный эффект → исследования реидентификации → восемь мер → этика и границы OSINT → пример.", "anch": "риски: раскрытие ПДн и служебных сведений, реидентификация, угрозы объектам. Мозаичный эффект — эмерджентный: опасно сочетание безвредных наборов. Меры: удалить прямые идентификаторы → оценить квазиидентификаторы → огрубить точность → агрегировать группы менее 5 записей → проверить связывание с другими наборами → экспертиза до публикации (ответственный за ПДн и служба защиты) → регламент отзыва набора (ч. 6 ст. 7 № 149-ФЗ) → документирование решения. Нормы: ч. 5, 6 ст. 7 № 149-ФЗ; ст. 3, 13.1 № 152-ФЗ; OSINT — ст. 137, 272, 272.1 УК, ст. 13 № 144-ФЗ.", "ex": "набор «Результаты олимпиад» без ФИО, но с «школа, класс, год рождения, ОВЗ»: в сельской школе один девятиклассник → ребёнок узнаваем, ОВЗ — сведения о здоровье → огрубить и агрегировать.", "concl": "риск нельзя оценить по одному набору; меры принимаются до публикации."}, {"d": "ebod", "q": 20, "title": "Информационная безопасность и триада КЦД", "plan": "понятие → триада → техническое и правовое значения конфиденциальности → дополнительные свойства → цепочка угрозы → пример.", "anch": "безопасность информации — состояние защищённости, при котором обеспечены конфиденциальность, целостность, доступность (п. 2.4.5 ГОСТ Р 50922-2006). Конфиденциальность: техническая (свойство системы) и правовая (обязанность лица, п. 7 ст. 2 № 149-ФЗ). Дополнительно: аутентичность, неотказуемость, подотчётность. Цепочка: источник угрозы → уязвимость → способ реализации → последствия; управлять можно уязвимостями.", "ex": "в З , "plan": "ETL → ELT и отличия → когда ELT предпочтительнее.", "anch": "ETL — преобразование до загрузки на отдельном сервере; ELT — загрузка «как есть» и преобразование внутри мощного хранилища (ClickHouse, Greenplum, облако). ELT — при больших объёмах, разнородных данных, нужде в сырых данных; ETL — при умеренных объёмах и требовании очистить и защитить данные до загрузки.", "ex": "ЦУР собирает миллионы сообщений из соцсетей, портала обратной связи и датчиков в сутки → ELT: сырое в хранилище, преобразование SQL-запросами.", "concl": "ETL и ELT различаются местом и моментом преобразования."}, {"d": "avd", "q": 6, "title": "Преимущества SQL перед Excel при больших массивах данных", "plan": "различия инструментов → целостность → типизация → автоматизация и воспроизводимость → память и масштаб → пример.", "anch": "SQL — декларативный язык к реляционной СУБД на сервере; ключи и ограничения (PRIMARY KEY, FOREIGN KEY, NOT NULL, CHECK); строгие типы; запрос — воспроизводимый сценарий; Excel ограничен 1 048 576 строками и памятью компьютера.", "ex": "сумма выплат по районам из таблицы фактов на 3 млн строк — один запрос: SELECT r.name, SUM(p.amount) … JOIN regions … WHERE период … GROUP BY r.name; в Excel пришлось бы сводить несколько файлов, каждый не помещается на лист.", "concl": "при больших массивах SQL выигрывает по целостности, типизации, автоматизации и масштабу; Excel — для небольших расчётов и оформления."}, {"d": "avd", "q": 7, "title": "F- и Z-паттерны сканирования экрана и размещение KPI", "plan": "паттерны внимания → правило 30 секунд → куда помещать KPI.", "anch": "F-паттерн (исследования Nielsen Norman Group) — для текстовых и табличных отчётов; Z-паттерн — для обзорных дашбордов: левый верхний угол — вход, правый нижний — завершение. Правило 30 секунд: руководитель должен увидеть статус и «красную зону» за первые 30 секунд. Главный KPI — в левом верхнем углу.", "draw": "экран с траекториями F и Z; KPI-карточка слева вверху, детализация ниже.", "ex": "дашборд губернатора по нацпроекту: слева вверху красная карточка «87 % (план 95 %)», справа — исполнение бюджета, ниже — графики по муниципалитетам.", "concl": "расположение элементов должно совпадать с траекторией взгляда."}, {"d": "avd", "q": 8, "title": "Столбчатая и круговая диаграммы с точки зрения восприятия", "plan": "назначение → почему длина точнее угла и площади → пример ошибки → когда круговая допустима.", "anch": "Кливленд и Макгилл (1984): точнее всего положение на общей шкале и длина, хуже — угол и площадь; принцип «Длина > Площадь». Круговая — только доли целого, не больше 5–6 секторов, сумма 100 %.", "ex": "перераспределение бригад ЖКХ по доле жалоб на отопление: круговая из 12 районов с долями 6–11 % — секторы неразличимы → столбчатая с сортировкой; ошибка и «исполнение бюджета по программам» на круговой, где сумма не 100 %.", "concl": "столбчатая — для сравнения и ранжирования, круговая — для простой структуры из немногих долей."}, {"d": "avd", "q": 9, "title": "Визуальный шум в дашбордах", "plan": "понятие → почему шум ухудшает решения → три примера → как устранить.", "anch": "визуальный шум — оформление без информации (chartjunk, Э. Тафти; принцип максимума «данные/чернила»). Примеры: 3D-круговая с тенями (искажает доли), избыточная сетка и фоновые картинки, случайный цвет без смысла; также обрезанная ось Y, «График 1» вместо заголовка-вывода.", "ex": "3D-диаграмма: ближний сектор 18 % выглядит больше дальнего 22 % — руководитель делает обратный вывод.", "concl": "шум перегружает внимание и маскирует отклонения; удалять всё, что не несёт данных, цвет — только со смыслом."}, {"d": "avd", "q": 10, "title": "Четыре критерия определения границ системы", "plan": "зачем границы → четыре критерия → проблема размытых границ → пример.", "anch": "критерии: юридический (полномочия и НПА ведомства), ресурсный (бюджет, штат, имущество), информационный (своя отчётность и ГИС), управляемости (контуры контроля, влияния и наблюдения). Факторы делятся на рычаги, промежуточные переменные и внешние факторы.", "ex": "снижение жалоб на теплоснабжение: внутри — полномочия минЖКХ и ГЖИ, программа капремонта, данные ГИС ЖКХ; снаружи — погода, тарифная политика федерального уровня.", "concl": "четыре критерия разделяют, чем орган управляет, а что только учитывает; размытые границы ведут к ответственности за неуправляемое."}, {"d": "avd", "q": 11, "title": "Положительная и отрицательная обратная связь", "plan": "понятие → различие → знак не равен оценке → значение для управления.", "anch": "положительная (усиливающая, R-петля) — «снежный ком»: инвестиции → инфраструктура → ниже издержки → выше привлекательность → новые инвестиции. Отрицательная (стабилизирующая, B-петля) — возврат к равновесию: рост тарифов → жалобы → проверки ГЖИ → корректировка тарифов. «Положительная» не значит «хорошая»: может раскручивать и кризис.", "ex": "отток молодёжи: закрытие школ → отъезд семей → меньше детей → закрытие новых школ (порочный круг, R-петля).", "concl": "положительная связь усиливает отклонение, отрицательная стабилизирует; знак — про механизм, а не про результат."}, {"d": "avd", "q": 12, "title": "Диаграммы влияния и техническое задание для BI", "plan": "понятие и назначение → место в моделировании → переход к ТЗ → пример.", "anch": "диаграмма влияния — граф причинно-следственных связей между решениями, неопределённостями и целью. Переход в ТЗ: решение → фильтр, срез, параметр сценария; переменная → график динамики; результат → крупная KPI-карточка; стрелка → связь таблиц, формула; узлы-решения и факторы → справочники; узлы-результаты → витрины.", "draw": "прямоугольники-решения → овалы-переменные → ромб-цель «Жалобы на портале».", "ex": "социальная напряжённость в ЖКХ: «тарифы на капремонт» и «плановые проверки ГЖИ» — фильтры-параметры; погода и износ сетей — графики; число жалоб — KPI.", "concl": "диаграмма влияния — каркас ТЗ: определяет фильтры, графики, KPI, расчёты и источники."}, {"d": "avd", "q": 13, "title": "Типы узлов диаграмм влияния", "plan": "общая характеристика → типы узлов → правила построения → пример.", "anch": "решение — прямоугольник (рычаг: субсидии, график проверок); неопределённость или промежуточная переменная — овал (инфляция, число заявителей); результат, ценность — ромб или восьмиугольник (уровень бедности); влияние — стрелка. Правила: начинать с результата и идти «назад» к причинам; про каждый узел спрашивать «кто им управляет?» (субъект — прямоугольник, среда — овал); каждая стрелка объяснима; узлы, не связанные с результатом, удалять.", "ex": "оценка соцподдержки: решения — финансирование льгот и информирование; внешний фактор — демография; переменные — численность нуждающихся и охват; результат — реальный доход льготников.", "concl": "три типа узлов и стрелки формализуют управленческую задачу."}, {"d": "avd", "q": 14, "title": "Элементы OLAP-куба и группы измерений", "plan": "понятие куба → элементы → группы измерений → связь с реляционной моделью.", "anch": "факты (меры) — агрегируемые числа; измерения — контекст; элементы (члены) — «2026», «Кировский район»; иерархии и уровни (год → квартал → месяц); ячейка — пересечение; агрегаты — предрасчитанные итоги. Группы измерений: время (когда), география (где), объекты, отрасли (что), субъекты (кто). Реляционно — схема «звезда».", "draw": "куб: ГЕОГРАФИЯ × ОТРАСЛЬ × ВРЕМЯ, выделенная ячейка с фактом.", "ex": "ячейка «Кировский район × ЖКХ × I квартал 2026» = выделено 15 млн руб.", "concl": "куб — факты на пересечении измерений с иерархиями."}, {"d": "avd", "q": 15, "title": "Операции над OLAP-кубом", "plan": "назначение → срез → вращение → консолидация → детализация → сценарий.", "anch": "срез (slice, dice) — фиксация значений измерений; вращение (pivot) — смена осей отчёта; консолидация (roll-up) — переход вверх по иерархии; детализация (drill-down) — вниз до первичных записей.", "ex": "консолидация — расходы на соцподдержку региона за 2026 год +12 % → срез по категории «Ветераны» → вращение: районы в строках, кварталы в столбцах — выделяется Заволжский район в III квартале → детализация до месяцев и получателей — дубли после сбоя выгрузки.", "concl": "четыре операции дают интерактивный цикл анализа «общее → частное»."}, {"d": "avd", "q": 16, "title": "Вычисляемый столбец и мера в DAX", "plan": "язык DAX → время вычисления и память → контексты → когда что выбирать → пример.", "anch": "вычисляемый столбец — вычисляется при загрузке, хранится в модели, занимает память, контекст строки, не реагирует на фильтры; мера — вычисляется «на лету» при запросе, не хранится, контекст фильтра, реагирует на срезы. Столбец — для атрибутов фильтрации и группировки; мера — для агрегатов и KPI.", "ex": "«Возрастная группа» — вычисляемый столбец в справочнике получателей (срез); «Сумма выплат», «Средняя выплата» — меры.", "concl": "если результат нужен как срез — столбец, если как показатель — мера."}, {"d": "avd", "q": 17, "title": "Self-Service BI в ГМУ", "plan": "понятие → актуальность для ГМУ → организационные риски → технические риски → как снижать.", "anch": "Self-Service BI — пользователи сами строят отчёты на подготовленных данных без ИТ-службы. Организационные риски: «зоопарк» отчётов и разные версии правды, низкая грамотность в данных, размытая ответственность, сопротивление, «теневая» аналитика. Технические: безопасность и ПДн (152-ФЗ), качество «сырых» выгрузок, нагрузка на ГИС, производительность, зависимость от облака. Снижение: Data Governance (владельцы, каталог показателей), сертифицированные датасеты и витрины, ролевой доступ и обезличивание, обучение и стандарты, гибридная модель «ИТ — данные, бизнес — анализ».", "ex": "у трёх отделов разное «число получателей» на совещании → единая сертифицированная витрина и мера.", "concl": "Self-Service BI ускоряет решения, если опирается на управляемые данные."}, {"d": "avd", "q": 18, "title": "Четыре сущности архитектуры Yandex DataLens", "plan": "характеристика DataLens → четыре сущности → логическая последовательность → пример.", "anch": "подключение (доступ к источнику: PostgreSQL, ClickHouse, CSV) → датасет (поля, типы, связи, вычисляемые поля) → чарт (визуализация) → дашборд (чарты, селекторы, вкладки). Дополнительно — воркбуки и коллекции. Изменение на нижнем уровне распространяется наверх.", "draw": "цепочка «Источник → Подключение → Датасет → Чарт → Дашборд».", "ex": "«Мониторинг обращений в сфере ЖКХ»: подключение к PostgreSQL портала → датасет с ОКТМО и полем «Просрочено» → чарты KPI и карта → дашборд для заместителя главы.", "concl": "четыре последовательные сущности разделяют доступ, логику данных, визуализацию и интерфейс."}, {"d": "avd", "q": 19, "title": "Виды геовизуализации", "plan": "значение геоаналитики для ГМУ → виды → требования к данным.", "anch": "точечная карта (где объекты: школы, ДТП); тепловая (где концентрация: жалобы на отопление); фоновая картограмма (choropleth — сравнение территорий по относительному показателю: безработица); картодиаграмма (абсолютные величины значком: субсидии); карта потоков (перемещения: маятниковая миграция). Данные: координаты WGS 84 или нормализованные адреса (ФИАС/ГАР) с геокодированием; контроль ошибок (точки 0;0 — перепутанные широта и долгота); справочник ОКТМО для полигонов.", "ex": "тепловая карта жалоб показала кластер протечек кровли в одном микрорайоне → внеплановая проверка управляющей компании.", "concl": "вид карты выбирается по вопросу: где, где больше, как различаются территории, сколько, куда движется."}, {"d": "avd", "q": 20, "title": "Выбросы и устойчивость медианы", "plan": "понятие выброса → почему аномалии мешают → почему среднее смещается, а медиана устойчива → пример → выводы для аналитика.", "anch": "выброс — наблюдение, существенно отклоняющееся от закономерности; бывает ошибкой или реальным событием. Среднее использует величину каждого значения (точка излома — 0 %), медиана — только порядок (точка излома — 50 %); мода тоже устойчива.", "ex": "сроки рассмотрения обращений: 5, 6, 6, 7, 7, 8, 8, 9, 10 дней — среднее 7,3, медиана 7; ошибка 1000 вместо 10 → среднее 117,3, медиана 7.", "concl": "при выбросах и асимметрии — медиана; среднее — только после проверки данных."}, {"d": "avd", "q": 21, "title": "Метод межквартильного размаха (IQR)", "plan": "квартили и IQR → алгоритм → почему IQR устойчивее трёх сигм → пример → ограничения.", "anch": "Q1, Q3; IQR = Q3 − Q1; границы нормы Q1 − 1,5 × IQR и Q3 + 1,5 × IQR (Тьюки; экстремальные — 3 × IQR). Функции: КВАРТИЛЬ.ВКЛ (Excel), PERCENTILE.INC (DAX), PERCENTILE_CONT (SQL). Квартили зависят от порядка, а не от величины крайних значений; правило 3σ страдает от «маскировки» — выброс раздувает σ.", "draw": "box plot: ящик Q1–Q3, медиана, «усы», точки-выбросы.", "ex": "сроки 11 заявок: 3, 4, 4, 5, 5, 6, 6, 7, 8, 9, 45 → 3σ: граница 45,2 — 45 «не выброс»; IQR: Q1 = 4,5, Q3 = 7,5, граница 12 — 45 выброс.", "concl": "IQR робастен и подходит для асимметричных данных ГМУ; он сигнализирует, а решение принимает аналитик."}, {"d": "avd", "q": 22, "title": "Методы нейтрализации аномалий и границы замены", "plan": "сначала диагностика → методы → когда замена оправдана → когда превращается в фальсификацию → пример.", "anch": "методы: исправление по первоисточнику (лучший); удаление (тесты, дубли, координаты 0;0); аппроксимация (медиана соседей, интерполяция); винзоризация (приравнять к границе); преобразование шкалы (логарифм); робастные статистики (медиана) без изменения данных; маркировка. Фальсификация: аномалия — реальное событие; замена ради KPI; заменена значимая доля; замена не документирована; аномалия — признак мошенничества.", "ex": "выплата 1 250 000 вместо 12 500 → сверка с платёжным поручением → исправлена по первоисточнику.", "concl": "сначала выяснить природу аномалии; замену документировать и не применять к реальным событиям."}, {"d": "avd", "q": 23, "title": "Три «греха» данных в отчётах (Tidy Data)", "plan": "почему «грехи» возникают → три «греха» → общие последствия для автоматизации.", "anch": "1) объединённые ячейки и многоуровневые шапки; 2) несколько значений в одной ячейке и смысл через цвет; 3) внутренние итоги и «широкий» формат. Исправление: одна строка заголовков, разделение значений по столбцам, цвет → отдельный признак, удаление итогов, разворот в «длинный» формат. Последствия: незаметные ошибки, ручной труд (до 80 % времени), невоспроизводимость, невозможность межведомственного обмена и публикации.", "ex": "отчёт района: «Итого по району» среди строк поселений → при суммировании выплаты учитываются дважды.", "concl": "отчёт «для глаз» не годится для машины: данные хранить в Tidy-формате, оформление — только в представлении."}, {"d": "avd", "q": 24, "title": "«Колодцы данных» (Data Silos) и пути их преодоления", "plan": "понятие → опасность → влияние на межведомственное взаимодействие → роль хранилища → роль НСИ → государственная инфраструктура.", "anch": "колодец данных — изолированный набор данных одного подразделения или системы, недоступный остальным; следствие лоскутной автоматизации. Последствия: противоречивая отчётность, дублирование ввода, нет сквозной аналитики. Решения: DWH — единый источник истины; НСИ — общие ключи (ОКТМО, ФИАС, КБК); СМЭВ, НСУД, региональные ЦУР.", "ex": "число многодетных семей в соцзащите, образовании и МФЦ различается → сопоставление по СНИЛС и ОКТМО в хранилище даёт одно число.", "concl": "колодцы устраняются вместе технологией интеграции и общими стандартами данных."}, {"d": "avd", "q": 25, "title": "Различие OLTP- и OLAP-систем", "plan": "определения → сравнение → почему системы разделяют → пример.", "anch": "OLTP — операции (короткие транзакции, нормализация, реальное время, текущие данные, операторы); OLAP — анализ (агрегирующие запросы, «звезда» и колонки, пакетная загрузка, история, аналитики). Разделяют из-за разной оптимизации, конкуренции за ресурсы, нужды в истории и интеграции, безопасности (аналитикам — обезличенные данные).", "ex": "ГИС «Электронная очередь в МФЦ» (OLTP) фиксирует талоны и время приёма; ночью ETL переносит данные в хранилище, куб показывает время ожидания по МФЦ и часам.", "concl": "OLTP фиксирует операции, OLAP анализирует историю; совмещение вредит обоим."}, {"d": "avd", "q": 26, "title": "Тест FASMI и требование Fast", "plan": "содержание теста → технические решения быстрого отклика → пример.", "anch": "FASMI (Пендс и Крит, 1995): Fast — ответ до 5 секунд, простые запросы около 1 секунды; Analysis — анализ без программирования; Shared — многопользовательский защищённый доступ; Multidimensional — многомерность (ключевое); Information — любые объёмы. Решения для Fast: предагрегация (MOLAP, материализованные представления), колоночное хранение и сжатие (ClickHouse, VertiPaq), in-memory, «звезда», партиционирование, кэш, MPP (Greenplum), инкрементальная загрузка, оптимизация дашборда.", "ex": "дашборд «Исполнение региональных программ» по транзакционной базе открывался 40–60 секунд → перенос в ClickHouse с агрегатами → секунды.", "concl": "FASMI определяет OLAP пятью требованиями; Fast обеспечивается предагрегацией, колонками и памятью."}, {"d": "avd", "q": 27, "title": "Первичный и внешний ключи", "plan": "реляционная модель и ключи → назначение → пример «факт — справочник» → типичные ошибки.", "anch": "PK — уникальный, не пустой идентификатор записи; FK — ссылка на PK другой таблицы, обеспечивает ссылочную целостность. В BI: справочник — сторона «1» (уникальные ключи), факты — сторона «N», фильтр идёт от справочника к фактам. Ошибки: дубли на стороне «1» («Департамент ЖКХ» и с пробелом), «сироты» — FK без записи в справочнике, несовпадение типов («07» и 7).", "draw": "Районы (PK ID_района) 1 — N Выплаты (FK ID_района).", "ex": "«Социальные выплаты»: выбор «Кировский район» в срезе фильтрует выплаты по ID_района; в SQL — JOIN по ключу.", "concl": "пара PK–FK связывает таблицы и защищает целостность — основа модели BI."}, {"d": "avd", "q": 28, "title": "Свойства социально-экономических систем", "plan": "государство как сверхсложная система → основные свойства → дополнительные → следствия для аналитики → пример.", "anch": "нелинейность; эмерджентность; инерционность и временные лаги; обратные связи; открытость внешней среде; активность и рефлексивность участников; многоцелевость и конфликт интересов; неопределённость и стохастичность; иерархичность; трудность измерения. Следствия: сценарии вместо точечных прогнозов, учёт лагов, мониторинг побочных эффектов.", "ex": "рост субсидий работодателям влияет на занятость нелинейно (до порога эффект мал) и с лагом; работодатели адаптируются к правилам субсидии.", "concl": "эти свойства делают решения рискованными; аналитика должна учитывать нелинейность, лаги и реакцию участников."}, {"d": "avd", "q": 29, "title": "Эндогенные и экзогенные факторы", "plan": "определения → как неучёт экзогенного фактора искажает оценку → как учитывать.", "anch": "эндогенные — внутренние, управляемые органом (рычаги и промежуточные переменные); экзогенные — внешние, только наблюдаемые (макроэкономика, погода, демография). Учёт: узлы-неопределённости в диаграмме влияния, контрольная группа («разность разностей»), нормирование (градусо-сутки, реальные цены), сценарии, показ внешних факторов на дашборде.", "ex": "переоценка — безработица снизилась с 4,5 до 3,0 %, но так же и в регионах без программы (дефицит кадров по стране); недооценка — после замены сетей аварий больше из-за аномальных морозов.", "concl": "без учёта экзогенных факторов эффект решения переоценивается или недооценивается."}, {"d": "avd", "q": 30, "title": "Два статистических метода обнаружения аномалий", "plan": "методы курса → правило трёх сигм → метод IQR → общие ограничения → сравнение → пример.", "anch": "3σ: |x − μ| > 3σ, требует нормальности и больших выборок, чувствительно к выбросам (маскировка). IQR: квартили, форма распределения не важна, точка излома 25 %. Общие ограничения: оба одномерные, не учитывают тренд и сезонность, только сигнализируют.", "ex": "14 проектов благоустройства: 12 по 1,2–2,4 млн, два — 14,0 и 15,5 → 3σ: граница 17,8 — аномалий нет; IQR: граница 3,15 — найдены оба; один — реальный крупный проект, второй — ошибка единиц (тыс. вместо млн).", "concl": "3σ — для нормальных данных, IQR — для асимметричных данных ГМУ; решение принимает аналитик после проверки."}, {"d": "udo", "q": 1, "title": "Хранилище данных и озеро данных", "plan": "определения → принципиальное отличие → сравнение по признакам → преимущества озера для логов и IoT → пример.", "anch": "DWH (Инмон) — очищенные структурированные данные, схема при записи (schema-on-write). Data Lake (Дж. Диксон, 2010) — сырые данные любых типов, схема при чтении (schema-on-read). Признаки: тип данных, момент схемы, способ обработки (ETL/SQL vs ELT/Spark/ML), пользователи (аналитики vs data scientists), стоимость и масштабируемость, назначение. Озеро для логов и IoT: дешёвое объектное хранение (S3, Parquet), не нужна схема, полная детализация для ML, потоковый приём (Kafka), разделение хранения и вычислений. Риск — «болото данных» без каталога.", "ex": "интернет-магазин: 50 млн строк логов в сутки и датчики холодильников каждые 10 секунд → озеро; модели оттока и предиктивного обслуживания; отчёт директору — из DWH.", "concl": "хранилище — проверенная отчётность, озеро — «склад сырья» для исследований и ML."}, {"d": "udo", "q": 2, "title": "ER-диаграмма «Прокат автомобилей»", "plan": "сущности, атрибуты, PK → диаграмма → связи и кардинальность → реализация M:N.", "anch": "Клиент (ID_клиента; ФИО, номер ВУ), Автомобиль (ID_автомобиля; VIN, госномер, тариф; FK ID_пункта), Пункт проката (ID_пункта; адрес), Договор проката (ID_договора; FK клиента и автомобиля; даты выдачи и возврата, сумма). Связи: Клиент–Договор 1:N, Автомобиль–Договор 1:N, Пункт–Автомобиль 1:N, Клиент–Автомобиль M:N через Договор; 1:1 — Договор–Акт приёма-передачи. Нотация «воронья лапка»: «||» — ровно один, «o<» — ноль или много.", "draw": "четыре прямоугольника с PK/FK, Договор в центре между Клиентом и Автомобилем.", "ex": "Петров брал Kia Rio в марте и июне и Skoda в августе → три строки в Договоре; поэтому PK — суррогатный ID_договора, а не пара (клиент, автомобиль).", "concl": "M:N разрешается ассоциативной сущностью с внешними ключами обеих сторон и собственными атрибутами факта."}, {"d": "udo", "q": 3, "title": "DFD уровня 0 «Обработка обращения в техподдержку»", "plan": "нотация и элементы → диаграмма → логика потоков → правила построения → пример.", "anch": "Гейн — Сарсон: внешняя сущность — прямоугольник с толстой рамкой; процесс — скруглённый прямоугольник с номером (у Йордона — круг); накопитель — открытый прямоугольник D1 (у Йордона — две линии); поток — именованная стрелка. Правила: у процесса есть вход и выход; сущность и накопитель не соединяются напрямую; баланс с контекстной диаграммой.", "draw": "сущности — Пользователь, Специалист 2-й линии, Руководитель; процессы — 1 Приём и регистрация, 2 Классификация и назначение, 3 Диагностика и решение, 4 Закрытие и уведомление, 5 Отчётность; накопители — D1 Обращения, D2 Пользователи и оборудование, D3 База знаний.", "ex": "«не подключается VPN» → заявка № 1045, приоритет высокий, SLA 4 часа → решение из базы знаний за 40 минут → в отчёте 18 % обращений по VPN.", "concl": "DFD показывает, какие данные нужны на каждом шаге и где хранятся, — основа выбора Service Desk."}, {"d": "udo", "q": 4, "title": "Реляционные (SQL) и нереляционные (NoSQL) базы данных", "plan": "понятия и различия → четыре типа NoSQL → выбор для двух задач.", "anch": "SQL — таблицы (Кодд, 1970), строгая схема, ACID, JOIN, вертикальное масштабирование. NoSQL — гибкая схема, горизонтальное масштабирование, BASE; теорема CAP (Брюер, 2000). Типы: ключ–значение (Redis, Tarantool), документная (MongoDB), колоночная wide-column (Cassandra, HBase), графовая (Neo4j).", "ex": "соцсеть с анализом связей → графовая Neo4j («друзья друзей» обходом графа вместо многократных JOIN); кэш сессий → Redis (в памяти, доступ по ключу за доли миллисекунды, TTL).", "concl": "SQL — для целостности, NoSQL — для масштаба и гибкости; на практике их сочетают (polyglot persistence)."}, {"d": "udo", "q": 5, "title": "Централизованные, распределённые и облачные системы хранения", "plan": "три класса: особенности, плюсы, минусы → выбор для оператора ПДн → вертикальное и горизонтальное масштабирование → пример.", "anch": "централизованная — простота, но единая точка отказа; распределённая — отказоустойчивость, горизонтальный рост, сложность (CAP); облачная — эластичность, оплата по факту, зависимость от провайдера. Локализация: ч. 5 ст. 18 № 152-ФЗ (ред. № 23-ФЗ, с 01.07.2025) — базы при сборе только в РФ; штраф ч. 8 ст. 13.11 КоАП — 1–6 млн руб., повторно (ч. 9) — 6–18 млн; защита — ПП № 1119, приказ ФСТЭК № 21; передача копий за рубеж — уведомление РКН (ч. 3 ст. 12). Scale up — мощнее один сервер; scale out — больше узлов.", "ex": "страховая: основная база в московском ЦОД, реплика в Петербурге, расчёт полисов в российском облаке на обезличенных данных.", "concl": "для оператора ПДн — распределённая архитектура в российском контуре; облако только российское и с подтверждённым уровнем защиты."}, {"d": "udo", "q": 6, "title": "Data Management и Data Governance", "plan": "понятия и соотношение → роли и структуры → разграничение ИТ и управления данными → инструменты → пример.", "anch": "DAMA-DMBOK2 (2017): Governance — полномочия, контроль и совместное принятие решений о данных; Management — исполнение планов, политик и практик. Governance — центр «колеса DAMA» из 11 областей; аналогия: аудит и бухгалтерия. Роли: Совет по данным (политики, споры), CDO (программа), владелец (Data Owner — бизнес, доступ и качество домена), стюард (Data Steward — глоссарий, справочники, качество), хранитель (Data Custodian — ИТ, техника). Инструменты: политики, RACI, глоссарий, каталог и lineage, контроль качества, MDM. В госсекторе — НСУД (распоряжение № 1189-р, ПП № 733); ответственный за ПДн — ст. 22.1 № 152-ФЗ.", "draw": "иерархия Совет → CDO → Владельцы / Стюарды / Хранители → Пользователи.", "ex": "маркетинг считал 1,2 млн «активных клиентов», финансы — 0,9 млн → Совет утвердил определение «покупка за 90 дней».", "concl": "Governance задаёт правила и ответственность, Management исполняет."}, {"d": "udo", "q": 7, "title": "Безопасность хранилищ, стандарты и защита интернет-магазина", "plan": "методы защиты → стандарты → комплекс мер для магазина → пример.", "anch": "шифрование (в покое, в пути — TLS, поля; ГОСТ Р 34.12-2015, AES; управление ключами), контроль доступа (MFA, RBAC/ABAC, минимальные права, RLS, маскирование), мониторинг и аудит (журналы, SIEM, DAM, DLP), резервирование 3-2-1, сегментация. GDPR (2016/679): ст. 25, 32, 33 (72 часа), штраф до 20 млн евро или 4 % оборота (ст. 83). ISO/IEC 27001:2022 — СМИБ, 93 меры в 4 группах (ГОСТ Р ИСО/МЭК 27001-2021). 152-ФЗ: ст. 18.1, 19, ч. 3.1 ст. 21 (24/72), ч. 12 ст. 19 (ГосСОПКА), штрафы за утечки ч. 12–18 ст. 13.11 КоАП. PCI DSS v4.0.1 — данные карт, CVV не хранить.", "ex": "магазин на 400 тыс. клиентов: оплата на странице эквайера (карты не хранятся), MFA, база закрыта от интернета, DLP и SIEM — утечка учётки менеджера не превратилась в утечку базы.", "concl": "главное — не хранить лишнего, выполнить 152-ФЗ и строить защиту по рискам (ISO 27001)."}, {"d": "udo", "q": 8, "title": "Проблемы с данными, выбросы и качество", "plan": "проблемы → выбросы и причины → пример ошибочного решения → меры.", "anch": "выбросы, дублирование, несогласованность, пропуски, устаревшие и «тёмные» (собранные, но не используемые — Gartner) данные. Выявление выбросов: IQR (за Q1 − 1,5·IQR и Q3 + 1,5·IQR), z-оценка > 3, box plot. Причины: ошибки ввода, измерения, интеграции (единицы, форматы), мошенничество, реальные редкие события — их удалять нельзя. Меры: контроль на входе, правила качества в ETL, НСИ и MDM, метрики, стюарды, удаление «тёмных» данных (ч. 7 ст. 5 № 152-ФЗ).", "draw": "box plot с двумя выбросами: «лишний ноль» и «чёрная пятница».", "ex": "кассир ввёл 1 250 тыс. вместо 125 → средняя выручка выросла со 128 до 166 тыс. (+29 %) → закупки увеличили на четверть → затоваривание.", "concl": "качество обеспечивает система контроля, а не разовая очистка."}, {"d": "udo", "q": 9, "title": "Бизнес-стратегия, ИТ-стратегия и карта уровней архитектуры", "plan": "связь стратегий и её двунаправленность → бизнес-инжиниринг как «мост» → карта уровней → пример.", "anch": "«бизнес → ИТ» — согласование (alignment), «ИТ → бизнес» — новые возможности (enabling) и ограничения. Модель стратегического соответствия Хендерсона и Венкатрамана (1993). Бизнес-инжиниринг (Х. Эстерле, Санкт-Галлен): стратегия → процессы, оргструктура, требования к ИС. Уровни: бизнес- и ИТ-стратегия → бизнес-инжиниринг → архитектура ИС → архитектура данных и приложений → техническая архитектура → корпоративные ИТ-системы (ERP, CRM, СЭД, DWH/BI).", "draw": "вертикальная карта из шести уровней; слева стрелка вниз «требования», справа вверх «обратная связь».", "ex": "банк выходит к малому бизнесу онлайн → «цифровой банк» → процесс открытия счёта за 15 минут → интеграция приложения, АБС, скоринга, ЕСИА → контейнеры и PostgreSQL; биометрия расширила стратегию на регионы.", "concl": "карта показывает путь от цели к системе; бизнес-инжиниринг не даёт стратегии оторваться от ИТ."}, {"d": "udo", "q": 10, "title": "Модель корневых процессов системы хранения данных", "plan": "понятие модели → корневые процессы и потоки данных → управляющие → поддерживающие → пример.", "anch": "корневые: 1 сбор и приём → 2 загрузка и интеграция (ETL/ELT) → 3 хранение и организация → 4 доступ и анализ; из 3 → 5 архивирование и удаление; потоки: сырые → очищенные → витрины и агрегаты → отчёты. Управляющие (сверху) задают правила и контролируют: стратегия и архитектура хранения, политики (сроки, доступ, защита), мониторинг SLA, ёмкости, качества. Поддерживающие (снизу) дают ресурсы: администрирование инфраструктуры, резервное копирование (RPO/RTO), метаданные и каталог, ИБ и поддержка.", "draw": "три полосы: управляющие / корневые со стрелками данных / поддерживающие.", "ex": "сеть магазинов: политика — чеки три года, агрегаты бессрочно, данные к 7:00; чеки грузятся ежечасно; бэкап каждый час (RPO = 1 ч).", "concl": "модель разделяет создание ценности, управление и обеспечение и помогает назначить ответственных."}, {"d": "udo", "q": 11, "title": "ER-диаграмма «Интернет-магазин»", "plan": "сущности, атрибуты, PK → диаграмма → связи и логика → реализация M:N.", "anch": "Покупатель (ID_покупателя; ФИО, e-mail, телефон, адрес), Заказ (ID_заказа; FK покупателя; дата, статус, сумма), Позиция заказа (PK = ID_заказа + ID_товара, оба FK; количество, цена продажи), Товар (ID_товара; артикул, цена, остаток; FK категории), Категория (ID_категории; ID_родителя — рекурсивная связь), Оплата (ID_оплаты; FK заказа). Связи 1:N: Покупатель–Заказ, Заказ–Позиция (не менее одной), Товар–Позиция, Категория–Товар, Категория–Категория, Заказ–Оплата; M:N Заказ–Товар через Позицию.", "draw": "шесть сущностей, Позиция заказа между Заказом и Товаром с составным ключом.", "ex": "заказ № 501: смартфон 1 × 24 990 и чехол 2 × 790 → две строки (501, 1017) и (501, 2230); цена продажи фиксируется на момент заказа.", "concl": "M:N реализуется связующей таблицей с составным ключом и атрибутами самой связи."}, {"d": "udo", "q": 12, "title": "DFD уровня 0 «Оформление заказа в интернет-магазине»", "plan": "граница и окружение → контекстная диаграмма → DFD уровня 0 → обозначения → отличие контекстного уровня от детализации → пример.", "anch": "граница — от выбора товаров до передачи оплаченного заказа в доставку; окружение — Покупатель, Платёжная система, Служба доставки. Процессы: 1 Формирование корзины, 2 Ввод данных и оформление, 3 Проверка наличия и резервирование, 4 Оплата, 5 Передача в доставку; накопители: D1 Каталог и остатки, D2 Покупатели, D3 Заказы, D4 Платежи. Контекстная диаграмма — один процесс «0», без накопителей, задаёт границу; уровень 0 — 3–9 процессов и накопители; правило баланса внешних потоков; дальше 4 → 4.1, 4.2, 4.3.", "draw": "сначала контекстную (один блок и три сущности), затем уровень 0.", "ex": "наушники в корзине → адрес → резерв последней единицы → оплата 5 490 руб. → трек-номер и чек.", "concl": "контекстная задаёт границу, уровень 0 раскрывает логику; баланс потоков сохраняет согласованность уровней."}, {"d": "udo", "q": 13, "title": "Модель корневых процессов управления данными организации", "plan": "структура модели → корневые процессы и потоки → управляющие → поддерживающие → пример.", "anch": "корневые (жизненный цикл): 1 создание и сбор → 2 интеграция и хранение → 3 обработка и анализ → 4 использование и обмен → 5 архивирование и уничтожение; потоки: первичные → единые данные → отчёты и модели → неактуальные данные. Управляющие: стратегия данных и Data Governance (совет, CDO), политики и стандарты (качество, доступ, жизненный цикл), контроль соответствия и рисков (152-ФЗ, аудит). Поддерживающие: метаданные и НСИ (MDM), управление качеством (профилирование), ИТ-инфраструктура и ИБ, обучение и культура работы с данными.", "draw": "три полосы, как в УДО 10, с жизненным циклом в центре.", "ex": "минсоцзащиты региона: заявления через Госуслуги, сведения по СМЭВ, расчёт права, передача решений в казначейство; показатель «доля заявлений с ошибками» идёт вверх и меняет форму заявления.", "concl": "корневые процессы ведут данные по жизненному циклу, управляющие задают правила, поддерживающие дают инструменты; обратная связь делает систему самонастраивающейся."}, {"d": "udo", "q": 14, "title": "ER-диаграмма «Поликлиника»", "plan": "сущности и ключи → связи → моделирование «много пациентов — много врачей» → пример.", "anch": "Пациент (ID_пациента; ФИО, дата рождения, полис ОМС), Врач (ID_врача; FK специальности; кабинет), Специальность, Приём (ID_приёма; FK пациента, врача, кода МКБ; дата и время, жалобы, назначения), Диагноз МКБ-10 (Код_МКБ). M:N Пациент–Врач через ассоциативную сущность Приём; суррогатный PK, альтернативный ключ (ID_врача, Дата_время); расширение — Слот расписания 1 : 0..1 Приём. Медданные — специальная категория (ст. 10 № 152-ФЗ), врачебная тайна (ст. 13 № 323-ФЗ) → разграничение доступа.", "draw": "Пациент — Приём — Врач в ряд, Специальность к Врачу, МКБ к Приёму.", "ex": "Сидорова: два приёма у терапевта и один у кардиолога → три строки в Приёме.", "concl": "модель строится вокруг Приёма, справочники обеспечивают единообразие медицинской статистики."}, {"d": "udo", "q": 15, "title": "Карта уровней архитектуры: мосты и обратные связи", "plan": "карта с примерами → роль мостов → обратные связи → пример обратной связи.", "anch": "уровни: бизнес-стратегия ⇄ ИТ-стратегия → бизнес-инжиниринг → архитектура ИС → архитектура данных и приложений → техническая архитектура → корпоративные ИТ-системы. Мост 1 — бизнес-инжиниринг (стратегия → процессы); мост 2 — архитектура ИС, интеграция (процессы → ИТ); горизонтальный мост — согласование бизнес- и ИТ-стратегии. Обратные связи: фактические показатели BI, возможности технологий, ограничения (сроки, санкции, регуляторы), архитектурный контроль.", "draw": "две колонки — уровни и примеры розничной сети; внизу блок «Обратная связь» со стрелкой вверх.", "ex": "цель — 30 % онлайн-продаж → омниканальная платформа → процесс «заказ онлайн — выдача в магазине» за 2 часа → сайт, CRM, ERP, склад через шину и API → MDM, CRM, ERP, WMS, DWH → облако, PostgreSQL → 1С:ERP, сайт, приложение, BI. Обратно: BI — 40 % онлайн-заказов забирают в магазине → расширить пункты выдачи.", "concl": "мосты сохраняют смысл стратегии при переходе к процессам и ИТ, обратные связи учат стратегию на фактах."}, {"d": "udo", "q": 16, "title": "Схема процесса ETL из CRM и ERP в хранилище", "plan": "схема → назначение этапов → действия при преобразовании → полная и инкрементальная загрузка → пример.", "anch": "источники (CRM, ERP, файлы, API) → Extract → Staging (сырая копия, источники не нагружаются) → Transform → Load → DWH → витрины → BI; сбоку — метаданные, расписание, журнал, контроль качества. Transform: очистка, проверка качества, дедупликация, единые форматы (даты, валюты), сопоставление справочников, суррогатные ключи, расчёт и обогащение, агрегирование, история изменений (SCD 2), маскирование ПДн. Полная загрузка — всё заново (первичная, малые справочники); инкрементальная — только изменения (метка времени, ID, CDC, хэши; MERGE/upsert).", "draw": "вертикальная цепочка E → Staging → T → L → DWH → витрины → BI.", "ex": "справочник товаров 30 тыс. — полностью; заказы — инкрементально (200 тыс. вместо 50 млн строк); клиенты CRM и ERP — по ИНН и телефону; витрины к 6:00.", "concl": "ETL превращает разрозненные данные в согласованные; регулярный режим — инкрементальный."}, {"d": "udo", "q": 17, "title": "DFD уровня 0 «Обслуживание клиента в банке»", "plan": "окружение → внутренняя логика → отражение хранения данных клиента → отражение обмена с внешними системами → пример.", "anch": "внешние сущности: Клиент, ЕБС/ЕСИА (№ 572-ФЗ), бюро кредитных историй (№ 218-ФЗ), Росфинмониторинг (№ 115-ФЗ), платёжная система (СБП). Процессы: 1 Идентификация, 2 Приём заявки, 3 Проверка и решение, 4 Проведение операции, 5 Уведомление и выписка. Накопители: D1 Клиенты (досье), D2 Счета и договоры, D3 Журнал операций. Накопитель пассивен: доступ только через процесс; стрелка к накопителю — запись, от него — чтение. Внешняя система — «чёрный ящик» с парой потоков «запрос — ответ»; в Росфинмониторинг — односторонний поток. Документы хранятся не менее 5 лет (ст. 7 № 115-ФЗ); банковская тайна — ст. 26 закона «О банках».", "ex": "кредитная карта в приложении: биометрия через ЕБС → кредитный отчёт из БКИ → решение за 3 минуты → договор и уведомление.", "concl": "накопители показывают, где живут данные клиента, внешние сущности с парными потоками — обмен с внешними системами."}, {"d": "udo", "q": 18, "title": "ER-диаграмма «Складской учёт»", "plan": "сущности и ключи → связи → один товар от нескольких поставщиков → один товар на нескольких складах → пример.", "anch": "Поставщик, Поставка (FK поставщика и склада; накладная, дата), Позиция поставки (PK = ID_поставки + ID_товара; количество, цена закупки), Товар, Склад, Остаток (PK = ID_склада + ID_товара; количество, ячейка). Поставщик–Товар M:N через Поставку и Позицию поставки (цена у конкретного поставщика; при договорных ценах — «Прайс поставщика»); Товар–Склад M:N через Остаток; движение между складами — «Перемещение».", "draw": "Поставщик → Поставка → Позиция ← Товар → Остаток ← Склад; Склад → Поставка.", "ex": "бумага А4: от «Альфы» по 320 руб. на склад «Север», от «Беты» по 305 руб. на склад «Юг» → остатки 400 и 250 пачек, всего 650.", "concl": "обе ситуации — M:N через ассоциативные сущности с составными ключами."}, {"d": "udo", "q": 19, "title": "Многомерная модель «звезда» для анализа продаж", "plan": "идея многомерного анализа → схема «звезда»: факты и измерения → «снежинка» и когда её применять → пример.", "anch": "Кимбалл: факты — числа событий, измерения — контекст; куб и операции slice, dice, drill-down, roll-up, pivot. Факт продаж (зерно — позиция чека): FK даты, товара, магазина, клиента, канала; меры — количество, выручка, себестоимость, скидка, валовая прибыль (аддитивные); средний чек считается в BI. Измерения с иерархиями: Дата (день → месяц → квартал → год), Товар (→ подкатегория → категория), Магазин (→ город → регион), Клиент (сегмент), Канал. «Снежинка» — нормализованные измерения: меньше избыточности, больше соединений; для огромных и общих иерархий.", "draw": "факт в центре, пять измерений вокруг; рядом фрагмент Товар → Подкатегория → Категория.", "ex": "падение выручки в Поволжье в марте: фильтр региона → недели → категории → «Электроника» не поставлялась две недели.", "concl": "«звезда» — простая быстрая основа анализа; «снежинка» оправдана при больших разделяемых иерархиях."}, {"d": "udo", "q": 20, "title": "Data Warehouse, Data Lake и Data Lakehouse", "plan": "определения → сравнение → выбор для организации с отчётностью и ML → пример.", "anch": "Lakehouse (Армбруст и соавторы, Databricks, CIDR 2021) — озеро плюс ACID, контроль схемы, версии, быстрый SQL за счёт табличных форматов Delta Lake, Apache Iceberg, Hudi поверх Parquet; медальонные слои Bronze → Silver → Gold. Признаки сравнения: типы данных, схема, транзакции, производительность BI, ML, стоимость, управление, число копий данных. Выбор — Lakehouse: одна копия для BI и ML, ACID для отчётности, дешёвое хранение, единый каталог; условие — инженеры данных и Data Governance; при действующем DWH — поэтапный переход.", "draw": "объектное хранилище → табличный формат → Bronze / Silver / Gold → BI и ML сверху.", "ex": "оператор связи: журналы сети в Bronze, абоненты в Silver, витрины выручки в Gold; отчёты по Gold, модель оттока по Silver.", "concl": "Lakehouse объединяет надёжность хранилища и дешевизну озера."}, {"d": "udo", "q": 21, "title": "Архитектура приложений, портфель и целевой ландшафт", "plan": "архитектура приложений и две области → зачем оценивать ценность → целевой ландшафт → пример замены системы.", "anch": "домен корпоративной архитектуры (бизнес, данные, приложения, технологии): состав систем, функции, интеграция (ESB, API). Две области: разработка прикладных систем (жизненный цикл, «купить или разработать», ГОСТ 34) и управление портфелем приложений (инвентаризация, оценка, решения, дорожная карта). Оценка по двум осям: ценность для бизнеса и техническое состояние (+ TCO); матрица TIME (Gartner): Tolerate — сохранить, Invest — развивать, Migrate — заменить, Eliminate — вывести. Целевой ландшафт (TO-BE) против текущего (AS-IS) → разрыв → дорожная карта.", "draw": "матрица 2 × 2 TIME.", "ex": "самописная CRM 2009 года: высокая ценность, плохое состояние, 6 млн руб. в год → Migrate; CRM из реестра российского ПО (ПП № 1236); 5 лет: старая ≈ 30 млн, новая ≈ 24,5 млн → миграция за 18 месяцев, старая — Eliminate.", "concl": "портфельная оценка превращает замену системы в обоснованное инвестиционное решение."}, {"d": "udo", "q": 22, "title": "Облачные модели IaaS, PaaS и SaaS", "plan": "характеристика моделей → разделённая ответственность → сравнение → выбор для быстрого хранилища → пример.", "anch": "NIST SP 800-145 (2011). IaaS — серверы, хранилища, сети; клиент ведёт ОС, СУБД, приложения. PaaS — готовая платформа и управляемые СУБД; клиент — приложения и данные. SaaS — готовое приложение по подписке. Данные и права доступа всегда на стороне клиента. Гибкость и контроль: IaaS > PaaS > SaaS; скорость внедрения — наоборот. Выбор — PaaS: управляемый ClickHouse или Greenplum в российском облаке + SaaS BI; при ПДн — ЦОД в РФ и договор поручения (ч. 3 ст. 6 № 152-ФЗ).", "draw": "таблица «слои × модели», закрашены зоны клиента.", "ex": "сеть из 80 магазинов за две недели развернула управляемый ClickHouse, ночную загрузку из 1С и дашборды DataLens без закупки серверов.", "concl": "IaaS — контроль, SaaS — скорость, PaaS — баланс; для быстрого хранилища — PaaS."}, {"d": "udo", "q": 23, "title": "SQL и NoSQL: модель данных, строгость схемы и выбор", "plan": "различие по модели и схеме → четыре типа NoSQL → выбор для двух задач → пример.", "anch": "SQL — таблицы, схема при записи, ограничения проверяет СУБД, миграции (ALTER TABLE), ACID. NoSQL — гибкая схема, поля добавляются «на лету», контроль в приложении (опционально JSON Schema в MongoDB). Типы: ключ–значение (Redis, Tarantool), документная (MongoDB), колоночная (Cassandra, HBase), графовая (Neo4j). Анализ связей в соцсети → графовая (обход графа, PageRank, сообщества, Cypher); профили с быстрым доступом → документная MongoDB (профиль — один документ, шардирование по ID) + кэш Redis.", "ex": "профили 20 млн пользователей — MongoDB, граф 1,5 млрд связей — Neo4j, платежи — PostgreSQL.", "concl": "строгая схема — для целостности, гибкая — для изменчивых данных; модели сочетают."}, {"d": "udo", "q": 24, "title": "Динамическая и статическая модели проектирования", "plan": "принципиальное различие → динамическая модель: «чёрный ящик» и акторы → статическая модель: классы и связи → связь моделей.", "anch": "статическая — структура (что есть в системе), без времени: диаграммы классов, объектов, компонентов UML. Динамическая — поведение во времени: диаграммы вариантов использования, последовательности, деятельности, состояний. «Чёрный ящик» — система описывается реакциями на акторов без внутреннего устройства. Акторы: Покупатель, Платёжная система, Служба доставки; варианты: найти товар, добавить в корзину, оформить заказ («include» → оплатить заказ), отследить доставку. Классы: Покупатель 1 — 0..∗ Заказ; Заказ ◆ 1 — 1..∗ ПозицияЗаказа (композиция); Позиция 0..∗ — 1 Товар; Заказ 1 — 0..1 Оплата, Доставка; обобщение «ОплатаКартой», «ОплатаСБП». Шаги сценариев → операции классов.", "draw": "диаграмму вариантов использования (рамка системы, эллипсы, человечки) и диаграмму классов с кратностями.", "ex": "сценарий «Оформить заказ»: корзина → проверка наличия → адрес → оплата → передача в доставку; отказ оплаты — статус «ожидает оплаты».", "concl": "динамическая модель — что система делает для акторов, статическая — из чего она построена."}, {"d": "udo", "q": 25, "title": "Централизованная и распределённая архитектуры, масштабирование", "plan": "сравнение архитектур → вертикальное и горизонтальное масштабирование → подход для быстрорастущего сервиса → пример.", "anch": "централизованная — простота, ACID, контроль, но единая точка отказа и предел сервера; распределённая — шардирование и репликация, отказоустойчивость, рост, но CAP и сложность. Scale up — мощнее сервер (простота, предел, нелинейная цена); scale out — больше узлов (почти без предела, отказоустойчивость, сложность). Для растущего сервиса: сервисы без состояния и автомасштабирование → кэш Redis и CDN → реплики для чтения → шардирование по ID пользователя → разные хранилища под задачи, очередь Kafka.", "draw": "слева большой сервер (scale up), справа балансировщик и узлы-шарды (scale out).", "ex": "платформа обучения выросла с 50 тыс. до 2 млн пользователей: сервер 16 → 64 ядра, сессии в Redis, три реплики, 8 шардов.", "concl": "поэтапный переход к горизонтальному масштабированию."}, {"d": "udo", "q": 26, "title": "ETL и ELT", "plan": "сравнение по порядку этапов, месту преобразований и применимости → почему ELT распространился с облаками → выбор для загрузки сырых данных → пример.", "anch": "ETL: извлечь → преобразовать на ETL-сервере → загрузить готовое; ELT: извлечь → загрузить как есть → преобразовать внутри хранилища (SQL, dbt, Spark). Причины роста ELT: мощные MPP и колоночные движки, разделение хранения и вычислений, эластичность, схема при чтении, потребности ML, инструменты вроде dbt. Для больших сырых данных — ELT; ПДн маскировать на входе (ETLT), каталог против «болота».", "draw": "две строки блоков: E → T → L → DWH и E → L → облако → T.", "ex": "маркетплейс получает 2 ТБ кликов в сутки → Parquet в объектное хранилище, ID покупателей хэшируются → Spark и dbt строят витрины; смена определения «сессии» — пересчёт двух лет за часы.", "concl": "ELT стал основным подходом для больших объёмов в облаке."}, {"d": "udo", "q": 27, "title": "OLAP и OLTP", "plan": "сравнение по назначению, запросам, структуре, частоте обновления → компоненты OLAP-системы → куб, измерения, меры → когда что применять → пример.", "anch": "OLTP — операции, короткие транзакции, 3НФ, непрерывное обновление; OLAP — анализ, агрегирующие запросы, «звезда» и колонки, пакетная загрузка (термин — Э. Кодд, 1993). Компоненты: источники (OLTP) → ETL → хранилище и витрины → OLAP-сервер (MOLAP, ROLAP, HOLAP) → метаданные → клиентские средства (BI). Куб: измерения на осях, меры в ячейках, иерархии; операции срез, детализация, свёртка, поворот.", "draw": "цепочку компонентов и куб «Регион × Категория × Квартал».", "ex": "кассы (OLTP) — 2 млн чеков в день; ночью загрузка, утром директор видит падение «Электроники» в Самаре в III квартале.", "concl": "OLTP — надёжные операции, OLAP — быстрый многомерный анализ истории."}, {"d": "udo", "q": 28, "title": "Классы систем хранения и ограничения облака при локализации ПДн", "plan": "три класса → требования 152-ФЗ и выбор архитектуры → ограничения облака → пример.", "anch": "централизованные, распределённые, облачные (особенности, плюсы, минусы). Ч. 5 ст. 18 № 152-ФЗ (ред. № 23-ФЗ, с 01.07.2025); ч. 8, 9 ст. 13.11 КоАП (1–6 и 6–18 млн руб.). Ограничения облака: 1) ЦОД первичной записи — в РФ; 2) передача копий — уведомление РКН (ч. 3 ст. 12), РКН может запретить (ч. 8, 12 ст. 12); 3) поручение обработки провайдеру — договор (ч. 3 ст. 6), отвечает оператор (ч. 5 ст. 6); 4) уровень защищённости — ПП № 1119, приказ ФСТЭК № 21, для ГИС — приказ № 117 и аттестация; 5) сертифицированные СЗИ и СКЗИ ФСБ; 6) зависимость от провайдера, санкционные риски, план выхода. Выбор — гибридная архитектура в российском контуре.", "ex": "сеть клиник, 300 тыс. пациентов, данные о здоровье, угрозы 3-го типа → УЗ-2; медкарты в частном облаке ЦОД в Москве с репликой в Казани, запись на приём — в аттестованном сегменте российского облака.", "concl": "облако допустимо только российское, с подтверждённым уровнем защиты и договором поручения."}, {"d": "udo", "q": 29, "title": "Измеримые характеристики качества, метрики и пороги", "plan": "характеристики → как задать метрику и порог → пример несогласованного справочника → меры.", "anch": "DAMA-DMBOK, ISO/IEC 25012: полнота, точность, согласованность, своевременность, валидность, уникальность, целостность; метрика — доля записей, удовлетворяющих правилу (полнота = (всего − пустые) / всего × 100 %). Порядок: объект и правило → формула → базовый уровень → пороги «зелёный — жёлтый — красный» по влиянию на бизнес → владелец, периодичность, действия. Пример порогов: телефон ≥ 95 %, дубли ≤ 0,5 %, коды регионов — 100 %.", "ex": "в ERP регион — код ОКТМО, в CRM — текст «Московская обл.», «МО», «Подмосковье» → область распалась на три строки, выглядит седьмой вместо второй → урезан бюджет, отложен склад.", "concl": "каждая характеристика — метрика с формулой, порогом и владельцем; справочники выравниваются единой НСИ."}, {"d": "udo", "q": 30, "title": "Управление мастер-данн CARDS.forEach(c => BANK.push({ id: c.d + '-' + c.q + '-op', d: c.d, q: c.q, l: 3, t: 'op', x: c.title }));

/* ---------- хранилище (только этот браузер) ---------- */
const store = {
  get(k, def){ try { const v = localStorage.getItem('m11:' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v){ try { localStorage.setItem('m11:' + k, JSON.stringify(v)); } catch (e) {} }
};
/* ---------- участники: прогресс по имени ---------- */
let profiles = store.get('profiles', {});      // key -> {name, stats, updated}
let curKey = store.get('current', null);
if (curKey && !profiles[curKey]) curKey = null;
let stats = curKey ? profiles[curKey].stats : {};   // id -> {n, ok, last}
const legacy = store.get('stats', null);       // прогресс из первой версии — достаётся первому участнику
let cloud = null;                              // {db, writable}
let cloudList = {};                            // key -> профиль из общего хранилища
const keyOf = name => 'u-' + encodeURIComponent(name.trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ')).replace(/[!'()*]/g, '_').replace(/%/g, '~');
const cleanName = n => n.trim().replace(/\s+/g, ' ').slice(0, 30);
function summary(st){
  let n = 0, sum = 0; const per = {};
  Object.keys(st || {}).forEach(id => { const r = st[id]; n += 1; sum += r.last; const k = id.split('-').slice(0, 2).join('-'); (per[k] = per[k] || [0, 0])[0] += 1; per[k][1] += r.last; });
  const mastered = Object.values(per).filter(([c, v]) => v / c >= .8 && c >= 2).length;
  return { n, acc: n ? sum / n : 0, mastered };
}
function mergeStats(a, b){
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach(id => { if (!out[id] || b[id].n > out[id].n) out[id] = b[id]; });
  return out;
}
function saveLocal(){ store.set('profiles', profiles); store.set('current', curKey); }
let pushT = null, pushing = false, pushAgain = false;
function schedulePush(){ if (!cloud || !cloud.writable || !curKey) return; clearTimeout(pushT); pushT = setTimeout(pushCloud, 1500); }
async function pushCloud(){
  if (!cloud || !cloud.writable || !curKey) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true;
  const pr = profiles[curKey], sm = summary(pr.stats);
  try {
    await cloud.db.collection('profiles').doc(curKey).set({ name: pr.name, stats: pr.stats, updated: pr.updated, answered: sm.n, acc: sm.acc, mastered: sm.mastered });
    cloudList[curKey] = { name: pr.name, stats: pr.stats, updated: pr.updated };
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) { cloud.writable = false; paintWho(); }
  }
  pushing = false;
  if (pushAgain){ pushAgain = false; schedulePush(); }
}
function saveProfile(){
  if (!curKey) return;
  profiles[curKey].stats = stats; profiles[curKey].updated = Date.now();
  saveLocal(); schedulePush();
}
function login(name, extraStats){
  name = cleanName(name); if (!name) return false;
  const k = keyOf(name);
  const local = profiles[k], remote = cloudList[k];
  let st = mergeStats(local ? local.stats : {}, remote ? remote.stats : {});
  if (extraStats) st = mergeStats(st, extraStats);
  if (!local && !remote && legacy && !Object.keys(profiles).length){ st = mergeStats(st, legacy); try { localStorage.removeItem('m11:stats'); } catch (e) {} }
  profiles[k] = { name: (local && local.name) || (remote && remote.name) || name, stats: st, updated: Date.now() };
  curKey = k; stats = st; saveProfile(); paintWho();
  return true;
}
function paintWho(){
  const pr = curKey && profiles[curKey];
  $('#who-av').textContent = pr ? pr.name.slice(0, 1).toUpperCase() : '?';
  $('#who-nm').textContent = pr ? pr.name : 'Войти';
  $('#who-btn').title = pr ? 'Сменить участника · ' + (cloud && cloud.writable ? 'прогресс в облаке' : 'прогресс на этом устройстве') : 'Войти';
}
async function initCloud(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db'); if (!db) return;
    let writable = true;
    try { const u = await window.claude.use('user'); if (u){ const c = await u.can('data.write'); if (c === false) writable = false; } } catch (e) {}
    cloud = { db, writable };
    const snap = await db.collection('profiles').get();
    snap.docs.forEach(d => { const v = d.data(); if (v && v.name) cloudList[d.id] = v; });
    if (curKey && cloudList[curKey]){ stats = mergeStats(stats, cloudList[curKey].stats); profiles[curKey].stats = stats; saveLocal(); }
    paintWho();
    if (current === 'who') viewWho();
    if (curKey) schedulePush();
  } catch (e) { cloud = cloud || null; }
}
/* код переноса: индексы заданий + счётчики */
function exportCode(){
  const pr = profiles[curKey]; const idx = {}; BANK.forEach((it, i) => { idx[it.id] = i; });
  const rows = Object.keys(pr.stats).filter(id => id in idx).map(id => { const r = pr.stats[id]; return [idx[id], r.n, Math.round(r.ok * 2), Math.round(r.last * 2)].map(x => x.toString(36)).join('.'); });
  const json = JSON.stringify({ v: 1, name: pr.name, s: rows.join(',') });
  return 'M11-' + btoa(unescape(encodeURIComponent(json)));
}
function importCode(code){
  const raw = code.trim().replace(/^M11-/, '').replace(/\s+/g, '');
  const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
  if (!obj || obj.v !== 1 || !obj.name) throw new Error('bad');
  const st = {};
  (obj.s ? obj.s.split(',') : []).forEach(row => { const [i, n, ok, last] = row.split('.').map(x => parseInt(x, 36)); const it = BANK[i]; if (it) st[it.id] = { n, ok: ok / 2, last: last / 2 }; });
  return { name: obj.name, stats: st };
}
const defaults = { disc: DKEYS.slice(), from: 1, to: 30, lv: [1, 2, 3], fmt: FKEYS.filter(f => f !== 'op'), count: 20, instant: true };
let S = Object.assign({}, defaults, store.get('settings', {}));
const saveS = () => store.set('settings', S);
function record(id, frac){
  const r = stats[id] || { n: 0, ok: 0, last: 0 };
  r.n += 1; r.ok += frac; r.last = frac; stats[id] = r; saveProfile();
}

/* ---------- утилиты ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^0-9a-zа-я]/g, '');
const lvl = l => '<span class="lvl" title="' + LV[l] + '">' + [1, 2, 3].map(i => '<i class="' + (i <= l ? 'on' : '') + '"></i>').join('') + '</span>';
const dtag = d => '<span class="tag d ' + d + '">' + DISC[d].s + '</span>';
const pct = x => Math.round(x * 100);
function plural(n, a, b, c){ const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); }

function filtered(opts = S){
  return BANK.filter(it => opts.disc.includes(it.d) && it.q >= opts.from && it.q <= opts.to && opts.lv.includes(it.l) && opts.fmt.includes(it.t));
}
function qMastery(d, q){
  const ids = BANK.filter(it => it.d === d && it.q === q).map(it => it.id);
  let n = 0, ok = 0; ids.forEach(id => { const r = stats[id]; if (r){ n += 1; ok += r.last; } });
  return n ? { n, acc: ok / n, of: ids.length } : null;
}
const mistakes = () => BANK.filter(it => stats[it.id] && stats[it.id].last < 1);
