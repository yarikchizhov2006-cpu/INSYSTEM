function bindFilters(root, onChange){
  root.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (c.dataset.range){ const [a, b] = c.dataset.range.split('-').map(Number); S.from = a; S.to = b; }
    else {
      const k = c.parentElement.dataset.k; if (!k) return;
      const v = k === 'lv' ? Number(c.dataset.v) : c.dataset.v;
      const arr = S[k]; const i = arr.indexOf(v);
      if (i >= 0){ if (arr.length > 1) arr.splice(i, 1); } else arr.push(v);
    }
    saveS(); onChange();
  });
  root.addEventListener('change', e => {
    if (e.target.id === 'f-from' || e.target.id === 'f-to'){
      let a = Math.min(30, Math.max(1, parseInt($('#f-from', root).value) || 1));
      let b = Math.min(30, Math.max(1, parseInt($('#f-to', root).value) || 30));
      if (a > b) [a, b] = [b, a]; S.from = a; S.to = b; saveS(); onChange();
    }
    if (e.target.id === 'f-count'){ S.count = Number(e.target.value); saveS(); onChange(); }
    if (e.target.id === 'f-instant'){ S.instant = e.target.value === '1'; saveS(); }
  });
}

/* ---------- Тест ---------- */
let QZ = null;
function prepare(it){
  const p = { it };
  if (it.t === 's') p.opts = shuffle(it.o.map((t, i) => ({ t, ok: i === 0 })));
  if (it.t === 'm') p.opts = shuffle(it.o.map(t => ({ t: t.replace(/^\+/, ''), ok: t.startsWith('+') })));
  if (it.t === 'tf') p.opts = [{ t: 'Верно', ok: !!it.a }, { t: 'Неверно', ok: !it.a }];
  if (it.t === 'mt'){ p.left = shuffle(it.p.map(x => x[0])); p.right = shuffle([...new Set(it.p.map(x => x[1]))]); p.sel = {}; }
  if (it.t === 'or'){ let o; do { o = shuffle(it.s); } while (it.s.length > 1 && o.every((v, i) => v === it.s[i])); p.cur = o; }
  p.picked = new Set(); p.done = false;
  return p;
}
function startQuiz(items, opts){
  if (!items.length) return;
  QZ = { items: items.map(prepare), i: 0, title: opts.title, instant: opts.instant, back: opts.back || 'test' };
  renderQ();
}
function renderQ(){
  const p = QZ.items[QZ.i], it = p.it, n = QZ.items.length;
  const multi = it.t === 'm';
  let body = '';
  if (it.t === 's' || it.t === 'm'){
    body = `<div class="opts">${p.opts.map((o, k) => `<button class="opt ${multi ? 'sq' : ''}" data-k="${k}" aria-pressed="${p.picked.has(k)}"><span class="mk">${k + 1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
            ${multi ? '<p class="note">Выберите все верные варианты.</p>' : ''}`;
  } else if (it.t === 'tf'){
    body = `<div class="tf opts">${p.opts.map((o, k) => `<button class="opt" data-k="${k}" aria-pressed="${p.picked.has(k)}"><span>${o.t}</span></button>`).join('')}</div>`;
  } else if (it.t === 'mt'){
    body = `<div class="match">${p.left.map((l, k) => `<div class="mrow" data-row="${k}"><div class="left">${esc(l)}</div>
      <select aria-label="Пара для: ${esc(l)}" data-l="${k}"><option value="">— выберите —</option>${p.right.map(r => `<option ${p.sel[k] === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`).join('')}</div>`;
  } else if (it.t === 'or'){
    body = `<ol class="order">${p.cur.map((s, k) => `<li data-k="${k}"><span class="n">${k + 1}</span><span class="t">${esc(s)}</span>
      <span class="mv"><button data-mv="-1" aria-label="Выше" ${k === 0 ? 'disabled' : ''}>↑</button><button data-mv="1" aria-label="Ниже" ${k === p.cur.length - 1 ? 'disabled' : ''}>↓</button></span></li>`).join('')}</ol>
      <p class="note">Стрелками расставьте элементы в правильном порядке.</p>`;
  } else if (it.t === 'in'){
    body = `<input class="answer-input" id="ans" autocomplete="off" placeholder="Ваш ответ" value="${esc(p.text || '')}">`;
  } else if (it.t === 'op'){
    body = `<p class="note">Расскажите ответ вслух или набросайте скелет: план → 2–3 нормы или термина → пример → вывод. Затем откройте карточку и оцените себя честно.</p>
      <textarea class="draft" id="draft" placeholder="Скелет ответа (необязательно)">${esc(p.text || '')}</textarea>`;
  }
  V().innerHTML = `
  <div class="stack">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">${esc(QZ.title)} · <span class="mono">${QZ.i + 1} / ${n}</span></span>
      <button class="btn ghost small" id="b-quit">Завершить</button>
    </div>
    <div class="progress"><i style="width:${(QZ.i / n) * 100}%"></i></div>
    <article class="sheet">
      <div class="sheet-head">${dtag(it.d)}<span class="tag">Вопрос <span class="mono">${it.q}</span></span><span class="tag">${FMT[it.t]}</span><span class="tag">${lvl(it.l)} ${LV[it.l]}</span></div>
      <div class="sheet-body">
        <div class="qtext">${esc(it.x)}</div>
        <div id="qbody">${body}</div>
        <div id="fb"></div>
        <div class="actions">
          <button class="btn ghost small" id="b-card">Карточка вопроса ${it.q}</button>
          <div class="row" id="act"></div>
        </div>
      </div>
    </article>
  </div>`;
  $('#b-quit').addEventListener('click', finishQuiz);
  $('#b-card').addEventListener('click', () => openCard(it.d, it.q));
  bindQ(p); renderActions(p);
  if (p.done) showFeedback(p);
  const first = $('#ans') || $('#draft'); if (first && !p.done) first.focus();
}
function renderActions(p){
  const it = p.it, last = QZ.i === QZ.items.length - 1;
  const act = $('#act');
  if (it.t === 'op'){
    act.innerHTML = p.done !== true ? (p.done ? '' : `<button class="btn primary" id="b-reveal">Открыть карточку <span class="kbd">Enter</span></button>`) : `<button class="btn primary" id="b-next">${last ? 'Результаты' : 'Дальше'} <span class="kbd">Enter</span></button>`;
  } else if (!p.done){
    act.innerHTML = `<button class="btn primary" id="b-check">${QZ.instant ? 'Проверить' : (last ? 'Завершить' : 'Ответить')} <span class="kbd">Enter</span></button>`;
  } else {
    act.innerHTML = `<button class="btn primary" id="b-next">${last ? 'Результаты' : 'Дальше'} <span class="kbd">Enter</span></button>`;
  }
  const c = $('#b-check'); if (c) c.addEventListener('click', () => check(p));
  const r = $('#b-reveal'); if (r) r.addEventListener('click', () => revealOpen(p));
  const nx = $('#b-next'); if (nx) nx.addEventListener('click', next);
}
function bindQ(p){
  const it = p.it, qb = $('#qbody');
  qb.addEventListener('click', e => {
    if (p.done) return;
    const o = e.target.closest('.opt');
    if (o){
      const k = Number(o.dataset.k);
      if (it.t === 'm'){ p.picked.has(k) ? p.picked.delete(k) : p.picked.add(k); o.setAttribute('aria-pressed', p.picked.has(k)); }
      else { p.picked = new Set([k]); qb.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b === o)); }
      return;
    }
    const mv = e.target.closest('[data-mv]');
    if (mv){
      const k = Number(mv.closest('li').dataset.k), d = Number(mv.dataset.mv), j = k + d;
      [p.cur[k], p.cur[j]] = [p.cur[j], p.cur[k]]; renderQ();
      const btn = document.querySelector(`.order li[data-k="${j}"] [data-mv="${d}"]`) || document.querySelector(`.order li[data-k="${j}"] [data-mv]`); if (btn) btn.focus();
    }
  });
  qb.addEventListener('change', e => { if (e.target.dataset.l !== undefined) p.sel[e.target.dataset.l] = e.target.value; });
  qb.addEventListener('input', e => { if (e.target.id === 'ans' || e.target.id === 'draft') p.text = e.target.value; });
}
function grade(p){
  const it = p.it;
  if (it.t === 's' || it.t === 'tf'){ const k = [...p.picked][0]; return k !== undefined && p.opts[k].ok ? 1 : 0; }
  if (it.t === 'm'){
    const good = p.opts.map((o, k) => o.ok === p.picked.has(k)).filter(Boolean).length;
    return good === p.opts.length ? 1 : Math.max(0, (good - (p.opts.length - good)) / p.opts.length);
  }
  if (it.t === 'mt'){ const right = it.p.filter(([l, r]) => p.sel[p.left.indexOf(l)] === r).length; return right / it.p.length; }
  if (it.t === 'or'){ const right = p.cur.filter((v, i) => v === it.s[i]).length; return right === it.s.length ? 1 : right / it.s.length * 0.5; }
  if (it.t === 'in'){ const v = norm(p.text || ''); return v && it.a.some(a => norm(a) === v) ? 1 : 0; }
  return 0;
}
function check(p){
  if (p.done) return;
  const it = p.it;
  if ((it.t === 's' || it.t === 'tf' || it.t === 'm') && !p.picked.size){ hint('Выберите вариант ответа.'); return; }
  if (it.t === 'mt' && it.p.some((x, k) => !p.sel[k])){ hint('Заполните все пары.'); return; }
  if (it.t === 'in' && !norm(p.text || '')){ hint('Введите ответ.'); return; }
  p.score = grade(p); p.done = true; record(it.id, p.score);
  if (QZ.instant){ renderQ(); } else next();
}
function hint(msg){ $('#fb').innerHTML = `<p class="note" role="status">${msg}</p>`; }
function revealOpen(p){
  p.done = 'reveal';
  showFeedback(p);
  $('#act').innerHTML = '';
}
function showFeedback(p){
  const it = p.it, fb = $('#fb');
  if (it.t === 'op'){
    fb.innerHTML = cardHtml(cardOf(it.d, it.q)) + `
      <div class="stack" style="gap:8px"><span class="label note">Как получилось рассказать?</span>
      <div class="grade" id="gr">
        <button class="btn g1" data-g="1" aria-pressed="${p.score === 1}">Знаю</button>
        <button class="btn g2" data-g="0.5" aria-pressed="${p.score === 0.5}">Частично</button>
        <button class="btn g3" data-g="0" aria-pressed="${p.score === 0}">Не знаю</button></div></div>`;
    $('#gr').addEventListener('click', e => {
      const b = e.target.closest('[data-g]'); if (!b) return;
      const first = p.score === undefined; p.score = Number(b.dataset.g);
      if (first) record(it.id, p.score); else { stats[it.id].last = p.score; saveProfile(); }
      p.done = true; showFeedback(p); renderActions(p);
    });
    const d = $('#draft'); if (d) d.readOnly = true;
    return;
  }
  const qb = $('#qbody');
  qb.querySelectorAll('button, select, input').forEach(el => { el.disabled = true; });
  if (it.t === 's' || it.t === 'm' || it.t === 'tf'){
    qb.querySelectorAll('.opt').forEach(b => {
      const k = Number(b.dataset.k), o = p.opts[k], pk = p.picked.has(k);
      b.setAttribute('aria-pressed', 'false');
      if (o.ok && pk) b.classList.add('good'); else if (!o.ok && pk) b.classList.add('wrong'); else if (o.ok) b.classList.add('miss');
    });
  }
  if (it.t === 'mt'){
    qb.querySelectorAll('.mrow').forEach(row => {
      const k = Number(row.dataset.row), l = p.left[k], r = it.p.find(x => x[0] === l)[1], ok = p.sel[k] === r;
      row.classList.add(ok ? 'good' : 'wrong');
      if (!ok) row.insertAdjacentHTML('beforeend', `<div class="fix">Верно: ${esc(r)}</div>`);
    });
  }
  if (it.t === 'or'){
    qb.querySelectorAll('.order li').forEach(li => { const k = Number(li.dataset.k); li.classList.add(p.cur[k] === it.s[k] ? 'good' : 'wrong'); });
    qb.querySelectorAll('.mv').forEach(m => m.remove());
  }
  if (it.t === 'in') $('#ans').classList.add(p.score === 1 ? 'good' : 'wrong');
  const full = p.score === 1, part = p.score > 0 && !full;
  let extra = '';
  if (it.t === 'or' && !full) extra = `<div>Правильный порядок: ${it.s.map((s, i) => `<span class="mono">${i + 1}.</span> ${esc(s)}`).join(' → ')}</div>`;
  if (it.t === 'in' && !full) extra = `<div>Ответ: <b>${esc(it.a[0])}</b></div>`;
  fb.innerHTML = `<div class="verdict ${full ? 'good' : part ? 'part' : 'wrong'}" role="status"><b>${full ? 'Верно' : part ? 'Частично верно · ' + pct(p.score) + ' %' : 'Неверно'}</b>${extra}<div class="ex">${esc(it.e || '')}</div></div>`;
}
function next(){
  if (QZ.i < QZ.items.length - 1){ QZ.i += 1; renderQ(); } else finishQuiz();
}
function finishQuiz(){
  const done = QZ.items.filter(p => p.score !== undefined);
  const total = done.reduce((a, p) => a + p.score, 0);
  const rate = done.length ? total / done.length : 0;
  const by = DKEYS.map(d => { const a = done.filter(p => p.it.d === d); return [d, a.length, a.reduce((s, p) => s + p.score, 0)]; }).filter(x => x[1]);
  const wrong = done.filter(p => p.score < 1);
  const back = QZ.back;
  V().innerHTML = `
  <div class="stack">
    <span class="eyebrow">${esc(QZ.title)} · итог</span>
    <div class="panel row" style="justify-content:space-between;gap:20px">
      <div class="stack" style="gap:6px"><span class="big mono">${pct(rate)}%</span>
        <span class="note">${plural(done.length, 'задание', 'задания', 'заданий')}, верно ${String(Math.round(total * 10) / 10).replace('.', ',')} баллов</span></div>
      <div class="bars" style="flex:1;min-width:220px">${by.map(([d, n, s]) => `<div class="bar"><span>${DISC[d].s}</span><span class="tr"><i style="width:${pct(s / n)}%;background:var(--${d})"></i></span><span class="v">${pct(s / n)}%</span></div>`).join('')}</div>
    </div>
    <div class="row">
      ${wrong.length ? `<button class="btn primary" id="b-redo">Повторить ошибки · <span class="mono">${wrong.length}</span></button>` : ''}
      <button class="btn" id="b-new">Новый тест</button>
    </div>
    <h2>${wrong.length ? 'Ошибки и неточности' : 'Ошибок нет'}</h2>
    <div class="mist">${wrong.map(p => `<div class="it"><div class="row">${dtag(p.it.d)}<span class="tag">Вопрос ${p.it.q}</span><span class="tag">${FMT[p.it.t]}</span></div>
      <div>${esc(p.it.x)}</div><div class="a">${esc(answerText(p.it))}</div></div>`).join('') || '<p class="empty">Все задания решены верно.</p>'}</div>
  </div>`;
  if (wrong.length) $('#b-redo').addEventListener('click', () => startQuiz(shuffle(wrong.map(p => p.it)), { title: 'Повтор ошибок', instant: true, back }));
  $('#b-new').addEventListener('click', () => go(back));
  QZ = null; window.scrollTo(0, 0);
}
function answerText(it){
  if (it.t === 's') return 'Ответ: ' + it.o[0];
  if (it.t === 'm') return 'Верные: ' + it.o.filter(o => o.startsWith('+')).map(o => o.slice(1)).join('; ');
  if (it.t === 'tf') return 'Ответ: ' + (it.a ? 'верно' : 'неверно') + '. ' + (it.e || '');
  if (it.t === 'mt') return it.p.map(x => x[0] + ' → ' + x[1]).join('; ');
  if (it.t === 'or') return it.s.join(' → ');
  if (it.t === 'in') return 'Ответ: ' + it.a[0];
  if (it.t === 'op') return 'Повторить карточку вопроса ' + it.q;
  return '';
}

function keepTimer(draw){ const keep = timer; if (keep){ clearInterval(keep.h); } draw(); if (keep){ timer = keep; tick(); if (keep.run) timer.h = setInterval(tick, 1000); } }
function fmtT(s){ const m = Math.floor(Math.abs(s) / 60), r = Math.abs(s) % 60; return (s < 0 ? '−' : '') + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0'); }

  if (!timer) return;

  const b = $('#b-tm'); if (b) b.textContent = timer.run ? 'Пауза' : (timer.left < 1800 ? 'Продолжить' : 'Старт');
}
function bindTimer(){
  if (!timer) timer = { left: 1800, run: false, t0: 0, h: null };
  tick();
  $('#b-tm').addEventListener('click', () => {
    if (timer.run){ timer.left = Math.round(timer.left - (Date.now() - timer.t0) / 1000); timer.run = false; clearInterval(timer.h); }
    else { timer.t0 = Date.now(); timer.run = true; timer.h = setInterval(tick, 1000); }
    tick();
  });
  $('#b-tr').addEventListener('click', () => { clearInterval(timer.h); timer = { left: 1800, run: false, t0: 0, h: null }; tick(); });
}

      <div class="row"><button class="btn small" id="b-imp">Загрузить прогресс</button><span class="note" id="imp-msg"></span></div>
      <div class="row"><button class="btn ghost small" id="b-del">Удалить «${esc(me.name)}» с этого устройства</button><span id="del-msg"></span></div>
    </section>` : `<section class="panel stack" style="gap:10px"><h2>Есть код переноса?</h2>
      <textarea class="code" id="imp" placeholder="M11-…"></textarea>
      <div class="row"><button class="btn small" id="b-imp">Загрузить прогресс</button><span class="note" id="imp-msg"></span></div></section>`}
  </div>`;
  const done = () => { const to = afterLogin && afterLogin !== 'who' ? afterLogin : 'test'; afterLogin = 'test'; go(to); };
  $('#login').addEventListener('submit', e => { e.preventDefault(); const v = $('#nm').value; if (!cleanName(v)){ $('#nm-msg').textContent = 'Введите имя.'; return; } login(v); done(); });
  V().querySelectorAll('.person').forEach(b => b.addEventListener('click', () => { login(b.dataset.name); done(); }));
  $('#b-imp').addEventListener('click', () => {
    try { const r = importCode($('#imp').value); login(r.name, r.stats); $('#imp-msg').textContent = 'Прогресс «' + r.name + '» загружен.'; setTimeout(viewWho, 900); }
    catch (e) { $('#imp-msg').textContent = 'Код не распознан. Скопируйте его целиком, начиная с M11-.'; }
  });
  if (me){
    $('#b-exp').addEventListener('click', () => {
      const code = exportCode(), ta = $('#exp'); ta.value = code; ta.hidden = false;
      const ok = () => { $('#exp-msg').textContent = 'Код скопирован.'; };
      const fail = () => { ta.focus(); ta.select(); $('#exp-msg').textContent = 'Выделите код и скопируйте вручную.'; };
      try { navigator.clipboard.writeText(code).then(ok, fail); } catch (e) { fail(); }
    });
    $('#b-del').addEventListener('click', () => {
      $('#del-msg').innerHTML = '<span class="row"><span class="note">Удалить прогресс с этого устройства?</span><button class="btn small" id="del-y">Удалить</button><button class="btn ghost small" id="del-n">Отмена</button></span>';
      $('#del-n').addEventListener('click', () => { $('#del-msg').innerHTML = ''; });
      $('#del-y').addEventListener('click', () => { delete profiles[curKey]; curKey = null; stats = {}; saveLocal(); paintWho(); viewWho(); });
    });
  }
  if (!me) $('#nm').focus();
}

/* ---------- клавиатура ---------- */
document.addEventListener('keydown', e => {
  if (!$('#drawer').hidden){ if (e.key === 'Escape'){ $('#dr-x').click(); } return; }
  if (e.key === 'Enter'){
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' && !(e.ctrlKey || e.metaKey)) return;
    const inQ = e.target.closest && e.target.closest('#qbody');
    if ((tag === 'button' || tag === 'select') && !inQ) return;
    const b = $('#b-check') || $('#b-next') || $('#b-reveal') || $('#b-start');
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
    return;
  }
  if (QZ && /^[1-9]$/.test(e.key) && !/input|textarea|select/i.test(e.target.tagName)){
    const o = document.querySelector(`#qbody .opt[data-k="${Number(e.key) - 1}"]`); if (o && !o.disabled) o.click();
  }
});

const start = (location.hash || '').slice(1);
paintWho();
go(VIEWS[start] ? start : 'test');
initCloud();
})();
</script>
