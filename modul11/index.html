<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Тренажёр ЭБОД · АВД · УДО</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Макет: верхняя полоса с режимами, одна рабочая колонка до 860px; задание — «лист билета» с полями-метками. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#141C2B; --muted:#596377; --line:#D3D9E2;
  --stamp:#5134C4; --stamp-ink:#FFFFFF; --stamp-soft:#ECE8FB;
  --ebod:#B3343A; --avd:#17786A; --udo:#2F55B5;
  --ok:#1E7F47; --ok-bg:#E2F3E8; --bad:#BE3229; --bad-bg:#FBE6E4; --warn:#A86C10; --warn-bg:#FBF0DA; --none:#DCE1E8;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#171F2B; --sunk:#121924; --ink:#E6EBF2; --muted:#98A3B5; --line:#2A3443;
  --stamp:#9C88FF; --stamp-ink:#140F2C; --stamp-soft:#241D45;
  --ebod:#F27C81; --avd:#4FC4AF; --udo:#82A0FF;
  --ok:#5ECB8C; --ok-bg:#132B1C; --bad:#FF8378; --bad-bg:#371816; --warn:#E9B65C; --warn-bg:#33270F; --none:#263040;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171F2B; --sunk:#121924; --ink:#E6EBF2; --muted:#98A3B5; --line:#2A3443;
  --stamp:#9C88FF; --stamp-ink:#140F2C; --stamp-soft:#241D45;
  --ebod:#F27C81; --avd:#4FC4AF; --udo:#82A0FF;
  --ok:#5ECB8C; --ok-bg:#132B1C; --bad:#FF8378; --bad-bg:#371816; --warn:#E9B65C; --warn-bg:#33270F; --none:#263040;
  color-scheme:dark; }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Верхняя полоса */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .dots{display:inline-flex;gap:3px}
.brand .dots i{width:8px;height:8px;border-radius:50%;display:block}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.tab[aria-current="page"]{background:var(--stamp-soft);color:var(--stamp);font-weight:600}
.tab:hover{color:var(--ink)}
.who{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px 5px 6px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;max-width:220px}
.who .av{width:24px;height:24px;border-radius:50%;background:var(--stamp);color:var(--stamp-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.person:hover{border-color:var(--muted)}
.person.me{border-color:var(--stamp);box-shadow:inset 3px 0 0 var(--stamp)}
.person .av{width:36px;height:36px;border-radius:50%;background:var(--stamp-soft);color:var(--stamp);display:grid;place-items:center;font-weight:700}
.person .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.person .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .lvbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:260px}
.person .lvbar i{display:block;height:100%;background:var(--ok)}
.person .sc{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.person .sc b{display:block;font-size:18px;color:var(--ink);font-family:var(--f-display)}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
.namebox input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);font-size:16px}
textarea.code{width:100%;min-height:84px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-family:var(--f-mono);font-size:12px;word-break:break-all}

main{padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.2vw,30px);line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.25}
h3{font-size:15px;font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{background:transparent;border-style:dashed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>.label{font-size:13px;font-weight:600;color:var(--muted)}

/* Переключатели-чипы */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);padding:6px 11px;border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px var(--bg)}
.num{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-family:var(--f-mono)}
select.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);max-width:100%}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.d{color:var(--surface);border-color:transparent}
.tag.d.ebod{background:var(--ebod)} .tag.d.avd{background:var(--avd)} .tag.d.udo{background:var(--udo)}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:6px;height:10px;border-radius:2px;background:var(--line);display:block}
.lvl i.on{background:var(--stamp)}

/* Сводка на главной */
.counter{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.counter b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* Лист задания */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px dashed var(--line);background:var(--sunk)}
.sheet-body{padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.qtext{font-size:18px;font-weight:600;line-height:1.4;max-width:68ch}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--stamp);transition:width .25s}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 13px;line-height:1.4}
.opt:hover{border-color:var(--muted)}
.opt .mk{flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:1px}
.opt.sq .mk{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--stamp);background:var(--stamp-soft)}
.opt[aria-pressed="true"] .mk{background:var(--stamp);border-color:var(--stamp);color:var(--stamp-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600;padding:14px}

.match{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mrow .left{font-weight:500;min-width:0}
.mrow select{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.mrow.good{border-color:var(--ok);background:var(--ok-bg)} .mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{grid-column:1/-1;font-size:13.5px;color:var(--ok);font-weight:600}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}

.order{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.order li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px;background:var(--surface)}
.order li .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:18px;flex:none}
.order li .t{flex:1;min-width:0}
.order li .mv{display:flex;gap:4px;flex:none}
.order li .mv button{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);line-height:1}
.order li.good{border-color:var(--ok);background:var(--ok-bg)} .order li.wrong{border-color:var(--bad);background:var(--bad-bg)}

.answer-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:17px}
.answer-input.good{border-color:var(--ok);background:var(--ok-bg)} .answer-input.wrong{border-color:var(--bad);background:var(--bad-bg)}
textarea.draft{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);resize:vertical;line-height:1.45}

.verdict{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict.good{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.verdict.wrong{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.verdict.part{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.verdict b{font-weight:700}
.verdict .ex{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* Карточка ответа */
.card dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 16px;margin:0}
.card dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.card dd{margin:0;max-width:70ch}
@media (max-width:560px){.card dl{grid-template-columns:1fr;gap:2px}.card dd{margin-bottom:10px}}
.grade{display:flex;gap:8px;flex-wrap:wrap}
.grade .btn.g1{border-color:var(--ok);color:var(--ok)} .grade .btn.g2{border-color:var(--warn);color:var(--warn)} .grade .btn.g3{border-color:var(--bad);color:var(--bad)}
.grade .btn[aria-pressed="true"].g1{background:var(--ok);color:var(--surface)}
.grade .btn[aria-pressed="true"].g2{background:var(--warn);color:var(--surface)}
.grade .btn[aria-pressed="true"].g3{background:var(--bad);color:var(--surface)}

/* Билет */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.stamp{width:84px;height:84px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-9deg);line-height:1.25;flex:none}
.stamp b{font-family:var(--f-display);font-size:20px;display:block;letter-spacing:0}
.timer{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.tq{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tq:last-child{border-bottom:0}
.tq .qn{display:flex;gap:10px;align-items:baseline}
.tq .qn .no{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}

/* Прогресс */
.cov{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
@media (max-width:520px){.cov{grid-template-columns:repeat(10,minmax(0,1fr))}}
.cell{aspect-ratio:1;max-width:100%;border:0;border-radius:5px;background:var(--none);font-family:var(--f-mono);font-size:11px;color:var(--muted);display:grid;place-items:center;padding:0}
.cell.c1{background:var(--bad);color:var(--surface)} .cell.c2{background:var(--warn);color:var(--surface)} .cell.c3{background:var(--ok);color:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:60px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

.big{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,10vw,64px);line-height:1}
.mist{display:flex;flex-direction:column;gap:8px}
.mist .it{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.mist .it .a{color:var(--ok);font-size:14px}
.empty{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;justify-content:flex-end}
.drawer .in{width:min(560px,100%);height:100%;overflow:auto;background:var(--surface);padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
@media (hover:none){.kbd{display:none}}
.explain{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.explain .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.explain p{max-width:72ch}
details.full{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.full>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
details.full>summary::-webkit-details-marker{display:none}
details.full>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.full[open]>summary::before{transform:rotate(45deg)}
details.full>summary .sub{font-weight:400;color:var(--muted);font-size:14px}
.ans{padding:4px 16px 18px;display:flex;flex-direction:column;gap:12px;line-height:1.55}
.ans h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin-top:8px}
.ans p,.ans li{max-width:74ch}
.ans ul,.ans ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.ans .tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ans table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.ans th,.ans td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.ans th{background:var(--sunk);font-weight:600}
.ans tr:last-child td{border-bottom:0}
.ans .cap{font-size:13px;color:var(--muted);font-weight:600}
.ans figure{margin:0;display:flex;flex-direction:column;gap:6px}
.ans figure .pic{background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
.ans figure img{display:block;margin:0 auto;height:auto}
.ans figcaption{font-size:13px;color:var(--muted)}
@media (max-width:640px){.who{order:2}.tabs{order:3;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dots"><i style="background:var(--ebod)"></i><i style="background:var(--avd)"></i><i style="background:var(--udo)"></i></span>Модуль 11 · тренажёр</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-go="test">Тест</button>
      <button class="tab" data-go="ticket">Билет</button>
      <button class="tab" data-go="cards">Карточки</button>
      <button class="tab" data-go="progress">Прогресс</button>
    </nav>
    <button class="who" id="who-btn" data-go="who" title="Сменить участника"><span class="av" id="who-av">?</span><span class="nm" id="who-nm">Войти</span></button>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="drawer" hidden></div>

<script>
const BANK = [];
function Q(d, q, items){ items.forEach((it, i) => BANK.push(Object.assign({ id: d + '-' + q + '-' + i, d, q }, it))); }
function EXPL(m){ Object.keys(m).forEach(id => { const it = BANK.find(x => x.id === id); if (it) it.x2 = m[id]; else console.warn('EXPL: нет задания', id); }); }
function FIX(m){ Object.keys(m).forEach(id => { const it = BANK.find(x => x.id === id); if (it) it.o = m[id]; else console.warn('FIX: нет задания', id); }); }

'ebod-1-3':'Юридическую силу электронному документу придаёт электронная подпись по № 63-ФЗ «Об электронной подписи». Закон различает простую, неквалифицированную и квалифицированную подписи; только квалифицированная автоматически равнозначна собственноручной (ч. 1 ст. 6).',
'ebod-1-4':'Показания, записанные при обследовании, — ещё данные: отдельные факты без оформления. Акт с датой, подписью и номером получил реквизиты — это документированная информация. Заключение в системе электронного документооборота с усиленной подписью — электронный документ, то есть документированная информация в электронной форме.',
'ebod-1-5':'Верно: п. 11.1 ст. 2 № 149-ФЗ определяет электронный документ как документированную информацию в электронной форме, пригодной для восприятия человеком и обработки в информационных системах. Иерархия понятий: информация → документированная информация → электронный документ.',
'ebod-2-0':'Статья 5 № 149-ФЗ делит информацию в зависимости от категории доступа на общедоступную и ту, доступ к которой ограничен федеральными законами. Ст. 9 устанавливает, как ограничивать доступ, ст. 2 даёт определения, ст. 13 № 8-ФЗ — о размещении сведений в сети.',
'ebod-2-1':'По ч. 1 ст. 9 № 149-ФЗ ограничить доступ к информации можно только федеральным законом — в целях защиты основ конституционного строя, нравственности, здоровья, прав и законных интересов других лиц, обороны и безопасности. Приказ руководителя может лишь реализовать уже установленный законом режим, но не создать его.',
'ebod-2-2':'Каждому режиму соответствует свой акт: гостайна — Закон РФ № 5485-1 «О государственной тайне»; перечень сведений конфиденциального характера (ПДн, тайна следствия, служебная, профессиональная и коммерческая тайны) — Указ Президента № 188; служебная информация ограниченного распространения с пометкой «ДСП» — постановление Правительства № 1233.',
'ebod-2-3':'Ч. 4 ст. 8 № 149-ФЗ перечисляет сведения, доступ к которым нельзя ограничить: нормативные правовые акты, затрагивающие права граждан; информация о состоянии окружающей среды; о деятельности органов власти и использовании бюджетных средств; накапливаемая в открытых фондах библиотек и архивов. Персональные данные и сведения о системах защиты ГИС, наоборот, охраняются.',
'ebod-2-4':'Утверждение перевёрнуто. Агрегирование (сумма по группе) и обезличивание снижают чувствительность сведений — такие данные можно даже публиковать. Сопоставление наборов, напротив, повышает её: из нескольких безвредных таблиц можно восстановить личность (мозаичный эффект). Поэтому категория сведений не постоянна.',
'ebod-2-5':'ФИО и адрес позволяют определить человека — это персональные данные. Инвалидность — сведения о здоровье, специальная категория ПДн по ст. 10 № 152-ФЗ с особыми условиями обработки. Число поездок по маршрутам без привязки к людям — агрегат, его можно публиковать как открытые данные.',
'ebod-3-0':'№ 149-ФЗ различает предоставление и распространение. Предоставление (п. 8 ст. 2) — получение информации определённым кругом лиц, например ответ на запрос или передача в другое ведомство. Распространение (п. 9) — неопределённым кругом лиц, например публикация на сайте.',
'ebod-3-1':'Обладатель информации (п. 5 ст. 2 № 149-ФЗ) — лицо, которое создало информацию или получило право разрешать или ограничивать доступ к ней. В органе это сам орган как оператор: он устанавливает режим доступа. Служащий лишь реализует полномочия органа и несёт обязанность соблюдать конфиденциальность.',
'ebod-3-2':'Контроль доступа к ГИС строится последовательно: система узнаёт, кто вы (идентификация по логину), проверяет подлинность (аутентификация паролем, токеном, MFA), выдаёт права по роли (авторизация), фиксирует действия в журнале (регистрация) и периодически пересматривает права — например, при переводе или увольнении сотрудника.',
'ebod-3-3':'Виды доступа закреплены в разных нормах: обязательное размещение сведений о деятельности органа в сети — ст. 13 № 8-ФЗ; доступ по запросу гражданина — ст. 18–20 № 8-ФЗ; открытые данные — ч. 4 ст. 7 № 149-ФЗ; права обладателя информации (разрешать, ограничивать, передавать) — ст. 6 № 149-ФЗ.',
'ebod-3-4':'Наличие технического доступа не равно праву использовать данные для любой цели. Конфиденциальность (п. 7 ст. 2 № 149-ФЗ) — обязательная для лица, получившего доступ, необходимость не передавать информацию третьим лицам без согласия обладателя. Просмотр сведений о соседе по личной просьбе знакомого выходит за служебную цель и нарушает этот режим.',
'ebod-3-5':'Пункт 7 ст. 2 № 149-ФЗ определяет конфиденциальность информации как обязательное для выполнения лицом, получившим доступ, требование не передавать её третьим лицам без согласия обладателя. Это правовое значение термина; техническое — свойство системы, обеспечивающее недоступность данных посторонним.',
'ebod-4-0':'Жизненный цикл данных в органе включает семь этапов: сбор, регистрацию и учёт, хранение, обработку и использование, передачу, архивное хранение и уничтожение. На каждом действуют свои требования: законная цель, учёт, защита, точность, правомерная передача, соблюдение сроков и уничтожение по достижении цели.',
'ebod-4-1':'Ст. 7 № 210-ФЗ «Об организации предоставления государственных и муниципальных услуг» запрещает требовать от заявителя документы и сведения, которые уже есть у органов власти: их получают по межведомственному запросу через СМЭВ. Это принцип «однократного предоставления» данных гражданином.',
'ebod-4-2':'Инфраструктура электронного правительства распределяет роли: на ЕПГУ (Госуслуги) гражданин подаёт заявление, через ЕСИА входит и подтверждает личность, а СМЭВ обеспечивает межведомственный обмен — например, орган получает сведения о доходах из Социального фонда без справок от заявителя.',
'ebod-4-3':'Требования к защите информации в государственных информационных системах установлены приказом ФСТЭК № 117 (применяется с 01.03.2026, заменил приказ № 17). Приказ ФСБ № 378 — о криптографической защите ПДн, постановление № 1119 — уровни защищённости ПДн, № 687 — обработка ПДн без средств автоматизации.',
'ebod-4-4':'Верно: ч. 7 ст. 5 № 152-ФЗ требует хранить ПДн не дольше, чем этого требуют цели обработки, и уничтожать их или обезличивать по достижении целей. Срок уничтожения после достижения цели — 30 дней (ч. 4 ст. 21).',
'ebod-5-0':'Данные — особый актив: при использовании они не расходуются и могут использоваться многократно и одновременно; со временем устаревают и теряют ценность; несут риски — утечки, штрафы, ошибочные решения на плохих данных. Поэтому ими управляют системно, а не хранят «на всякий случай».',
'ebod-5-1':'По DAMA-DMBOK владелец данных — руководитель бизнес-подразделения, отвечающий за качество и правила использования своего домена; распорядитель (стюард) ведёт данные, справочники и проверяет качество; ИТ-служба предоставляет инструменты и инфраструктуру. Ключевая мысль: за качество отвечает бизнес, а не ИТ.',
'ebod-5-2':'Четыре цели использования данных в госуправлении: обоснование управленческих решений; проактивные услуги (назначение выплаты без заявления по сведениям из систем); риск-ориентированный контроль и надзор (проверки там, где выше риск); стратегическое планирование. Продажа данных к целям госоргана не относится.',
'ebod-5-3':'Государственный уровень управления данными — Национальная система управления данными (НСУД); её нормативную основу в курсе составляют постановления Правительства № 710 и № 733. Стратегическая рамка — Указ № 203 о Стратегии развития информационного общества. Остальные варианты — о защите ПДн, открытых данных, ДСП и КИИ.',
'ebod-5-4':'Неверно. ИТ-служба обеспечивает инструменты и хранение, но не знает смысла данных и не принимает решений по ним. Ответственность за качество несёт бизнес-владелец данных: он определяет правила, требования и последствия ошибок для своего домена.',
'ebod-6-0':'Шесть критериев качества данных: точность (соответствие реальности), полнота (нет пропусков), непротиворечивость (одинаковые сведения в разных системах), актуальность (данные свежие), уникальность (нет дублей), репрезентативность (выборка отражает всю совокупность). Оформление к качеству данных не относится.',
'ebod-6-1':'Адекватность данных бывает трёх форм. Синтаксическая — формат и структура корректны (дата записана датой). Семантическая — смысл однозначен (понятно, что именно измерено). Прагматическая — данные пригодны для конкретной управленческой задачи. Корректные по формату данные могут оказаться бесполезными для решения.',
'ebod-6-2':'Достоверность источника оценивают по пяти критериям: первичность (данные из первоисточника), полномочия (источник вправе их вести), регламент (данные собираются по утверждённому порядку), методика (известно, как считали), прослеживаемость (можно проверить происхождение). Популярность не критерий.',
'ebod-6-3':'Адрес в поле «Описание» — ошибка измерения: данные записаны неверно, и при анализе адрес теряется. Меньшее число жалоб на окраинах при худших дорогах — ошибка отбора: жалобы подают не все группы населения одинаково, поэтому выборка не репрезентативна. Решение — добавить независимые данные диагностики дорог.',
'ebod-6-4':'Неверно. Разовая очистка устраняет текущие ошибки, но новые появятся при следующем вводе. Качество обеспечивается системой: контроль на входе (форматы, справочники), регулярный аудит, метрики и ответственные стюарды.',
'ebod-7-0':'Право определяет, допустимо ли действие, то есть «можно ли». Этика данных отвечает на вопрос «следует ли»: даже законная обработка может быть несправедливой, непрозрачной или чрезмерной. Поэтому до запуска алгоритма проводят этическую экспертизу.',
'ebod-7-1':'Пять рисков алгоритмического управления: предвзятость (модель воспроизводит дискриминацию из данных), социальный скоринг (оценка граждан по поведению), слежка (избыточный сбор), цифровое неравенство (люди без цифровых навыков выпадают) и «чёрный ящик» (решение нельзя объяснить).',
'ebod-7-2':'Ст. 16 № 152-ФЗ запрещает принимать решения, порождающие юридические последствия для субъекта или иным образом затрагивающие его права, исключительно на основании автоматизированной обработки ПДн, кроме случаев с письменного согласия или прямо предусмотренных законом. Субъект вправе возразить против такого решения.',
'ebod-7-3':'Основание для обработки есть, но модель предвзята к людям старше 50 лет и сельским жителям. Правильно — исправить признаки, порождающие дискриминацию, и оставить окончательное решение за человеком. Это реализует принципы соразмерности, прозрачности и контроля человека.',
'ebod-7-4':'Национальная стратегия развития искусственного интеллекта утверждена Указом Президента № 490; её п. 19 формулирует принципы: защита прав и свобод человека, безопасность, прозрачность, технологический суверенитет и др. В той же рамке — ГОСТ Р 59276-2020 и кодекс этики в сфере ИИ.',
'ebod-8-0':'Регулирование ПДн выстроено в пять уровней: Конституция (ст. 23 — неприкосновенность частной жизни, ст. 24 — запрет сбора сведений о частной жизни без согласия) → № 152-ФЗ и смежные законы → постановления Правительства (№ 1119, № 687) → приказы ФСТЭК и ФСБ → локальные акты оператора (политика, положения, приказы).',
'ebod-8-1':'Регуляторы разделены по предмету: Роскомнадзор — уполномоченный орган по защите прав субъектов ПДн (ст. 23 № 152-ФЗ), проверяет законность обработки; ФСТЭК устанавливает требования к технической защите; ФСБ — к криптографической защите и обнаружению компьютерных атак.',
'ebod-8-2':'Ключевые вехи: 2006 — принят № 152-ФЗ; 2014 — требование локализации баз ПДн граждан РФ (№ 242-ФЗ, с 2015 года); 2024 — оборотные штрафы за утечки (№ 420-ФЗ) и уголовная ответственность по ст. 272.1 УК (№ 421-ФЗ); 2025 — запрет зарубежных баз (№ 23-ФЗ) и отдельное согласие (№ 156-ФЗ).',
'ebod-8-3':'Уровни защищённости ПДн (УЗ-1…УЗ-4) установлены постановлением Правительства № 1119 «Об утверждении требований к защите персональных данных при их обработке в информационных системах». Конкретные меры защиты для каждого уровня перечислены в приказе ФСТЭК № 21.',
'ebod-8-4':'Неверно, роли перепутаны. Приказ ФСТЭК № 21 устанавливает состав и содержание организационных и технических мер защиты ПДн. Приказ ФСБ № 378 определяет меры с использованием средств криптографической защиты информации (СКЗИ).',
'ebod-9-0':'По п. 1 ст. 3 № 152-ФЗ персональные данные — любая информация, относящаяся прямо или косвенно к определённому или определяемому физическому лицу. Ключевое слово «определяемому»: даже без ФИО сочетание признаков (школа, класс, год рождения) может указать на человека. Сведения о юридических лицах ПДн не являются.',
'ebod-9-1':'Каждой категории — своя статья: специальные (раса, политика, религия, здоровье, интимная жизнь) — ст. 10; биометрические — ст. 11; разрешённые субъектом для распространения — ст. 10.1 (отдельное согласие); обезличенные — ст. 13.1 (введена с 01.09.2025).',
'ebod-9-2':'Ст. 10 № 152-ФЗ относит к специальным категориям сведения о расовой и национальной принадлежности, политических взглядах, религиозных и философских убеждениях, состоянии здоровья и интимной жизни. Их обработка по общему правилу запрещена, кроме перечисленных законом случаев. СНИЛС и адрес — общие ПДн.',
'ebod-9-3':'Неверно. Биометрические ПДн по ст. 11 — сведения о физиологических и биологических особенностях, которые используются оператором для установления личности. Фото в анкете само по себе не биометрия; оно станет биометрией, если по нему будут идентифицировать человека.',
'ebod-9-4':'Оператор ПДн (п. 2 ст. 3 № 152-ФЗ) организует обработку и определяет её цели, состав данных и действия с ними. Оператор информационной системы (п. 12 ст. 2 № 149-ФЗ) эксплуатирует систему и обрабатывает информацию в её базах. Это могут быть разные лица: орган — оператор ПДн, подрядчик — оператор ИС.',
'ebod-9-5':'Сбор и использование биометрии для идентификации регулирует № 572-ФЗ: биометрические данные собираются и хранятся в Единой биометрической системе (ЕБС), а организации проводят идентификацию через неё.',
'ebod-10-0':'Принципы обработки ПДн собраны в ст. 5 № 152-ФЗ — она состоит из семи частей. Ст. 6 перечисляет основания обработки, ст. 9 — требования к согласию, ст. 19 — меры по обеспечению безопасности.',
'ebod-10-1':'Части ст. 5: ч. 2 — обработка ограничивается достижением конкретных, заранее определённых законных целей; ч. 3 — нельзя объединять базы, созданные для несовместимых целей; ч. 4–5 — состав и объём данных соответствуют целям, избыточные данные недопустимы; ч. 6 — точность и актуальность; ч. 7 — хранение не дольше цели и уничтожение.',
'ebod-10-2':'Любую операцию с ПДн проверяют в два шага. Сначала — законна ли цель (есть ли основание и полномочие). Затем — нужен ли именно такой состав данных для этой цели или можно обойтись меньшим, например агрегатами.',
'ebod-10-3':'Неверно. Основание по ст. 6 отвечает на вопрос «можно ли обрабатывать вообще», а принципы ст. 5 — «как именно». Принципы действуют одновременно с основанием: даже при законной обработке нельзя собирать лишнее или хранить дольше цели.',
'ebod-10-4':'Цель — анализ охвата мероприятий — законна, но для неё не нужны ФИО, точные даты рождения и адреса. Достаточно возрастных групп и поселений: агрегированные данные решают задачу и не создают рисков. Это и есть минимизация по ч. 4–5 ст. 5.',
'ebod-11-0':'Для органа власти базовое основание — п. 4 ч. 1 ст. 6 № 152-ФЗ: обработка необходима для исполнения полномочий органов и предоставления государственных и муниципальных услуг. Согласие субъекта органу в таких случаях не требуется, а п. 10 об общедоступных данных утратил силу.',
'ebod-11-1':'Грубая ошибка на экзамене. П. 10 ч. 1 ст. 6 (обработка общедоступных данных) утратил силу. Сейчас то, что данные где-то опубликованы, не даёт права их обрабатывать: для распространения нужен особый режим ст. 10.1 с отдельным согласием субъекта.',
'ebod-11-2':'Ч. 1 ст. 9 № 152-ФЗ требует, чтобы согласие было свободным (без давления), конкретным (на определённые цели), информированным (субъект знает, что и зачем обрабатывается) и однозначным (явное действие, а не молчание). Согласие можно отозвать (ч. 2), а доказывать его наличие должен оператор (ч. 3).',
'ebod-11-3':'Основания ч. 1 ст. 6: п. 1 — согласие субъекта; п. 5 — исполнение договора, стороной которого является субъект; п. 6 — защита жизни, здоровья и иных жизненно важных интересов, когда согласие получить невозможно; п. 9 — статистические и исследовательские цели при обязательном обезличивании.',
'ebod-11-4':'С 01.09.2025 по № 156-ФЗ согласие на обработку ПДн оформляется отдельно от иных документов: его нельзя «зашить» в договор или заявление. Остальные даты: 01.07.2025 — запрет зарубежных баз (№ 23-ФЗ), 30.05.2025 — новые штрафы (№ 420-ФЗ), 01.03.2023 — уведомление о трансграничной передаче (№ 266-ФЗ).',
'ebod-11-5':'Регистрация по месту жительства — государственная услуга, поэтому основание обработки — п. 4 ч. 1 ст. 6, согласие не требуется. Кроме того, с 01.09.2025 согласие должно оформляться отдельным документом, поэтому вписывать его в бланк заявления нельзя.',
'ebod-11-6':'Ст. 10.1 № 152-ФЗ требует отдельного согласия на обработку ПДн, разрешённых субъектом для распространения (например, публикация фото и ФИО победителей конкурса). Субъект может установить запреты и условия — например, разрешить только просмотр, но не передачу.',
'ebod-12-0':'Права субъекта: доступ к сведениям о себе и их обработке; уточнение, блокирование и уничтожение неполных, устаревших или незаконно полученных данных (ст. 14); отзыв согласия (ч. 2 ст. 9); обжалование действий оператора в Роскомнадзор или суд и возмещение вреда (ст. 17, 24). Требовать удаления из всех архивов страны закон не позволяет.',
'ebod-12-1':'Каждому праву соответствует обязанность оператора с жёстким сроком: ответ на запрос — 10 рабочих дней с возможным продлением на 5 (ч. 1 ст. 20); уточнение — 7 рабочих дней; прекращение неправомерной обработки — 3 рабочих дня (ч. 3 ст. 21); уничтожение по достижении цели — 30 дней (ч. 4 ст. 21). Запомните формулу 10 — 7 — 3 — 30.',
'ebod-12-2':'Ч. 1 ст. 20 № 152-ФЗ: оператор отвечает на запрос субъекта в течение 10 рабочих дней. Срок можно продлить ещё на 5 рабочих дней, направив субъекту мотивированное уведомление.',
'ebod-12-3':'Обязанность назначить ответственного за организацию обработки ПДн закреплена в ст. 22.1 № 152-ФЗ. Ст. 18.1 обязывает принять и опубликовать политику оператора, ст. 21 — устранять нарушения, ст. 14 — об информировании субъекта.',
'ebod-12-4':'Неверно. Прекратить неправомерную обработку нужно в течение 3 рабочих дней (ч. 3 ст. 21). Срок 30 дней относится к уничтожению данных по достижении цели обработки (ч. 4 ст. 21).',
'ebod-13-0':'Требования к защите определяются по цепочке: категория ПДн (специальные, биометрические, иные) → тип актуальных угроз → число субъектов (порог — 100 000) → уровень защищённости по ПП № 1119 → перечень мер по приказу ФСТЭК № 21. При использовании шифрования добавляются требования приказа ФСБ № 378.',
'ebod-13-1':'ПП № 1119 выделяет три типа угроз. 1-й — угрозы, связанные с недекларированными возможностями системного ПО (операционной системы); 2-й — прикладного ПО; 3-й — таких угроз нет. Тип угроз оператор определяет сам в модели угроз.',
'ebod-13-2':'Уровни защищённости нумеруются от высшего к низшему: УЗ-1 — максимальный (например, специальные данные при угрозах 1-го типа), УЗ-4 — минимальный. Чем выше уровень, тем шире перечень мер по приказу ФСТЭК № 21.',
'ebod-13-3':'Доходы и инвалидность — специальная категория (здоровье) и чувствительные сведения; субъектов 180 тыс., то есть больше 100 000; угрозы 3-го типа. По ПП № 1119 такое сочетание даёт УЗ-2. Поскольку реестр ещё и ГИС, параллельно определяют класс по приказу № 117 и применяют более строгие требования.',
'ebod-13-4':'Неверно. Три линейки требований независимы: уровень защищённости ПДн, класс ГИС по приказу ФСТЭК № 117 и категория значимости объекта КИИ по ПП № 127. Если система одновременно попадает в несколько, применяют наивысшие требования.',
'ebod-13-5':'Постановление Правительства № 687 утверждает положение об особенностях обработки ПДн, осуществляемой без использования средств автоматизации: бумажные журналы, карточки, анкеты. Оно требует раздельного хранения ПДн с разными целями и определяет порядок уничтожения.',
'ebod-14-0':'Ч. 3.1 ст. 21 № 152-ФЗ вводит двухэтапное уведомление Роскомнадзора об инциденте с ПДн: в течение 24 часов — о самом инциденте, предполагаемых причинах и вреде; в течение 72 часов — о результатах внутреннего расследования и виновных лицах.',
'ebod-14-1':'С 01.03.2023 по № 266-ФЗ оператор обязан уведомить Роскомнадзор о намерении осуществлять трансграничную передачу ПДн до её начала (ст. 12). Ранее передача в «адекватные» страны не требовала уведомления.',
'ebod-14-2':'При передаче в государство, не входящее в перечень обеспечивающих адекватную защиту, оператор ждёт 10 рабочих дней: за это время Роскомнадзор рассматривает уведомление и может запретить или ограничить передачу. Критерий перечня — соответствие Конвенции 108.',
'ebod-14-3':'Ч. 5 ст. 18 № 152-ФЗ (ред. № 23-ФЗ) требует, чтобы при сборе ПДн граждан РФ запись, систематизация, хранение велись в базах на территории России; базы за рубежом не допускаются. Зарубежный сервис опросов собирает данные сразу за рубеж, поэтому нарушает запрет независимо от согласия.',
'ebod-14-4':'Неверно. Локализация (первичная запись в российских базах) и трансграничная передача — разные обязанности. Сначала данные должны быть собраны в РФ, затем копию можно передать за рубеж после уведомления РКН. Уведомление не заменяет требование ч. 5 ст. 18.',
'ebod-15-0':'За нарушения в сфере ПДн наступает четыре вида ответственности: дисциплинарная (служащий — по № 79-ФЗ), гражданско-правовая (возмещение вреда по ст. 24 № 152-ФЗ и ст. 151 ГК), административная (ст. 13.11 КоАП) и уголовная (ст. 272.1 УК). Налоговой ответственности за это нет.',
'ebod-15-1':'Грубая ошибка. Оборотные штрафы (процент выручки) по ст. 13.11 КоАП применяются к коммерческим операторам — у органа власти нет выручки. В государственном органе ответственность несут должностные лица, допустившие нарушение.',
'ebod-15-2':'Ст. 272.1 УК (введена № 421-ФЗ, действует с 11.12.2024) устанавливает ответственность за незаконные использование, передачу, сбор и хранение компьютерной информации, содержащей ПДн, — до 10 лет лишения свободы при отягчающих обстоятельствах.',
'ebod-15-3':'Алгоритм при утечке: зафиксировать факт и время; локализовать (закрыть доступ, отозвать учётные данные); в течение 24 часов уведомить Роскомнадзор; сообщить в НКЦКИ (ГосСОПКА, приказ ФСБ № 77); провести расследование; в течение 72 часов направить в РКН его результаты; устранить причины.',
'ebod-15-4':'По ст. 13.11 КоАП в ред. № 420-ФЗ (с 30.05.2025) за повторную утечку коммерческий оператор платит оборотный штраф 1–3 % совокупной выручки, но не менее 20 млн (для ПДн) или 25 млн руб. (для иных случаев) и не более 500 млн руб. 1–6 млн — штраф за нарушение локализации.',
'ebod-15-5':'Административные штрафы в сфере ПДн собраны в ст. 13.11 КоАП: от отсутствия политики и уведомления до утечек (ч. 12–14), утечек специальных данных и биометрии (ч. 16, 17) и повторных нарушений с оборотным штрафом (ч. 15, 18).',
'ebod-16-0':'Открытые данные (ч. 4 ст. 7 № 149-ФЗ) — общедоступная информация, размещаемая в сети в формате, допускающем автоматизированную обработку без предварительных изменений человеком, для повторного использования. Скан PDF не машиночитаем, а данные по запросу или с ограничением доступа не открыты.',
'ebod-16-1':'Принципы открытых данных: полнота, первичность (из первоисточника, без агрегирования без необходимости), актуальность, машиночитаемость, недискриминационность (доступ без регистрации и для всех) и свобода использования. Открытые данные бесплатны.',
'ebod-16-2':'Пятизвёздочная модель открытых данных предложена Тимом Бернерс-Ли, создателем Всемирной паутины: одна звезда — данные в сети под открытой лицензией, далее — структурированный формат, открытый формат (CSV), идентификаторы URI, связи с другими данными (Linked Data).',
'ebod-16-3':'Верно. По ч. 5 и 6 ст. 7 № 149-ФЗ размещение открытых данных прекращается или приостанавливается, если оно может привести к раскрытию государственной тайны или распространению персональных данных, а также по решению суда.',
'ebod-16-4':'Постановление Правительства № 583 определяет порядок размещения органами власти информации в сети в форме открытых данных: требования к форматам, паспортам наборов и периодичности обновления.',
'ebod-17-0':'Жизненный цикл открытых данных: инвентаризация (какие данные есть), приоритизация (что публиковать первым), подготовка (очистка, формат), экспертиза (нет ли ПДн и тайн), паспортизация (описание), публикация, актуализация (регулярное обновление) и обратная связь от пользователей.',
'ebod-17-1':'Паспорт набора — «инструкция» для пользователя: наименование и описание, владелец, структура полей, периодичность и дата обновления, территория и период, формат и лицензия, источник и методика, контакт для обратной связи. Без паспорта набором трудно пользоваться.',
'ebod-17-2':'Опубликованный набор мгновенно скачивают и копируют, удалить его из оборота уже нельзя. Поэтому ошибки публикации — например, оставленные ПДн — необратимы, и весь контроль (экспертиза, проверка связывания) проводится до публикации.',
'ebod-17-3':'Для расписаний общественного транспорта отраслевой стандарт — GTFS, его понимают навигаторы и приложения; дополнительно публикуют CSV. Скан, DOCX и PNG не машиночитаемы и не отвечают требованиям к открытым данным.',
'ebod-17-4':'Верно. ЕМИСС (Единая межведомственная информационно-статистическая система) наряду с федеральным и региональными порталами открытых данных и ведомственными сайтами входит в инфраструктуру публикации официальных данных.',
'ebod-18-0':'Открытые данные дают эффект всем участникам: государству — подотчётность и бесплатную проверку качества данных пользователями; гражданам и СМИ — общественный контроль; бизнесу и науке — сырьё для сервисов и исследований.',
'ebod-18-1':'Публикация сама по себе ничего не меняет: данные должны быть освоены разработчиками и исследователями, превратиться в продукт (сервис, исследование), дать эффект (решения, изменения), вернуться обратной связью к органу и привести к расширению публикаций.',
'ebod-18-2':'Решение о публикации принимают по матрице «польза × риск»: высокая польза и низкий риск — публиковать; высокий риск — обезличивать, агрегировать или отказаться. Матрица TIME — про портфель приложений, FASMI — про OLAP, DIKW — про ценность информации.',
'ebod-18-3':'Неверно. Набор, который никто не скачивает, не создаёт ценности. Эффект появляется, когда данные используют: строят сервисы, проводят исследования, контролируют власть.',
'ebod-18-4':'«Карта ДТП» строится на открытых данных Госавтоинспекции и показывает места концентрации аварий; жители и активисты используют её, чтобы добиваться светофоров, ограждений и переходов. Госуслуги, СМЭВ и ЕСИА — государственная инфраструктура, а не сервисы на открытых данных.',
'ebod-19-0':'Мозаичный эффект — риск, возникающий при сочетании наборов, каждый из которых безопасен сам по себе. Сопоставив их, можно реидентифицировать человека или раскрыть охраняемые сведения. Поэтому риск оценивают не по одному набору, а с учётом того, что уже опубликовано.',
'ebod-19-1':'Восемь мер до публикации: удалить прямые идентификаторы; оценить квазиидентификаторы (возраст, адрес, должность); огрубить точность; агрегировать малые группы (меньше 5 записей); проверить связывание с другими наборами; провести экспертизу; утвердить регламент отзыва набора; задокументировать решение.',
'ebod-19-2':'Если в группе меньше 5 записей, человек может быть узнан по сочетанию признаков. Такие группы объединяют с соседними или скрывают значение — это правило малых чисел при публикации статистики.',
'ebod-19-3':'ФИО удалены, но «сельская школа + класс + год рождения» указывает на единственного ученика, а отметка об ОВЗ — сведения о здоровье, специальная категория ПДн. Это реидентификация через квазиидентификаторы; нужно огрубить признаки и агрегировать.',
'ebod-19-4':'Сбор сведений из открытых источников (OSINT) ограничен уголовным законом: ст. 137 УК — нарушение неприкосновенности частной жизни, ст. 272 — неправомерный доступ к информации, ст. 272.1 — незаконный оборот ПДн. Ещё одна граница — ст. 13 № 144-ФЗ об оперативно-розыскной деятельности.',
'ebod-20-0':'Безопасность информации обеспечивается триадой: конфиденциальность (доступ только у уполномоченных), целостность (данные не изменены без разрешения) и доступность (данные доступны, когда нужны). Нарушение любого из трёх свойств — инцидент.',
'ebod-20-1':'П. 2.4.5 ГОСТ Р 50922-2006 «Защита информации. Основные термины и определения» определяет безопасность информации как состояние защищённости, при котором обеспечены её конфиденциальность, доступность и целостность.',
'ebod-20-2':'Угроза реализуется по цепочке: источник (злоумышленник, сбой, стихия) использует уязвимость (слабый пароль, ошибка ПО) с помощью способа реализации (атака) и вызывает последствия. Организация не управляет источниками угроз, но может устранять уязвимости.',
'ebod-20-3':'При работе под чужой учётной записью действия записываются на коллегу, и установить, кто что сделал, невозможно. Это нарушение подотчётности — дополнительного свойства безопасности наряду с аутентичностью и неотказуемостью. Страдают и целостность, и конфиденциальность.',
'ebod-20-4':'Конфиденциальность имеет два значения. Техническое — свойство системы, обеспечивающее недоступность данных посторонним (шифрование, разграничение доступа). Правовое — обязанность лица, получившего доступ, не передавать информацию без согласия обладателя (п. 7 ст. 2 № 149-ФЗ).',
'ebod-21-0':'Угроза — совокупность условий и факторов, создающих опасность нарушения безопасности информации. Уязвимость — свойство системы, которое можно использовать для реализации угрозы. Атака — действие нарушителя, реализующее угрозу через уязвимость.',
'ebod-21-1':'НСД — доступ к информации с нарушением правил разграничения доступа: прежде всего страдает конфиденциальность (уголовно — ст. 272 УК). Несанкционированное воздействие — нарушение правил изменения информации: искажение, уничтожение, блокирование, то есть удар по целостности и доступности (ст. 272–274.1 УК).',
'ebod-21-2':'Каналы утечки: человеческий (разглашение, социальная инженерия), технический (побочные электромагнитные излучения, прослушивание), визуальный (экран, бумаги на столе), носители (флешки, диски), программный (вредоносное ПО, уязвимости).',
'ebod-21-3':'Портал выдаёт заявление по номеру в адресе и не проверяет, принадлежит ли оно вошедшему пользователю. Это уязвимость «небезопасная прямая ссылка на объект» (IDOR): перебирая номера, родитель читает чужие ПДн — несанкционированный доступ.',
'ebod-21-4':'Банк данных угроз безопасности информации (БДУ ФСТЭК) содержит каталог угроз и уязвимостей; модель угроз строят, привязывая актуальные угрозы к его идентификаторам. ЕМИСС — статистика, ФИАС — адреса, ОКТМО — классификатор территорий.',

'ebod-22-0':'Четыре режима не смешивают. Гостайна защищается грифами секретности по Закону № 5485-1. Служебная информация ограниченного распространения получает пометку «Для служебного пользования» по ПП № 1233. Конфиденциальная информация определена перечнем Указа № 188 и законами (№ 152-ФЗ, № 98-ФЗ о коммерческой тайне). Общедоступная — ст. 7 № 149-ФЗ.',
'ebod-22-1':'Неверно. «Для служебного пользования» — пометка, а не гриф секретности. Её ставят в правом верхнем углу первой страницы документа по Положению, утверждённому ПП № 1233. Грифы существуют только для гостайны.',
'ebod-22-2':'Закон № 5485-1 «О государственной тайне» устанавливает три степени секретности и соответствующие грифы: «особой важности», «совершенно секретно», «секретно». «ДСП» и «конфиденциально» к гостайне не относятся.',
'ebod-22-3':'Шесть методов защиты: препятствие (физически закрыть путь), управление доступом (права и роли), маскировка (криптографическое закрытие), регламентация (правила работы), принуждение (ответственность за нарушения) и побуждение (этика и культура).',
'ebod-22-4':'Записка о должниках бюджета — не гостайна, гриф «Секретно» на ней неправомерен. Это служебная информация, для которой ставится пометка «ДСП». Отправка через мессенджер нарушает порядок обращения со служебными сведениями — их передают по защищённым каналам.',
'ebod-23-0':'Методы анализа защищённости ПО: статический — изучение исходного кода без запуска; динамический — тестирование работающего приложения на стенде; SCA (анализ состава ПО) — поиск уязвимых сторонних библиотек; фаззинг — подача случайных и некорректных данных, чтобы вызвать сбой.',
'ebod-23-1':'Глава 28 УК «Преступления в сфере компьютерной информации»: ст. 272 — неправомерный доступ; ст. 272.1 — незаконный оборот ПДн; ст. 273 — создание и распространение вредоносных программ; ст. 274 — нарушение правил эксплуатации; ст. 274.1 — неправомерное воздействие на КИИ.',
'ebod-23-2':'ГОСТ Р 56939-2024 «Разработка безопасного программного обеспечения» устанавливает требования к процессам безопасной разработки — их включают в техническое задание. ГОСТ Р 71207-2024 посвящён статическому анализу.',
'ebod-23-3':'Сисадмин корыстно, с использованием служебного положения передал базу с ПДн — это ч. 3 ст. 272.1 УК (квалифицированный состав). Выгрузка без служебной цели может квалифицироваться и как неправомерный доступ по ст. 272.',
'ebod-23-4':'Неверно. Статический анализ находит ошибки в коде, но не видит проблем конфигурации и поведения в работе. Динамический ловит то, что проявляется только при выполнении. Поэтому методы сочетают.',
'ebod-24-0':'Модель OSI (ГОСТ Р ИСО/МЭК 7498-1-99) описывает 7 уровней снизу вверх: физический, канальный, сетевой, транспортный, сеансовый, представления, прикладной. Данные на каждом уровне инкапсулируются в заголовки нижележащего уровня.',
'ebod-24-1':'Модель TCP/IP практичнее и состоит из 4 уровней: сетевого доступа (соответствует физическому и канальному OSI), межсетевого (сетевой), транспортного и прикладного (три верхних уровня OSI).',
'ebod-24-2':'Угрозы по уровням: на канальном — подмена MAC-адресов и ARP-спуфинг; на сетевом (межсетевом) — подмена IP и сканирование; на транспортном — SYN-флуд, исчерпывающий соединения; на прикладном — SQL-инъекции и фишинг.',
'ebod-24-3':'Фильтр по адресам и портам работает на сетевом и транспортном уровнях и не видит содержимого запросов. SQL-инъекция идёт через разрешённый порт 443 внутри обычного HTTPS-запроса — это угроза прикладного уровня. Её останавливает WAF, разбирающий запросы к веб-приложению.',
'ebod-24-4':'Комплексные угрозы затрагивают несколько уровней сразу: MITM (перехват «человек посередине»), DDoS (отказ в обслуживании), APT (длительные целевые атаки) и атаки на цепочку поставок (через подрядчиков и обновления ПО). Отсюда эшелонированная защита.',
'ebod-25-0':'Межсетевые экраны различаются глубиной разбора трафика: пакетный фильтр смотрит адреса и порты; МЭ с контролем состояния учитывает установленные соединения; шлюз прикладного уровня (прокси) разбирает протокол; NGFW распознаёт приложения и включает IPS; WAF специализируется на защите веб-приложений.',
'ebod-25-1':'ФСТЭК классифицирует МЭ по месту установки (приказ № 9 от 09.02.2016): тип А — на границе сети (периметр), тип Б — на логических границах внутри сети, тип В — на узле (хостовый), тип Г — для защиты веб-сервера, тип Д — для АСУ ТП.',
'ebod-25-2':'Класс МЭ выбирают по классу защищаемой системы: 4-й — для ГИС 1-го класса, УЗ-1 и КИИ 1-й категории; 5-й — для ГИС 2-го, УЗ-2, КИИ 2-й; 6-й — для ГИС 3-го, УЗ-3 и УЗ-4, КИИ 3-й. Классы 3–1 предназначены для систем с гостайной.',
'ebod-25-3':'Эшелонированная защита строится слоями: организационные меры, периметр сети, внутренняя сеть (сегментация), узлы и приложения, сами данные (шифрование, резервные копии). Прорыв одного эшелона не означает доступа к данным.',
'ebod-25-4':'Неверно. МЭ на периметре контролирует трафик между внутренней сетью и интернетом. Инсайдер уже внутри, а фишинговое письмо проходит как разрешённая почта. Эти угрозы закрывают другие эшелоны: сегментация, контроль доступа, DLP, обучение сотрудников.',
'ebod-25-5':'В требованиях ФСТЭК МЭ обозначается сочетанием типа (место установки) и класса (уровень защищённости), например «МЭ типа А 4-го класса». Класс ГИС, УЗ и класс СКЗИ — характеристики других объектов.',
'ebod-26-0':'Криптография обеспечивает конфиденциальность (шифрование), целостность (хэш-функции, имитовставка), аутентичность (подпись подтверждает автора) и неотказуемость (автор не может отказаться от подписанного). На ней же строятся защищённые каналы VPN. Доступность при DDoS криптография не обеспечивает.',
'ebod-26-1':'Российские криптостандарты: ГОСТ Р 34.10-2012 — алгоритм электронной подписи; ГОСТ Р 34.11-2012 «Стрибог» — хэш-функция; ГОСТ Р 34.12-2015 — блочные шифры «Кузнечик» и «Магма»; ГОСТ Р 34.13-2015 — режимы работы блочных шифров.',
'ebod-26-2':'По ст. 5 № 63-ФЗ подписи бывают простые и усиленные (неквалифицированные и квалифицированные). Только усиленная квалифицированная подпись признаётся равнозначной собственноручной без дополнительных соглашений (ч. 1 ст. 6). Для остальных нужен закон или соглашение сторон.',
'ebod-26-3':'Классы СКЗИ (приказ ФСБ № 378, ПКЗ-2005) отражают возможности нарушителя, от которого защищает средство: КС1 — самый базовый, затем КС2, КС3, КВ и КА — защита от нарушителя с максимальными возможностями.',
'ebod-26-4':'Неверно. Класс СКЗИ выбирают по модели нарушителя — какими возможностями и ресурсами обладает злоумышленник. Объём шифруемых данных на класс не влияет.',
'ebod-27-0':'Шифровальщик блокирует данные и требует выкуп; если есть изолированная копия (правило 3-2-1: три копии, на двух носителях, одна вне площадки и недоступна из сети), данные восстанавливают без выкупа. Пароли, антивирус и запрет флешек полезны, но не спасают уже зашифрованные данные.',

'ebod-27-2':'Компьютерная атака (п. 4 ст. 2 № 187-ФЗ) — целенаправленное воздействие программными или программно-аппаратными средствами. Компьютерный инцидент (п. 5 ст. 2) — факт нарушения или прекращения функционирования объекта. Инцидент ИБ по ГОСТ Р 53114-2008 шире: любое нежелательное событие безопасности.',
'ebod-27-3':'Типовая цепочка: письмо с макросом → дроппер (загрузчик) → стилер крадёт пароли → злоумышленник выгружает данные → запускает шифровальщик. Разорвать цепочку можно на каждом звене: отключить макросы, фильтровать почту, включить MFA, сегментировать сеть.',
'ebod-27-4':'DDoS-атаки делят на объёмные (забивают канал трафиком), протокольные (исчерпывают ресурсы сетевого оборудования, например SYN-флуд) и прикладные (перегружают приложение «тяжёлыми» запросами). Все они бьют по доступности, в том числе госуслуг.',
'ebod-28-0':'Социальную инженерию классифицируют по каналу: фишинг — через электронную почту; вишинг — голосовые звонки; атаки через мессенджеры; подброшенные носители — «забытая» флешка с вредоносным ПО.',
'ebod-28-1':'Требование секретности («никому не говорите», «решение конфиденциальное») отрезает жертву от проверки у коллег и руководителя. Настоящие служебные процедуры почти никогда не требуют скрывать их от собственной службы безопасности, поэтому это главный признак обмана.',
'ebod-28-2':'Манипуляции опираются на психологию: авторитет (звонок «от руководителя»), дефицит времени (срочно, иначе штраф), страх (блокировка счёта), требование секретности и знакомый контекст (реальные номера закупок и имена коллег).',
'ebod-28-3':'Целевая атака начинается с разведки: злоумышленник собирает сведения о сотрудниках из соцсетей и открытых источников. Чем меньше цифровой след, тем меньше материала для правдоподобного письма. Позже остановить атаку дороже: приходится реагировать на заражение и утечку.',
'ebod-28-4':'Признаки фишинга: домен похож, но отличается от настоящего (minfin-region.ru вместо minfin-reg.ru); давление срочностью; просьба ввести пароль по ссылке. Реальный номер закупки берут из открытого реестра, поэтому он не доказывает подлинность письма.',
'ebod-29-0':'Инсайдер — сотрудник, подрядчик или иное лицо с легальным доступом к системе, которое использует его во вред. Внешний злоумышленник с украденным паролем — не инсайдер, хотя действует под чужой учётной записью.',
'ebod-29-1':'Инсайдер действует легальными правами, поэтому периметр его не остановит. Нужен контроль обращений к данным: журналы событий, DLP (предотвращение утечек) и UEBA (анализ поведения пользователей, выявление аномалий).',
'ebod-29-2':'Методика оценки угроз ФСТЭК от 05.02.2021 вводит уровни возможностей нарушителя Н1–Н4: от лица с базовыми возможностями до специальных служб. Это основа модели нарушителя. УЗ — уровни защищённости ПДн, КС1–КА — классы СКЗИ.',
'ebod-29-3':'Специалисты приёма имеют базовые возможности и работают с ограниченными функциями — внутренний нарушитель Н1; против него — журналы, DLP и минимальные права. Администраторы обладают повышенными привилегиями — Н2; нужны разделение полномочий и контроль привилегированных действий.',
'ebod-29-4':'Верно. Открытую сеть Wi-Fi может контролировать злоумышленник и перехватывать трафик. Работать со служебными системами можно только через штатный защищённый канал (VPN организации), иначе — мобильный интернет.',
'ebod-30-0':'При компрометации служащий: отключает компьютер от сети, не выключая (сохраняются следы в памяти); сообщает администратору безопасности; меняет пароли с чистого устройства; сохраняет доказательства; предупреждает адресатов о возможных поддельных письмах; обеспечивает уведомления РКН и НКЦКИ.',

'ebod-30-2':'Ст. 5 № 187-ФЗ «О безопасности критической информационной инфраструктуры» определяет ГосСОПКА — государственную систему обнаружения, предупреждения и ликвидации последствий компьютерных атак. Её создание предусмотрено Указом № 31с, координирует систему ФСБ через НКЦКИ.',

'ebod-30-5':'Постановление Правительства № 127 утверждает правила категорирования объектов КИИ и перечень показателей значимости: социальной, политической, экономической, экологической и оборонной. По ним объекту присваивают 1-ю, 2-ю или 3-ю категорию значимости.'

'avd-2-2':'Год — это переменная, но здесь он спрятан в заголовках столбцов 2023, 2024, 2025. Такой «широкий» формат удобен глазу, но фильтровать и строить динамику по году нельзя. Нужно развернуть таблицу в формат «Район | Год | Значение».',
'avd-2-3':'Операция unpivot (в Power Query — «Отменить свёртывание столбцов») превращает столбцы-годы в строки: каждая пара «район — год» становится отдельным наблюдением со своим значением. После этого работают сводные таблицы и фильтры по году.',
'avd-2-4':'Верно. Когда данные в Tidy-формате, сводные таблицы, связи между таблицами и дашборды строятся сразу, без ручной переделки. Исчезают и ошибки при сведении муниципальных выгрузок.',
'avd-3-0':'Логическая модель связывает показатели в цепочку «ресурсы — действия — результат — эффект»: сколько вложили (inputs), что сделали (activities), что произвели (outputs) и что изменилось в жизни людей (outcomes).',
'avd-3-1':'Деньги на ремонт и камеры — ресурс. Обследования аварийных участков — процесс, действие органа. Километры отремонтированных дорог и камеры — непосредственный результат. Снижение смертности в ДТП — социальный эффект, ради которого всё делалось.',
'avd-3-2':'Неверно. Освоение бюджета — ресурсный показатель: деньги потрачены, но это не значит, что жизнь людей изменилась. Эффективность оценивают по показателям социального эффекта, сопоставляя их с затратами.',
'avd-3-3':'Помимо смысловой классификации показатели делят на абсолютные (число ДТП) и относительные (ДТП на 100 тыс. населения), а также опережающие (сигнализируют заранее, например число обследований) и запаздывающие (фиксируют итог, например смертность за год).',
'avd-4-0':'По Инмону хранилище данных — предметно-ориентированное (организовано по темам), интегрированное (данные из разных систем приведены к единым кодам), неизменяемое (данные не перезаписываются) и поддерживающее хронологию (хранит историю). Оптимизация под короткие транзакции — признак OLTP.',
'avd-4-1':'Витрина данных (Data Mart) — тематическое подмножество хранилища для конкретного отдела или задачи, например витрина «ЖКХ». Она проще и быстрее для пользователей, чем всё хранилище.',
'avd-4-2':'Инмон строит сверху вниз: сначала единое нормализованное хранилище организации, затем из него витрины. Кимбалл — снизу вверх: витрины по бизнес-процессам в схеме «звезда», объединённые общими (согласованными) измерениями — шиной.',
'avd-4-3':'Транзакционная система (OLTP) обслуживает текущую работу: тяжёлые аналитические запросы её замедляют. В ней нет истории (данные перезаписываются) и нет данных других систем. Поэтому для отчётов строят отдельное хранилище.',
'avd-4-4':'Верно. В хранилище уже собрана история за пять лет, единый справочник районов и данные жилищной инспекции. Аналитик получает их через витрину «ЖКХ», не нагружая рабочие ГИС.',
'avd-5-0':'ETL: данные извлекаются, преобразуются на отдельном сервере и загружаются в хранилище готовыми. ELT: данные загружаются в хранилище «как есть», а преобразуются уже внутри него средствами СУБД. Разница — где и когда выполняется преобразование.',
'avd-5-1':'ELT выгоден при больших объёмах и разнородных источниках, когда мощности хранилища достаточно и важно сохранить сырые данные для будущих задач. ETL предпочтителен, если данные нужно очистить и защитить (например, обезличить) до загрузки.',
'avd-5-2':'ELT опирается на мощные хранилища: ClickHouse и Greenplum (колоночные и MPP-системы) или облачные хранилища выполняют преобразования SQL-запросами над огромными объёмами. Excel для этого не предназначен.',
'avd-5-3':'Миллионы разнородных сообщений в сутки выгоднее загрузить сырыми и преобразовывать SQL внутри хранилища: так сохраняется исходник для новых видов анализа, а отдельный ETL-сервер не становится узким местом.',
'avd-6-0':'Лист Excel вмещает 1 048 576 строк (2 в 20-й степени), и вся книга обрабатывается в памяти компьютера пользователя. Таблица фактов на миллионы строк в него не помещается — её делят на файлы и сводят вручную.',
'avd-6-1':'Целостность в СУБД обеспечивают ограничения: PRIMARY KEY — уникальность записи; FOREIGN KEY — ссылка только на существующую строку справочника; NOT NULL — обязательное поле; CHECK — допустимый диапазон. ВПР — функция Excel и целостности не гарантирует.',
'avd-6-2':'SQL выигрывает по целостности (ограничения и транзакции), строгой типизации (дата всегда дата), воспроизводимости (запрос — сценарий, который повторяется одинаково) и масштабу (сервер обрабатывает миллионы строк). Оформление — сильная сторона Excel.',
'avd-6-3':'Порядок записи запроса: SELECT — какие поля и агрегаты; FROM … JOIN — из каких таблиц и как связать; WHERE — фильтр строк (период); GROUP BY — группировка по району. Один запрос заменяет сведение нескольких файлов.',
'avd-6-4':'Верно. В декларативном языке пользователь пишет, что нужно получить (сумму по районам), а план выполнения — порядок чтения таблиц, индексы, соединения — выбирает оптимизатор СУБД.',
'avd-7-0':'Исследования Nielsen Norman Group показали два паттерна движения взгляда. F-паттерн: взгляд идёт по верхней строке, затем ниже, сканируя левый край, — так читают текстовые и табличные отчёты. Z-паттерн — по диагонали от левого верхнего угла к правому нижнему — характерен для обзорных дашбордов.',
'avd-7-1':'Взгляд входит на экран в левом верхнем углу — в обоих паттернах это первая точка. Поэтому главный KPI с цветовым статусом размещают там, а детализацию — ниже и правее.',
'avd-7-2':'Правило 30 секунд: за первые полминуты руководитель должен понять общий статус и увидеть «красную зону». Если для этого нужно листать и читать подписи, дашборд не выполняет задачу.',
'avd-7-3':'Верно. Z-паттерн начинается слева вверху и заканчивается справа внизу: там взгляд завершает просмотр, поэтому в этом месте уместны итог, вывод или ссылка на действие.',
'avd-8-0':'Кливленд и Макгилл (1984) экспериментально ранжировали способы кодирования: точнее всего человек сравнивает положение на общей шкале и длину, хуже — угол и площадь, ещё хуже — цвет. Отсюда принцип «длина точнее площади» и преимущество столбчатых диаграмм.',
'avd-8-1':'Круговая диаграмма допустима, когда показываются доли одного целого (сумма 100 %), секторов немного (до 5–6) и они заметно различаются. Для сравнения многих категорий и для динамики она не подходит.',
'avd-8-2':'Двенадцать секторов от 6 до 11 % глаз не различит: углы почти одинаковы. Столбчатая диаграмма с сортировкой по убыванию сразу показывает, у какого района доля больше, — это и нужно для перераспределения бригад.',
'avd-8-3':'Неверно. Исполнение по программам — не части одного целого: это проценты от разных планов, и их сумма не равна 100 %. Круговая диаграмма здесь искажает смысл; нужна столбчатая с линией плана.',
'avd-9-0':'Эдвард Тафти ввёл понятие chartjunk — «графический мусор» — и принцип максимизации отношения «данные/чернила»: всё, что нарисовано на графике, должно передавать данные.',
'avd-9-1':'Визуальный шум — элементы, которые не несут информации: 3D-эффекты и тени, густая сетка, фоновые картинки, случайные цвета, обезличенные заголовки «График 1». Сюда же относится обрезанная ось Y, преувеличивающая различия.',
'avd-9-2':'В 3D-круговой диаграмме ближние секторы растягиваются перспективой, дальние сжимаются. Сектор 18 % выглядит больше 22 %, и руководитель делает обратный вывод о структуре. Это пример шума, который искажает данные.',
'avd-9-3':'Верно. Цвет на дашборде — сигнал: красный — отклонение, зелёный — норма, акцентный — выделение главного. Случайные цвета заставляют искать несуществующий смысл и маскируют реальные отклонения.',
'avd-10-0':'Границы системы определяют по четырём критериям: юридическому (полномочия), ресурсному (бюджет, штат, имущество), информационному (собственная отчётность и ГИС) и управляемости (что орган контролирует, на что влияет и что только наблюдает).',
'avd-10-1':'Юридический критерий — какие полномочия даны ведомству нормативными актами. Ресурсный — какими деньгами, людьми и имуществом оно распоряжается. Информационный — какие данные и системы ведёт. Управляемость — контуры контроля, влияния и наблюдения.',
'avd-10-2':'Погода и федеральная тарифная политика влияют на жалобы, но региональное министерство ими не управляет — это внешние факторы, которые учитывают. Полномочия минЖКХ и жилинспекции, программа капремонта и данные ГИС ЖКХ находятся внутри границ.',
'avd-10-3':'Верно. Если границы не определены, органу вменяют ответственность за показатели, на которые он не влияет (например, погоду), а его реальные рычаги остаются без оценки. Четыре критерия отделяют управляемое от учитываемого.',
'avd-11-0':'Положительная обратная связь (R-петля, reinforcing) усиливает отклонение: рост ведёт к ещё большему росту, падение — к ещё большему падению, как снежный ком. Отрицательная (B-петля, balancing) возвращает систему к равновесию.',
'avd-11-1':'Неверно. «Положительная» описывает механизм усиления, а не оценку. Такая петля может раскручивать и инвестиционный рост, и кризис — например, отток населения.',
'avd-11-2':'Каждое звено усиливает следующее: закрытие школ ведёт к отъезду семей, детей становится меньше, закрываются новые школы. Это усиливающая петля — порочный круг, который сам себя не остановит.',
'avd-11-3':'Рост тарифов вызывает жалобы, жалобы — проверки, проверки — корректировку тарифов вниз. Система возвращается к равновесию: это стабилизирующая, отрицательная обратная связь.',
'avd-12-0':'Диаграмма влияния — граф, где узлы-решения (то, чем управляет орган), неопределённости и промежуточные переменные связаны стрелками влияния с целевым результатом. Она формализует управленческую задачу перед построением дашборда.',
'avd-12-1':'Каждый элемент диаграммы превращается в элемент ТЗ: решение — фильтр или параметр сценария; переменная — график динамики; результат — крупная KPI-карточка; стрелка — связь таблиц или формула расчёта.',
'avd-12-2':'Число жалоб на портале — целевой результат, узел-ромб. В дашборде он становится главной KPI-карточкой, которую видно первой; решения (тарифы, проверки) — фильтрами, внешние факторы — графиками.',
'avd-12-3':'Верно. Узлы-решения и факторы задают перечни значений — это справочники (районы, виды проверок). Узлы-результаты требуют агрегированных данных — витрин, из которых считаются KPI.',
'avd-13-0':'В диаграмме влияния решение (то, что выбирает орган) рисуют прямоугольником, неопределённость или промежуточную переменную — овалом, целевой результат — ромбом или восьмиугольником. Стрелки показывают влияние.',
'avd-13-1':'Построение начинают с результата и идут назад: что на него влияет, что влияет на эти факторы, и так до решений органа и внешних условий. Так в диаграмму попадают только значимые для цели узлы.',
'avd-13-2':'Про каждый узел спрашивают: «кто им управляет?». Если орган — это решение (прямоугольник); если среда или другие участники — неопределённость (овал).',
'avd-13-3':'Верно. Узел без пути к результату не помогает решить задачу и только загромождает модель и будущий дашборд, поэтому его удаляют.',
'avd-13-4':'Финансированием льгот управляет орган — решение. Демографией не управляет — внешний фактор. Численность нуждающихся зависит от демографии и решений — промежуточная переменная. Реальный доход льготников — цель, результат.',
'avd-14-0':'Элементы куба: факт (мера) — агрегируемое число (выделено 15 млн руб.); измерение — ось анализа (география); элемент (член) — значение на оси («Кировский район»); иерархия — уровни детализации (год → квартал → месяц).',
'avd-14-1':'Измерения группируют по вопросу, на который они отвечают: время — когда; география — где; объекты и отрасли — что; субъекты — кто (получатели, организации).',
'avd-14-2':'В реляционной базе куб реализуют схемой «звезда»: в центре таблица фактов с числовыми мерами и внешними ключами, вокруг — таблицы измерений с атрибутами и иерархиями.',
'avd-14-3':'Верно. Агрегаты — заранее подсчитанные итоги (например, по кварталам и регионам). Они позволяют отвечать на запросы за секунды, не суммируя каждый раз миллионы строк.',
'avd-15-0':'Операции OLAP: срез (slice, dice) фиксирует значения измерений; вращение (pivot) меняет местами оси отчёта; консолидация (roll-up) поднимает данные вверх по иерархии; детализация (drill-down) опускает до подробных записей.',
'avd-15-1':'Анализ идёт от общего к частному: сначала общий итог по региону (консолидация), затем срез по категории «Ветераны», затем вращение для удобного сравнения районов по кварталам и, наконец, детализация до месяцев и получателей, где находится причина — дубли.',
'avd-15-2':'Переход с уровня кварталов на уровень месяцев — движение вниз по иерархии времени, то есть детализация (drill-down). Обратное движение — консолидация.',
'avd-15-3':'Перенос районов из столбцов в строки меняет оси отчёта, не меняя данных. Это вращение (pivot).',
'avd-16-0':'Вычисляемый столбец считается построчно при загрузке или обновлении данных и хранится в модели — он работает в контексте строки. Мера считается в момент показа визуализации в контексте текущих фильтров и не хранится.',
'avd-16-1':'Возрастная группа — атрибут каждого получателя, по нему нужно фильтровать и группировать. Значение нужно в каждой строке, поэтому это вычисляемый столбец в справочнике получателей.',
'avd-16-2':'Средняя выплата — агрегат, который должен пересчитываться при выборе района, периода или категории. Это работа для меры: она вычисляется в контексте фильтра.',
'avd-16-3':'Неверно. Значение столбца вычислено один раз при загрузке и при выборе среза не меняется. Срез лишь показывает часть строк. На фильтры реагируют меры.',
'avd-16-4':'Верно. Результаты вычисляемого столбца физически хранятся для каждой строки и увеличивают размер модели. Мера хранится только как формула, поэтому их можно создавать сотни без затрат памяти.',
'avd-17-0':'Self-Service BI — модель, при которой пользователи из отделов сами строят отчёты и дашборды на подготовленных, проверенных данных, не дожидаясь ИТ-службы. ИТ отвечает за данные, бизнес — за анализ.',
'avd-17-1':'Организационные риски связаны с людьми и процессами: «зоопарк» отчётов с разными цифрами, низкая грамотность в данных, размытая ответственность. Технические — с системами: нагрузка на рабочие ГИС, утечки ПДн, плохое качество сырых выгрузок.',
'avd-17-2':'Риски снижают Data Governance (владельцы данных, каталог показателей с единой методикой), сертифицированные датасеты и витрины, ролевой доступ с обезличиванием, обучение сотрудников и стандарты оформления.',
'avd-17-3':'Разные числа возникли потому, что каждый отдел считал по своей выгрузке и методике. Решение — одна сертифицированная витрина с утверждённой мерой «число получателей», которой пользуются все.',
'avd-18-0':'В DataLens объекты связаны цепочкой: подключение даёт доступ к источнику; датасет описывает поля, типы и связи; чарт визуализирует данные датасета; дашборд собирает чарты и селекторы на одном экране.',
'avd-18-1':'Подключение хранит параметры доступа к источнику (PostgreSQL, ClickHouse, CSV). Датасет — модель данных: поля, типы, связи, вычисляемые поля. Чарт — отдельная визуализация. Дашборд — интерфейс из чартов, селекторов и вкладок.',
'avd-18-2':'Верно. Чарты строятся на датасете, дашборды — на чартах. Если в датасете исправить формулу поля, изменения автоматически появятся во всех чартах и дашбордах, которые его используют.',
'avd-18-3':'Логику данных — вычисляемые поля вроде «Просрочено = срок ответа < сегодня» — задают в датасете. Тогда поле одинаково работает во всех чартах, а не дублируется в каждом.',
'avd-18-4':'Для организации объектов в DataLens используются воркбуки (рабочие книги, объединяющие подключения, датасеты, чарты и дашборды проекта) и коллекции (папки для воркбуков с правами доступа).',
'avd-19-0':'Вид карты выбирают по вопросу: где находятся объекты — точечная; где концентрация событий — тепловая; как различаются территории по относительному показателю — фоновая картограмма; сколько в абсолютных величинах — картодиаграмма (значки); куда движутся люди или грузы — карта потоков.',
'avd-19-1':'Безработица в процентах — относительный показатель по территориям. Её показывают фоновой картограммой (choropleth): районы закрашиваются цветом по значению.',
'avd-19-2':'Точка (0; 0) находится в Гвинейском заливе. Объекты там появляются, когда координаты пустые и заменились нулями или перепутаны широта и долгота. Это сигнал ошибки геоданных, который нужно проверить перед публикацией карты.',

'avd-20-0':'Медиана — значение середины упорядоченного ряда. Она зависит от порядка, а не от величины крайних значений, поэтому один огромный выброс её почти не сдвигает. Среднее, сумма и максимум изменяются сильно.',
'avd-20-1':'Точка излома — доля выбросов, при которой оценка может стать сколь угодно неверной. У среднего она 0 %: хватит одного выброса. У медианы — 50 %: нужно испортить половину данных.',
